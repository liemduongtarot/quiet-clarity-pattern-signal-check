name: V8.3.238 DEVELOPMENT checkpoint
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v83238-development-checkpoint.yml
permissions:
  contents: read
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 30e559e09ac1b5ac5126e3ce10713615f918dbe9
          fetch-depth: 0
      - name: Build checkpoint
        run: |
          # actual checkpoint trigger
          set -euo pipefail
          mkdir V8_3_238_DEVELOPMENT_CHECKPOINT
          cp validation/V8_3_238_DEVELOPMENT_AUTHORITY_V1.json V8_3_238_DEVELOPMENT_CHECKPOINT/
          cp validation/V8_3_238_V113_REGRESSION_RECEIPT.json V8_3_238_DEVELOPMENT_CHECKPOINT/
          cp validation/qc-evidence-extractor-v5an-v238-frozen-residuals.js V8_3_238_DEVELOPMENT_CHECKPOINT/
          cp validation/psc-v83238-v237-v113-frozen-residuals.js V8_3_238_DEVELOPMENT_CHECKPOINT/
          printf '%s\n' '30e559e09ac1b5ac5126e3ce10713615f918dbe9' > V8_3_238_DEVELOPMENT_CHECKPOINT/DEVELOPMENT_SHA.txt
          (cd V8_3_238_DEVELOPMENT_CHECKPOINT && sha256sum * > SHA256_MANIFEST.txt)
          zip -r PSC_V8_3_238_DEVELOPMENT_CHECKPOINT.zip V8_3_238_DEVELOPMENT_CHECKPOINT
          sha256sum PSC_V8_3_238_DEVELOPMENT_CHECKPOINT.zip > PSC_V8_3_238_DEVELOPMENT_CHECKPOINT_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PSC_V8_3_238_DEVELOPMENT_CHECKPOINT
          path: |
            PSC_V8_3_238_DEVELOPMENT_CHECKPOINT.zip
            PSC_V8_3_238_DEVELOPMENT_CHECKPOINT_SHA256.txt
          if-no-files-found: error
