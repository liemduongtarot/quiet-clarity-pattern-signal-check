name: V8.3.166 V1 Transport Preflight
on:
  push:
    branches: [v83166-v1-sealed-validation]
jobs:
  transport_preflight:
    if: github.event.head_commit.message == 'Run V8.3.166 V1 transport preflight'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and verify immutable V8.3.166 sealed material without runtime
        run: |
          python - <<'PY'
          import pathlib,json,hashlib,base64,gzip
          root=pathlib.Path('validation/v83166-v1-sealed')
          def csha(o):
              x=dict(o); x.pop('sha256_without_sha_field',None)
              return hashlib.sha256(json.dumps(x,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          def mat(parts):
              txt=''.join((root/p).read_text().strip() for p in parts)
              return json.loads(gzip.decompress(base64.b64decode(txt)))
          sel=mat(['V8_3_166_PRESEAL_OWNER_SELECTION_V1.json.gz.b64'])
          gold=mat([f'V8_3_166_INDEPENDENT_GOLD_V1.json.gz.b64.part{i:02d}' for i in range(1,6)])
          mem=mat(['V8_3_166_SEALED_MEMBERSHIP_V1.json.gz.b64'])
          fix=mat([f'V8_3_166_SEALED_EXECUTION_FIXTURE_V1.json.gz.b64.part{i:02d}' for i in range(1,6)])
          assert csha(sel)=='2641c8a802297e6dd51a246b3576b8eaaf7c32323dd728f6f15fde5de7776bab'
          assert csha(gold)=='322ff4ab5a6e62ad774c362be4ee13f08a5b8706232f01402874d6f9ea739724'
          assert csha(mem)=='982f0a4f9df87af6668367d9153b9ab8df8979393754f562c099f044fe1bfd49'
          assert csha(fix)=='18d65ddd059f8853e3e57a714982a1bc16483d11570ceec430ec69f0d3bc42bf'
          assert fix['development_authority_commit']=='fe867115344bf0ffb2c212c5c9d13207e9381570'
          assert len(fix['batch_a'])==30 and len(fix['batch_b'])==30
          assert set(fix['batch_a']).isdisjoint(set(fix['batch_b']))
          assert len(set(fix['batch_a']+fix['batch_b']))==60
          print('TRANSPORT PREFLIGHT PASS runtime=0 A=0 B=0')
          PY
          test -f validation/psc-v83166-v165-v1-sealed-a-bounded-repair.js
      - name: Record transport status artifact
        run: |
          cat > V8_3_166_TRANSPORT_PREFLIGHT_STATUS.json <<EOF
          {"authority":"V8.3.166 V1 TRANSPORT PREFLIGHT","run_id":"${{ github.run_id }}","run_attempt":"${{ github.run_attempt }}","head_sha":"${{ github.sha }}","result":"PASS","runtime_executed":false,"batch_a_executed":false,"batch_b_executed":false,"step_111_authorized":false,"production_authorized":false}
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: PSC_V8_3_166_TRANSPORT_PREFLIGHT
          path: V8_3_166_TRANSPORT_PREFLIGHT_STATUS.json
