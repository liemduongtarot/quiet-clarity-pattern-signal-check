name: V8.3.223 V100 Bounded Regression
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  regression:
    if: github.event.head_commit.message == 'Run V8.3.223 V100 bounded regression'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83223-v1-validation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Run bounded regression
        id: reg
        continue-on-error: true
        run: python validation/v83223-v100-regression-orchestrator.py
      - name: Freeze evidence
        if: always()
        run: |
          set -euo pipefail
          test -f validation/V8_3_223_V100_REGRESSION_RECEIPT.json
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- validation/V8_3_223_V100_REGRESSION_RECEIPT.json validation/V8_3_223_V222_A_FROZEN_CARRIER.json
          for f in V8_3_223_V100_REGRESSION_RESULTS.json V8_3_223_V222_A_REGRESSION_RESULTS.json; do if [ -f "$f" ]; then cp "$f" validation/; git add "validation/$f"; fi; done
          git diff --cached --quiet || git commit -m 'Record V8.3.223 V100 regression evidence'
          git push origin HEAD:v83223-v1-validation
      - name: Build checkpoint
        if: always()
        run: |
          python - <<'PY'
          import pathlib,zipfile,hashlib
          r=pathlib.Path('.');files=[p for p in (r/'validation').glob('V8_3_223_*') if p.is_file()]
          z=r/'PSC_V8_3_223_V100_REGRESSION_CHECKPOINT.zip'
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED) as q:
            for p in files:q.write(p,p.name)
          (r/'PSC_V8_3_223_V100_REGRESSION_CHECKPOINT_SHA256.txt').write_text(hashlib.sha256(z.read_bytes()).hexdigest()+'  '+z.name+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PSC_V8_3_223_V100_REGRESSION_CHECKPOINT
          if-no-files-found: error
          path: |
            PSC_V8_3_223_V100_REGRESSION_CHECKPOINT.zip
            PSC_V8_3_223_V100_REGRESSION_CHECKPOINT_SHA256.txt
      - name: Enforce
        if: always()
        run: test '${{ steps.reg.outcome }}' = 'success'
