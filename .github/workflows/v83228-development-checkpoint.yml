name: V8.3.228 DEVELOPMENT checkpoint
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v83228-development-checkpoint.yml
permissions:
  contents: read
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2d5725e4b12f532ca9b710083e55e21efdb6c686
          fetch-depth: 0
      - name: Build checkpoint
        shell: bash
        run: |
          # exact V8.3.228 DEVELOPMENT authority checkpoint
          set -euo pipefail
          mkdir V8_3_228_DEVELOPMENT_CHECKPOINT
          cp validation/V8_3_228_DEVELOPMENT_AUTHORITY_V1.json V8_3_228_DEVELOPMENT_CHECKPOINT/
          cp validation/V8_3_228_V105_REGRESSION_RECEIPT.json V8_3_228_DEVELOPMENT_CHECKPOINT/
          cp validation/qc-evidence-extractor-v5af-v228-witness-completion.js V8_3_228_DEVELOPMENT_CHECKPOINT/
          cp validation/psc-v83228-v227-v105-witness-completion.js V8_3_228_DEVELOPMENT_CHECKPOINT/
          printf '%s\n' '2d5725e4b12f532ca9b710083e55e21efdb6c686' > V8_3_228_DEVELOPMENT_CHECKPOINT/DEVELOPMENT_SHA.txt
          (cd V8_3_228_DEVELOPMENT_CHECKPOINT && sha256sum * > SHA256_MANIFEST.txt)
          zip -r PSC_V8_3_228_DEVELOPMENT_CHECKPOINT.zip V8_3_228_DEVELOPMENT_CHECKPOINT
          sha256sum PSC_V8_3_228_DEVELOPMENT_CHECKPOINT.zip > PSC_V8_3_228_DEVELOPMENT_CHECKPOINT_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PSC_V8_3_228_DEVELOPMENT_CHECKPOINT
          path: |
            PSC_V8_3_228_DEVELOPMENT_CHECKPOINT.zip
            PSC_V8_3_228_DEVELOPMENT_CHECKPOINT_SHA256.txt
          if-no-files-found: error
