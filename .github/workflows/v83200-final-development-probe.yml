name: V8.3.200 Final Development Probe
on:
  push:
    branches: [v83200-v1-validation]
permissions:
  actions: read
  contents: write
jobs:
  probe:
    if: github.event.head_commit.message == 'Probe V8.3.200 final development evidence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record target run metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,urllib.request,pathlib
          target='5d49e0220c04786de7da66d02afbc9deaba8d232'
          req=urllib.request.Request('https://api.github.com/repos/liemduongtarot/quiet-clarity-pattern-signal-check/actions/runs?head_sha='+target+'&event=push&per_page=100',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          data=json.load(urllib.request.urlopen(req));runs=[r for r in data.get('workflow_runs',[]) if r.get('name')=='V8.3.200 Final Development']
          if not runs:raise SystemExit('target final-development run not found')
          r=sorted(runs,key=lambda x:x['id'])[-1]
          pathlib.Path('validation/V8_3_200_FINAL_DEVELOPMENT_RECEIPT.json').write_text(json.dumps({'candidate':'V8.3.200','phase':'development','target_head_sha':target,'run_id':r['id'],'status':r['status'],'conclusion':r.get('conclusion'),'run_attempt':r.get('run_attempt',1),'sealed_validation_executed':False,'v199_sealed_rerun':False},indent=2))
          PY
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/V8_3_200_FINAL_DEVELOPMENT_RECEIPT.json
          git commit -m 'Record V8.3.200 final development receipt'
          git push
