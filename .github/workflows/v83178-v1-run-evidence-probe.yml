name: V8.3.178 V1 Run Evidence Probe
on:
  push:
    branches: [v83178-v1-validation]
permissions:
  contents: write
  actions: read
jobs:
  probe:
    if: github.event.head_commit.message == 'Probe V8.3.178 run evidence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read target run metadata only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,urllib.request,pathlib
          target='fd36bac029e466dda18d0f2a355a39f636e132e1';repo=os.environ['GITHUB_REPOSITORY']
          def get(url):
            q=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
            return json.load(urllib.request.urlopen(q))
          runs=[r for r in get(f'https://api.github.com/repos/{repo}/actions/runs?head_sha={target}&per_page=20')['workflow_runs'] if r.get('name')=='V8.3.178 V1 Deep Validation'];assert len(runs)==1
          r=runs[0];jobs=get(f"https://api.github.com/repos/{repo}/actions/runs/{r['id']}/jobs?per_page=100")['jobs'];arts=get(f"https://api.github.com/repos/{repo}/actions/runs/{r['id']}/artifacts?per_page=100")['artifacts']
          out={'candidate':'V8.3.178','phase':'development','target_head_sha':target,'run_id':r['id'],'status':r['status'],'conclusion':r.get('conclusion'),'run_attempt':r.get('run_attempt'),'jobs':[{'id':j['id'],'name':j['name'],'status':j['status'],'conclusion':j.get('conclusion'),'steps':[{'name':s['name'],'status':s['status'],'conclusion':s.get('conclusion'),'number':s['number']} for s in j.get('steps',[])]} for j in jobs],'artifacts':[{'id':a['id'],'name':a['name'],'size_in_bytes':a['size_in_bytes'],'expired':a['expired']} for a in arts],'sealed_validation_executed':False,'v177_sealed_rerun':False}
          pathlib.Path('validation/V8_3_178_LATEST_DEVELOPMENT_RUN_RECEIPT.json').write_text(json.dumps(out,indent=2))
          PY
      - name: Commit receipt
        run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/V8_3_178_LATEST_DEVELOPMENT_RUN_RECEIPT.json
          git commit -m 'Record V8.3.178 development run receipt'
          git push
