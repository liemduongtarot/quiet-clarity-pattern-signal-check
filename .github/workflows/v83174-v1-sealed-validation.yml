name: V8.3.174 V1 Sealed Validation
on:
  push:
    branches: [v83174-v1-sealed-validation]
jobs:
  sealed_validate:
    if: github.event.head_commit.message == 'Run V8.3.174 V1 sealed validation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Verify sealed material and materialize exact V8.3.174 authority
        run: |
          python - <<'PY'
          import pathlib,json,hashlib,base64,gzip,zipfile
          pack=json.loads(pathlib.Path('validation/v83174-v1-sealed/V8_3_174_SEALED_TRANSPORT_PACK_V1.json').read_text())
          assert pack['development_authority_commit']=='6c334f1a95e112ab7ff313565115c96242853664'
          assert pack['fixture_sha256_without_sha_field']=='3909b137723f07b40e6c199b884c201ec3ea2258f3077b18cf237e461407597b'
          assert pack['selection_sha256']=='9b4a8b317dd153d081c486d42c476acd802bab27adb6c09f944149b48436d3f8'
          assert pack['gold_sha256']=='983a5cde5e28cfd346fdbe28567380b962db4a3b354ac0c4501c534cc371b9e2'
          assert pack['membership_sha256']=='05f8be50f0df663bcbc33f44765659f557f717458e51a44984ab29b4e98fdc8d'
          assert pack['runtime_executed_before_transport'] is False and pack['v173_batch_a_rerun'] is False and pack['v173_batch_b_accessed'] is False
          raw=gzip.decompress(base64.b64decode(pack['fixture_gzip_b64']));fix=json.loads(raw)
          def csha(o):
            x=dict(o);x.pop('sha256_without_sha_field',None)
            return hashlib.sha256(json.dumps(x,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          assert csha(fix)==pack['fixture_sha256_without_sha_field']
          assert len(fix['cases'])==60 and len(fix['batch_a'])==30 and len(fix['batch_b'])==30
          assert set(fix['batch_a']).isdisjoint(fix['batch_b']) and len(set(fix['batch_a']+fix['batch_b']))==60
          pathlib.Path('V8_3_174_SEALED_EXECUTION_FIXTURE_V1.json').write_bytes(raw)
          with zipfile.ZipFile('PSC_V8_3_139_FINAL_LOCAL_READINESS_EXTERNAL_BUILD_PENDING_CHECKPOINT (1).zip') as z:z.extractall('.')
          PY
          for f in psc-v83142-sealed-failure-convergence.js psc-v83143-semantic-convergence.js psc-v83144-sealed-failure-convergence.js psc-v83145-route-layer.js psc-v83145-family-state-layer.js psc-v83146-route-boundary-repair.js psc-v83146-family-sequence-repair.js psc-v83147-sealed-failure-repair.js psc-v83148-sealed-failure-repair.js psc-v83149-sealed-failure-repair.js psc-v83150-sealed-failure-repair.js psc-v83151-sealed-failure-repair.js psc-v83152-sealed-failure-repair.js psc-v83153-sealed-failure-repair.js psc-v83154-sealed-failure-repair.js psc-v83155-sealed-failure-repair.js psc-v83156-v155-v3-bounded-repair.js psc-v83157-v156-sealed-a-bounded-repair.js psc-v83158-v157-sealed-a-bounded-repair.js psc-v83159-v158-sealed-a-bounded-repair.js psc-v83160-v159-v2-sealed-a-bounded-repair.js psc-v83161-v160-v1-sealed-a-bounded-repair.js psc-v83162-v161-v1-sealed-a-bounded-repair.js psc-v83163-v162-v1-sealed-a-bounded-repair.js psc-v83164-v163-v1-sealed-a-bounded-repair.js psc-v83165-v164-v1-sealed-a-bounded-repair.js psc-v83166-v165-v1-sealed-a-bounded-repair.js psc-v83167-v166-v1-sealed-a-bounded-repair.js psc-v83168-v167-v1-sealed-a-bounded-repair.js psc-v83169-v168-v1-sealed-a-bounded-repair.js psc-v83170-v169-v1-sealed-a-bounded-repair.js psc-v83171-v170-v1-sealed-a-bounded-repair.js psc-v83172-v171-v1-sealed-a-bounded-repair.js psc-v83173-v172-v1-sealed-a-bounded-repair.js psc-v83174-v173-v1-sealed-a-bounded-repair.js; do cp validation/$f PSC_V8_3_138_DEV/public/; done
      - name: SEALED Batch A first run exactly once
        working-directory: PSC_V8_3_138_DEV
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),s={};vm.createContext(s);
          const files=["psc-v3.js","psc-v4.js","psc-v83121-r1-reconstructed.js","psc-v83122-operator-aware.js","psc-v83123-family-preservation.js","psc-v83124-operator-context.js","psc-v83125-semantic-routing.js","psc-v83126-public-route-canonicalization.js","psc-v83127-review-intent-authority.js","psc-v83129-canonical-shadow.js","psc-v83130-representation-coverage.js","psc-v83131-proposition-consolidation.js","psc-v83132-relation-graph.js","psc-v83133-canonical-role-binding.js","psc-v83135-scoped-operator.js","psc-v83138-semantic-convergence.js","psc-v83139-semantic-convergence.js","psc-v83142-sealed-failure-convergence.js","psc-v83143-semantic-convergence.js","psc-v83144-sealed-failure-convergence.js","psc-v83145-route-layer.js","psc-v83145-family-state-layer.js","psc-v83146-route-boundary-repair.js","psc-v83146-family-sequence-repair.js","psc-v83147-sealed-failure-repair.js","psc-v83148-sealed-failure-repair.js","psc-v83149-sealed-failure-repair.js","psc-v83150-sealed-failure-repair.js","psc-v83151-sealed-failure-repair.js","psc-v83152-sealed-failure-repair.js","psc-v83153-sealed-failure-repair.js","psc-v83154-sealed-failure-repair.js","psc-v83155-sealed-failure-repair.js","psc-v83156-v155-v3-bounded-repair.js","psc-v83157-v156-sealed-a-bounded-repair.js","psc-v83158-v157-sealed-a-bounded-repair.js","psc-v83159-v158-sealed-a-bounded-repair.js","psc-v83160-v159-v2-sealed-a-bounded-repair.js","psc-v83161-v160-v1-sealed-a-bounded-repair.js","psc-v83162-v161-v1-sealed-a-bounded-repair.js","psc-v83163-v162-v1-sealed-a-bounded-repair.js","psc-v83164-v163-v1-sealed-a-bounded-repair.js","psc-v83165-v164-v1-sealed-a-bounded-repair.js","psc-v83166-v165-v1-sealed-a-bounded-repair.js","psc-v83167-v166-v1-sealed-a-bounded-repair.js","psc-v83168-v167-v1-sealed-a-bounded-repair.js","psc-v83169-v168-v1-sealed-a-bounded-repair.js","psc-v83170-v169-v1-sealed-a-bounded-repair.js","psc-v83171-v170-v1-sealed-a-bounded-repair.js","psc-v83172-v171-v1-sealed-a-bounded-repair.js","psc-v83173-v172-v1-sealed-a-bounded-repair.js","psc-v83174-v173-v1-sealed-a-bounded-repair.js"];for(const f of files)vm.runInContext(fs.readFileSync('public/'+f,'utf8'),s);if(!s.QCSemanticCoreV43)throw Error('QCSemanticCoreV43 missing');
          const F=JSON.parse(fs.readFileSync('../V8_3_174_SEALED_EXECUTION_FIXTURE_V1.json')),ids=new Set(F.batch_a),cases=F.cases.filter(c=>ids.has(c.case_id));let passed=0;const results=[];
          for(const c of cases){const r=s.QCSemanticCoreV43.analyze(c.surface,c.domain),a={route:r.input_route.id,families:[...r.families].sort(),sequence:!!r.sequence},e={route:c.expected.route,families:[...(c.expected.families||[])].sort(),sequence:!!c.expected.sequence},ok=JSON.stringify(a)===JSON.stringify(e);if(ok)passed++;results.push({case_id:c.case_id,pass:ok,expected:e,actual:a,surface:c.surface,domain:c.domain,language:c.language});}
          fs.writeFileSync('../V8_3_174_BATCH_A_FIRST_RUN_RESULTS.json',JSON.stringify({authority:'V8.3.174 V1 SEALED BATCH A FIRST RUN',run_id:process.env.GITHUB_RUN_ID,run_attempt:process.env.GITHUB_RUN_ATTEMPT,total:cases.length,passed,failed:cases.length-passed,results},null,2));console.log('Batch A',passed+'/'+cases.length);if(passed!==cases.length)process.exit(1);
          NODE
      - name: SEALED Batch B exactly once only after A PASS
        working-directory: PSC_V8_3_138_DEV
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),s={};vm.createContext(s);
          const files=["psc-v3.js","psc-v4.js","psc-v83121-r1-reconstructed.js","psc-v83122-operator-aware.js","psc-v83123-family-preservation.js","psc-v83124-operator-context.js","psc-v83125-semantic-routing.js","psc-v83126-public-route-canonicalization.js","psc-v83127-review-intent-authority.js","psc-v83129-canonical-shadow.js","psc-v83130-representation-coverage.js","psc-v83131-proposition-consolidation.js","psc-v83132-relation-graph.js","psc-v83133-canonical-role-binding.js","psc-v83135-scoped-operator.js","psc-v83138-semantic-convergence.js","psc-v83139-semantic-convergence.js","psc-v83142-sealed-failure-convergence.js","psc-v83143-semantic-convergence.js","psc-v83144-sealed-failure-convergence.js","psc-v83145-route-layer.js","psc-v83145-family-state-layer.js","psc-v83146-route-boundary-repair.js","psc-v83146-family-sequence-repair.js","psc-v83147-sealed-failure-repair.js","psc-v83148-sealed-failure-repair.js","psc-v83149-sealed-failure-repair.js","psc-v83150-sealed-failure-repair.js","psc-v83151-sealed-failure-repair.js","psc-v83152-sealed-failure-repair.js","psc-v83153-sealed-failure-repair.js","psc-v83154-sealed-failure-repair.js","psc-v83155-sealed-failure-repair.js","psc-v83156-v155-v3-bounded-repair.js","psc-v83157-v156-sealed-a-bounded-repair.js","psc-v83158-v157-sealed-a-bounded-repair.js","psc-v83159-v158-sealed-a-bounded-repair.js","psc-v83160-v159-v2-sealed-a-bounded-repair.js","psc-v83161-v160-v1-sealed-a-bounded-repair.js","psc-v83162-v161-v1-sealed-a-bounded-repair.js","psc-v83163-v162-v1-sealed-a-bounded-repair.js","psc-v83164-v163-v1-sealed-a-bounded-repair.js","psc-v83165-v164-v1-sealed-a-bounded-repair.js","psc-v83166-v165-v1-sealed-a-bounded-repair.js","psc-v83167-v166-v1-sealed-a-bounded-repair.js","psc-v83168-v167-v1-sealed-a-bounded-repair.js","psc-v83169-v168-v1-sealed-a-bounded-repair.js","psc-v83170-v169-v1-sealed-a-bounded-repair.js","psc-v83171-v170-v1-sealed-a-bounded-repair.js","psc-v83172-v171-v1-sealed-a-bounded-repair.js","psc-v8