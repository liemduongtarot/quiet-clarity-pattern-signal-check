          const F=JSON.parse(fs.readFileSync('../V8_3_174_SEALED_EXECUTION_FIXTURE_V1.json')),ids=new Set(F.batch_b),cases=F.cases.filter(c=>ids.has(c.case_id));let passed=0;const results=[];
          for(const c of cases){const r=s.QCSemanticCoreV43.analyze(c.surface,c.domain),a={route:r.input_route.id,families:[...r.families].sort(),sequence:!!r.sequence},e={route:c.expected.route,families:[...(c.expected.families||[])].sort(),sequence:!!c.expected.sequence},ok=JSON.stringify(a)===JSON.stringify(e);if(ok)passed++;results.push({case_id:c.case_id,pass:ok,expected:e,actual:a,surface:c.surface,domain:c.domain,language:c.language});}
          fs.writeFileSync('../V8_3_174_BATCH_B_FIRST_RUN_RESULTS.json',JSON.stringify({authority:'V8.3.174 V1 SEALED BATCH B FIRST RUN',run_id:process.env.GITHUB_RUN_ID,run_attempt:process.env.GITHUB_RUN_ATTEMPT,total:cases.length,passed,failed:cases.length-passed,results},null,2));console.log('Batch B',passed+'/'+cases.length);if(passed!==cases.length)process.exit(1);
          NODE
      - name: Package immutable sealed checkpoint
        if: always()
        run: |
          python - <<'PY'
          import pathlib,json,zipfile,hashlib,shutil
          st=pathlib.Path('V8_3_174_SEALED_CHECKPOINT');st.mkdir(exist_ok=True)
          for n in ['V8_3_174_SEALED_EXECUTION_FIXTURE_V1.json','V8_3_174_BATCH_A_FIRST_RUN_RESULTS.json','V8_3_174_BATCH_B_FIRST_RUN_RESULTS.json']:
            p=pathlib.Path(n)
            if p.exists():shutil.copy2(p,st/n)
          A=pathlib.Path('V8_3_174_BATCH_A_FIRST_RUN_RESULTS.json');B=pathlib.Path('V8_3_174_BATCH_B_FIRST_RUN_RESULTS.json');a=json.loads(A.read_text()) if A.exists() else None;b=json.loads(B.read_text()) if B.exists() else None
          status={'candidate':'V8.3.174','run_id':'${{ github.run_id }}','run_attempt':'${{ github.run_attempt }}','head_sha':'${{ github.sha }}','batch_a_executed':a is not None,'batch_a_passed':a['passed'] if a else None,'batch_a_failed':a['failed'] if a else None,'batch_b_executed':b is not None,'batch_b_passed':b['passed'] if b else None,'batch_b_failed':b['failed'] if b else None,'v173_batch_a_rerun':False,'v173_batch_b_accessed':False,'step_111_authorized':False,'production_authorized':False};(st/'V8_3_174_SEALED_STATUS.json').write_text(json.dumps(status,indent=2))
          def sha(p):return hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          (st/'SHA256_MANIFEST.txt').write_text(''.join(f'{sha(p)}  {p.name}\n' for p in sorted(st.iterdir()) if p.is_file()));z=pathlib.Path('PSC_V8_3_174_V1_SEALED_VALIDATION_CHECKPOINT.zip')
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED) as q:
            for p in sorted(st.iterdir()):q.write(p,p.name)
          pathlib.Path('PSC_V8_3_174_V1_SEALED_VALIDATION_CHECKPOINT_SHA256.txt').write_text(f'{sha(z)}  {z.name}\n')
          PY
      - uses: actions/upload-artifact@v4
