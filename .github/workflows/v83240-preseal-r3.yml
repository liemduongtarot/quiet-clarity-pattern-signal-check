name: V8.3.240 PRESEAL R3
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v83240-preseal-r3.yml
permissions:
  contents: write
jobs:
  preseal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83240-v1-sealed-validation
          fetch-depth: 0
      - name: Run construction PRESEAL with diversity diagnostic
        id: run
        shell: bash
        run: |
          set +e
          python validation/v83240-v1-sealed/v83240-preseal-freeze.py > /tmp/v240-preseal-r3.log 2>&1
          rc=$?
          cat /tmp/v240-preseal-r3.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Freeze diagnostic evidence
        if: always()
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          test ! -f validation/v83240-v1-sealed/V8_3_240_PRESEAL_DIVERSITY_DIAGNOSTIC.json || git add validation/v83240-v1-sealed/V8_3_240_PRESEAL_DIVERSITY_DIAGNOSTIC.json
          test ! -f validation/v83240-v1-sealed/V8_3_240_PRESEAL_RUN_RECEIPT.json || git add validation/v83240-v1-sealed/V8_3_240_PRESEAL_RUN_RECEIPT.json
          for f in validation/v83240-v1-sealed/V8_3_240_PRESEAL_CANDIDATE_BANK_V1.json validation/v83240-v1-sealed/V8_3_240_SEALED_SELECTION_V1.json validation/v83240-v1-sealed/V8_3_240_SEALED_FIXTURE_V1.json validation/v83240-v1-sealed/V8_3_240_INDEPENDENT_GOLD_V1.json validation/v83240-v1-sealed/V8_3_240_SEALED_MEMBERSHIP_V1.json validation/v83240-v1-sealed/V8_3_240_PRESEAL_DIVERSITY_AUDIT_V1.json validation/v83240-v1-sealed/V8_3_240_SEALED_AUTHORITY_V1.json; do test ! -f "$f" || git add "$f"; done
          git diff --cached --quiet || git commit -m 'Record V8.3.240 PRESEAL R3 diagnostic evidence'
          git push origin HEAD:v83240-v1-sealed-validation
      - name: Enforce outcome
        run: test '${{ steps.run.outputs.rc }}' = '0'
