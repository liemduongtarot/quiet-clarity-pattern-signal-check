name: V8.3.240 runner recovery proof
# trigger: actual bounded proof
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v83240-runner-recovery-proof.yml
permissions:
  contents: write
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83240-v1-validation
          fetch-depth: 0
      - name: Run bounded runner recovery proof
        run: python validation/v83240-runner-recovery-proof.py
      - name: Freeze evidence
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/V8_3_240_RUNNER_PLUMBING_RECOVERY_RECEIPT.json
          git diff --cached --quiet || git commit -m 'Freeze V8.3.240 runner recovery proof'
          git push origin HEAD:v83240-v1-validation
