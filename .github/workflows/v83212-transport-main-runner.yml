name: V8.3.214 Preseal Diagnostic R1
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  diagnostic:
    if: github.event.head_commit.message == 'Run V8.3.214 preseal diagnostic R1'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83214-v1-sealed-validation
          fetch-depth: 1
      - name: Materialize prior references
        id: refs
        continue-on-error: true
        run: |
          set -euo pipefail
          rm -rf validation/v83214-preseal-refs
          mkdir -p validation/v83214-preseal-refs
          for v in 201 202 203 204 205 206 207 208 209; do
            s=${v#20}; branch=v8320${s}-v1-sealed-validation; root=validation/v8320${s}-v1-sealed
            git fetch --depth=1 origin refs/heads/${branch}:refs/remotes/origin/${branch}
            if git cat-file -e origin/${branch}:${root}/V8_3_${v}_PRESEAL_CANDIDATE_BANK_V1.json 2>/dev/null; then git show origin/${branch}:${root}/V8_3_${v}_PRESEAL_CANDIDATE_BANK_V1.json > validation/v83214-preseal-refs/V8_3_${v}_SEALED_BANK.json; else git show origin/${branch}:${root}/V8_3_${v}_SEALED_FIXTURE_V1.json > validation/v83214-preseal-refs/V8_3_${v}_SEALED_FIXTURE.json; fi
          done
          git fetch --depth=1 origin refs/heads/v83210-v1-sealed-validation:refs/remotes/origin/v83210-v1-sealed-validation
          if git cat-file -e origin/v83210-v1-sealed-validation:validation/v83210-v1-sealed/V8_3_210_PRESEAL_CANDIDATE_BANK_V1.json 2>/dev/null; then git show origin/v83210-v1-sealed-validation:validation/v83210-v1-sealed/V8_3_210_PRESEAL_CANDIDATE_BANK_V1.json > validation/v83214-preseal-refs/V8_3_210_SEALED_BANK.json; else git show origin/v83210-v1-sealed-validation:validation/v83210-v1-sealed/V8_3_210_SEALED_FIXTURE_V1.json > validation/v83214-preseal-refs/V8_3_210_SEALED_FIXTURE.json; fi
          git fetch --depth=1 origin 6d82282b620f03e397368a6d973b566d8055d2eb
          rm -rf /tmp/v211-r4-preseal; mkdir -p /tmp/v211-r4-preseal/validation/v83211-r4-frozen
          git show 6d82282b620f03e397368a6d973b566d8055d2eb:validation/v83211-r4-frozen/generate-r4-carrier.py > /tmp/v211-r4-preseal/validation/v83211-r4-frozen/generate-r4-carrier.py
          (cd /tmp/v211-r4-preseal && python validation/v83211-r4-frozen/generate-r4-carrier.py)
          for f in /tmp/v211-r4-preseal/validation/v83211-r4-runtime/*.json; do cp "$f" validation/v83214-preseal-refs/V211_$(basename "$f"); done
          python validation/v83211-generalization-600-generator-v1r.py
          cp validation/V8_3_211_DEVELOPMENT_GENERALIZATION_600_V1.json validation/v83214-preseal-refs/V8_3_211_DEV_600.json
          git fetch --depth=1 origin refs/heads/v83212-v1-sealed-validation:refs/remotes/origin/v83212-v1-sealed-validation
          git show origin/v83212-v1-sealed-validation:validation/v83212-v1-sealed/V8_3_212_PRESEAL_CANDIDATE_BANK_V1.json > validation/v83214-preseal-refs/V8_3_212_SEALED_BANK.json
          python validation/v83212-generalization-800-generator.py
          cp validation/V8_3_212_DEVELOPMENT_GENERALIZATION_800_V1.json validation/v83214-preseal-refs/V8_3_212_DEV_800.json
          git fetch --depth=1 origin refs/heads/v83213-v1-sealed-validation:refs/remotes/origin/v83213-v1-sealed-validation
          git show origin/v83213-v1-sealed-validation:validation/v83213-v1-sealed/V8_3_213_PRESEAL_CANDIDATE_BANK_V1.json > validation/v83214-preseal-refs/V8_3_213_SEALED_BANK.json
          git show origin/v83213-v1-sealed-validation:validation/v83213-v1-sealed/V8_3_213_SEALED_FIXTURE_V1.json > validation/v83214-preseal-refs/V8_3_213_SEALED_FIXTURE.json
      - name: Run R1 construction with captured output
        id: bank
        continue-on-error: true
        run: |
          set +e
          python validation/v83214-sealed-v1-generator-r1.py >/tmp/v214-preseal.out 2>&1
          rc=$?
          cat /tmp/v214-preseal.out
          exit $rc
      - name: Record diagnostic evidence
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib,os
          root=pathlib.Path('validation/v83214-v1-sealed'); p=root/'V8_3_214_PRESEAL_DIVERSITY_AUDIT_V1.json'
          audit=json.loads(p.read_text()) if p.exists() else None
          log=pathlib.Path('/tmp/v214-preseal.out').read_text(errors='replace')[-12000:] if pathlib.Path('/tmp/v214-preseal.out').exists() else ''
          r={'candidate':'V8.3.214','phase':'preseal-diagnostic-r1','run_id':int(os.environ['GITHUB_RUN_ID']),'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'refs_step':'${{ steps.refs.outcome }}','bank_step':'${{ steps.bank.outcome }}','reference_file_count':len(list(pathlib.Path('validation/v83214-preseal-refs').glob('*.json'))),'audit':audit,'captured_tail':log,'semantic_runtime_executed':False,'semantic_authority_loaded':False,'batch_a_executed':False,'batch_b_executed':False,'v213_sealed_rerun':False,'step_111_authorized':False,'production_authorized':False}
          (root/'V8_3_214_PRESEAL_DIAGNOSTIC_R1_RECEIPT.json').write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- validation/v83214-v1-sealed/V8_3_214_PRESEAL_DIAGNOSTIC_R1_RECEIPT.json
          git commit -m 'Record V8.3.214 preseal R1 diagnostic evidence'
          git push origin HEAD:v83214-v1-sealed-validation
      - name: Enforce diagnostic outcome
        if: always()
        run: test '${{ steps.refs.outcome }}' = 'success' -a '${{ steps.bank.outcome }}' = 'success'
