name: V8.3.215 V95 Regression Main Runner
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  regression:
    if: github.event.head_commit.message == 'Run V8.3.215 V95 regression via main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83215-v1-validation
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run frozen V214 carrier then immutable regression
        id: orchestrator
        continue-on-error: true
        run: python validation/v83215-v95-regression-orchestrator.py
      - name: Record V95 regression evidence
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib,os
          def load(p):
            q=pathlib.Path(p); return json.loads(q.read_text()) if q.exists() else None
          existing=load('validation/V8_3_215_V95_REGRESSION_V1_RECEIPT.json')
          ar=load('V8_3_215_V214_A_REGRESSION_RESULTS.json'); rr=load('V8_3_215_V95_REGRESSION_RESULTS.json')
          r=existing or {'candidate':'V8.3.215','phase':'v95-regression-v1-main','run_id':int(os.environ['GITHUB_RUN_ID']),'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'head_sha':os.popen('git rev-parse HEAD').read().strip(),'semantic_authority':'QCSemanticCoreV95','v214_frozen_a_regression':None if ar is None else {'total':ar.get('total'),'passed':ar.get('passed'),'failed':ar.get('failed')},'immutable_regression':None if rr is None else {'total':rr.get('total'),'passed':rr.get('passed'),'failed':rr.get('failed')},'status':'completed','conclusion':'success' if '${{ steps.orchestrator.outcome }}'=='success' else 'failure','v214_sealed_rerun':False,'sealed_validation_executed':False,'step_111_authorized':False,'production_authorized':False}
          pathlib.Path('validation/V8_3_215_V95_REGRESSION_EVIDENCE_RECEIPT.json').write_text(json.dumps(r,indent=2)+'\n')
          PY
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- validation/V8_3_215_V95_REGRESSION_EVIDENCE_RECEIPT.json
          if [ -f validation/V8_3_215_V95_REGRESSION_V1_RECEIPT.json ]; then git add -- validation/V8_3_215_V95_REGRESSION_V1_RECEIPT.json; fi
          if [ -f V8_3_215_V214_A_REGRESSION_RESULTS.json ]; then cp V8_3_215_V214_A_REGRESSION_RESULTS.json validation/ && git add validation/V8_3_215_V214_A_REGRESSION_RESULTS.json; fi
          if [ -f V8_3_215_V95_REGRESSION_RESULTS.json ]; then cp V8_3_215_V95_REGRESSION_RESULTS.json validation/ && git add validation/V8_3_215_V95_REGRESSION_RESULTS.json; fi
          git diff --cached --quiet || git commit -m 'Record V8.3.215 V95 regression evidence'
          git push origin HEAD:v83215-v1-validation
      - name: Enforce regression outcome
        if: always()
        run: test '${{ steps.orchestrator.outcome }}' = 'success'
