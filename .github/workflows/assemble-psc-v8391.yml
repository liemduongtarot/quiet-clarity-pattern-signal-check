name: Assemble PSC V8.3.91 transport
on:
  push:
    paths:
      - 'transport/READY'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Assemble exact candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find transport/chunks -type f -name 'part-*.txt' -print0 | sort -z | xargs -0 cat > dist/psc-v8.3.91.html.gz.b64
          test "$(sha256sum dist/psc-v8.3.91.html.gz.b64 | awk '{print $1}')" = "06a92b09197051262cc1d247dacf2e6e8d0bcf214fa6beff8b4f6dbcaf1b63cc"
          base64 -d dist/psc-v8.3.91.html.gz.b64 > dist/psc-v8.3.91.html.gz
          gzip -dc dist/psc-v8.3.91.html.gz > dist/psc-v8.3.91.html
          test "$(sha256sum dist/psc-v8.3.91.html | awk '{print $1}')" = "0ea820bb669e3981e689400438112bde86ae08ae0eff7f5d0a698e0a59a5be2a"
          test "$(wc -c < dist/psc-v8.3.91.html | tr -d ' ')" = "1489508"
      - name: Commit assembled artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'psc-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add dist/psc-v8.3.91.html dist/psc-v8.3.91.html.gz.b64
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Assemble verified PSC V8.3.91 artifact'
          git push origin HEAD:${{ github.ref_name }}
