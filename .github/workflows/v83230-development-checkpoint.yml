name: V8.3.230 DEVELOPMENT checkpoint
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v83230-development-checkpoint.yml
permissions:
  contents: read
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 695b3ec998c73be2a0c0f45bcdcd29821ed112d6
          fetch-depth: 0
      - name: Build checkpoint
        run: |
          set -euo pipefail
          mkdir V8_3_230_DEVELOPMENT_CHECKPOINT
          cp validation/V8_3_230_DEVELOPMENT_AUTHORITY_V1.json V8_3_230_DEVELOPMENT_CHECKPOINT/
          cp validation/V8_3_230_V106_REGRESSION_RECEIPT.json V8_3_230_DEVELOPMENT_CHECKPOINT/
          cp validation/qc-evidence-extractor-v5ag-v230-concept-generalization.js V8_3_230_DEVELOPMENT_CHECKPOINT/
          cp validation/psc-v83230-v229-v106-concept-generalization.js V8_3_230_DEVELOPMENT_CHECKPOINT/
          printf '%s\n' '695b3ec998c73be2a0c0f45bcdcd29821ed112d6' > V8_3_230_DEVELOPMENT_CHECKPOINT/DEVELOPMENT_SHA.txt
          (cd V8_3_230_DEVELOPMENT_CHECKPOINT && sha256sum * > SHA256_MANIFEST.txt)
          zip -r PSC_V8_3_230_DEVELOPMENT_CHECKPOINT.zip V8_3_230_DEVELOPMENT_CHECKPOINT
          sha256sum PSC_V8_3_230_DEVELOPMENT_CHECKPOINT.zip > PSC_V8_3_230_DEVELOPMENT_CHECKPOINT_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PSC_V8_3_230_DEVELOPMENT_CHECKPOINT
          path: |
            PSC_V8_3_230_DEVELOPMENT_CHECKPOINT.zip
            PSC_V8_3_230_DEVELOPMENT_CHECKPOINT_SHA256.txt
          if-no-files-found: error
