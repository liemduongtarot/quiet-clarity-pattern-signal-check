name: V8.3.217 Fresh Preseal Freeze
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  preseal:
    if: github.event.head_commit.message == 'Run V8.3.217 fresh preseal freeze'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83217-v1-sealed-validation
          fetch-depth: 1
      - name: Construct audit freeze
        id: preseal
        continue-on-error: true
        run: python validation/v83217-v1-sealed/v83217-preseal-freeze.py
      - name: Commit frozen evidence
        if: always()
        run: |
          set -euo pipefail
          test -f validation/v83217-v1-sealed/V8_3_217_PRESEAL_RUN_RECEIPT.json
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- validation/v83217-v1-sealed/V8_3_217_*.json
          git diff --cached --quiet || git commit -m 'Record V8.3.217 frozen preseal authority'
          git push origin HEAD:v83217-v1-sealed-validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PSC_V8_3_217_V1_PRESEAL_CHECKPOINT
          if-no-files-found: error
          path: |
            PSC_V8_3_217_V1_PRESEAL_CHECKPOINT.zip
            PSC_V8_3_217_V1_PRESEAL_CHECKPOINT_SHA256.txt
      - name: Enforce
        if: always()
        run: test '${{ steps.preseal.outcome }}' = 'success'
