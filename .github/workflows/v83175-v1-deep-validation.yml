        run: |
          mkdir -p .e2e;printf '{"private":true}\n' > .e2e/package.json
          npm install --prefix .e2e --no-package-lock playwright@1.55.0
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)";test -n "$CHROME";echo "$CHROME" > chrome.txt
          cd PSC_V8_3_138_DEV/dist/client;python3 -m http.server 4173 --bind 127.0.0.1 > ../../../http175.log 2>&1 & echo $! > ../../../http175.pid;cd ../../..
          node - <<'NODE'
          const fs=require('fs'),{createRequire}=require('module'),req=createRequire(process.cwd()+'/x.js'),{chromium}=req('./.e2e/node_modules/playwright');(async()=>{const paths=['validation/V8_3_175_V174_V1_FAILURE_REGRESSION.json','validation/V8_3_175_V174_V1_PREVIOUS_PASS_REGRESSION.json','validation/V8_3_174_V173_V1_FAILURE_REGRESSION.json','validation/V8_3_174_V173_V1_PREVIOUS_PASS_REGRESSION.json','validation/V8_3_173_V172_V1_FAILURE_REGRESSION.json','validation/V8_3_173_V172_V1_PREVIOUS_PASS_REGRESSION.json','validation/V8_3_172_V171_V1_FAILURE_REGRESSION.json','validation/V8_3_172_V171_V1_PREVIOUS_PASS_REGRESSION.json','validation/V8_3_171_V170_V1_FAILURE_REGRESSION.json','validation/V8_3_171_V170_V1_PREVIOUS_PASS_REGRESSION.json','validation/V8_3_169_V168_V1_FAILURE_REGRESSION.json','validation/V8_3_169_V168_V1_PREVIOUS_PASS_REGRESSION.json','validation/V8_3_168_V167_V1_FAILURE_REGRESSION.json','validation/V8_3_168_V167_V1_PREVIOUS_PASS_REGRESSION.json'],A=paths.flatMap(f=>JSON.parse(fs.readFileSync(f)).cases),exe=fs.readFileSync('chrome.txt','utf8').trim(),b=await chromium.launch({headless:true,executablePath:exe,args:['--no-sandbox']});try{const p=await b.newPage();await p.route('**/favicon.ico',r=>r.fulfill({status:204,body:''}));await p.goto('http://127.0.0.1:4173/candidate.html',{waitUntil:'networkidle'});const pf=await p.evaluate(()=>({same:QCSemanticCoreV4===QCSemanticCoreV44,version:QCSemanticCoreV44?.version,authority:document.documentElement.dataset.pscSemanticAuthority}));if(!pf.same||!pf.version?.startsWith('V8.3.175'))throw Error(JSON.stringify(pf));let pass=0;for(const c of A){const a=await p.evaluate(x=>{const r=QCSemanticCoreV4.analyze(x.surface,x.domain);return{route:r.input_route.id,families:[...r.families].sort(),sequence:!!r.sequence}},c),e={route:c.expected.route,families:[...(c.expected.families||[])].sort(),sequence:!!c.expected.sequence};if(JSON.stringify(a)!==JSON.stringify(e))throw Error(c.case_id+' '+JSON.stringify({a,e}));pass++}fs.writeFileSync('V8_3_175_BROWSER_E2E_RESULTS.json',JSON.stringify({total:A.length,passed:pass,failed:0,preflight:pf},null,2))}finally{await b.close()}})().catch(e=>{console.error(e);process.exit(1)})
          NODE
      - name: Teardown
        if: always()
        run: '[ -f http175.pid ] && kill "$(cat http175.pid)" || true'
      - name: Package checkpoint
        if: always()
        run: |
          python - <<'PY'
          import pathlib,shutil,zipfile,hashlib,json
          st=pathlib.Path('V8_3_175_CHECKPOINT');st.mkdir(exist_ok=True);r=pathlib.Path('PSC_V8_3_138_DEV')
          for p in [r/'public/psc-v83175-v174-v1-sealed-a-bounded-repair.js',pathlib.Path('V8_3_175_BROWSER_E2E_RESULTS.json'),pathlib.Path('validation/V8_3_175_V174_V1_FAILURE_REGRESSION.json'),pathlib.Path('validation/V8_3_175_V174_V1_PREVIOUS_PASS_REGRESSION.json')]:
            if p.exists():shutil.copy2(p,st/p.name)
          status={'candidate':'V8.3.175','development':'PASS' if (st/'V8_3_175_BROWSER_E2E_RESULTS.json').exists() else 'FAIL_OR_INCOMPLETE','sealed_validation_executed':False,'v174_batch_a_rerun':False,'v174_batch_b_accessed':False,'step_111_authorized':False,'production_authorized':False};(st/'V8_3_175_DEVELOPMENT_STATUS.json').write_text(json.dumps(status,indent=2))
          def sha(p):return hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          (st/'SHA256_MANIFEST.txt').write_text(''.join(f'{sha(p)}  {p.name}\n' for p in sorted(st.iterdir()) if p.is_file()));z=pathlib.Path('PSC_V8_3_175_DEVELOPMENT_VALIDATION_CHECKPOINT.zip')
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED) as q:
