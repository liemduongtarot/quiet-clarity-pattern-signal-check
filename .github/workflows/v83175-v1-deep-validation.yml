        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),s={};vm.createContext(s);
          const files=['psc-v3.js','psc-v4.js','psc-v83121-r1-reconstructed.js','psc-v83122-operator-aware.js','psc-v83123-family-preservation.js','psc-v83124-operator-context.js','psc-v83125-semantic-routing.js','psc-v83126-public-route-canonicalization.js','psc-v83127-review-intent-authority.js','psc-v83129-canonical-shadow.js','psc-v83130-representation-coverage.js','psc-v83131-proposition-consolidation.js','psc-v83132-relation-graph.js','psc-v83133-canonical-role-binding.js','psc-v83135-scoped-operator.js','psc-v83138-semantic-convergence.js','psc-v83139-semantic-convergence.js','psc-v83142-sealed-failure-convergence.js','psc-v83143-semantic-convergence.js','psc-v83144-sealed-failure-convergence.js','psc-v83145-route-layer.js','psc-v83145-family-state-layer.js','psc-v83146-route-boundary-repair.js','psc-v83146-family-sequence-repair.js','psc-v83147-sealed-failure-repair.js','psc-v83148-sealed-failure-repair.js','psc-v83149-sealed-failure-repair.js','psc-v83150-sealed-failure-repair.js','psc-v83151-sealed-failure-repair.js','psc-v83152-sealed-failure-repair.js','psc-v83153-sealed-failure-repair.js','psc-v83154-sealed-failure-repair.js','psc-v83155-sealed-failure-repair.js','psc-v83156-v155-v3-bounded-repair.js','psc-v83157-v156-sealed-a-bounded-repair.js','psc-v83158-v157-sealed-a-bounded-repair.js','psc-v83159-v158-sealed-a-bounded-repair.js','psc-v83160-v159-v2-sealed-a-bounded-repair.js','psc-v83161-v160-v1-sealed-a-bounded-repair.js','psc-v83162-v161-v1-sealed-a-bounded-repair.js','psc-v83163-v162-v1-sealed-a-bounded-repair.js','psc-v83164-v163-v1-sealed-a-bounded-repair.js','psc-v83165-v164-v1-sealed-a-bounded-repair.js','psc-v83166-v165-v1-sealed-a-bounded-repair.js','psc-v83167-v166-v1-sealed-a-bounded-repair.js','psc-v83168-v167-v1-sealed-a-bounded-repair.js','psc-v83169-v168-v1-sealed-a-bounded-repair.js','psc-v83170-v169-v1-sealed-a-bounded-repair.js','psc-v83171-v170-v1-sealed-a-bounded-repair.js','psc-v83172-v171-v1-sealed-a-bounded-repair.js','psc-v83173-v172-v1-sealed-a-bounded-repair.js','psc-v83174-v173-v1-sealed-a-bounded-repair.js','psc-v83175-v174-v1-sealed-a-bounded-repair.js'];for(const f of files)vm.runInContext(fs.readFileSync('public/'+f,'utf8'),s);if(!s.QCSemanticCoreV44)throw Error('V44 missing');let fail=0;
          function run(path,label){const A=JSON.parse(fs.readFileSync(path)).cases;let p=0,b=[];for(const c of A){const r=s.QCSemanticCoreV44.analyze(c.surface,c.domain),a={route:r.input_route.id,families:[...r.families].sort(),sequence:!!r.sequence},e={route:c.expected.route,families:[...(c.expected.families||[])].sort(),sequence:!!c.expected.sequence};if(JSON.stringify(a)===JSON.stringify(e))p++;else b.push({id:c.case_id,a,e,surface:c.surface});}console.log(label,p+'/'+A.length);if(b.length){console.log(JSON.stringify(b,null,2));fail+=b.length;}}
          run('../validation/V8_3_175_V174_V1_FAILURE_REGRESSION.json','V174 sealed failures');run('../validation/V8_3_175_V174_V1_PREVIOUS_PASS_REGRESSION.json','V174 sealed passes');run('../validation/V8_3_174_V173_V1_FAILURE_REGRESSION.json','V173 failures');run('../validation/V8_3_174_V173_V1_PREVIOUS_PASS_REGRESSION.json','V173 passes');run('../validation/V8_3_173_V172_V1_FAILURE_REGRESSION.json','V172 failures');run('../validation/V8_3_173_V172_V1_PREVIOUS_PASS_REGRESSION.json','V172 passes');run('../validation/V8_3_172_V171_V1_FAILURE_REGRESSION.json','V171 failures');run('../validation/V8_3_172_V171_V1_PREVIOUS_PASS_REGRESSION.json','V171 passes');run('../validation/V8_3_171_V170_V1_FAILURE_REGRESSION.json','V170 failures');run('../validation/V8_3_171_V170_V1_PREVIOUS_PASS_REGRESSION.json','V170 passes');run('../validation/V8_3_169_V168_V1_FAILURE_REGRESSION.json','V168 failures');run('../validation/V8_3_169_V168_V1_PREVIOUS_PASS_REGRESSION.json','V168 passes');run('../validation/V8_3_168_V167_V1_FAILURE_REGRESSION.json','V167 failures');run('../validation/V8_3_168_V167_V1_PREVIOUS_PASS_REGRESSION.json','V167 passes');if(fail)process.exit(1);
          NODE
          node --check public/psc-v83175-v174-v1-sealed-a-bounded-repair.js
      - name: Build artifact validation
        working-directory: PSC_V8_3_138_DEV
        run: |
          chmod +x scripts/*.sh
          npm run install:ci
          npm run build
          npm run validate:artifact
          test "$(find dist -type f -name '*.map' | wc -l)" -eq 0
          test -f dist/client/psc-v83175-v174-v1-sealed-a-bounded-repair.js
