name: Observe V8.3.203 Sealed One-Shot
on:
  push:
    branches: [v83203-v1-validation]
permissions:
  contents: write
  actions: read
jobs:
  observe:
    if: github.event.head_commit.message == 'Observe V8.3.203 sealed one-shot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read sealed workflow state without touching sealed branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,urllib.request,pathlib
          repo=os.environ['GITHUB_REPOSITORY']
          url=f'https://api.github.com/repos/{repo}/actions/workflows/v83203-sealed-validation.yml/runs?branch=v83203-v1-sealed-validation&event=push&per_page=20'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          data=json.load(urllib.request.urlopen(req))
          runs=[r for r in data.get('workflow_runs',[]) if r.get('display_title')=='Run V8.3.203 sealed validation one-shot']
          out={'candidate':'V8.3.203','sealed_branch':'v83203-v1-sealed-validation','trigger_sha':'0b6a9d86aaf6253791525f2a4cb263f60029bef6','found':bool(runs),'sealed_branch_modified':False,'v202_sealed_rerun':False,'step_111_authorized':False}
          if runs:
            r=sorted(runs,key=lambda x:x['id'],reverse=True)[0]
            out.update({'run_id':r['id'],'run_attempt':r['run_attempt'],'head_sha':r['head_sha'],'status':r['status'],'conclusion':r['conclusion']})
          pathlib.Path('validation/V8_3_203_SEALED_OBSERVER_STATE.json').write_text(json.dumps(out,indent=2))
          PY
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/V8_3_203_SEALED_OBSERVER_STATE.json
          git commit -m 'Record V8.3.203 sealed observer state'
          git push
