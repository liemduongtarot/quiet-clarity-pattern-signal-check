name: V8.3.222 V99 Bounded Regression
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  regression:
    if: github.event.head_commit.message == 'Run V8.3.222 V99 bounded regression'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83222-v1-validation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run V99 bounded regression
        id: reg
        continue-on-error: true
        run: python validation/v83222-v99-regression-orchestrator.py
      - name: Freeze regression evidence
        if: always()
        run: |
          set -euo pipefail
          test -f validation/V8_3_222_V99_REGRESSION_RECEIPT.json
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- validation/V8_3_222_V99_REGRESSION_RECEIPT.json validation/V8_3_222_V219_A_FROZEN_CARRIER.json validation/V8_3_222_V221_A_FROZEN_CARRIER.json
          for f in V8_3_222_V99_REGRESSION_RESULTS.json V8_3_222_V219_A_REGRESSION_RESULTS.json V8_3_222_V221_A_REGRESSION_RESULTS.json; do
            if [ -f "$f" ]; then cp "$f" validation/; git add "validation/$f"; fi
          done
          git diff --cached --quiet || git commit -m 'Record V8.3.222 V99 regression evidence'
          git push origin HEAD:v83222-v1-validation
      - name: Build checkpoint
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,zipfile,hashlib
          r=pathlib.Path('.');files=[]
          for n in ['V8_3_222_V99_REGRESSION_RECEIPT.json','V8_3_222_V219_A_FROZEN_CARRIER.json','V8_3_222_V221_A_FROZEN_CARRIER.json','V8_3_222_V99_REGRESSION_RESULTS.json','V8_3_222_V219_A_REGRESSION_RESULTS.json','V8_3_222_V221_A_REGRESSION_RESULTS.json']:
            p=r/'validation'/n
            if p.exists():files.append(p)
          z=r/'PSC_V8_3_222_V99_REGRESSION_CHECKPOINT.zip'
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED) as q:
            for p in files:q.write(p,p.name)
          h=hashlib.sha256(z.read_bytes()).hexdigest();(r/'PSC_V8_3_222_V99_REGRESSION_CHECKPOINT_SHA256.txt').write_text(h+'  '+z.name+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PSC_V8_3_222_V99_REGRESSION_CHECKPOINT
          if-no-files-found: error
          path: |
            PSC_V8_3_222_V99_REGRESSION_CHECKPOINT.zip
            PSC_V8_3_222_V99_REGRESSION_CHECKPOINT_SHA256.txt
      - name: Enforce
        if: always()
        run: test '${{ steps.reg.outcome }}' = 'success'
