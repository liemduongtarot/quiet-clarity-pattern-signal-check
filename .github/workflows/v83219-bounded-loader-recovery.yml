name: V8.3.219 Bounded Loader Recovery
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  recovery:
    if: github.event.head_commit.message == 'Run V8.3.219 bounded loader recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83219-v1-validation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run bounded loader-chain validation
        id: recovery
        continue-on-error: true
        run: python validation/v83219-loader-chain-recovery.py
      - name: Freeze recovery evidence and checkpoint
        if: always()
        run: |
          set -euo pipefail
          test -f validation/V8_3_219_BOUNDED_LOADER_RECOVERY_RECEIPT.json
          python - <<'PY'
          import pathlib,zipfile,hashlib
          root=pathlib.Path('.'); rec=root/'validation/V8_3_219_BOUNDED_LOADER_RECOVERY_RECEIPT.json'
          z=root/'PSC_V8_3_219_BOUNDED_LOADER_RECOVERY_CHECKPOINT.zip'
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED) as q:q.write(rec,rec.name)
          (root/'PSC_V8_3_219_BOUNDED_LOADER_RECOVERY_CHECKPOINT_SHA256.txt').write_text(hashlib.sha256(z.read_bytes()).hexdigest()+'  '+z.name+'\n')
          PY
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- validation/V8_3_219_BOUNDED_LOADER_RECOVERY_RECEIPT.json
          git diff --cached --quiet || git commit -m 'Record V8.3.219 bounded loader recovery evidence'
          git push origin HEAD:v83219-v1-validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PSC_V8_3_219_BOUNDED_LOADER_RECOVERY_CHECKPOINT
          if-no-files-found: error
          path: |
            PSC_V8_3_219_BOUNDED_LOADER_RECOVERY_CHECKPOINT.zip
            PSC_V8_3_219_BOUNDED_LOADER_RECOVERY_CHECKPOINT_SHA256.txt
      - name: Enforce
        if: always()
        run: test '${{ steps.recovery.outcome }}' = 'success'
