name: V8.3.255 Step 4 Facebook Bridge Repair R2

on:
  push:
    branches: [v83255-step4-repair]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Materialize exact deployed authority and patch bridge only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir src
          gh run download 32671592504 -n PSC_V8_3_255_EXACT_DEPLOYABLE_DIST -D src
          unzip -q src/PSC_V8_3_255_EXACT_DEPLOYABLE_DIST.zip -d original
          cp -a original patched
          python - <<'PY'
          from pathlib import Path
          p=Path('patched/client/candidate.html'); s=p.read_text(encoding='utf-8')
          old='<div class="note consult-note"><b>NẾU BẠN MUỐN ĐI SÂU HƠN</b><p>Nếu bạn muốn Quiet Clarity xem xét tình huống này sâu hơn, hãy sao chép kết quả Pattern Signal Check và gửi lại khi liên hệ tư vấn. Không có kết quả nào được tự động gửi sang Quiet Clarity.</p></div>'
          new='<div class="note consult-note"><b>NẾU BẠN MUỐN ĐI SÂU HƠN</b><p>Nếu bạn muốn Quiet Clarity xem xét tình huống này sâu hơn, hãy sao chép kết quả và gửi lại qua Facebook Page.</p><a class="consult-contact" id="contactFacebook" href="https://www.facebook.com/quietclarity.uklondon" target="_blank" rel="noopener noreferrer">LIÊN HỆ QUIET CLARITY TRÊN FACEBOOK</a><p class="privacy-note">Pattern Signal Check không tự động gửi nội dung của bạn sang Quiet Clarity.</p></div>'
          oldcss='.consult-note{margin-top:22px}.privacy-note{color:#cdbba3;font-size:14px}'
          newcss='.consult-note{margin-top:22px}.consult-contact{display:inline-block;margin-top:10px;padding:9px 13px;border:1px solid #765a38;border-radius:7px;background:transparent;color:#eee1d0;font-family:"Inter",ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;font-weight:700;text-decoration:none}.privacy-note{color:#cdbba3;font-size:14px;margin-top:10px}'
          assert s.count(old)==1 and s.count(oldcss)==1
          p.write_text(s.replace(old,new).replace(oldcss,newcss),encoding='utf-8')
          PY
      - name: Static regression and semantic identity
        run: |
          mkdir -p evidence
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,re,urllib.parse
          O=Path('original'); P=Path('patched')
          old=(O/'client/candidate.html').read_text(encoding='utf-8'); new=(P/'client/candidate.html').read_text(encoding='utf-8')
          sha=lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          def fhash(s,a,b):
            x=s.index('function '+a); y=s.index('function '+b,x); return hashlib.sha256(s[x:y].encode()).hexdigest()
          of={str(p.relative_to(O)):sha(p) for p in O.rglob('*') if p.is_file()}; nf={str(p.relative_to(P)):sha(p) for p in P.rglob('*') if p.is_file()}
          changed=sorted(k for k in of if of[k]!=nf[k])
          url='https://www.facebook.com/quietclarity.uklondon'; u=urllib.parse.urlsplit(url)
          checks={
            'only_candidate_html_changed':changed==['client/candidate.html'],
            'changed_files':changed,
            'resultPlainText_unchanged':fhash(old,'resultPlainText','actionMessage')==fhash(new,'resultPlainText','actionMessage'),
            'copyCurrentResult_unchanged':fhash(old,'copyCurrentResult','saveCurrentResult')==fhash(new,'copyCurrentResult','saveCurrentResult'),
            'saveCurrentResult_unchanged':fhash(old,'saveCurrentResult','wireResultActions')==fhash(new,'saveCurrentResult','wireResultActions'),
            'wireResultActions_unchanged':fhash(old,'wireResultActions','showResult')==fhash(new,'wireResultActions','showResult'),
            'cta_exact':f'id="contactFacebook" href="{url}" target="_blank" rel="noopener noreferrer"' in new,
            'cta_no_query_fragment':not u.query and not u.fragment,
            'bridge_copy_exact':'Nếu bạn muốn Quiet Clarity xem xét tình huống này sâu hơn, hãy sao chép kết quả và gửi lại qua Facebook Page.' in new,
            'privacy_copy_exact':'Pattern Signal Check không tự động gửi nội dung của bạn sang Quiet Clarity.' in new,
            'no_new_fetch':new.count('fetch(')<=old.count('fetch('),
            'no_new_xhr':new.count('XMLHttpRequest')<=old.count('XMLHttpRequest'),
            'no_new_beacon':new.count('sendBeacon')<=old.count('sendBeacon'),
            'no_new_localStorage':new.count('localStorage')<=old.count('localStorage'),
            'no_new_sessionStorage':new.count('sessionStorage')<=old.count('sessionStorage'),
            'v124_sha':sha(P/'client/psc-v83253-v252-v124-residual.js'),
            'v5ay_sha':sha(P/'client/qc-evidence-extractor-v5ay-v253-v252-residual.js'),
          }
          checks['v124_identity']=checks['v124_sha']=='50f170383bb3f273beb64cbb251029de2c4fd84d256a5be33e2e8c646a87dd96'
          checks['v5ay_identity']=checks['v5ay_sha']=='26bb9d33e5c04b041e72fdf2f435c954415f3f62f731c0e64584d8a8f452174a'
          checks['pass']=all(v for k,v in checks.items() if isinstance(v,bool))
          Path('evidence/V8_3_255_STEP4_FACEBOOK_BRIDGE_STATIC_R2.json').write_text(json.dumps(checks,ensure_ascii=False,indent=2)+'\n')
          assert checks['pass'], checks
          PY
      - name: Semantic valid-invalid smoke
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,json
          h=Path('patched/client/candidate.html').read_text(); srcs=re.findall(r'<script[^>]+src="([^"]+)"',h)
          L=["const fs=require('fs'),vm=require('vm');"]
          for x in srcs:
            if x.endswith('.js'):
              b=Path(x).name; L.append(f"vm.runInThisContext(fs.readFileSync('patched/client/{b}','utf8'),{{filename:{b!r}}});")
          T=[['Khi nào tôi mới có tiền?','money','input:prediction',False],['Tôi đã trì hoãn gửi báo cáo ba lần trong tháng này dù biết việc đó làm dự án chậm, và tuần này tôi lại tránh mở email nhắc việc.','career','input:self-lived',True]]
          L.append('const T='+json.dumps(T,ensure_ascii=False)+'; const o=T.map(([t,d,route,can])=>{const r=QCSemanticCoreV124.analyze(t,d);return {input:t,route:r.input_route.id,can_continue:r.can_continue,pass:r.input_route.id===route&&r.can_continue===can}}); fs.writeFileSync("evidence/V8_3_255_STEP4_SEMANTIC_SMOKE_R2.json",JSON.stringify({core:QCSemanticCoreV124.version,extractor:!!QCEvidenceExtractorV5AY,tests:o,pass:o.every(x=>x.pass)},null,2)); if(!o.every(x=>x.pass))process.exit(1);')
          Path('/tmp/smoke.js').write_text('\n'.join(L))
          PY
          node /tmp/smoke.js
      - name: Install Playwright
        run: |
          cd /tmp && npm init -y >/dev/null 2>&1 && npm install playwright@1.55.0 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Browser E2E
        run: |
          python3 -m http.server 4173 --directory patched/client >/tmp/http.log 2>&1 &
          sleep 2
          cat >/tmp/e2e.cjs <<'JS'
          const {chromium}=require('/tmp/node_modules/playwright'); const fs=require('fs');
          (async()=>{const b=await chromium.launch({headless:true});const c=await b.newContext();await c.grantPermissions(['clipboard-read','clipboard-write'],{origin:'http://127.0.0.1:4173'});const p=await c.newPage();const outbound=[];await c.route('https://www.facebook.com/**',async r=>{outbound.push(r.request().url());await r.fulfill({status:200,contentType:'text/html',body:'ok'})});await p.goto('http://127.0.0.1:4173/candidate.html',{waitUntil:'domcontentloaded'});await p.evaluate(()=>showResult('<div class="b"><b>TEST</b><p>RESULT BODY</p></div>'));const o={};o.copy=await p.locator('#copyResult').isVisible();o.save=await p.locator('#saveResult').isVisible();o.cta=await p.locator('#contactFacebook').isVisible();o.href=await p.locator('#contactFacebook').getAttribute('href');o.target=await p.locator('#contactFacebook').getAttribute('target');o.rel=await p.locator('#contactFacebook').getAttribute('rel');o.bridge=(await p.locator('.consult-note p').first().textContent()).trim();o.privacy=(await p.locator('.privacy-note').textContent()).trim();await p.locator('#copyResult').click();o.copymsg=(await p.locator('#actionMsg').textContent()).trim();const dp=p.waitForEvent('download');await p.locator('#saveResult').click();o.download=(await dp).suggestedFilename();const pp=p.waitForEvent('popup');await p.locator('#contactFacebook').click();const pop=await pp;await pop.waitForLoadState('domcontentloaded').catch(()=>{});o.popup=pop.url();o.outbound=outbound;o.pass=o.copy&&o.save&&o.cta&&o.href==='https://www.facebook.com/quietclarity.uklondon'&&o.target==='_blank'&&/noopener/.test(o.rel)&&/noreferrer/.test(o.rel)&&o.bridge==='Nếu bạn muốn Quiet Clarity xem xét tình huống này sâu hơn, hãy sao chép kết quả và gửi lại qua Facebook Page.'&&o.privacy==='Pattern Signal Check không tự động gửi nội dung của bạn sang Quiet Clarity.'&&o.copymsg.startsWith('Đã sao chép kết quả.')&&o.download==='Pattern_Signal_Check_Result.txt'&&!/[?&#](text|message|result|situation|pattern)=/i.test(o.href);fs.writeFileSync('evidence/V8_3_255_STEP4_FACEBOOK_BRIDGE_BROWSER_E2E_R2.json',JSON.stringify(o,null,2));await b.close();if(!o.pass)process.exit(1)})()
          JS
          node /tmp/e2e.cjs
      - name: Build candidate and PASS receipt
        run: |
          (cd patched && zip -qr ../PSC_V8_3_255_STEP4_FACEBOOK_BRIDGE_REPAIR_CANDIDATE_R2.zip .)
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          z=Path('PSC_V8_3_255_STEP4_FACEBOOK_BRIDGE_REPAIR_CANDIDATE_R2.zip'); h=hashlib.sha256(z.read_bytes()).hexdigest()
          r={'candidate':'V8.3.255 Step 4 Facebook Bridge Repair R2','base_production_pointer':'5860c948ef12781867a9115d57d2fe7de8f319b5','approved_destination':'https://www.facebook.com/quietclarity.uklondon','diagnostic_layer':'UI / PRESENTATION','static_regression':'PASS','semantic_valid_invalid_smoke':'PASS','browser_e2e':'PASS','copy_save_unchanged':True,'session_only_privacy':'PASS','v124_v5ay_identity':'PASS','expected_gold_changed':False,'sealed_batch_a_rerun':False,'sealed_batch_b_rerun':False,'production_deployed':False,'candidate_sha256':h,'verdict':'PASS — STEP 4 PUBLIC BRIDGE REPAIR CANDIDATE FROZEN; OWNER PRODUCTION PROMOTION/DEPLOYMENT AUTHORIZATION REQUIRED','pass':True}
          Path('evidence/V8_3_255_STEP4_FACEBOOK_BRIDGE_REPAIR_PASS_R2.json').write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n')
          Path('evidence/V8_3_255_STEP4_FACEBOOK_BRIDGE_REPAIR_CANDIDATE_R2_SHA256.txt').write_text(h+'  '+z.name+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: PSC_V8_3_255_STEP4_FACEBOOK_BRIDGE_REPAIR_CANDIDATE_R2
          path: |
            evidence/
            PSC_V8_3_255_STEP4_FACEBOOK_BRIDGE_REPAIR_CANDIDATE_R2.zip
      - name: Record immutable PASS evidence on candidate branch
        run: |
          mkdir -p validation/v83255-step4-facebook-bridge
          cp evidence/*.json evidence/*.txt validation/v83255-step4-facebook-bridge/
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/v83255-step4-facebook-bridge
          git commit -m 'Record V8.3.255 Step 4 Facebook bridge repair PASS R2'
          git push origin HEAD:v83255-step4-repair
