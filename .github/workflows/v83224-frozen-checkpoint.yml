name: V8.3.224 Frozen Failure Checkpoint
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checkpoint:
    if: github.event.head_commit.message == 'Build V8.3.224 frozen failure checkpoint'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: v83224-v1-sealed-validation, fetch-depth: 0}
      - name: Build checkpoint
        run: |
          python - <<'PY'
          import pathlib,zipfile,hashlib
          root=pathlib.Path('validation/v83224-v1-sealed');files=[p for p in root.glob('V8_3_224_*.json') if p.exists()];z=pathlib.Path('PSC_V8_3_224_FROZEN_FAILURE_CHECKPOINT.zip')
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED) as q:
            for p in sorted(files):q.write(p,p.name)
          pathlib.Path('PSC_V8_3_224_FROZEN_FAILURE_CHECKPOINT_SHA256.txt').write_text(hashlib.sha256(z.read_bytes()).hexdigest()+'  '+z.name+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: PSC_V8_3_224_FROZEN_FAILURE_CHECKPOINT
          path: |
            PSC_V8_3_224_FROZEN_FAILURE_CHECKPOINT.zip
            PSC_V8_3_224_FROZEN_FAILURE_CHECKPOINT_SHA256.txt
