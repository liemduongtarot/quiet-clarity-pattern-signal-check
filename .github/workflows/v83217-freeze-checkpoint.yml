name: V8.3.217 Frozen Failure Checkpoint
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checkpoint:
    if: github.event.head_commit.message == 'Build V8.3.217 frozen failure checkpoint'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83217-v1-sealed-validation
          fetch-depth: 1
      - name: Build immutable frozen checkpoint
        run: |
          python - <<'PY'
          import pathlib,hashlib,zipfile,shutil
          r=pathlib.Path('.');o=r/'validation/v83217-v1-sealed';d=r/'V8_3_217_FROZEN_FAILURE_CHECKPOINT'
          shutil.rmtree(d,ignore_errors=True);d.mkdir()
          names=['V8_3_217_SEALED_AUTHORITY_V1.json','V8_3_217_PRESEAL_DIVERSITY_AUDIT_V1.json','V8_3_217_PRESEAL_RUN_RECEIPT.json','V8_3_217_TRANSPORT_VERIFICATION_V1.json','V8_3_217_STATIC_SEALED_PREFLIGHT_V1.json','V8_3_217_BATCH_A_ATTEMPT_MARKER.json','V8_3_217_SEALED_FIRST_RUN_MARKER.json','V8_3_217_BATCH_A_STATUS_V1.json','V8_3_217_BATCH_A_FAILURE_AUTOPSY_V1.json','V8_3_217_SEALED_FREEZE_V1.json']
          for n in names:
            p=o/n
            if not p.exists():raise SystemExit('missing '+n)
            shutil.copy2(p,d/n)
          def sha(p):return hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          (d/'SHA256_MANIFEST.txt').write_text(''.join(f'{sha(p)}  {p.name}\n' for p in sorted(d.iterdir()) if p.is_file()))
          z=r/'PSC_V8_3_217_V1_FROZEN_FAILURE_CHECKPOINT.zip'
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED) as q:
            for p in sorted(d.iterdir()):q.write(p,p.name)
          (r/'PSC_V8_3_217_V1_FROZEN_FAILURE_CHECKPOINT_SHA256.txt').write_text(f'{sha(z)}  {z.name}\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: PSC_V8_3_217_V1_FROZEN_FAILURE_CHECKPOINT
          if-no-files-found: error
          path: |
            PSC_V8_3_217_V1_FROZEN_FAILURE_CHECKPOINT.zip
            PSC_V8_3_217_V1_FROZEN_FAILURE_CHECKPOINT_SHA256.txt
