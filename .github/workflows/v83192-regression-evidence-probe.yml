name: V8.3.192 Regression Evidence Probe
on:
  push:
    branches: [v83192-v1-validation]
permissions:
  actions: read
  contents: write
jobs:
  probe:
    if: github.event.head_commit.message == 'Probe V8.3.192 regression sweep evidence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Record target run metadata only
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: 3e83488fafcffe96b9a5a4b4bfda28eae47a9ea2
        run: |
          python - <<'PY'
          import os,json,urllib.request,pathlib
          repo=os.environ['GITHUB_REPOSITORY']; target=os.environ['TARGET']; token=os.environ['GH_TOKEN']
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/runs?head_sha={target}&event=push&per_page=20',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','User-Agent':'psc-probe'})
          runs=json.load(urllib.request.urlopen(req))['workflow_runs']; runs=[r for r in runs if r['head_sha']==target and r['name']=='V8.3.192 Regression Sweep']
          if not runs: raise SystemExit('target run not found')
          r=sorted(runs,key=lambda x:x['id'])[-1]
          out={'target_head_sha':target,'run_id':r['id'],'status':r['status'],'conclusion':r['conclusion']}
          pathlib.Path('validation/V8_3_192_REGRESSION_SWEEP_RECEIPT.json').write_text(json.dumps(out,indent=2))
          PY
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/V8_3_192_REGRESSION_SWEEP_RECEIPT.json
          git commit -m 'Record V8.3.192 regression sweep receipt'
          git push