name: V8.3.222 Fresh Preseal Freeze R2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  preseal:
    if: github.event.head_commit.message == 'Run V8.3.222 fresh preseal freeze R2'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83222-v1-sealed-validation
          fetch-depth: 0
      - name: Construction-only R2
        id: preseal
        continue-on-error: true
        run: python validation/v83222-v1-sealed/v83222-preseal-freeze-r2.py
      - name: Freeze R2 preseal evidence
        if: always()
        run: |
          set -euo pipefail
          test -f validation/v83222-v1-sealed/V8_3_222_PRESEAL_RUN_RECEIPT.json
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- validation/v83222-v1-sealed/V8_3_222_*.json
          git diff --cached --quiet || git commit -m 'Record V8.3.222 frozen preseal R2 authority'
          git push origin HEAD:v83222-v1-sealed-validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PSC_V8_3_222_V1_PRESEAL_R2_CHECKPOINT
          if-no-files-found: error
          path: |
            PSC_V8_3_222_V1_PRESEAL_CHECKPOINT.zip
            PSC_V8_3_222_V1_PRESEAL_CHECKPOINT_SHA256.txt
      - name: Enforce
        if: always()
        run: test '${{ steps.preseal.outcome }}' = 'success'
