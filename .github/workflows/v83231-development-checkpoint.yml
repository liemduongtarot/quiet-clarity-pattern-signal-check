name: V8.3.231 DEVELOPMENT checkpoint
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v83231-development-checkpoint.yml
permissions:
  contents: read
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8be235fe1d00396dc43de3ac82990f4255bb73a7
          fetch-depth: 0
      - name: Build checkpoint
        run: |
          set -euo pipefail
          mkdir V8_3_231_DEVELOPMENT_CHECKPOINT
          cp validation/V8_3_231_DEVELOPMENT_AUTHORITY_V1.json V8_3_231_DEVELOPMENT_CHECKPOINT/
          cp validation/V8_3_231_V107_REGRESSION_RECEIPT.json V8_3_231_DEVELOPMENT_CHECKPOINT/
          cp validation/qc-evidence-extractor-v5ah-v231-isolated-concepts.js V8_3_231_DEVELOPMENT_CHECKPOINT/
          cp validation/psc-v83231-v230-v107-isolated-concepts.js V8_3_231_DEVELOPMENT_CHECKPOINT/
          printf '%s\n' '8be235fe1d00396dc43de3ac82990f4255bb73a7' > V8_3_231_DEVELOPMENT_CHECKPOINT/DEVELOPMENT_SHA.txt
          (cd V8_3_231_DEVELOPMENT_CHECKPOINT && sha256sum * > SHA256_MANIFEST.txt)
          zip -r PSC_V8_3_231_DEVELOPMENT_CHECKPOINT.zip V8_3_231_DEVELOPMENT_CHECKPOINT
          sha256sum PSC_V8_3_231_DEVELOPMENT_CHECKPOINT.zip > PSC_V8_3_231_DEVELOPMENT_CHECKPOINT_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PSC_V8_3_231_DEVELOPMENT_CHECKPOINT
          path: |
            PSC_V8_3_231_DEVELOPMENT_CHECKPOINT.zip
            PSC_V8_3_231_DEVELOPMENT_CHECKPOINT_SHA256.txt
          if-no-files-found: error
