name: V8.3.165 Development Run Diagnostic
on:
  push:
    branches: [main]
jobs:
  inspect:
    if: github.event.head_commit.message == 'Run V8.3.165 development run diagnostic'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Query exact development trigger run history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, pathlib
          repo=os.environ['GITHUB_REPOSITORY']; sha='bc21989f6fe4e2f5cd561c4df1fc5d716e322a67'
          url=f'https://api.github.com/repos/{repo}/actions/runs?head_sha={sha}&per_page=100'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req) as r:data=json.load(r)
          runs=[]
          for x in data.get('workflow_runs',[]):
              runs.append({k:x.get(k) for k in ['id','name','event','status','conclusion','head_branch','head_sha','run_attempt','workflow_id','created_at','updated_at']})
          out={'authority':'V8.3.165 DEVELOPMENT TRIGGER RUN DIAGNOSTIC','target_head_sha':sha,'total_count':data.get('total_count',0),'runs':runs,'sealed_validation_executed_by_diagnostic':False,'step_111_authorized':False,'production_authorized':False}
          pathlib.Path('validation/V8_3_165_DEVELOPMENT_TRIGGER_RUN_DIAGNOSTIC.json').write_text(json.dumps(out,indent=2));print(json.dumps(out,indent=2))
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add validation/V8_3_165_DEVELOPMENT_TRIGGER_RUN_DIAGNOSTIC.json
          git commit -m 'Record V8.3.165 development trigger diagnostic' || exit 0
          git push
