name: V8.3.211 R3 Consolidated One-Shot
on:
  push:
    branches: [v83211-v1-validation]
permissions:
  contents: write
jobs:
  sealed:
    if: github.event.head_commit.message == 'Run V8.3.211 R3 consolidated one-shot'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Execute pinned transport and semantic one-shot
        id: run
        continue-on-error: true
        run: python validation/v83211-r3-one-shot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PSC_V8_3_211_R3_SEALED_VALIDATION_CHECKPOINT
          path: |
            PSC_V8_3_211_R3_SEALED_VALIDATION_CHECKPOINT.zip
            PSC_V8_3_211_R3_SEALED_VALIDATION_CHECKPOINT_SHA256.txt
      - name: Record immutable run receipt
        if: always()
        run: |
          test -f validation/V8_3_211_R3_ONE_SHOT_RUN_RECEIPT.json
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- validation/V8_3_211_R3_ONE_SHOT_RUN_RECEIPT.json
          git commit -m 'Record V8.3.211 R3 consolidated one-shot receipt'
          git push
      - name: Fail unless both sealed batches passed
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib,sys
          r=json.loads(pathlib.Path('validation/V8_3_211_R3_ONE_SHOT_RUN_RECEIPT.json').read_text())
          if r.get('conclusion')!='success':sys.exit(1)
          PY
