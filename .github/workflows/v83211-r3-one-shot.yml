name: V8.3.211 R4 Semantic One-Shot
on:
  push:
    branches: [v83211-v1-validation]
permissions:
  contents: write
jobs:
  sealed:
    if: github.event.head_commit.message == 'Run V8.3.211 R4 semantic one-shot'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Execute pinned R4 transport and semantic one-shot
        id: sealed
        continue-on-error: true
        run: python validation/v83211-r4-one-shot.py
      - name: Ensure immutable receipt exists
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib,os
          p=pathlib.Path('validation/V8_3_211_R4_ONE_SHOT_RUN_RECEIPT.json')
          if not p.exists():
            p.write_text(json.dumps({'candidate':'V8.3.211','phase':'sealed-validation-r4','run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'status':'completed','conclusion':'presemantic-plumbing-failure','transport_passed':False,'batch_a_executed':False,'batch_a_passed':None,'batch_a_failed':None,'batch_b_executed':False,'batch_b_passed':None,'batch_b_failed':None,'sealed_trigger_repeated':False,'v210_sealed_rerun':False,'step_111_authorized':False,'production_authorized':False},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PSC_V8_3_211_R4_SEALED_VALIDATION_CHECKPOINT
          path: |
            PSC_V8_3_211_R4_SEALED_VALIDATION_CHECKPOINT.zip
            PSC_V8_3_211_R4_SEALED_VALIDATION_CHECKPOINT_SHA256.txt
          if-no-files-found: warn
      - name: Record R4 first-run evidence
        if: always()
        run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- validation/V8_3_211_R4_ONE_SHOT_RUN_RECEIPT.json
          if [ -f validation/V8_3_211_R4_SEMANTIC_FIRST_RUN_EXECUTED.json ]; then git add -- validation/V8_3_211_R4_SEMANTIC_FIRST_RUN_EXECUTED.json; fi
          if [ -d validation/v83211-r4-run ]; then git add -- validation/v83211-r4-run; fi
          git diff --cached --quiet || git commit -m 'Record V8.3.211 R4 sealed first-run evidence'
          git push
      - name: Enforce sealed outcome
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib,sys
          r=json.loads(pathlib.Path('validation/V8_3_211_R4_ONE_SHOT_RUN_RECEIPT.json').read_text())
          if r.get('conclusion')!='success': sys.exit(1)
          PY
