name: V8.3.159 V2 Sealed Validation
on:
  push:
    branches: [v83159-v2-sealed-validation-raw3]

jobs:
  sealed_validate:
    if: github.event.head_commit.message == 'Run V8.3.159 V2 sealed validation'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}

      - name: Verify immutable sealed material and materialize exact V8.3.159 authority
        run: |
          python - <<'PY'
          import pathlib,json,hashlib,zipfile
          root=pathlib.Path('validation/v83159-v2-sealed')
          def obj_from_paths(paths): return json.loads(''.join((root/p).read_text() for p in paths))
          def canonical_sha(obj):
              x=dict(obj); x.pop('sha256_without_sha_field',None)
              return hashlib.sha256(json.dumps(x,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          sel=json.loads((root/'V8_3_159_PRESEAL_OWNER_SELECTION_V2.json').read_text())
          mem=json.loads((root/'V8_3_159_SEALED_MEMBERSHIP_V2.json').read_text())
          gold=obj_from_paths(['V8_3_159_INDEPENDENT_GOLD_V2.json.part01','V8_3_159_INDEPENDENT_GOLD_V2.json.part02','V8_3_159_INDEPENDENT_GOLD_V2.json.part03a','V8_3_159_INDEPENDENT_GOLD_V2.json.part03b','V8_3_159_INDEPENDENT_GOLD_V2.json.part03c','V8_3_159_INDEPENDENT_GOLD_V2.json.part03d','V8_3_159_INDEPENDENT_GOLD_V2.json.part04','V8_3_159_INDEPENDENT_GOLD_V2.json.part05'])
          fix=obj_from_paths([f'V8_3_159_SEALED_EXECUTION_FIXTURE_V2.json.part{i:02d}' for i in range(1,6)])
          bank='61827266acfe807d43d9acc5762186c8a41b2057c5bbad442625ae90b7ff2947'
          assert canonical_sha(sel)=='7c58338e6b7e4c999db9ff047c166b132364c78c9b1a80f8e2936ebaa22669ea'
          assert canonical_sha(gold)=='58e958e1df86b25350902258f0f3ab6c80c5f5d626d6623ed67bff4141c64251'
          assert canonical_sha(mem)=='3513fb05021bda714501e8111e66583f2c610a4a036ddd12ee88e210732705b1'
          assert canonical_sha(fix)=='c0cd4a7746327e3eb98f01c3c1e36c14e4b2930b0cecfeb409def18cfc3bd516'
          assert sel['source_bank_sha256']==bank and sel['case_count']==60 and sel['runtime_execution_before_selection']==0
          assert gold['source_bank_sha256']==bank and gold['selection_sha256']==sel['sha256_without_sha_field'] and gold['case_count']==60 and gold['runtime_execution_before_gold']==0
          assert mem['source_bank_sha256']==bank and mem['selection_sha256']==sel['sha256_without_sha_field'] and mem['gold_sha256']==gold['sha256_without_sha_field'] and mem['sealed_before_runtime'] is True and mem['runtime_execution_before_membership']==0
          assert fix['development_authority_commit']=='9cc6d0c9a96fa0a6cd0c7b6c0c8265d789ee6f1f' and fix['candidate_sha256']==bank and fix['selection_sha256']==sel['sha256_without_sha_field'] and fix['gold_sha256']==gold['sha256_without_sha_field'] and fix['membership_sha256']==mem['sha256_without_sha_field'] and fix['sealed_before_execution'] is True and fix['runtime_execution_before_fixture']==0
          ids=set(sel['case_ids']); A=set(mem['batch_A_case_ids']); B=set(mem['batch_B_case_ids'])
          assert len(ids)==60 and len(A)==30 and len(B)==30 and not(A&B) and A|B==ids
          assert set(fix['batch_a'])==A and set(fix['batch_b'])==B and len(fix['cases'])==60
          pathlib.Path('V8_3_159_PRESEAL_OWNER_SELECTION_V2.json').write_text(json.dumps(sel,ensure_ascii=False,indent=2))
          pathlib.Path('V8_3_159_INDEPENDENT_GOLD_V2.json').write_text(json.dumps(gold,ensure_ascii=False,indent=2))
          pathlib.Path('V8_3_159_SEALED_MEMBERSHIP_V2.json').write_text(json.dumps(mem,ensure_ascii=False,indent=2))
          pathlib.Path('V8_3_159_SEALED_EXECUTION_FIXTURE_V2.json').write_text(json.dumps(fix,ensure_ascii=False,indent=2))
          with zipfile.ZipFile('PSC_V8_3_139_FINAL_LOCAL_READINESS_EXTERNAL_BUILD_PENDING_CHECKPOINT (1).zip') as z:z.extractall('.')
          PY
          for f in psc-v83142-sealed-failure-convergence.js psc-v83143-semantic-convergence.js psc-v83144-sealed-failure-convergence.js psc-v83145-route-layer.js psc-v83145-family-state-layer.js psc-v83146-route-boundary-repair.js psc-v83146-family-sequence-repair.js psc-v83147-sealed-failure-repair.js psc-v83148-sealed-failure-repair.js psc-v83149-sealed-failure-repair.js psc-v83150-sealed-failure-repair.js psc-v83151-sealed-failure-repair.js psc-v83152-sealed-failure-repair.js psc-v83153-sealed-failure-repair.js psc-v83154-sealed-failure-repair.js psc-v83155-sealed-failure-repair.js psc-v83156-v155-v3-bounded-repair.js psc-v83157-v156-sealed-a-bounded-repair.js psc-v83158-v157-sealed-a-bounded-repair.js psc-v83159-v158-sealed-a-bounded-repair.js; do cp validation/$f PSC_V8_3_138_DEV/public/; done

      - name: SEALED Batch A first run exactly once
        working-directory: PSC_V8_3_138_DEV
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),s={};vm.createContext(s);
          const files=['psc-v3.js','psc-v4.js','psc-v83121-r1-reconstructed.js','psc-v83122-operator-aware.js','psc-v83123-family-preservation.js','psc-v83124-operator-context.js','psc-v83125-semantic-routing.js','psc-v83126-public-route-canonicalization.js','psc-v83127-review-intent-authority.js','psc-v83129-canonical-shadow.js','psc-v83130-representation-coverage.js','psc-v83131-proposition-consolidation.js','psc-v83132-relation-graph.js','psc-v83133-canonical-role-binding.js','psc-v83135-scoped-operator.js','psc-v83138-semantic-convergence.js','psc-v83139-semantic-convergence.js','psc-v83142-sealed-failure-convergence.js','psc-v83143-semantic-convergence.js','psc-v83144-sealed-failure-convergence.js','psc-v83145-route-layer.js','psc-v83145-family-state-layer.js','psc-v83146-route-boundary-repair.js','psc-v83146-family-sequence-repair.js','psc-v83147-sealed-failure-repair.js','psc-v83148-sealed-failure-repair.js','psc-v83149-sealed-failure-repair.js','psc-v83150-sealed-failure-repair.js','psc-v83151-sealed-failure-repair.js','psc-v83152-sealed-failure-repair.js','psc-v83153-sealed-failure-repair.js','psc-v83154-sealed-failure-repair.js','psc-v83155-sealed-failure-repair.js','psc-v83156-v155-v3-bounded-repair.js','psc-v83157-v156-sealed-a-bounded-repair.js','psc-v83158-v157-sealed-a-bounded-repair.js','psc-v83159-v158-sealed-a-bounded-repair.js'];
          for(const f of files) vm.runInContext(fs.readFileSync('public/'+f,'utf8'),s);
          if(!s.QCSemanticCoreV28||!String(s.QCSemanticCoreV28.version).startsWith('V8.3.159')) throw Error('V8.3.159 authority missing');
          const fix=JSON.parse(fs.readFileSync('../V8_3_159_SEALED_EXECUTION_FIXTURE_V2.json'));
          const by=new Map(fix.cases.map(c=>[c.case_id,c])); const results=[];
          for(const id of fix.batch_a){const c=by.get(id),r=s.QCSemanticCoreV28.analyze(c.surface,c.domain);const actual={route:r.input_route.id,families:[...r.families].sort(),sequence:!!r.sequence};const expected={route:c.expected.route,families:[...(c.expected.families||[])].sort(),sequence:!!c.expected.sequence};results.push({case_id:id,pass:JSON.stringify(actual)===JSON.stringify(expected),surface:c.surface,domain:c.domain,language:c.language,expected,actual});}
          const passed=results.filter(x=>x.pass).length, failed=results.length-passed;
          const out={authority:'V8.3.159 V2 SEALED BATCH A FIRST RUN',run_id:process.env.GITHUB_RUN_ID,run_attempt:process.env.GITHUB_RUN_ATTEMPT,total:results.length,passed,failed,results};
          fs.writeFileSync('../V8_3_159_BATCH_A_FIRST_RUN_RESULTS.json',JSON.stringify(out,null,2));
          if(failed) process.exit(1);
          NODE

      - name: SEALED Batch B exactly once only after A PASS
        if: success()
        working-directory: PSC_V8_3_138_DEV
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),s={};vm.createContext(s);
          const files=['psc-v3.js','psc-v4.js','psc-v83121-r1-reconstructed.js','psc-v83122-operator-aware.js','psc-v83123-family-preservation.js','psc-v83124-operator-context.js','psc-v83125-semantic-routing.js','psc-v83126-public-route-canonicalization.js','psc-v83127-review-intent-authority.js','psc-v83129-canonical-shadow.js','psc-v83130-representation-coverage.js','psc-v83131-proposition-consolidation.js','psc-v83132-relation-graph.js','psc-v83133-canonical-role-binding.js','psc-v83135-scoped-operator.js','psc-v83138-semantic-convergence.js','psc-v83139-semantic-convergence.js','psc-v83142-sealed-failure-convergence.js','psc-v83143-semantic-convergence.js','psc-v83144-sealed-failure-convergence.js','psc-v83145-route-layer.js','psc-v83145-family-state-layer.js','psc-v83146-route-boundary-repair.js','psc-v83146-family-sequence-repair.js','psc-v83147-sealed-failure-repair.js','psc-v83148-sealed-failure-repair.js','psc-v83149-sealed-failure-repair.js','psc-v83150-sealed-failure-repair.js','psc-v83151-sealed-failure-repair.js','psc-v83152-sealed-failure-repair.js','psc-v83153-sealed-failure-repair.js','psc-v83154-sealed-failure-repair.js','psc-v83155-sealed-failure-repair.js','psc-v83156-v155-v3-bounded-repair.js','psc-v83157-v156-sealed-a-bounded-repair.js','psc-v83158-v157-sealed-a-bounded-repair.js','psc-v83159-v158-sealed-a-bounded-repair.js'];
          for(const f of files) vm.runInContext(fs.readFileSync('public/'+f,'utf8'),s);
          const a=JSON.parse(fs.readFileSync('../V8_3_159_BATCH_A_FIRST_RUN_RESULTS.json')); if(a.failed!==0||a.passed!==30) throw Error('Batch A not 30/30');
          const fix=JSON.parse(fs.readFileSync('../V8_3_159_SEALED_EXECUTION_FIXTURE_V2.json')); const by=new Map(fix.cases.map(c=>[c.case_id,c])); const results=[];
          for(const id of fix.batch_b){const c=by.get(id),r=s.QCSemanticCoreV28.analyze(c.surface,c.domain);const actual={route:r.input_route.id,families:[...r.families].sort(),sequence:!!r.sequence};const expected={route:c.expected.route,families:[...(c.expected.families||[])].sort(),sequence:!!c.expected.sequence};results.push({case_id:id,pass:JSON.stringify(actual)===JSON.stringify(expected),surface:c.surface,domain:c.domain,language:c.language,expected,actual});}
          const passed=results.filter(x=>x.pass).length, failed=results.length-passed;fs.writeFileSync('../V8_3_159_BATCH_B_FIRST_RUN_RESULTS.json',JSON.stringify({authority:'V8.3.159 V2 SEALED BATCH B FIRST RUN',run_id:process.env.GITHUB_RUN_ID,run_attempt:process.env.GITHUB_RUN_ATTEMPT,total:results.length,passed,failed,results},null,2));if(failed)process.exit(1);
          NODE

      - name: Package immutable sealed checkpoint
        if: always()
        run: |
          python - <<'PY'
          import pathlib,json,zipfile,hashlib,shutil
          st=pathlib.Path('V8_3_159_V2_SEALED_CHECKPOINT');st.mkdir(exist_ok=True)
          names=['V8_3_159_PRESEAL_OWNER_SELECTION_V2.json','V8_3_159_INDEPENDENT_GOLD_V2.json','V8_3_159_SEALED_MEMBERSHIP_V2.json','V8_3_159_SEALED_EXECUTION_FIXTURE_V2.json','V8_3_159_BATCH_A_FIRST_RUN_RESULTS.json','V8_3_159_BATCH_B_FIRST_RUN_RESULTS.json']
          for n in names:
              p=pathlib.Path(n)
              if p.exists():shutil.copy2(p,st/n)
          a=json.loads(pathlib.Path('V8_3_159_BATCH_A_FIRST_RUN_RESULTS.json').read_text()) if pathlib.Path('V8_3_159_BATCH_A_FIRST_RUN_RESULTS.json').exists() else None
          b=json.loads(pathlib.Path('V8_3_159_BATCH_B_FIRST_RUN_RESULTS.json').read_text()) if pathlib.Path('V8_3_159_BATCH_B_FIRST_RUN_RESULTS.json').exists() else None
          status={'authority':'V8.3.159 V2 SEALED STATUS','run_id':'${{ github.run_id }}','run_attempt':'${{ github.run_attempt }}','head_sha':'${{ github.sha }}','transport_preflight_run_id':32121540476,'batch_a_executed':a is not None,'batch_a_passed':a['passed'] if a else None,'batch_a_failed':a['failed'] if a else None,'batch_b_executed':b is not None,'batch_b_passed':b['passed'] if b else None,'batch_b_failed':b['failed'] if b else None,'step_111_executed':False,'production_authorized':False}
          (st/'V8_3_159_SEALED_STATUS.json').write_text(json.dumps(status,indent=2))
          (st/'SHA256_MANIFEST.txt').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in sorted(st.iterdir()) if p.is_file()))
          z=pathlib.Path('PSC_V8_3_159_V2_SEALED_VALIDATION_CHECKPOINT.zip')
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED) as q:
              for p in sorted(st.iterdir()): q.write(p,p.name)
          pathlib.Path('PSC_V8_3_159_V2_SEALED_VALIDATION_CHECKPOINT_SHA256.txt').write_text(f'{hashlib.sha256(z.read_bytes()).hexdigest()}  {z.name}\n')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PSC_V8_3_159_V2_SEALED_VALIDATION_CHECKPOINT
          path: |
            PSC_V8_3_159_V2_SEALED_VALIDATION_CHECKPOINT.zip
            PSC_V8_3_159_V2_SEALED_VALIDATION_CHECKPOINT_SHA256.txt
