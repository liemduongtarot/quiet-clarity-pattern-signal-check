name: V8.3.188 Sealed Evidence Probe
on:
  push:
    branches: [v83188-v1-sealed-validation]
permissions:
  actions: read
  contents: write
jobs:
  probe:
    if: github.event.head_commit.message == 'Probe V8.3.188 sealed evidence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record sealed receipt
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 34db7c4c40e8c71689513d0715d09fb118e3799d
        run: |
          python - <<'PY'
          import json,os,urllib.request,pathlib
          repo=os.environ['GITHUB_REPOSITORY'];target=os.environ['TARGET_SHA'];token=os.environ['GH_TOKEN']
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/runs?branch=v83188-v1-sealed-validation&per_page=50',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json'})
          runs=json.load(urllib.request.urlopen(req))['workflow_runs'];cand=[r for r in runs if r.get('head_sha')==target and r.get('name')=='V8.3.188 Sealed Validation'];assert cand
          r=sorted(cand,key=lambda x:x['id'],reverse=True)[0]
          pathlib.Path('validation/v83188-v1-sealed/V8_3_188_SEALED_RUN_RECEIPT.json').write_text(json.dumps({'candidate':'V8.3.188','phase':'sealed-validation','target_head_sha':target,'run_id':r['id'],'status':r['status'],'conclusion':r.get('conclusion'),'run_attempt':r.get('run_attempt',1),'sealed_trigger_repeated':False,'v187_sealed_rerun':False},indent=2))
          PY
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/v83188-v1-sealed/V8_3_188_SEALED_RUN_RECEIPT.json
          git commit -m 'Record V8.3.188 sealed run receipt'
          git push