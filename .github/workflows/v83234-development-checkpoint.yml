name: V8.3.234 DEVELOPMENT checkpoint
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v83234-development-checkpoint.yml
permissions:
  contents: read
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6486a01fe4db04ad9594af67a8401d5340d54720
          fetch-depth: 0
      - name: Build checkpoint
        run: |
          set -euo pipefail
          mkdir V8_3_234_DEVELOPMENT_CHECKPOINT
          cp validation/V8_3_234_DEVELOPMENT_AUTHORITY_V1.json V8_3_234_DEVELOPMENT_CHECKPOINT/
          cp validation/V8_3_234_V109_REGRESSION_RECEIPT.json V8_3_234_DEVELOPMENT_CHECKPOINT/
          cp validation/qc-evidence-extractor-v5aj-v234-residual-generalization.js V8_3_234_DEVELOPMENT_CHECKPOINT/
          cp validation/psc-v83234-v233-v109-residual-generalization.js V8_3_234_DEVELOPMENT_CHECKPOINT/
          printf '%s\n' '6486a01fe4db04ad9594af67a8401d5340d54720' > V8_3_234_DEVELOPMENT_CHECKPOINT/DEVELOPMENT_SHA.txt
          (cd V8_3_234_DEVELOPMENT_CHECKPOINT && sha256sum * > SHA256_MANIFEST.txt)
          zip -r PSC_V8_3_234_DEVELOPMENT_CHECKPOINT.zip V8_3_234_DEVELOPMENT_CHECKPOINT
          sha256sum PSC_V8_3_234_DEVELOPMENT_CHECKPOINT.zip > PSC_V8_3_234_DEVELOPMENT_CHECKPOINT_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PSC_V8_3_234_DEVELOPMENT_CHECKPOINT
          path: |
            PSC_V8_3_234_DEVELOPMENT_CHECKPOINT.zip
            PSC_V8_3_234_DEVELOPMENT_CHECKPOINT_SHA256.txt
          if-no-files-found: error
