name: V8.3.241 PRESEAL
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v83241-preseal.yml
permissions:
  contents: write
jobs:
  preseal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83241-v1-sealed-validation
          fetch-depth: 0
      - name: Run construction-only PRESEAL
        id: run
        shell: bash
        run: |
          set +e
          python validation/v83241-v1-sealed/v83241-preseal-freeze.py > /tmp/v241-preseal.log 2>&1
          rc=$?
          cat /tmp/v241-preseal.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Freeze evidence
        if: always()
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for f in validation/v83241-v1-sealed/V8_3_241_PRESEAL_RUN_RECEIPT.json validation/v83241-v1-sealed/V8_3_241_PRESEAL_CANDIDATE_BANK_V1.json validation/v83241-v1-sealed/V8_3_241_SEALED_SELECTION_V1.json validation/v83241-v1-sealed/V8_3_241_SEALED_FIXTURE_V1.json validation/v83241-v1-sealed/V8_3_241_INDEPENDENT_GOLD_V1.json validation/v83241-v1-sealed/V8_3_241_SEALED_MEMBERSHIP_V1.json validation/v83241-v1-sealed/V8_3_241_PRESEAL_DIVERSITY_AUDIT_V1.json validation/v83241-v1-sealed/V8_3_241_SEALED_AUTHORITY_V1.json; do test ! -f "$f" || git add "$f"; done
          git diff --cached --quiet || git commit -m 'Freeze V8.3.241 PRESEAL authority'
          git push origin HEAD:v83241-v1-sealed-validation
      - name: Build checkpoint
        if: always()
        run: |
          set -euo pipefail
          rm -rf V8_3_241_PRESEAL_CHECKPOINT && mkdir V8_3_241_PRESEAL_CHECKPOINT
          for f in validation/v83241-v1-sealed/V8_3_241_*; do test ! -f "$f" || cp "$f" V8_3_241_PRESEAL_CHECKPOINT/; done
          (cd V8_3_241_PRESEAL_CHECKPOINT && sha256sum * > SHA256_MANIFEST.txt)
          zip -r PSC_V8_3_241_PRESEAL_CHECKPOINT.zip V8_3_241_PRESEAL_CHECKPOINT
          sha256sum PSC_V8_3_241_PRESEAL_CHECKPOINT.zip > PSC_V8_3_241_PRESEAL_CHECKPOINT_SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PSC_V8_3_241_PRESEAL_CHECKPOINT
          path: |
            PSC_V8_3_241_PRESEAL_CHECKPOINT.zip
            PSC_V8_3_241_PRESEAL_CHECKPOINT_SHA256.txt
          if-no-files-found: error
      - name: Enforce outcome
        run: test '${{ steps.run.outputs.rc }}' = '0'
