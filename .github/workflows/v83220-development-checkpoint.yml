name: V8.3.220 Development Checkpoint
on:
  push:
    branches: [main]
jobs:
  checkpoint:
    if: github.event.head_commit.message == 'Build V8.3.220 development checkpoint'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 06ac0e51c958f5c64dcb97f91d66b122d3048bf8
          fetch-depth: 1
      - name: Build immutable development checkpoint
        run: |
          python - <<'PY'
          import pathlib,zipfile,hashlib
          r=pathlib.Path('.'); files=[
            r/'validation/V8_3_220_DEVELOPMENT_AUTHORITY.json',
            r/'validation/V8_3_220_V98_REGRESSION_RECEIPT.json',
            r/'validation/V8_3_220_V219_A_IMMUTABLE_CARRIER.json',
            r/'validation/V8_3_220_V219_A_REGRESSION_RESULTS.json',
            r/'validation/qc-evidence-extractor-v5y-v220-bounded-recall.js',
            r/'validation/psc-v83220-v219-v98-bounded-recall.js']
          assert all(p.exists() for p in files)
          z=r/'PSC_V8_3_220_DEVELOPMENT_CHECKPOINT.zip'
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED) as q:
            for p in files:q.write(p,p.name)
          (r/'PSC_V8_3_220_DEVELOPMENT_CHECKPOINT_SHA256.txt').write_text(hashlib.sha256(z.read_bytes()).hexdigest()+'  '+z.name+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: PSC_V8_3_220_DEVELOPMENT_CHECKPOINT
          if-no-files-found: error
          path: |
            PSC_V8_3_220_DEVELOPMENT_CHECKPOINT.zip
            PSC_V8_3_220_DEVELOPMENT_CHECKPOINT_SHA256.txt
