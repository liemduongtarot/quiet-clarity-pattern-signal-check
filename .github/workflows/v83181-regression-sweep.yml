name: V8.3.181 Regression Sweep
on:
  push:
    branches: [v83181-v1-validation]
jobs:
  regressions:
    if: github.event.head_commit.message == 'Run V8.3.181 regression sweep'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Materialize exact historical carriers
        run: |
          python - <<'PY'
          import pathlib,base64,gzip,zipfile
          names=['V8_3_172_V171_V1_FAILURE_REGRESSION','V8_3_172_V171_V1_PREVIOUS_PASS_REGRESSION','V8_3_171_V170_V1_FAILURE_REGRESSION','V8_3_171_V170_V1_PREVIOUS_PASS_REGRESSION','V8_3_169_V168_V1_FAILURE_REGRESSION','V8_3_169_V168_V1_PREVIOUS_PASS_REGRESSION','V8_3_168_V167_V1_FAILURE_REGRESSION','V8_3_168_V167_V1_PREVIOUS_PASS_REGRESSION']
          for n in names:
            p=pathlib.Path('validation/'+n+'.json.gz.b64');assert p.exists(),n
            pathlib.Path('validation/'+n+'.json').write_bytes(gzip.decompress(base64.b64decode(p.read_text().strip())))
          with zipfile.ZipFile('PSC_V8_3_139_FINAL_LOCAL_READINESS_EXTERNAL_BUILD_PENDING_CHECKPOINT (1).zip') as z:z.extractall('.')
          PY
          for f in psc-v83142-sealed-failure-convergence.js psc-v83143-semantic-convergence.js psc-v83144-sealed-failure-convergence.js psc-v83145-route-layer.js psc-v83145-family-state-layer.js psc-v83146-route-boundary-repair.js psc-v83146-family-sequence-repair.js psc-v83147-sealed-failure-repair.js psc-v83148-sealed-failure-repair.js psc-v83149-sealed-failure-repair.js psc-v83150-sealed-failure-repair.js psc-v83151-sealed-failure-repair.js psc-v83152-sealed-failure-repair.js psc-v83153-sealed-failure-repair.js psc-v83154-sealed-failure-repair.js psc-v83155-sealed-failure-repair.js psc-v83156-v155-v3-bounded-repair.js psc-v83157-v156-sealed-a-bounded-repair.js psc-v83158-v157-sealed-a-bounded-repair.js psc-v83159-v158-sealed-a-bounded-repair.js psc-v83160-v159-v2-sealed-a-bounded-repair.js psc-v83161-v160-v1-sealed-a-bounded-repair.js psc-v83162-v161-v1-sealed-a-bounded-repair.js psc-v83163-v162-v1-sealed-a-bounded-repair.js psc-v83164-v163-v1-sealed-a-bounded-repair.js psc-v83165-v164-v1-sealed-a-bounded-repair.js psc-v83166-v165-v1-sealed-a-bounded-repair.js psc-v83167-v166-v1-sealed-a-bounded-repair.js psc-v83168-v167-v1-sealed-a-bounded-repair.js psc-v83169-v168-v1-sealed-a-bounded-repair.js psc-v83170-v169-v1-sealed-a-bounded-repair.js psc-v83171-v170-v1-sealed-a-bounded-repair.js psc-v83172-v171-v1-sealed-a-bounded-repair.js psc-v83173-v172-v1-sealed-a-bounded-repair.js psc-v83174-v173-v1-sealed-a-bounded-repair.js psc-v83175-v174-v1-sealed-a-bounded-repair.js psc-v83176-v175-bank-contract-carry-forward.js psc-v83177-v176-sealed-a-bounded-repair.js psc-v83178-v177-sealed-a-bounded-repair.js psc-v83179-v178-sealed-a-bounded-repair.js psc-v83180-v179-sealed-a-bounded-repair.js psc-v83181-v180-sealed-a-bounded-repair.js psc-v83181-v180-v1-historical-precedence-repair.js psc-v83181-v180-v1-historical-self-family-precedence-repair.js; do cp validation/$f PSC_V8_3_138_DEV/public/; done
      - name: Sweep immutable regressions
        working-directory: PSC_V8_3_138_DEV
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),path=require('path'),s={};vm.createContext(s);
          const files=['psc-v3.js','psc-v4.js','psc-v83121-r1-reconstructed.js','psc-v83122-operator-aware.js','psc-v83123-family-preservation.js','psc-v83124-operator-context.js','psc-v83125-semantic-routing.js','psc-v83126-public-route-canonicalization.js','psc-v83127-review-intent-authority.js','psc-v83129-canonical-shadow.js','psc-v83130-representation-coverage.js','psc-v83131-proposition-consolidation.js','psc-v83132-relation-graph.js','psc-v83133-canonical-role-binding.js','psc-v83135-scoped-operator.js','psc-v83138-semantic-convergence.js','psc-v83139-semantic-convergence.js','psc-v83142-sealed-failure-convergence.js','psc-v83143-semantic-convergence.js','psc-v83144-sealed-failure-convergence.js','psc-v83145-route-layer.js','psc-v83145-family-state-layer.js','psc-v83146-route-boundary-repair.js','psc-v83146-family-sequence-repair.js','psc-v83147-sealed-failure-repair.js','psc-v83148-sealed-failure-repair.js','psc-v83149-sealed-failure-repair.js','psc-v83150-sealed-failure-repair.js','psc-v83151-sealed-failure-repair.js','psc-v83152-sealed-failure-repair.js','psc-v83153-sealed-failure-repair.js','psc-v83154-sealed-failure-repair.js','psc-v83155-sealed-failure-repair.js','psc-v83156-v155-v3-bounded-repair.js','psc-v83157-v156-sealed-a-bounded-repair.js','psc-v83158-v157-sealed-a-bounded-repair.js','psc-v83159-v158-sealed-a-bounded-repair.js','psc-v83160-v159-v2-sealed-a-bounded-repair.js','psc-v83161-v160-v1-sealed-a-bounded-repair.js','psc-v83162-v161-v1-sealed-a-bounded-repair.js','psc-v83163-v162-v1-sealed-a-bounded-repair.js','psc-v83164-v163-v1-sealed-a-bounded-repair.js','psc-v83165-v164-v1-sealed-a-bounded-repair.js','psc-v83166-v165-v1-sealed-a-bounded-repair.js','psc-v83167-v166-v1-sealed-a-bounded-repair.js','psc-v83168-v167-v1-sealed-a-bounded-repair.js','psc-v83169-v168-v1-sealed-a-bounded-repair.js','psc-v83170-v169-v1-sealed-a-bounded-repair.js','psc-v83171-v170-v1-sealed-a-bounded-repair.js','psc-v83172-v171-v1-sealed-a-bounded-repair.js','psc-v83173-v172-v1-sealed-a-bounded-repair.js','psc-v83174-v173-v1-sealed-a-bounded-repair.js','psc-v83175-v174-v1-sealed-a-bounded-repair.js','psc-v83176-v175-bank-contract-carry-forward.js','psc-v83177-v176-sealed-a-bounded-repair.js','psc-v83178-v177-sealed-a-bounded-repair.js','psc-v83179-v178-sealed-a-bounded-repair.js','psc-v83180-v179-sealed-a-bounded-repair.js','psc-v83181-v180-sealed-a-bounded-repair.js','psc-v83181-v180-v1-historical-precedence-repair.js','psc-v83181-v180-v1-historical-self-family-precedence-repair.js'];for(const f of files)vm.runInContext(fs.readFileSync('public/'+f,'utf8'),s);if(!s.QCSemanticCoreV50R2)throw Error('V50R2 missing');
          const dir='../validation',paths=fs.readdirSync(dir).filter(x=>/REGRESSION\.json$/.test(x));let total=0;const bad=[];
          for(const name of paths){const o=JSON.parse(fs.readFileSync(path.join(dir,name),'utf8'));if(!Array.isArray(o.cases))continue;for(const c of o.cases){const r=s.QCSemanticCoreV50R2.analyze(c.surface,c.domain),a={route:r.input_route.id,families:[...r.families].sort(),sequence:!!r.sequence},e={route:c.expected.route,families:[...(c.expected.families||[])].sort(),sequence:!!c.expected.sequence};if(JSON.stringify(a)!==JSON.stringify(e))bad.push({file:name,id:c.case_id,surface:c.surface,a,e});total++;}}
          console.log('TOTAL',total,'FAIL',bad.length);if(bad.length){console.log(JSON.stringify(bad.slice(0,50),null,2));process.exit(1);}console.log('V181 REGRESSION SWEEP PASS',total);
          NODE