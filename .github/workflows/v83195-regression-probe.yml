name: V8.3.195 Regression Probe
on:
  push:
    branches: [v83195-v1-validation]
permissions:
  actions: read
  contents: write
jobs:
  probe:
    if: github.event.head_commit.message == 'Probe V8.3.195 regression sweep evidence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record target run metadata only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,urllib.request,time,pathlib
          target='caf920a8511ef09d1ded37d4ac9767b4c5c9f216'
          url='https://api.github.com/repos/liemduongtarot/quiet-clarity-pattern-signal-check/actions/runs?branch=v83195-v1-validation&event=push&per_page=100'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          found=None
          for _ in range(20):
            with urllib.request.urlopen(req) as r:data=json.load(r)
            for x in data.get('workflow_runs',[]):
              if x.get('head_sha')==target and x.get('name')=='V8.3.195 Regression Sweep': found=x; break
            if found and found.get('status')=='completed': break
            time.sleep(5)
          out={'target_head_sha':target,'run_id':found.get('id') if found else None,'status':found.get('status') if found else 'not_found','conclusion':found.get('conclusion') if found else None}
          pathlib.Path('validation/V8_3_195_REGRESSION_SWEEP_RECEIPT.json').write_text(json.dumps(out,indent=2))
          PY
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/V8_3_195_REGRESSION_SWEEP_RECEIPT.json
          git commit -m 'Record V8.3.195 regression sweep receipt'
          git push
