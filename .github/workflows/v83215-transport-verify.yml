name: V8.3.215 Transport Verify
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  transport:
    if: github.event.head_commit.message == 'Verify V8.3.215 frozen transport'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83215-v1-sealed-validation
          fetch-depth: 1
      - name: Verify frozen hashes without semantic runtime
        run: python validation/v83215-v1-sealed/v83215-transport-verify.py
      - name: Commit transport receipt
        run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- validation/v83215-v1-sealed/V8_3_215_TRANSPORT_VERIFICATION_V1.json
          git diff --cached --quiet || git commit -m 'Record V8.3.215 transport verification'
          git push origin HEAD:v83215-v1-sealed-validation
