name: V8.3.155 V3 Sealed Observer
on:
  workflow_run:
    workflows: ['V8.3.155 V3 Sealed Validation']
    types: [completed]
permissions:
  contents: write
jobs:
  record:
    if: github.event.workflow_run.head_branch == 'v83155-v3-sealed-validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Record immutable sealed run evidence
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT: ${{ github.event.workflow_run.event }}
        run: |
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('validation/V8_3_155_V3_SEALED_RUN_EVIDENCE.json');p.parent.mkdir(exist_ok=True)
          p.write_text(json.dumps({'authority':'V8.3.155 V3 SEALED RUN EVIDENCE','run_id':int(os.environ['RUN_ID']),'run_attempt':int(os.environ['RUN_ATTEMPT']),'conclusion':os.environ['CONCLUSION'],'head_sha':os.environ['HEAD_SHA'],'event':os.environ['EVENT'],'sealed_branch':'v83155-v3-sealed-validation','step_111_authorized':False,'production_authorized':False},indent=2))
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add validation/V8_3_155_V3_SEALED_RUN_EVIDENCE.json
          git commit -m 'Record V8.3.155 V3 sealed run evidence' || exit 0
          git push origin main
