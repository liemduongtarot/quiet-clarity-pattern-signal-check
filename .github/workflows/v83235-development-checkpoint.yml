name: V8.3.235 DEVELOPMENT checkpoint
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v83235-development-checkpoint.yml
permissions:
  contents: read
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4c58dbbd7315719093e58eb01ac18acec8cdb6fd
          fetch-depth: 0
      - name: Build checkpoint
        run: |
          set -euo pipefail
          mkdir V8_3_235_DEVELOPMENT_CHECKPOINT
          cp validation/V8_3_235_DEVELOPMENT_AUTHORITY_V1.json V8_3_235_DEVELOPMENT_CHECKPOINT/
          cp validation/V8_3_235_V110_REGRESSION_RECEIPT.json V8_3_235_DEVELOPMENT_CHECKPOINT/
          cp validation/qc-evidence-extractor-v5ak-v235-final-residuals.js V8_3_235_DEVELOPMENT_CHECKPOINT/
          cp validation/psc-v83235-v234-v110-final-residuals.js V8_3_235_DEVELOPMENT_CHECKPOINT/
          printf '%s\n' '4c58dbbd7315719093e58eb01ac18acec8cdb6fd' > V8_3_235_DEVELOPMENT_CHECKPOINT/DEVELOPMENT_SHA.txt
          (cd V8_3_235_DEVELOPMENT_CHECKPOINT && sha256sum * > SHA256_MANIFEST.txt)
          zip -r PSC_V8_3_235_DEVELOPMENT_CHECKPOINT.zip V8_3_235_DEVELOPMENT_CHECKPOINT
          sha256sum PSC_V8_3_235_DEVELOPMENT_CHECKPOINT.zip > PSC_V8_3_235_DEVELOPMENT_CHECKPOINT_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PSC_V8_3_235_DEVELOPMENT_CHECKPOINT
          path: |
            PSC_V8_3_235_DEVELOPMENT_CHECKPOINT.zip
            PSC_V8_3_235_DEVELOPMENT_CHECKPOINT_SHA256.txt
          if-no-files-found: error
