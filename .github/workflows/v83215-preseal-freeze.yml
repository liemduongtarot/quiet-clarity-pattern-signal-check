name: V8.3.215 Dedicated Preseal Freeze R8
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  preseal:
    if: github.event.head_commit.message == 'Execute V8.3.215 preseal freeze R8'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83215-v1-sealed-validation
          fetch-depth: 1
      - name: Construct audit freeze R8
        id: preseal
        continue-on-error: true
        run: python validation/v83215-v1-sealed/v83215-preseal-freeze-r8.py
      - name: Commit frozen evidence
        if: always()
        run: |
          set -euo pipefail
          test -f validation/v83215-v1-sealed/V8_3_215_PRESEAL_RUN_RECEIPT.json
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- validation/v83215-v1-sealed/V8_3_215_*.json
          git diff --cached --quiet || git commit -m 'Record V8.3.215 frozen preseal authority R8'
          git push origin HEAD:v83215-v1-sealed-validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PSC_V8_3_215_V1_PRESEAL_CHECKPOINT_R8
          if-no-files-found: error
          path: |
            PSC_V8_3_215_V1_PRESEAL_CHECKPOINT.zip
            PSC_V8_3_215_V1_PRESEAL_CHECKPOINT_SHA256.txt
      - name: Enforce
        if: always()
        run: test '${{ steps.preseal.outcome }}' = 'success'
