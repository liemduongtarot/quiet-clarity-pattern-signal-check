name: Observe V8.3.172 Development
on:
  push:
    branches: [main]
permissions:
  actions: read
  contents: write
jobs:
  observe:
    if: github.event.head_commit.message == 'Observe V8.3.172 development'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Observe exact development run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json,time,urllib.request,pathlib
          repo='liemduongtarot/quiet-clarity-pattern-signal-check';sha='60621d9d6d61e1a1a48270433d88ce77424a9a15'
          url=f'https://api.github.com/repos/{repo}/actions/runs?head_sha={sha}&per_page=20'
          def get():
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              return json.load(urllib.request.urlopen(req))
          target=None
          for _ in range(96):
              cand=[r for r in get().get('workflow_runs',[]) if r.get('name')=='V8.3.172 V1 Deep Validation' and r.get('head_sha')==sha]
              if cand:
                  target=sorted(cand,key=lambda r:r['id'],reverse=True)[0]
                  if target.get('status')=='completed':break
              time.sleep(5)
          if not target:raise SystemExit('development run not found')
          out={'authority':'V8.3.172 DEVELOPMENT RUN EVIDENCE','run_id':target['id'],'run_attempt':target.get('run_attempt'),'status':target.get('status'),'conclusion':target.get('conclusion'),'head_sha':target.get('head_sha'),'head_branch':target.get('head_branch'),'workflow_name':target.get('name'),'sealed_validation_executed':False,'step_111_authorized':False,'production_authorized':False}
          pathlib.Path('validation/V8_3_172_DEVELOPMENT_RUN_EVIDENCE.json').write_text(json.dumps(out,indent=2));print(json.dumps(out,indent=2))
          if target.get('status')!='completed':raise SystemExit('development run incomplete')
          PY
      - name: Commit evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/V8_3_172_DEVELOPMENT_RUN_EVIDENCE.json
          git commit -m 'Record V8.3.172 development run evidence'
          git push origin HEAD:main
