name: V8.3.170 Browser E2E V2 Observer
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  observe:
    if: github.event.head_commit.message == 'Observe V8.3.170 Browser E2E V2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Observe exact V170 V2 run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,urllib.request,pathlib,time
          sha='e3c28163cba968aaab0dfe28743a136f26509ce1'
          url=f'https://api.github.com/repos/liemduongtarot/quiet-clarity-pattern-signal-check/actions/runs?head_sha={sha}&event=push&per_page=20'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer ${{ github.token }}','Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req) as r:data=json.load(r)
          runs=[x for x in data.get('workflow_runs',[]) if x.get('name')=='V8.3.170 V1 Browser E2E V2']
          assert runs,'V170 V2 run not found'
          x=sorted(runs,key=lambda a:a['id'],reverse=True)[0]
          out={'authority':'V8.3.170 Browser E2E V2 Run Evidence','run_id':x['id'],'run_attempt':x['run_attempt'],'status':x['status'],'conclusion':x['conclusion'],'head_sha':x['head_sha'],'head_branch':x['head_branch'],'workflow_name':x['name'],'semantic_authority_changed':False,'sealed_validation_executed':False,'step_111_authorized':False,'production_authorized':False}
          pathlib.Path('validation/V8_3_170_BROWSER_E2E_V2_RUN_EVIDENCE.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - name: Commit evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/V8_3_170_BROWSER_E2E_V2_RUN_EVIDENCE.json
          git commit -m 'Record V8.3.170 Browser E2E V2 run evidence' || exit 0
          git push
