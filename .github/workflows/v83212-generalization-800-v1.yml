name: V8.3.212 Generalization 800 V2
on:
  push:
    branches: [v83212-v1-validation]
permissions:
  contents: write
jobs:
  challenge:
    if: github.event.head_commit.message == 'Run V8.3.212 generalization 800 V2'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Materialize historical application authority
        run: |
          python - <<'PY'
          import pathlib,base64,gzip,zipfile
          names=['V8_3_172_V171_V1_FAILURE_REGRESSION','V8_3_172_V171_V1_PREVIOUS_PASS_REGRESSION','V8_3_171_V170_V1_FAILURE_REGRESSION','V8_3_171_V170_V1_PREVIOUS_PASS_REGRESSION','V8_3_169_V168_V1_FAILURE_REGRESSION','V8_3_169_V168_V1_PREVIOUS_PASS_REGRESSION','V8_3_168_V167_V1_FAILURE_REGRESSION','V8_3_168_V167_V1_PREVIOUS_PASS_REGRESSION']
          for n in names:
            p=pathlib.Path('validation/'+n+'.json.gz.b64');pathlib.Path('validation/'+n+'.json').write_bytes(gzip.decompress(base64.b64decode(p.read_text().strip())))
          with zipfile.ZipFile('PSC_V8_3_139_FINAL_LOCAL_READINESS_EXTERNAL_BUILD_PENDING_CHECKPOINT (1).zip') as z:z.extractall('.')
          PY
      - name: Generate fresh 800-case challenge
        run: python validation/v83212-generalization-800-generator.py
      - name: Materialize prior-only contamination references
        run: |
          mkdir -p validation/v83212-generalization-refs
          for v in 201 202 203 204 205 206 207 208 209; do s=${v#20}; git fetch --depth=1 origin refs/heads/v8320${s}-v1-sealed-validation:refs/remotes/origin/v8320${s}-v1-sealed-validation; git show origin/v8320${s}-v1-sealed-validation:validation/v8320${s}-v1-sealed/V8_3_${v}_SEALED_FIXTURE_V1.json > validation/v83212-generalization-refs/V8_3_${v}_SEALED.json; done
          git fetch --depth=1 origin refs/heads/v83210-v1-sealed-validation:refs/remotes/origin/v83210-v1-sealed-validation
          git show origin/v83210-v1-sealed-validation:validation/v83210-v1-sealed/V8_3_210_SEALED_FIXTURE_V1.json > validation/v83212-generalization-refs/V8_3_210_SEALED.json
          git fetch --depth=1 origin 6d82282b620f03e397368a6d973b566d8055d2eb
          mkdir -p /tmp/v211-r4-ref/validation/v83211-r4-frozen
          git show 6d82282b620f03e397368a6d973b566d8055d2eb:validation/v83211-r4-frozen/generate-r4-carrier.py > /tmp/v211-r4-ref/validation/v83211-r4-frozen/generate-r4-carrier.py
          (cd /tmp/v211-r4-ref && python validation/v83211-r4-frozen/generate-r4-carrier.py)
          cp /tmp/v211-r4-ref/validation/v83211-r4-runtime/V8_3_211_R4_SEALED_FIXTURE.json validation/v83212-generalization-refs/V8_3_211_R4_SEALED.json
          python validation/v83211-generalization-600-generator-v1r.py
          cp validation/V8_3_211_DEVELOPMENT_GENERALIZATION_600_V1.json validation/v83212-generalization-refs/V8_3_211_DEV_600.json
      - name: Build V91 runner from proven regression bootstrap
        run: python validation/v83212-build-generalization-800-v2-runner.py
      - name: Run V91 800-case generalization audit
        id: audit
        continue-on-error: true
        run: node validation/run-v83212-generalization-800-v2.cjs
      - name: Record challenge receipt
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib,os
          p=pathlib.Path('V8_3_212_DEVELOPMENT_GENERALIZATION_800_RESULTS_V1.json');r=json.loads(p.read_text()) if p.exists() else None
          receipt={'candidate':'V8.3.212','phase':'generalization-800-v2','run_id':int(os.environ['GITHUB_RUN_ID']),'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'head_sha':os.environ['GITHUB_SHA'],'semantic_authority':'QCSemanticCoreV91','total':r.get('total') if r else None,'classification_passed':r.get('classification_passed') if r else None,'evidence_passed':r.get('evidence_passed') if r else None,'pass':r.get('pass') if r else False,'independence':r.get('independence') if r else None,'failure_attribution':r.get('failure_attribution') if r else None,'v211_r4_sealed_rerun':False,'step_111_authorized':False,'production_authorized':False}
          pathlib.Path('validation/V8_3_212_GENERALIZATION_800_V2_RECEIPT.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- validation/V8_3_212_GENERALIZATION_800_V2_RECEIPT.json
          git commit -m 'Record V8.3.212 generalization 800 V2 evidence'
          git push
      - name: Enforce challenge gate
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib,sys
          p=pathlib.Path('V8_3_212_DEVELOPMENT_GENERALIZATION_800_RESULTS_V1.json')
          if not p.exists():sys.exit(1)
          r=json.loads(p.read_text())
          if r.get('total')!=800 or not r.get('pass'):sys.exit(1)
          PY
