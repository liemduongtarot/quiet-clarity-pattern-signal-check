name: V8.3.212 Preseal Main Runner
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  trace:
    if: startsWith(github.event.head_commit.message, 'Run V8.3.212 fresh preseal via main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Record preseal run start
        run: |
          python - <<'PY'
          import json,os,pathlib
          pathlib.Path('validation/V8_3_212_PRESEAL_RUN_START.json').write_text(json.dumps({'run_id':int(os.environ['GITHUB_RUN_ID']),'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'head_sha':os.environ['GITHUB_SHA'],'semantic_runtime_executed':False,'batch_a_executed':False,'batch_b_executed':False},indent=2)+'\n')
          PY
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- validation/V8_3_212_PRESEAL_RUN_START.json
          git commit -m 'Record V8.3.212 preseal run start'
          git push origin HEAD:main
  preseal:
    needs: trace
    if: startsWith(github.event.head_commit.message, 'Run V8.3.212 fresh preseal via main')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83212-v1-sealed-validation
          fetch-depth: 20
      - name: Verify exact sealed-prep lineage
        run: |
          test "$(git merge-base --is-ancestor 840cfd3aeea515a335a97615fbc321ebf0e1ce11 HEAD; echo $?)" = "0"
          test -f validation/psc-v83212-v211-v92-relational-recall.js
          test -f validation/qc-evidence-extractor-v5s-v212-relational-recall.js
          test -f validation/v83212-preseal-diversity-hotfix-v1.py
      - name: Materialize prior-only contamination references
        run: |
          mkdir -p validation/v83212-preseal-refs
          for v in 201 202 203 204 205 206 207 208 209; do s=${v#20}; git fetch --depth=1 origin refs/heads/v8320${s}-v1-sealed-validation:refs/remotes/origin/v8320${s}-v1-sealed-validation; git show origin/v8320${s}-v1-sealed-validation:validation/v8320${s}-v1-sealed/V8_3_${v}_SEALED_FIXTURE_V1.json > validation/v83212-preseal-refs/V8_3_${v}_SEALED.json; done
          git fetch --depth=1 origin refs/heads/v83210-v1-sealed-validation:refs/remotes/origin/v83210-v1-sealed-validation
          git show origin/v83210-v1-sealed-validation:validation/v83210-v1-sealed/V8_3_210_SEALED_FIXTURE_V1.json > validation/v83212-preseal-refs/V8_3_210_SEALED.json
          git fetch --depth=1 origin 6d82282b620f03e397368a6d973b566d8055d2eb
          rm -rf /tmp/v211-r4-preseal; mkdir -p /tmp/v211-r4-preseal/validation/v83211-r4-frozen
          git show 6d82282b620f03e397368a6d973b566d8055d2eb:validation/v83211-r4-frozen/generate-r4-carrier.py > /tmp/v211-r4-preseal/validation/v83211-r4-frozen/generate-r4-carrier.py
          (cd /tmp/v211-r4-preseal && python validation/v83211-r4-frozen/generate-r4-carrier.py)
          cp /tmp/v211-r4-preseal/validation/v83211-r4-runtime/V8_3_211_R4_SEALED_FIXTURE.json validation/v83212-preseal-refs/V8_3_211_R4_SEALED.json
          python validation/v83211-generalization-600-generator-v1r.py
          cp validation/V8_3_211_DEVELOPMENT_GENERALIZATION_600_V1.json validation/v83212-preseal-refs/V8_3_211_DEV_600.json
          python validation/v83212-generalization-800-generator.py
          cp validation/V8_3_212_DEVELOPMENT_GENERALIZATION_800_V1.json validation/v83212-preseal-refs/V8_3_212_DEV_800.json
      - name: Construct and audit fresh V212 sealed bank
        run: python validation/v83212-preseal-diversity-hotfix-v1.py
      - name: Verify authority and package checkpoint
        run: |
          python - <<'PY'
          import json,pathlib,hashlib,zipfile,os,shutil
          root=pathlib.Path('validation/v83212-v1-sealed')
          auth=json.loads((root/'V8_3_212_SEALED_AUTHORITY_V1.json').read_text())
          audit=json.loads((root/'V8_3_212_PRESEAL_DIVERSITY_AUDIT_V1.json').read_text())
          assert auth['validated_development_head_sha']=='840cfd3aeea515a335a97615fbc321ebf0e1ce11'
          assert auth['semantic_authority']=='QCSemanticCoreV92'
          assert auth['candidate_bank_count']>=180 and auth['selected_count']==60
          assert audit['pass']
          assert audit['internal_max_similarity']<.75
          assert audit['external_cases_at_or_above_0_75']==0
          assert audit['exact_external_duplicates']==0
          assert not audit['runtime_executed_during_bank_or_selection']
          assert not audit['semantic_authority_loaded_during_bank_or_selection']
          assert not audit['selection_uses_runtime_output']
          receipt={'candidate':'V8.3.212','phase':'preseal-v1-main-runner','run_id':int(os.environ['GITHUB_RUN_ID']),'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'workflow_head_sha':os.environ['GITHUB_SHA'],'sealed_branch_head_before_freeze':os.popen('git rev-parse HEAD').read().strip(),'validated_development_head_sha':auth['validated_development_head_sha'],'semantic_authority':'QCSemanticCoreV92','candidate_count':auth['candidate_bank_count'],'selected_count':auth['selected_count'],'internal_max_similarity':audit['internal_max_similarity'],'external_max_similarity':audit['external_max_similarity'],'external_reference_surfaces':audit['external_reference_surfaces'],'semantic_runtime_executed':False,'semantic_authority_loaded':False,'selection_uses_runtime_output':False,'v211_r4_sealed_rerun':False,'batch_a_executed':False,'batch_b_executed':False,'step_111_authorized':False,'production_authorized':False,'construction_hotfix':'v83212-preseal-diversity-hotfix-v1','conclusion':'success'}
          (root/'V8_3_212_PRESEAL_RUN_RECEIPT.json').write_text(json.dumps(receipt,indent=2)+'\n')
          st=pathlib.Path('V8_3_212_PRESEAL_CHECKPOINT');shutil.rmtree(st,ignore_errors=True);st.mkdir()
          for p in root.iterdir():
            if p.is_file():shutil.copy2(p,st/p.name)
          def sha(p):return hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          (st/'SHA256_MANIFEST.txt').write_text(''.join(f'{sha(p)}  {p.name}\n' for p in sorted(st.iterdir()) if p.is_file()))
          z=pathlib.Path('PSC_V8_3_212_PRESEAL_CHECKPOINT.zip')
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED) as q:
            for p in sorted(st.iterdir()):q.write(p,p.name)
          pathlib.Path('PSC_V8_3_212_PRESEAL_CHECKPOINT_SHA256.txt').write_text(f'{sha(z)}  {z.name}\n')
          print(json.dumps(receipt,indent=2))
          PY
      - name: Freeze direct V212 preseal authority on sealed branch
        run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- validation/v83212-v1-sealed
          git commit -m 'Freeze V8.3.212 V1 preseal authority'
          git push origin HEAD:v83212-v1-sealed-validation
      - uses: actions/upload-artifact@v4
        with:
          name: PSC_V8_3_212_PRESEAL_CHECKPOINT
          path: |
            PSC_V8_3_212_PRESEAL_CHECKPOINT.zip
            PSC_V8_3_212_PRESEAL_CHECKPOINT_SHA256.txt
