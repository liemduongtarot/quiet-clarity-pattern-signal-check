name: V8.3.153 Sealed Validation
on:
  push:
    branches: [v83153-sealed-validation]
jobs:
  sealed_validate:
    if: github.event.head_commit.message == 'Run V8.3.153 sealed validation'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Verify sealed pack and materialize exact V8.3.153 authority
        run: |
          python - <<'PY'
          import base64,pathlib,hashlib,zipfile,json
          s=''.join(pathlib.Path(f'validation/v83153-sealed/V8_3_153_SEALED_PACK_V1.chunk{i}').read_text().strip() for i in range(1,7))
          b=base64.b64decode(s)
          assert hashlib.sha256(b).hexdigest()=='33910dc9fecb376796f23efa364f11d43d79c3faea9c746804ecdab90ff815c8'
          pathlib.Path('V8_3_153_SEALED_PACK_V1.zip').write_bytes(b)
          with zipfile.ZipFile('V8_3_153_SEALED_PACK_V1.zip') as z:z.extractall('V8_3_153_SEALED')
          def shaf(n):return hashlib.sha256(pathlib.Path('V8_3_153_SEALED',n).read_bytes()).hexdigest()
          assert shaf('V8_3_153_PRESEAL_OWNER_SELECTION_V1.json')=='d360e7a6b9965191be9fb0e7999e2a846f24dc8d43bb22b54e449701a3192d3d'
          assert shaf('V8_3_153_INDEPENDENT_GOLD_V1.json')=='933bff223addfef875dce96e9666ecdb1776a883f81d424fb790f8e899276f56'
          assert shaf('V8_3_153_SEALED_MEMBERSHIP_V1.json')=='8ed023efc3c3abe343327a6d741c9947b7b99c5d8a701631e7d90e58c9b17818'
          assert shaf('V8_3_153_SEALED_EXECUTION_FIXTURE_V1.json')=='26ffad0b9d47f17d6fddad469ca5cf90a42e62a766ff93c64bd8ea5797e9fdf8'
          f=json.loads(pathlib.Path('V8_3_153_SEALED/V8_3_153_SEALED_EXECUTION_FIXTURE_V1.json').read_text())
          assert f['development_authority_commit']=='3ade485b160b98febad948db1504faa8c12fe0e9'
          assert f['candidate_sha256']=='39290e112adceda76b5e09c7f65f5d792c5350884fb7b84d5abd914612e59c64'
          assert f['sealed_before_execution'] is True and f['prior_failed_batch_B_accessed'] is False
          assert len(f['cases'])==60 and len(f['batch_a'])==30 and len(f['batch_b'])==30 and not(set(f['batch_a'])&set(f['batch_b']))
          with zipfile.ZipFile('PSC_V8_3_139_FINAL_LOCAL_READINESS_EXTERNAL_BUILD_PENDING_CHECKPOINT (1).zip') as z:z.extractall('.')
          PY
          for f in psc-v83142-sealed-failure-convergence.js psc-v83143-semantic-convergence.js psc-v83144-sealed-failure-convergence.js psc-v83145-route-layer.js psc-v83145-family-state-layer.js psc-v83146-route-boundary-repair.js psc-v83146-family-sequence-repair.js psc-v83147-sealed-failure-repair.js psc-v83148-sealed-failure-repair.js psc-v83149-sealed-failure-repair.js psc-v83150-sealed-failure-repair.js psc-v83151-sealed-failure-repair.js psc-v83152-sealed-failure-repair.js psc-v83153-sealed-failure-repair.js psc-v83153-browser-authority-lock.js; do cp validation/$f PSC_V8_3_138_DEV/public/; done
          sha256sum PSC_V8_3_138_DEV/public/psc-v83153-sealed-failure-repair.js PSC_V8_3_138_DEV/public/psc-v83153-browser-authority-lock.js > V8_3_153_RUNTIME_AUTHORITY_SHA256.txt
      - name: SEALED Batch A first run exactly once; Batch B only after A PASS
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const fixture=JSON.parse(fs.readFileSync('V8_3_153_SEALED/V8_3_153_SEALED_EXECUTION_FIXTURE_V1.json','utf8'));
          const by=Object.fromEntries(fixture.cases.map(c=>[c.case_id,c]));const s={};vm.createContext(s);
          const files=['psc-v3.js','psc-v4.js','psc-v83121-r1-reconstructed.js','psc-v83122-operator-aware.js','psc-v83123-family-preservation.js','psc-v83124-operator-context.js','psc-v83125-semantic-routing.js','psc-v83126-public-route-canonicalization.js','psc-v83127-review-intent-authority.js','psc-v83129-canonical-shadow.js','psc-v83130-representation-coverage.js','psc-v83131-proposition-consolidation.js','psc-v83132-relation-graph.js','psc-v83133-canonical-role-binding.js','psc-v83135-scoped-operator.js','psc-v83138-semantic-convergence.js','psc-v83139-semantic-convergence.js','psc-v83142-sealed-failure-convergence.js','psc-v83143-semantic-convergence.js','psc-v83144-sealed-failure-convergence.js','psc-v83145-route-layer.js','psc-v83145-family-state-layer.js','psc-v83146-route-boundary-repair.js','psc-v83146-family-sequence-repair.js','psc-v83147-sealed-failure-repair.js','psc-v83148-sealed-failure-repair.js','psc-v83149-sealed-failure-repair.js','psc-v83150-sealed-failure-repair.js','psc-v83151-sealed-failure-repair.js','psc-v83152-sealed-failure-repair.js','psc-v83153-sealed-failure-repair.js'];
          for(const f of files)vm.runInContext(fs.readFileSync('PSC_V8_3_138_DEV/public/'+f,'utf8'),s);if(!s.QCSemanticCoreV22)throw Error('QCSemanticCoreV22 missing');
          function run(ids,label,file){const results=[];let passed=0;for(const id of ids){const c=by[id],r=s.QCSemanticCoreV22.analyze(c.surface),actual={route:r.input_route.id,families:[...r.families].sort(),sequence:!!r.sequence},expected={route:c.expected.route,families:[...c.expected.families].sort(),sequence:!!c.expected.sequence},pass=JSON.stringify(actual)===JSON.stringify(expected);if(pass)passed++;results.push({case_id:id,pass,expected,actual});}fs.writeFileSync(file,JSON.stringify({authority:label,run_id:process.env.GITHUB_RUN_ID,run_attempt:process.env.GITHUB_RUN_ATTEMPT,total:ids.length,passed,failed:ids.length-passed,results},null,2));console.log(label+': '+passed+'/'+ids.length);return passed===ids.length;}
          const a=run(fixture.batch_a,'V8.3.153 SEALED BATCH A FIRST RUN','V8_3_153_BATCH_A_FIRST_RUN_RESULTS.json');if(!a)process.exit(1);
          const b=run(fixture.batch_b,'V8.3.153 SEALED BATCH B FIRST RUN','V8_3_153_BATCH_B_FIRST_RUN_RESULTS.json');if(!b)process.exit(2);
          NODE
      - name: Package sealed validation checkpoint
        if: always()
        run: |
          python - <<'PY'
          import pathlib,zipfile,hashlib,json,shutil
          st=pathlib.Path('V8_3_153_SEALED_CHECKPOINT');st.mkdir(exist_ok=True)
          for f in ['V8_3_153_RUNTIME_AUTHORITY_SHA256.txt','V8_3_153_BATCH_A_FIRST_RUN_RESULTS.json','V8_3_153_BATCH_B_FIRST_RUN_RESULTS.json']:
              p=pathlib.Path(f)
              if p.exists():shutil.copy2(p,st/p.name)
          for p in pathlib.Path('V8_3_153_SEALED').iterdir():shutil.copy2(p,st/p.name)
          status={'batch_a_executed':(st/'V8_3_153_BATCH_A_FIRST_RUN_RESULTS.json').exists(),'batch_b_executed':(st/'V8_3_153_BATCH_B_FIRST_RUN_RESULTS.json').exists(),'step_111_executed':False,'production_authorized':False,'prior_failed_batch_B_accessed':False}
          (st/'V8_3_153_SEALED_STATUS.json').write_text(json.dumps(status,indent=2))
          def sha(p):return hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          (st/'SHA256_MANIFEST.txt').write_text(''.join(f'{sha(p)}  {p.name}\n' for p in sorted(st.iterdir()) if p.is_file()))
          z=pathlib.Path('PSC_V8_3_153_SEALED_VALIDATION_CHECKPOINT.zip')
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED) as q:
              for p in sorted(st.iterdir()):q.write(p,p.name)
          pathlib.Path('PSC_V8_3_153_SEALED_VALIDATION_CHECKPOINT_SHA256.txt').write_text(f'{sha(z)}  {z.name}\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PSC_V8_3_153_SEALED_VALIDATION_CHECKPOINT
          path: |
            PSC_V8_3_153_SEALED_VALIDATION_CHECKPOINT.zip
            PSC_V8_3_153_SEALED_VALIDATION_CHECKPOINT_SHA256.txt
