name: V8.3.203 Regression V1
on:
  push:
    branches: [v83203-v1-validation]
jobs:
  regression:
    if: github.event.head_commit.message == 'Run V8.3.203 regression V1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Materialize immutable regression authority
        run: |
          python - <<'PY'
          import pathlib,base64,gzip,zipfile
          names=['V8_3_172_V171_V1_FAILURE_REGRESSION','V8_3_172_V171_V1_PREVIOUS_PASS_REGRESSION','V8_3_171_V170_V1_FAILURE_REGRESSION','V8_3_171_V170_V1_PREVIOUS_PASS_REGRESSION','V8_3_169_V168_V1_FAILURE_REGRESSION','V8_3_169_V168_V1_PREVIOUS_PASS_REGRESSION','V8_3_168_V167_V1_FAILURE_REGRESSION','V8_3_168_V167_V1_PREVIOUS_PASS_REGRESSION']
          for n in names:
            p=pathlib.Path('validation/'+n+'.json.gz.b64')
            pathlib.Path('validation/'+n+'.json').write_bytes(gzip.decompress(base64.b64decode(p.read_text().strip())))
          with zipfile.ZipFile('PSC_V8_3_139_FINAL_LOCAL_READINESS_EXTERNAL_BUILD_PENDING_CHECKPOINT (1).zip') as z:z.extractall('.')
          src=pathlib.Path('validation/run-v83196-full-regression-sweep-v2.cjs').read_text()
          src=src.replace("'psc-v83196-v195-v1-hypothetical-preservation-repair.js'];","'psc-v83196-v195-v1-hypothetical-preservation-repair.js','psc-v83197-v196-sealed-a-bounded-repair.js','psc-v83198-v197-sealed-a-bounded-repair.js','psc-v83199-v198-sealed-a-bounded-repair.js','psc-v83200-v199-sealed-a-bounded-repair.js','psc-v83201-v200-sealed-a-bounded-repair.js','psc-v83201-v200-v1-preservation-precedence-repair.js','psc-v83202-v201-sealed-a-bounded-repair.js','psc-v83203-v202-sealed-a-bounded-repair.js'];")
          src=src.replace('QCSemanticCoreV65R','QCSemanticCoreV72').replace('V8.3.196 V65R full immutable regression sweep V2','V8.3.203 V72 regression V1').replace('V8_3_196_V2_FULL_REGRESSION_SWEEP_RESULTS.json','V8_3_203_REGRESSION_V1_RESULTS.json')
          pathlib.Path('validation/run-v83203-regression-v1.cjs').write_text(src)
          PY
      - name: Run full immutable regression plus frozen V202 first-run carriers
        run: node validation/run-v83203-regression-v1.cjs
      - name: Package regression checkpoint
        if: always()
        run: |
          python - <<'PY'
          import pathlib,zipfile,hashlib,json,shutil
          st=pathlib.Path('V8_3_203_REGRESSION_V1_CHECKPOINT');st.mkdir(exist_ok=True)
          for p in [pathlib.Path('V8_3_203_REGRESSION_V1_RESULTS.json'),pathlib.Path('validation/V8_3_203_V202_V1_FAILURE_REGRESSION.json'),pathlib.Path('validation/V8_3_203_V202_V1_PREVIOUS_PASS_REGRESSION.json'),pathlib.Path('validation/V8_3_203_V202_V1_FAILURE_FORENSIC_IMMUTABLE.json'),pathlib.Path('validation/psc-v83203-v202-sealed-a-bounded-repair.js')]:
            if p.exists():shutil.copy2(p,st/p.name)
          result=json.loads((st/'V8_3_203_REGRESSION_V1_RESULTS.json').read_text()) if (st/'V8_3_203_REGRESSION_V1_RESULTS.json').exists() else None
          status={'candidate':'V8.3.203','phase':'development-regression-v1','parent_semantic_authority':'QCSemanticCoreV71','candidate_semantic_authority':'QCSemanticCoreV72','result':'PASS' if result and result.get('failed')==0 else 'FAIL','v202_sealed_rerun':False,'step_111_authorized':False,'production_authorized':False};(st/'V8_3_203_REGRESSION_V1_STATUS.json').write_text(json.dumps(status,indent=2))
          def sha(p):return hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          (st/'SHA256_MANIFEST.txt').write_text(''.join(f'{sha(p)}  {p.name}\n' for p in sorted(st.iterdir()) if p.is_file()))
          z=pathlib.Path('PSC_V8_3_203_REGRESSION_V1_CHECKPOINT.zip')
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED) as q:
            for p in sorted(st.iterdir()):q.write(p,p.name)
          pathlib.Path('PSC_V8_3_203_REGRESSION_V1_CHECKPOINT_SHA256.txt').write_text(f'{sha(z)}  {z.name}\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PSC_V8_3_203_REGRESSION_V1_CHECKPOINT
          path: |
            PSC_V8_3_203_REGRESSION_V1_CHECKPOINT.zip
            PSC_V8_3_203_REGRESSION_V1_CHECKPOINT_SHA256.txt
