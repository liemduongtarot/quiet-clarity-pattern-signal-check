name: V8.3.140 Validation

on:
  workflow_dispatch:
  push:
    branches:
      - v83140-validation

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Extract V8.3.139 parent checkpoint
        run: |
          python - <<'PY'
          import zipfile
          p='PSC_V8_3_139_FINAL_LOCAL_READINESS_EXTERNAL_BUILD_PENDING_CHECKPOINT (1).zip'
          with zipfile.ZipFile(p) as z:
              z.extractall('.')
          PY
      - name: Materialize exact V8.3.140 repair
        run: |
          cp validation/psc-v83140-browser-authority-bridge.js PSC_V8_3_138_DEV/public/psc-v83140-browser-authority-bridge.js
          python - <<'PY'
          from pathlib import Path
          p=Path('PSC_V8_3_138_DEV/public/candidate.html')
          s=p.read_text()
          old='<script src="psc-v83139-semantic-convergence.js"></script><script src="psc-v83137-ui-gate-authority.js"></script>'
          new='<script src="psc-v83139-semantic-convergence.js"></script><script src="psc-v83140-browser-authority-bridge.js"></script><script src="psc-v83137-ui-gate-authority.js"></script>'
          if old not in s: raise SystemExit('expected V8.3.139 browser authority sequence not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: V8.3.140 authority regression
        working-directory: PSC_V8_3_138_DEV
        run: |
          chmod +x scripts/*.sh
          node - <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict'),path=require('node:path');
          const sandbox={};vm.createContext(sandbox);
          for(const s of ['psc-v3.js','psc-v4.js','psc-v83121-r1-reconstructed.js','psc-v83122-operator-aware.js','psc-v83123-family-preservation.js','psc-v83124-operator-context.js','psc-v83125-semantic-routing.js','psc-v83126-public-route-canonicalization.js','psc-v83127-review-intent-authority.js','psc-v83129-canonical-shadow.js','psc-v83130-representation-coverage.js','psc-v83131-proposition-consolidation.js','psc-v83132-relation-graph.js','psc-v83133-canonical-role-binding.js','psc-v83135-scoped-operator.js','psc-v83138-semantic-convergence.js','psc-v83139-semantic-convergence.js','psc-v83140-browser-authority-bridge.js','psc-v83137-ui-gate-authority.js'])vm.runInContext(fs.readFileSync('public/'+s,'utf8'),sandbox);
          assert.equal(sandbox.QCSemanticCoreV4,sandbox.QCSemanticCoreV10);
          const forensic=JSON.parse(fs.readFileSync('tests/V8_3_138_BATCH_A_FAILURE_FORENSIC_IMMUTABLE_PARENT.json','utf8'));
          for(const f of forensic.failures){const r=sandbox.QCSemanticCoreV4.analyze(f.raw_input);assert.equal(r.input_route.id,f.expected.route,f.case_id+' route');assert.deepEqual(Array.from(r.families).sort(),Array.from(f.expected.families).sort(),f.case_id+' families');assert.equal(!!r.sequence,!!f.expected.sequence,f.case_id+' sequence');const g=sandbox.PSCUIAuthorityV83137.resolveSituationGate(sandbox.QCSemanticCoreV4,f.raw_input,null);assert.equal(g.route.id,f.expected.route,f.case_id+' UI route');}
          console.log('V8.3.140 authority regression PASS',forensic.failures.length);
          NODE
          node tests/v83139-v137-12-failure-regressions.test.cjs
          node tests/v83139-scoped-operator-regression.test.cjs
          node tests/v83139-fresh-convergence-probe-250.test.cjs
          node tests/v83139-600-real-case-regression.test.cjs
          node tests/v83139-architecture-and-atomic.test.cjs
          node tests/v83139-v83117-100-edge-case-gate.test.cjs
          node tests/v83139-v83135-contrasts-metamorphic.test.cjs
      - name: Install locked dependencies
        working-directory: PSC_V8_3_138_DEV
        run: npm run install:ci
      - name: Fresh production build
        working-directory: PSC_V8_3_138_DEV
        run: npm run build
      - name: Validate artifact and source maps
        working-directory: PSC_V8_3_138_DEV
        run: |
          npm run validate:artifact
          test "$(find dist -type f -name '*.map' | wc -l)" -eq 0
          test -f dist/client/psc-v83140-browser-authority-bridge.js
          grep -q 'psc-v83140-browser-authority-bridge.js' dist/client/candidate.html
      - name: Record exact V8.3.140 authority hashes
        working-directory: PSC_V8_3_138_DEV
        run: |
          sha256sum public/psc-v83140-browser-authority-bridge.js public/psc-v83139-semantic-convergence.js public/psc-v83138-semantic-convergence.js public/psc-v83137-ui-gate-authority.js public/psc-v83135-scoped-operator.js public/candidate.html package.json package-lock.json > V8_3_140_CI_AUTHORITY_HASHES.txt
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > V8_3_140_DIST_SHA256.txt
      - name: Install isolated browser tooling
        run: |
          mkdir -p .e2e
          printf '{"private":true}\n' > .e2e/package.json
          npm install --prefix .e2e --no-package-lock playwright@1.55.0
          .e2e/node_modules/.bin/playwright install --with-deps chromium
      - name: Start exact static build
        run: |
          cd PSC_V8_3_138_DEV/dist/client
          python3 -m http.server 4173 --bind 127.0.0.1 > ../../../V8_3_140_HTTP_SERVER.log 2>&1 &
          echo $! > ../../../V8_3_140_HTTP_SERVER.pid
          cd ../../..
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/candidate.html >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Start temporary external HTTPS tunnel
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          ./cloudflared tunnel --url http://127.0.0.1:4173 --no-autoupdate > V8_3_140_CLOUDFLARED.log 2>&1 &
          echo $! > V8_3_140_CLOUDFLARED.pid
          for i in $(seq 1 60); do URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' V8_3_140_CLOUDFLARED.log | tail -1 || true); if [ -n "$URL" ]; then echo "$URL" | tee V8_3_140_TEMP_HTTPS_URL.txt; echo "PSC_E2E_URL=$URL" >> "$GITHUB_ENV"; exit 0; fi; sleep 1; done
          cat V8_3_140_CLOUDFLARED.log
          exit 1
      - name: External HTTPS sanity
        run: |
          for i in $(seq 1 30); do curl -fsS "$PSC_E2E_URL/candidate.html" | grep -q 'Pattern Signal Check' && exit 0; sleep 1; done
          exit 1
      - name: Browser E2E exactly once
        run: node validation/v83140-browser-e2e.mjs
      - name: Teardown temporary transport
        if: always()
        run: |
          if [ -f V8_3_140_CLOUDFLARED.pid ]; then kill "$(cat V8_3_140_CLOUDFLARED.pid)" || true; fi
          if [ -f V8_3_140_HTTP_SERVER.pid ]; then kill "$(cat V8_3_140_HTTP_SERVER.pid)" || true; fi
          sleep 3
          URL=$(cat V8_3_140_TEMP_HTTPS_URL.txt 2>/dev/null || true)
          if [ -n "$URL" ]; then CODE=$(curl -L -sS -o V8_3_140_POST_TEARDOWN_BODY.txt -w '%{http_code}' --max-time 15 "$URL/candidate.html" || true); echo "$CODE" > V8_3_140_POST_TEARDOWN_HTTP_CODE.txt; if [ "$CODE" = "200" ] && grep -q 'Pattern Signal Check' V8_3_140_POST_TEARDOWN_BODY.txt; then echo 'Preview still serves application' >&2; exit 1; fi; fi
      - name: Recheck authority after E2E
        if: always()
        working-directory: PSC_V8_3_138_DEV
        run: |
          sha256sum -c V8_3_140_CI_AUTHORITY_HASHES.txt
          test "$(find dist -type f -name '*.map' | wc -l)" -eq 0
      - name: Package exact V8.3.140 checkpoint
        if: always()
        run: |
          python - <<'PY'
          import shutil, pathlib
          root=pathlib.Path('PSC_V8_3_138_DEV')
          ev=pathlib.Path('V8_3_140_EVIDENCE')
          ev.mkdir(exist_ok=True)
          for n in ['V8_3_140_BROWSER_E2E_RESULTS.json','V8_3_140_TEMP_HTTPS_URL.txt','V8_3_140_CLOUDFLARED.log','V8_3_140_POST_TEARDOWN_HTTP_CODE.txt','V8_3_140_POST_TEARDOWN_BODY.txt']:
              p=pathlib.Path(n)
              if p.exists(): shutil.copy2(p,ev/n)
          shutil.copy2(root/'V8_3_140_CI_AUTHORITY_HASHES.txt',ev/'V8_3_140_CI_AUTHORITY_HASHES.txt')
          shutil.copy2(root/'V8_3_140_DIST_SHA256.txt',ev/'V8_3_140_DIST_SHA256.txt')
          shutil.make_archive('PSC_V8_3_140_VALIDATION_CHECKPOINT','zip','.')
          PY
          sha256sum PSC_V8_3_140_VALIDATION_CHECKPOINT.zip > PSC_V8_3_140_VALIDATION_CHECKPOINT_SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v83140-validation-evidence
          path: |
            PSC_V8_3_138_DEV/V8_3_140_CI_AUTHORITY_HASHES.txt
            PSC_V8_3_138_DEV/V8_3_140_DIST_SHA256.txt
            PSC_V8_3_138_DEV/dist
            V8_3_140_BROWSER_E2E_RESULTS.json
            V8_3_140_TEMP_HTTPS_URL.txt
            V8_3_140_CLOUDFLARED.log
            V8_3_140_POST_TEARDOWN_HTTP_CODE.txt
            V8_3_140_POST_TEARDOWN_BODY.txt
            PSC_V8_3_140_VALIDATION_CHECKPOINT.zip
            PSC_V8_3_140_VALIDATION_CHECKPOINT_SHA256.txt
          if-no-files-found: warn
