name: V8.3.242 DEVELOPMENT checkpoint
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v83242-development-checkpoint.yml
permissions:
  contents: read
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 79645f8973c9e8288119f79318b39646e2feb00f
          fetch-depth: 0
      - name: Build checkpoint
        run: |
          set -euo pipefail
          mkdir V8_3_242_DEVELOPMENT_CHECKPOINT
          cp validation/V8_3_242_DEVELOPMENT_AUTHORITY_V1.json V8_3_242_DEVELOPMENT_CHECKPOINT/
          cp validation/V8_3_242_V116_REGRESSION_RECEIPT.json V8_3_242_DEVELOPMENT_CHECKPOINT/
          cp validation/qc-evidence-extractor-v5aq-v242-v241-residuals.js V8_3_242_DEVELOPMENT_CHECKPOINT/
          cp validation/psc-v83242-v241-v116-residuals.js V8_3_242_DEVELOPMENT_CHECKPOINT/
          printf '%s\n' '79645f8973c9e8288119f79318b39646e2feb00f' > V8_3_242_DEVELOPMENT_CHECKPOINT/DEVELOPMENT_SHA.txt
          (cd V8_3_242_DEVELOPMENT_CHECKPOINT && sha256sum * > SHA256_MANIFEST.txt)
          zip -r PSC_V8_3_242_DEVELOPMENT_CHECKPOINT.zip V8_3_242_DEVELOPMENT_CHECKPOINT
          sha256sum PSC_V8_3_242_DEVELOPMENT_CHECKPOINT.zip > PSC_V8_3_242_DEVELOPMENT_CHECKPOINT_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PSC_V8_3_242_DEVELOPMENT_CHECKPOINT
          path: |
            PSC_V8_3_242_DEVELOPMENT_CHECKPOINT.zip
            PSC_V8_3_242_DEVELOPMENT_CHECKPOINT_SHA256.txt
          if-no-files-found: error
