name: V8.3.188 Transport Preflight
on:
  push:
    branches: [v83188-v1-sealed-validation]
permissions:
  contents: write
jobs:
  transport:
    if: github.event.head_commit.message == 'Run V8.3.188 transport preflight'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen sealed bank without semantic runtime
        run: |
          python - <<'PY'
          import json,hashlib,pathlib
          root=pathlib.Path('validation/v83188-v1-sealed')
          fixture=json.loads((root/'V8_3_188_SEALED_FIXTURE_V1.json').read_text());sel=json.loads((root/'V8_3_188_SEALED_SELECTION_V1.json').read_text());gold=json.loads((root/'V8_3_188_INDEPENDENT_GOLD_V1.json').read_text());auth=json.loads((root/'V8_3_188_SEALED_AUTHORITY_V1.json').read_text())
          membership={'authority':'V8.3.188 V1 SEALED MEMBERSHIP','members':[{'case_id':c['case_id'],'batch':'A' if c['case_id'] in sel['batch_a'] else 'B'} for c in fixture['cases']]}
          def canon(o):return json.dumps(o,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()
          for k,o in {'fixture':fixture,'selection':sel,'membership':membership,'independent_gold':gold}.items():assert hashlib.sha256(canon(o)).hexdigest()==auth['hashes'][k],k
          assert len(fixture['cases'])==60 and len(sel['batch_a'])==30 and len(sel['batch_b'])==30
          gm={cid:g['expected'] for g in gold['groups'] for cid in g['case_ids']};assert len(gm)==60
          for c in fixture['cases']:assert gm[c['case_id']]==c['expected']
          assert auth['semantic_runtime_executed_before_transport'] is False and auth['v187_batch_a_rerun'] is False and auth['v187_batch_b_accessed'] is False
          PY
      - name: Record transport receipt
        run: |
          python - <<'PY'
          import json,pathlib,os
          p=pathlib.Path('validation/v83188-v1-sealed/V8_3_188_TRANSPORT_RUN_RECEIPT.json')
          p.write_text(json.dumps({'candidate':'V8.3.188','phase':'transport-preflight','target_head_sha':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'status':'completed','conclusion':'success','semantic_runtime_executed':False,'v187_sealed_rerun':False},indent=2))
          PY
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/v83188-v1-sealed/V8_3_188_TRANSPORT_RUN_RECEIPT.json
          git commit -m 'Record V8.3.188 transport receipt'
          git push