name: V8.3.230 V106 DEVELOPMENT regression R5
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v83230-v106-development-regression-r5.yml
permissions:
  contents: write
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83230-v1-validation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run exact V106 full regression
        id: run
        shell: bash
        run: |
          # actual R5 trigger after two-residual V5AG repair
          set +e
          python validation/v83230-v106-regression-orchestrator.py > /tmp/v230-r5.log 2>&1
          rc=$?
          cat /tmp/v230-r5.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          RC="$rc" python - <<'PY'
          import json,os,pathlib
          text=pathlib.Path('/tmp/v230-r5.log').read_text(errors='replace');rc=os.environ['RC']
          pathlib.Path('validation/V8_3_230_V106_REGRESSION_DIAGNOSTIC.json').write_text(json.dumps({'candidate':'V8.3.230','phase':'v106-development-regression-diagnostic-r5','outcome':'success' if rc=='0' else 'failure','exit_code':rc,'log_tail':text[-18000:],'sealed_validation_executed':False,'v229_sealed_rerun':False,'step_111_authorized':False,'production_authorized':False},indent=2)+'\n')
          PY
          exit 0
      - name: Freeze evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/V8_3_230_V106_REGRESSION_DIAGNOSTIC.json
          test ! -f validation/V8_3_230_V106_REGRESSION_RECEIPT.json || git add validation/V8_3_230_V106_REGRESSION_RECEIPT.json
          for f in validation/V8_3_230_V*_A_FROZEN_CARRIER.json; do test ! -f "$f" || git add "$f"; done
          git diff --cached --quiet || git commit -m 'Record V8.3.230 V106 DEVELOPMENT regression R5 evidence'
          git push origin HEAD:v83230-v1-validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PSC_V8_3_230_V106_REGRESSION_R5
          path: |
            validation/V8_3_230_V106_REGRESSION_DIAGNOSTIC.json
            validation/V8_3_230_V106_REGRESSION_RECEIPT.json
          if-no-files-found: warn
      - name: Enforce outcome
        shell: bash
        run: test '${{ steps.run.outputs.rc }}' = '0'
