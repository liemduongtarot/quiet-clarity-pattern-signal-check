name: V8.3.201 Regression Probe
on:
  push:
    branches: [v83201-v1-validation]
permissions:
  contents: write
  actions: read
jobs:
  probe:
    if: github.event.head_commit.message == 'Probe V8.3.201 regression sweep'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record target run metadata only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,subprocess,pathlib,os
          target='ae295ed2af08f99cac646095382f2769969ffbae'
          repo=os.environ['GITHUB_REPOSITORY']
          raw=subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs?head_sha={target}&event=push&per_page=100'],text=True)
          runs=json.loads(raw)['workflow_runs']; runs=[r for r in runs if r['head_sha']==target and r['name']=='V8.3.201 Regression Sweep']
          assert len(runs)==1,runs
          r=runs[0]; out={'target_head_sha':target,'run_id':r['id'],'status':r['status'],'conclusion':r['conclusion'],'run_attempt':r['run_attempt']}
          pathlib.Path('validation/V8_3_201_REGRESSION_SWEEP_RECEIPT.json').write_text(json.dumps(out,indent=2))
          PY
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/V8_3_201_REGRESSION_SWEEP_RECEIPT.json
          git commit -m 'Record V8.3.201 regression sweep receipt'
          git push
