name: V8.3.221 Preseal Diagnostic
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  diag:
    if: github.event.head_commit.message == 'Diagnose V8.3.221 preseal construction'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83221-v1-sealed-validation
          fetch-depth: 0
      - name: Run observable preseal construction
        id: preseal
        continue-on-error: true
        run: |
          set +e
          python validation/v83221-v1-sealed/v83221-preseal-freeze.py > /tmp/v221-preseal.log 2>&1
          rc=$?
          cat /tmp/v221-preseal.log
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit $rc
      - name: Freeze diagnostic
        if: always()
        run: |
          python - <<'PY'
          import json,os,pathlib
          log=pathlib.Path('/tmp/v221-preseal.log').read_text(errors='replace') if pathlib.Path('/tmp/v221-preseal.log').exists() else ''
          d={'candidate':'V8.3.221','phase':'preseal-construction-diagnostic','outcome':os.environ['OUTCOME'],'exit_code':os.environ.get('EXIT_CODE'),'log_tail':log[-16000:],'semantic_runtime_executed':False,'batch_a_executed':False,'batch_b_executed':False,'v220_sealed_rerun':False}
          pathlib.Path('validation/v83221-v1-sealed/V8_3_221_PRESEAL_DIAGNOSTIC.json').write_text(json.dumps(d,indent=2)+'\n')
          PY
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- validation/v83221-v1-sealed/V8_3_221_PRESEAL_DIAGNOSTIC.json
          for f in validation/v83221-v1-sealed/V8_3_221_*.json; do test ! -f "$f" || git add -- "$f"; done
          git diff --cached --quiet || git commit -m 'Record V8.3.221 preseal diagnostic evidence'
          git push origin HEAD:v83221-v1-sealed-validation
        env:
          OUTCOME: ${{ steps.preseal.outcome }}
          EXIT_CODE: ${{ steps.preseal.outputs.exit_code }}
