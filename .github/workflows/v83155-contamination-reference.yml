name: V8.3.155 Contamination Reference Extract
on:
  push:
    branches: [v83155-validation]
permissions:
  contents: write
jobs:
  extract:
    if: github.event.head_commit.message == 'Extract V8.3.155 old WIP contamination reference'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read old WIP sealed raw surfaces only
        run: |
          git fetch origin v83155-sealed-validation --depth=1
          git show origin/v83155-sealed-validation:validation/v83155-sealed/V8_3_155_SEALED_PACK_V1.part1 > /tmp/p1
          git show origin/v83155-sealed-validation:validation/v83155-sealed/V8_3_155_SEALED_PACK_V1.part2 > /tmp/p2
          cat /tmp/p1 /tmp/p2 | base64 -d > /tmp/old.zip
          mkdir -p /tmp/oldpack
          unzip -q /tmp/old.zip -d /tmp/oldpack
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('/tmp/oldpack')
          f=next(root.rglob('V8_3_155_SEALED_EXECUTION_FIXTURE_V1.json'))
          d=json.loads(f.read_text())
          out={'authority':'V8.3.155 OLD WIP SEALED RAW SURFACES — CONTAMINATION REFERENCE ONLY','source_fixture_authority':d.get('authority'),'runtime_outputs_read':False,'batch_results_read':False,'gold_read':False,'sealed_branch_modified':False,'case_count':len(d.get('cases',[])),'cases':[{'case_id':c.get('case_id'),'surface':c.get('surface','')} for c in d.get('cases',[])]}
          pathlib.Path('validation/V8_3_155_OLD_WIP_SEALED_SURFACES_REFERENCE.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/V8_3_155_OLD_WIP_SEALED_SURFACES_REFERENCE.json
          git commit -m 'Record V8.3.155 old WIP contamination reference'
          git push origin HEAD:v83155-validation
