name: V8.3.150 Sealed Validation V2
on:
  push:
    branches: [v83150-sealed-validation]
jobs:
  sealed_validate:
    if: github.event.head_commit.message == 'Run V8.3.150 sealed validation v2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Verify sealed transport and materialize authority
        run: |
          python - <<'PY'
          import base64,pathlib,hashlib,zipfile,json
          names=['part1','part2a','part2b','part2c','part3','part4','part5']
          exp={'part1':'c9180c204831330b5b16a98ae61d9d239126584c0a4e1a78aa865469c5c3e807','part2a':'d02ddd975aa550ecb0b3c5c1614965c5c1848597aa263279403d7a51279d301c','part2b':'eecdf0dfbe644be79c9ecbb32dfaf3413fec9eb587931e15835bba5d11f1a1cd','part2c':'b3427630468e1b65b7f290c5c2c771e764ba0a10bf12a7a051f3e4e64d6b99c4','part3':'ec9a60471301cecaa0f718dae586665b806caa2169a1fd034845157a1eef19da','part4':'e23e4d62328d3dc47716a6686be6f9527af2d8e8de8772da574fb0bdc3e2a321','part5':'562202f6f252af234cdad92ab15ac75b85cad7b652a7a151c374b7a2a012e2b3'}
          parts=[]
          for n in names:
              p=pathlib.Path('validation/v83150-sealed/V8_3_150_SEALED_PACK_V1.'+n)
              s=p.read_text().strip();h=hashlib.sha256(s.encode()).hexdigest();print(n,h);assert h==exp[n];parts.append(s)
          b=base64.b64decode(''.join(parts));assert hashlib.sha256(b).hexdigest()=='9be8e3f0dcece5757344924d75f2c8f1fc8541b6dc9a885b3c50daa797016f6e'
          pathlib.Path('V8_3_150_SEALED_PACK_V1.zip').write_bytes(b)
          with zipfile.ZipFile('V8_3_150_SEALED_PACK_V1.zip') as z:z.extractall('V8_3_150_SEALED')
          def shaf(n):return hashlib.sha256(pathlib.Path('V8_3_150_SEALED',n).read_bytes()).hexdigest()
          assert shaf('V8_3_150_PRESEAL_OWNER_SELECTION_V1.json')=='777d78b9758733b40fed9295a4ffceeaf13e4204abf28ab93f95799f015f9f9e'
          assert shaf('V8_3_150_INDEPENDENT_GOLD_V1.json')=='d1b3d4ca355af5b8c2adee6add34d5f48fe87aa9876258b10ec8a0794851fd14'
          assert shaf('V8_3_150_SEALED_MEMBERSHIP_V1.json')=='81dd7d05d19c0f0e542865d0b15cd8a5bc11c40d6512c34d743caced4800d8b8'
          f=json.loads(pathlib.Path('V8_3_150_SEALED/V8_3_150_SEALED_EXECUTION_FIXTURE_V1.json').read_text())
          assert f['development_authority_commit']=='e11e7442c14912d05356ca1c9c110988bad16455' and f['sealed_before_execution'] is True
          assert f['V8_3_145_Batch_B_accessed'] is False and f['V8_3_149_Batch_B_accessed'] is False
          assert len(f['cases'])==60 and len(f['batch_a'])==30 and len(f['batch_b'])==30 and not(set(f['batch_a'])&set(f['batch_b']))
          with zipfile.ZipFile('PSC_V8_3_139_FINAL_LOCAL_READINESS_EXTERNAL_BUILD_PENDING_CHECKPOINT (1).zip') as z:z.extractall('.')
          PY
          for f in psc-v83142-sealed-failure-convergence.js psc-v83143-semantic-convergence.js psc-v83144-sealed-failure-convergence.js psc-v83145-route-layer.js psc-v83145-family-state-layer.js psc-v83146-route-boundary-repair.js psc-v83146-family-sequence-repair.js psc-v83147-sealed-failure-repair.js psc-v83148-sealed-failure-repair.js psc-v83149-sealed-failure-repair.js psc-v83150-sealed-failure-repair.js psc-v83150-browser-authority-lock.js; do cp validation/$f PSC_V8_3_138_DEV/public/; done
          sha256sum PSC_V8_3_138_DEV/public/psc-v83150-sealed-failure-repair.js PSC_V8_3_138_DEV/public/psc-v83150-browser-authority-lock.js > V8_3_150_RUNTIME_AUTHORITY_SHA256.txt
      - name: SEALED Batch A first run exactly once; Batch B only after A PASS
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),fixture=JSON.parse(fs.readFileSync('V8_3_150_SEALED/V8_3_150_SEALED_EXECUTION_FIXTURE_V1.json','utf8')),by=Object.fromEntries(fixture.cases.map(c=>[c.case_id,c])),s={};vm.createContext(s);
          const files=['psc-v3.js','psc-v4.js','psc-v83121-r1-reconstructed.js','psc-v83122-operator-aware.js','psc-v83123-family-preservation.js','psc-v83124-operator-context.js','psc-v83125-semantic-routing.js','psc-v83126-public-route-canonicalization.js','psc-v83127-review-intent-authority.js','psc-v83129-canonical-shadow.js','psc-v83130-representation-coverage.js','psc-v83131-proposition-consolidation.js','psc-v83132-relation-graph.js','psc-v83133-canonical-role-binding.js','psc-v83135-scoped-operator.js','psc-v83138-semantic-convergence.js','psc-v83139-semantic-convergence.js','psc-v83142-sealed-failure-convergence.js','psc-v83143-semantic-convergence.js','psc-v83144-sealed-failure-convergence.js','psc-v83145-route-layer.js','psc-v83145-family-state-layer.js','psc-v83146-route-boundary-repair.js','psc-v83146-family-sequence-repair.js','psc-v83147-sealed-failure-repair.js','psc-v83148-sealed-failure-repair.js','psc-v83149-sealed-failure-repair.js','psc-v83150-sealed-failure-repair.js'];for(const f of files)vm.runInContext(fs.readFileSync('PSC_V8_3_138_DEV/public/'+f,'utf8'),s);if(!s.QCSemanticCoreV19)throw Error('QCSemanticCoreV19 missing');
          function run(ids,label,file){const results=[];let passed=0;for(const id of ids){const c=by[id],r=s.QCSemanticCoreV19.analyze(c.surface),actual={route:r.input_route.id,families:[...r.families].sort(),sequence:!!r.sequence},expected={route:c.expected.route,families:[...c.expected.families].sort(),sequence:!!c.expected.sequence},pass=JSON.stringify(actual)===JSON.stringify(expected);if(pass)passed++;results.push({case_id:id,pass,expected,actual});}fs.writeFileSync(file,JSON.stringify({authority:label,run_id:process.env.GITHUB_RUN_ID,run_attempt:process.env.GITHUB_RUN_ATTEMPT,total:ids.length,passed,failed:ids.length-passed,results},null,2));console.log(label+': '+passed+'/'+ids.length);return passed===ids.length;}
          if(!run(fixture.batch_a,'V8.3.150 SEALED BATCH A FIRST RUN','V8_3_150_BATCH_A_FIRST_RUN_RESULTS.json'))process.exit(1);
          if(!run(fixture.batch_b,'V8.3.150 SEALED BATCH B FIRST RUN','V8_3_150_BATCH_B_FIRST_RUN_RESULTS.json'))process.exit(2);
          NODE
      - name: Package sealed checkpoint
        if: always()
        run: |
          python - <<'PY'
          import pathlib,zipfile,hashlib,json,shutil
          st=pathlib.Path('V8_3_150_SEALED_CHECKPOINT');st.mkdir(exist_ok=True)
          for f in ['V8_3_150_RUNTIME_AUTHORITY_SHA256.txt','V8_3_150_BATCH_A_FIRST_RUN_RESULTS.json','V8_3_150_BATCH_B_FIRST_RUN_RESULTS.json']:
              p=pathlib.Path(f)
              if p.exists():shutil.copy2(p,st/p.name)
          sd=pathlib.Path('V8_3_150_SEALED')
          if sd.exists():
              for p in sd.iterdir():shutil.copy2(p,st/p.name)
          status={'batch_a_executed':(st/'V8_3_150_BATCH_A_FIRST_RUN_RESULTS.json').exists(),'batch_b_executed':(st/'V8_3_150_BATCH_B_FIRST_RUN_RESULTS.json').exists(),'step_111_executed':False,'production_authorized':False,'V8_3_145_Batch_B_accessed':False,'V8_3_149_Batch_B_accessed':False}
          (st/'V8_3_150_SEALED_STATUS.json').write_text(json.dumps(status,indent=2))
          def sha(p):return hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          (st/'SHA256_MANIFEST.txt').write_text(''.join(f'{sha(p)}  {p.name}\n' for p in sorted(st.iterdir()) if p.is_file()))
          z=pathlib.Path('PSC_V8_3_150_SEALED_VALIDATION_CHECKPOINT.zip')
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED) as q:
              for p in sorted(st.iterdir()):q.write(p,p.name)
          pathlib.Path('PSC_V8_3_150_SEALED_VALIDATION_CHECKPOINT_SHA256.txt').write_text(f'{sha(z)}  {z.name}\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PSC_V8_3_150_SEALED_VALIDATION_CHECKPOINT_V2
          path: |
            PSC_V8_3_150_SEALED_VALIDATION_CHECKPOINT.zip
            PSC_V8_3_150_SEALED_VALIDATION_CHECKPOINT_SHA256.txt
