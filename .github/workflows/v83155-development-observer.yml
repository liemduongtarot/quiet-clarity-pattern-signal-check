name: V8.3.155 Development Observer
on:
  workflow_run:
    workflows: ["V8.3.155 Deep Validation"]
    types: [completed]
permissions:
  contents: write
  actions: read
jobs:
  record:
    if: github.event.workflow_run.head_branch == 'v83155-validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83155-validation
      - name: Record immutable development run evidence
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          p=pathlib.Path('validation/V8_3_155_DEVELOPMENT_RUN_EVIDENCE.json')
          p.write_text(json.dumps({
            'authority':'V8.3.155 DEVELOPMENT RUN EVIDENCE',
            'workflow':'V8.3.155 Deep Validation',
            'run_id':int(os.environ['RUN_ID']),
            'run_attempt':int(os.environ['RUN_ATTEMPT']),
            'conclusion':os.environ['RUN_CONCLUSION'],
            'head_sha':os.environ['RUN_HEAD_SHA'],
            'run_url':os.environ['RUN_URL'],
            'sealed_validation_executed_by_observer':False,
            'step_111_authorized':False,
            'production_authorized':False
          },indent=2)+'\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/V8_3_155_DEVELOPMENT_RUN_EVIDENCE.json
          git commit -m 'Record V8.3.155 deep validation evidence' || exit 0
          git push origin HEAD:v83155-validation
