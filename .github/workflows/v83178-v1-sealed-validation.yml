name: V8.3.178 V1 Sealed Validation
on:
  push:
    branches: [v83178-v1-sealed-validation]
permissions:
  contents: write
jobs:
  sealed_validate:
    if: github.event.head_commit.message == 'Run V8.3.178 V1 sealed validation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Verify frozen bank and materialize exact V8.3.178 authority
        run: |
          python - <<'PY'
          import pathlib,json,hashlib,zipfile
          f=json.loads(pathlib.Path('validation/v83178-v1-sealed/V8_3_178_SEALED_EXECUTION_FIXTURE_V1.json').read_text());h=json.loads(pathlib.Path('validation/v83178-v1-sealed/V8_3_178_SEALED_HASH_AUTHORITY.json').read_text())
          assert h['development_authority_commit']=='fd36bac029e466dda18d0f2a355a39f636e132e1'
          assert h['fixture_sha256']=='bfaa22ed5af1fd8fdf8b79601a516d486651b0eee2d45adcf33881ab987cdc1d'
          assert h['selection_sha256']=='817b38f78111d23ff98672eac82c030de8122400aad8bad751b415226f62be33'
          assert h['gold_sha256']=='9062e82ee51ca01e9f66304413bb160e37a8e86ca1c859494098dcc6f4df7fea'
          assert h['membership_sha256']=='d8b65da8e2cc6e4f10e95eee69dc9f85acc0dccb6442d11d81806a1e8921e6f9'
          assert h['semantic_runtime_executed_before_transport'] is False and h['v177_sealed_rerun'] is False
          def canon(o):return json.dumps(o,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()
          def sha(o):return hashlib.sha256(canon(o)).hexdigest()
          selection={'authority':'V8.3.178 V1 OWNER SELECTION','selection_method':'odd/even deterministic split after bank freeze; 30 A / 30 B','batch_a':f['batch_a'],'batch_b':f['batch_b']}
          gold={'authority':'V8.3.178 V1 INDEPENDENT GOLD','source':'manual contract assignment before runtime execution','cases':[{'case_id':c['case_id'],'expected':c['expected']} for c in f['cases']]}
          membership={'authority':'V8.3.178 V1 SEALED MEMBERSHIP','all_case_ids':sorted(f['batch_a']+f['batch_b']),'batch_a':f['batch_a'],'batch_b':f['batch_b']}
          assert sha(f)==h['fixture_sha256'] and sha(selection)==h['selection_sha256'] and sha(gold)==h['gold_sha256'] and sha(membership)==h['membership_sha256']
          with zipfile.ZipFile('PSC_V8_3_139_FINAL_LOCAL_READINESS_EXTERNAL_BUILD_PENDING_CHECKPOINT (1).zip') as z:z.extractall('.')
          pathlib.Path('V8_3_178_SEALED_EXECUTION_FIXTURE_V1.json').write_text(json.dumps(f,ensure_ascii=False,indent=2))
          PY
          for f in psc-v83142-sealed-failure-convergence.js psc-v83143-semantic-convergence.js psc-v83144-sealed-failure-convergence.js psc-v83145-route-layer.js psc-v83145-family-state-layer.js psc-v83146-route-boundary-repair.js psc-v83146-family-sequence-repair.js psc-v83147-sealed-failure-repair.js psc-v83148-sealed-failure-repair.js psc-v83149-sealed-failure-repair.js psc-v83150-sealed-failure-repair.js psc-v83151-sealed-failure-repair.js psc-v83152-sealed-failure-repair.js psc-v83153-sealed-failure-repair.js psc-v83154-sealed-failure-repair.js psc-v83155-sealed-failure-repair.js psc-v83156-v155-v3-bounded-repair.js psc-v83157-v156-sealed-a-bounded-repair.js psc-v83158-v157-sealed-a-bounded-repair.js psc-v83159-v158-sealed-a-bounded-repair.js psc-v83160-v159-v2-sealed-a-bounded-repair.js psc-v83161-v160-v1-sealed-a-bounded-repair.js psc-v83162-v161-v1-sealed-a-bounded-repair.js psc-v83163-v162-v1-sealed-a-bounded-repair.js psc-v83164-v163-v1-sealed-a-bounded-repair.js psc-v83165-v164-v1-sealed-a-bounded-repair.js psc-v83166-v165-v1-sealed-a-bounded-repair.js psc-v83167-v166-v1-sealed-a-bounded-repair.js psc-v83168-v167-v1-sealed-a-bounded-repair.js psc-v83169-v168-v1-sealed-a-bounded-repair.js psc-v83170-v169-v1-sealed-a-bounded-repair.js psc-v83171-v170-v1-sealed-a-bounded-repair.js psc-v83172-v171-v1-sealed-a-bounded-repair.js psc-v83173-v172-v1-sealed-a-bounded-repair.js psc-v83174-v173-v1-sealed-a-bounded-repair.js psc-v83175-v174-v1-sealed-a-bounded-repair.js psc-v83176-v175-bank-contract-carry-forward.js psc-v83177-v176-sealed-a-bounded-repair.js psc-v83178-v177-sealed-a-bounded-repair.js; do cp validation/$f PSC_V8_3_138_DEV/public/; done
