      - name: Package immutable sealed checkpoint
        if: always()
        run: |
          python - <<'PY'
          import pathlib,json,zipfile,hashlib,shutil
          st=pathlib.Path('V8_3_178_SEALED_CHECKPOINT');st.mkdir(exist_ok=True)
          for n in ['V8_3_178_SEALED_EXECUTION_FIXTURE_V1.json','V8_3_178_BATCH_A_FIRST_RUN_RESULTS.json','V8_3_178_BATCH_B_FIRST_RUN_RESULTS.json']:
            p=pathlib.Path(n)
            if p.exists():shutil.copy2(p,st/n)
          A=pathlib.Path('V8_3_178_BATCH_A_FIRST_RUN_RESULTS.json');B=pathlib.Path('V8_3_178_BATCH_B_FIRST_RUN_RESULTS.json');a=json.loads(A.read_text()) if A.exists() else None;b=json.loads(B.read_text()) if B.exists() else None
          status={'candidate':'V8.3.178','run_id':'${{ github.run_id }}','run_attempt':'${{ github.run_attempt }}','head_sha':'${{ github.sha }}','batch_a_executed':a is not None,'batch_a_passed':a['passed'] if a else None,'batch_a_failed':a['failed'] if a else None,'batch_b_executed':b is not None,'batch_b_passed':b['passed'] if b else None,'batch_b_failed':b['failed'] if b else None,'v177_batch_a_rerun':False,'v177_batch_b_accessed':False,'step_111_authorized':False,'production_authorized':False};(st/'V8_3_178_SEALED_STATUS.json').write_text(json.dumps(status,indent=2))
