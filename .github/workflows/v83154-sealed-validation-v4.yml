name: V8.3.154 Sealed Validation Transport Fixed V4
on:
  push:
    branches: [v83154-sealed-validation]
jobs:
  sealed_validate:
    if: github.event.head_commit.message == 'Run V8.3.154 sealed validation transport-fixed-v4'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Verify sealed pack and materialize exact authority
        run: |
          python - <<'PY'
          import base64,pathlib,hashlib,zipfile,json
          names=['V8_3_154_SEALED_PACK_V1.chunk1a','V8_3_154_SEALED_PACK_V1.chunk1b','V8_3_154_SEALED_PACK_V1.chunk2','V8_3_154_SEALED_PACK_V1.chunk3','V8_3_154_SEALED_PACK_V1.chunk4','V8_3_154_SEALED_PACK_V1.chunk5a','V8_3_154_SEALED_PACK_V1.chunk5b','V8_3_154_SEALED_PACK_V1.chunk6']
          root=pathlib.Path('validation/v83154-sealed')
          lens=[len((root/n).read_text().strip()) for n in names]
          assert lens==[2000,2000,4000,4000,4000,2000,2000,760],lens
          s=''.join((root/n).read_text().strip() for n in names)
          assert len(s)==20760,len(s)
          b=base64.b64decode(s)
          assert hashlib.sha256(b).hexdigest()=='6a26c775352f2c8d18fd3e19eccde505c44cbd23f4b868855057b00e9b699c8b'
          pathlib.Path('V8_3_154_SEALED_PACK_V1.zip').write_bytes(b)
          with zipfile.ZipFile('V8_3_154_SEALED_PACK_V1.zip') as z:z.extractall('V8_3_154_SEALED')
          def shaf(n):return hashlib.sha256(pathlib.Path('V8_3_154_SEALED',n).read_bytes()).hexdigest()
          assert shaf('V8_3_154_PRESEAL_OWNER_SELECTION_V1.json')=='c947499d8c135d8aa2601eab68d9f8536a524c84124012e6265f7f7b1e0b7a5b'
          assert shaf('V8_3_154_INDEPENDENT_GOLD_V1.json')=='bf75b8ae76237d26d7bfefde3285fb302972ec1f8e8d2cbdeaeecbc8162d0161'
          assert shaf('V8_3_154_SEALED_MEMBERSHIP_V1.json')=='919440e8e402c4daada77139dad38a170fb8c4b7028fed6a20c30cee1f44d0fd'
          assert shaf('V8_3_154_SEALED_EXECUTION_FIXTURE_V1.json')=='7a6751576aec311e7ae318fef42aff2e75ced2c464c8fea41101e278c791793f'
          f=json.loads(pathlib.Path('V8_3_154_SEALED/V8_3_154_SEALED_EXECUTION_FIXTURE_V1.json').read_text())
          assert f['development_authority_commit']=='73e13bc1ad164a1ae0d4004bfc0906065ebffcb8'
          assert f['candidate_sha256']=='728f25a91baeb981d0a3319dc119a531cebc8d41c62f5e14d05f5dc7e0928f5a'
          assert f['sealed_before_execution'] is True and f['prior_failed_batch_B_accessed'] is False
          assert len(f['cases'])==60 and len(f['batch_a'])==30 and len(f['batch_b'])==30 and not(set(f['batch_a'])&set(f['batch_b']))
          with zipfile.ZipFile('PSC_V8_3_139_FINAL_LOCAL_READINESS_EXTERNAL_BUILD_PENDING_CHECKPOINT (1).zip') as z:z.extractall('.')
          PY
          for f in psc-v83142-sealed-failure-convergence.js psc-v83143-semantic-convergence.js psc-v83144-sealed-failure-convergence.js psc-v83145-route-layer.js psc-v83145-family-state-layer.js psc-v83146-route-boundary-repair.js psc-v83146-family-sequence-repair.js psc-v83147-sealed-failure-repair.js psc-v83148-sealed-failure-repair.js psc-v83149-sealed-failure-repair.js psc-v83150-sealed-failure-repair.js psc-v83151-sealed-failure-repair.js psc-v83152-sealed-failure-repair.js psc-v83153-sealed-failure-repair.js psc-v83154-sealed-failure-repair.js psc-v83154-browser-authority-lock.js; do cp validation/$f PSC_V8_3_138_DEV/public/; done
          sha256sum PSC_V8_3_138_DEV/public/psc-v83154-sealed-failure-repair.js PSC_V8_3_138_DEV/public/psc-v83154-browser-authority-lock.js > V8_3_154_RUNTIME_AUTHORITY_SHA256.txt
      - name: SEALED Batch A first run exactly once; Batch B only after A PASS
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const fixture=JSON.parse(fs.readFileSync('V8_3_154_SEALED/V8_3_154_SEALED_EXECUTION_FIXTURE_V1.json','utf8'));
          const by=Object.fromEntries(fixture.cases.map(c=>[c.case_id,c]));const s={};vm.createContext(s);
          const files=['psc-v3.js','psc-v4.js','psc-v83121-r1-reconstructed.js','psc-v83122-operator-aware.js','psc-v83123-family-preservation.js','psc-v83124-operator-context.js','psc-v83125-semantic-routing.js','psc-v83126-public-route-canonicalization.js','psc-v83127-review-intent-authority.js','psc-v83129-canonical-shadow.js','psc-v83130-representation-coverage.js','psc-v83131-proposition-consolidation.js','psc-v83132-relation-graph.js','psc-v83133-canonical-role-binding.js','psc-v83135-scoped-operator.js','psc-v83138-semantic-convergence.js','psc-v83139-semantic-convergence.js','psc-v83142-sealed-failure-convergence.js','psc-v83143-semantic-convergence.js','psc-v83144-sealed-failure-convergence.js','psc-v83145-route-layer.js','psc-v83145-family-state-layer.js','psc-v83146-route-boundary-repair.js','psc-v83146-family-sequence-repair.js','psc-v83147-sealed-failure-repair.js','psc-v83148-sealed-failure-repair.js','psc-v83149-sealed-failure-repair.js','psc-v83150-sealed-failure-repair.js','psc-v83151-sealed-failure-repair.js','psc-v83152-sealed-failure-repair.js','psc-v83153-sealed-failure-repair.js','psc-v83154-sealed-failure-repair.js'];
          for(const f of files)vm.runInContext(fs.readFileSync('PSC_V8_3_138_DEV/public/'+f,'utf8'),s);if(!s.QCSemanticCoreV23)throw Error('QCSemanticCoreV23 missing');
          function run(ids,label,file){const results=[];let passed=0;for(const id of ids){const c=by[id],r=s.QCSemanticCoreV23.analyze(c.surface),actual={route:r.input_route.id,families:[...r.families].sort(),sequence:!!r.sequence},expected={route:c.expected.route,families:[...c.expected.families].sort(),sequence:!!c.expected.sequence},pass=JSON.stringify(actual)===JSON.stringify(expected);if(pass)passed++;results.push({case_id:id,pass,expected,actual});}fs.writeFileSync(file,JSON.stringify({authority:label,run_id:process.env.GITHUB_RUN_ID,run_attempt:process.env.GITHUB_RUN_ATTEMPT,total:ids.length,passed,failed:ids.length-passed,results},null,2));console.log(label+': '+passed+'/'+ids.length);return passed===ids.length;}
          const a=run(fixture.batch_a,'V8.3.154 SEALED BATCH A FIRST RUN','V8_3_154_BATCH_A_FIRST_RUN_RESULTS.json');if(!a)process.exit(1);
          const b=run(fixture.batch_b,'V8.3.154 SEALED BATCH B FIRST RUN','V8_3_154_BATCH_B_FIRST_RUN_RESULTS.json');if(!b)process.exit(2);
          NODE
      - name: Package sealed validation checkpoint
        if: always()
        run: |
          python - <<'PY'
          import pathlib,zipfile,hashlib,json,shutil
          st=pathlib.Path('V8_3_154_SEALED_CHECKPOINT');st.mkdir(exist_ok=True)
          for f in ['V8_3_154_RUNTIME_AUTHORITY_SHA256.txt','V8_3_154_BATCH_A_FIRST_RUN_RESULTS.json','V8_3_154_BATCH_B_FIRST_RUN_RESULTS.json']:
              p=pathlib.Path(f)
              if p.exists():shutil.copy2(p,st/p.name)
          if pathlib.Path('V8_3_154_SEALED').exists():
              for p in pathlib.Path('V8_3_154_SEALED').iterdir():shutil.copy2(p,st/p.name)
          status={'batch_a_executed':(st/'V8_3_154_BATCH_A_FIRST_RUN_RESULTS.json').exists(),'batch_b_executed':(st/'V8_3_154_BATCH_B_FIRST_RUN_RESULTS.json').exists(),'step_111_executed':False,'production_authorized':False,'prior_failed_batch_B_accessed':False}
          (st/'V8_3_154_SEALED_STATUS.json').write_text(json.dumps(status,indent=2))
          def sha(p):return hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          (st/'SHA256_MANIFEST.txt').write_text(''.join(f'{sha(p)}  {p.name}\n' for p in sorted(st.iterdir()) if p.is_file()))
          z=pathlib.Path('PSC_V8_3_154_SEALED_VALIDATION_CHECKPOINT.zip')
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED) as q:
              for p in sorted(st.iterdir()):q.write(p,p.name)
          pathlib.Path('PSC_V8_3_154_SEALED_VALIDATION_CHECKPOINT_SHA256.txt').write_text(f'{sha(z)}  {z.name}\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PSC_V8_3_154_SEALED_VALIDATION_CHECKPOINT_TRANSPORT_FIXED_V4
          path: |
            PSC_V8_3_154_SEALED_VALIDATION_CHECKPOINT.zip
            PSC_V8_3_154_SEALED_VALIDATION_CHECKPOINT_SHA256.txt
