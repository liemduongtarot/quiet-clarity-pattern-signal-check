name: V8.3.151 Sealed Validation
on:
  push:
    branches: [v83151-sealed-validation]
jobs:
  sealed_validate:
    if: github.event.head_commit.message == 'Run V8.3.151 sealed validation'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Verify sealed pack and materialize exact V8.3.151 authority
        run: |
          python - <<'PY'
          import base64,pathlib,hashlib,zipfile,json
          p=pathlib.Path('validation/v83151-sealed/V8_3_151_SEALED_PACK_V1.b64')
          b=base64.b64decode(p.read_text().strip())
          assert hashlib.sha256(b).hexdigest()=='892a2dc57de0ac5b9a42a164f7f3945bb60ac00ea40331c693cb2113bfe81272'
          pathlib.Path('V8_3_151_SEALED_PACK_V1.zip').write_bytes(b)
          with zipfile.ZipFile('V8_3_151_SEALED_PACK_V1.zip') as z:z.extractall('V8_3_151_SEALED')
          def shaf(n):return hashlib.sha256(pathlib.Path('V8_3_151_SEALED',n).read_bytes()).hexdigest()
          assert shaf('V8_3_151_PRESEAL_OWNER_SELECTION_V1.json')=='0a7198a8a89860fdef1c4e84440b0d2aa752b8091e1cd476f674610d5f1cac0b'
          assert shaf('V8_3_151_INDEPENDENT_GOLD_V1.json')=='df644e5ef1c7a121843836c2cc76dea88222165502a55873ff4585abbf725332'
          assert shaf('V8_3_151_SEALED_MEMBERSHIP_V1.json')=='aaa41170d37a25c05255c96a2ef8b55f3d5c545f5b6cbd3b75afc759e1ef12d5'
          assert shaf('V8_3_151_SEALED_EXECUTION_FIXTURE_V1.json')=='9dc35b0959f42d1bea4b853f8846acd7ff034c42ac6c9ad8d02a0369a957eaa4'
          f=json.loads(pathlib.Path('V8_3_151_SEALED/V8_3_151_SEALED_EXECUTION_FIXTURE_V1.json').read_text())
          assert f['authority']=='V8.3.151 SEALED EXECUTION FIXTURE V1'
          assert f['development_authority_commit']=='240024b7e0674127d1557b6239861401e72d7446'
          assert f['candidate_sha256']=='2f111f5277e1f264565853b660c3bed79c43e058248b97e4da71b2500d572952'
          assert f['sealed_before_execution'] is True
          assert f['V8_3_145_Batch_B_accessed'] is False and f['V8_3_149_Batch_B_accessed'] is False and f['V8_3_150_Batch_B_accessed'] is False
          assert len(f['cases'])==60 and len(f['batch_a'])==30 and len(f['batch_b'])==30 and not(set(f['batch_a'])&set(f['batch_b']))
          with zipfile.ZipFile('PSC_V8_3_139_FINAL_LOCAL_READINESS_EXTERNAL_BUILD_PENDING_CHECKPOINT (1).zip') as z:z.extractall('.')
          PY
          for f in psc-v83142-sealed-failure-convergence.js psc-v83143-semantic-convergence.js psc-v83144-sealed-failure-convergence.js psc-v83145-route-layer.js psc-v83145-family-state-layer.js psc-v83146-route-boundary-repair.js psc-v83146-family-sequence-repair.js psc-v83147-sealed-failure-repair.js psc-v83148-sealed-failure-repair.js psc-v83149-sealed-failure-repair.js psc-v83150-sealed-failure-repair.js psc-v83151-sealed-failure-repair.js psc-v83151-browser-authority-lock.js; do cp validation/$f PSC_V8_3_138_DEV/public/; done
          sha256sum PSC_V8_3_138_DEV/public/psc-v83151-sealed-failure-repair.js PSC_V8_3_138_DEV/public/psc-v83151-browser-authority-lock.js > V8_3_151_RUNTIME_AUTHORITY_SHA256.txt
      - name: SEALED Batch A first run exactly once; Batch B only after A PASS
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const fixture=JSON.parse(fs.readFileSync('V8_3_151_SEALED/V8_3_151_SEALED_EXECUTION_FIXTURE_V1.json','utf8'));
          const by=Object.fromEntries(fixture.cases.map(c=>[c.case_id,c]));const s={};vm.createContext(s);
          const files=['psc-v3.js','psc-v4.js','psc-v83121-r1-reconstructed.js','psc-v83122-operator-aware.js','psc-v83123-family-preservation.js','psc-v83124-operator-context.js','psc-v83125-semantic-routing.js','psc-v83126-public-route-canonicalization.js','psc-v83127-review-intent-authority.js','psc-v83129-canonical-shadow.js','psc-v83130-representation-coverage.js','psc-v83131-proposition-consolidation.js','psc-v83132-relation-graph.js','psc-v83133-canonical-role-binding.js','psc-v83135-scoped-operator.js','psc-v83138-semantic-convergence.js','psc-v83139-semantic-convergence.js','psc-v83142-sealed-failure-convergence.js','psc-v83143-semantic-convergence.js','psc-v83144-sealed-failure-convergence.js','psc-v83145-route-layer.js','psc-v83145-family-state-layer.js','psc-v83146-route-boundary-repair.js','psc-v83146-family-sequence-repair.js','psc-v83147-sealed-failure-repair.js','psc-v83148-sealed-failure-repair.js','psc-v83149-sealed-failure-repair.js','psc-v83150-sealed-failure-repair.js','psc-v83151-sealed-failure-repair.js'];
          for(const f of files)vm.runInContext(fs.readFileSync('PSC_V8_3_138_DEV/public/'+f,'utf8'),s);if(!s.QCSemanticCoreV20)throw Error('QCSemanticCoreV20 missing');
          function run(ids,label,file){const results=[];let passed=0;for(const id of ids){const c=by[id],r=s.QCSemanticCoreV20.analyze(c.surface),actual={route:r.input_route.id,families:[...r.families].sort(),sequence:!!r.sequence},expected={route:c.expected.route,families:[...c.expected.families].sort(),sequence:!!c.expected.sequence},pass=JSON.stringify(actual)===JSON.stringify(expected);if(pass)passed++;results.push({case_id:id,pass,expected,actual});}const o={authority:label,run_id:process.env.GITHUB_RUN_ID,run_attempt:process.env.GITHUB_RUN_ATTEMPT,total:ids.length,passed,failed:ids.length-passed,results};fs.writeFileSync(file,JSON.stringify(o,null,2));console.log(label+': '+passed+'/'+ids.length);return passed===ids.length;}
          const a=run(fixture.batch_a,'V8.3.151 SEALED BATCH A FIRST RUN','V8_3_151_BATCH_A_FIRST_RUN_RESULTS.json');
          if(!a)process.exit(1);
          const b=run(fixture.batch_b,'V8.3.151 SEALED BATCH B FIRST RUN','V8_3_151_BATCH_B_FIRST_RUN_RESULTS.json');
          if(!b)process.exit(2);
          NODE
      - name: Package sealed validation checkpoint
        if: always()
        run: |
          python - <<'PY'
          import pathlib,zipfile,hashlib,json,shutil
          st=pathlib.Path('V8_3_151_SEALED_CHECKPOINT');st.mkdir(exist_ok=True)
          for f in ['V8_3_151_RUNTIME_AUTHORITY_SHA256.txt','V8_3_151_BATCH_A_FIRST_RUN_RESULTS.json','V8_3_151_BATCH_B_FIRST_RUN_RESULTS.json']:
              p=pathlib.Path(f)
              if p.exists():shutil.copy2(p,st/p.name)
          for p in pathlib.Path('V8_3_151_SEALED').iterdir():shutil.copy2(p,st/p.name)
          status={'batch_a_executed':(st/'V8_3_151_BATCH_A_FIRST_RUN_RESULTS.json').exists(),'batch_b_executed':(st/'V8_3_151_BATCH_B_FIRST_RUN_RESULTS.json').exists(),'step_111_executed':False,'production_authorized':False,'V8_3_145_Batch_B_accessed':False,'V8_3_149_Batch_B_accessed':False,'V8_3_150_Batch_B_accessed':False}
          (st/'V8_3_151_SEALED_STATUS.json').write_text(json.dumps(status,indent=2))
          def sha(p):return hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          (st/'SHA256_MANIFEST.txt').write_text(''.join(f'{sha(p)}  {p.name}\n' for p in sorted(st.iterdir()) if p.is_file()))
          z=pathlib.Path('PSC_V8_3_151_SEALED_VALIDATION_CHECKPOINT.zip')
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED) as q:
              for p in sorted(st.iterdir()):q.write(p,p.name)
          pathlib.Path('PSC_V8_3_151_SEALED_VALIDATION_CHECKPOINT_SHA256.txt').write_text(f'{sha(z)}  {z.name}\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PSC_V8_3_151_SEALED_VALIDATION_CHECKPOINT
          path: |
            PSC_V8_3_151_SEALED_VALIDATION_CHECKPOINT.zip
            PSC_V8_3_151_SEALED_VALIDATION_CHECKPOINT_SHA256.txt
