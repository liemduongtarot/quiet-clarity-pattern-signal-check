name: V8.3.211 R3 Preseal Direct Carrier
on:
  push:
    branches: [v83211-v1-validation]
permissions:
  contents: write
jobs:
  preseal:
    if: github.event.head_commit.message == 'Run V8.3.211 R3 preseal direct carrier'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Materialize frozen references only
        run: |
          mkdir -p validation/preseal_refs validation/v83211-v1-sealed
          for v in 201 202 203 204 205 206 207 208 209; do s=${v#20}; git fetch --depth=1 origin refs/heads/v8320${s}-v1-sealed-validation:refs/remotes/origin/v8320${s}-v1-sealed-validation; git show origin/v8320${s}-v1-sealed-validation:validation/v8320${s}-v1-sealed/V8_3_${v}_SEALED_FIXTURE_V1.json > validation/preseal_refs/V8_3_${v}_SEALED_FIXTURE_REFERENCE.json; done
          git fetch --depth=1 origin refs/heads/v83210-v1-sealed-validation:refs/remotes/origin/v83210-v1-sealed-validation
          git show origin/v83210-v1-sealed-validation:validation/v83210-v1-sealed/V8_3_210_SEALED_FIXTURE_V1.json > validation/preseal_refs/V8_3_210_SEALED_FIXTURE_REFERENCE.json
          python validation/v83211-generalization-600-generator-v1r.py
          cp validation/V8_3_211_DEVELOPMENT_GENERALIZATION_600_V1.json validation/preseal_refs/V8_3_211_DEVELOPMENT_GENERALIZATION_600_REFERENCE.json
      - name: Fetch reproducible preseal generators
        run: |
          git fetch --depth=1 origin f2907d7107089dbf5d01ce5d193a0d8fb6b278dc
          git show f2907d7107089dbf5d01ce5d193a0d8fb6b278dc:validation/v83211-preseal-generator.py > validation/v83211-preseal-generator.py
          git show f2907d7107089dbf5d01ce5d193a0d8fb6b278dc:validation/v83211-preseal-generator-v1r.py > validation/v83211-preseal-generator-v1r.py
      - name: Generate R3 bank without semantic runtime
        run: python validation/v83211-preseal-generator-v1r.py
      - name: Verify R3 authority and direct constituents
        run: |
          python - <<'PY'
          import json,pathlib,hashlib,shutil
          src=pathlib.Path('validation/v83211-v1-sealed');dst=pathlib.Path('validation/v83211-r3-preseal');dst.mkdir(exist_ok=True)
          def canon(o):return json.dumps(o,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()
          auth=json.loads((src/'V8_3_211_SEALED_AUTHORITY_V1.json').read_text());audit=json.loads((src/'V8_3_211_PRESEAL_DIVERSITY_AUDIT_V1.json').read_text())
          assert auth['validated_development_head_sha']=='ec0646c126ffd60358013663c148f4ffd7080ca2'
          assert auth['semantic_authority']=='QCSemanticCoreV89'
          assert audit['pass'] is True and audit['candidate_count']==180 and audit['selected_count']==60
          assert audit['internal_max_similarity']<.75 and audit['external_cases_at_or_above_0_75']==0 and audit['exact_external_duplicates']==0
          assert audit['runtime_executed_during_bank_or_selection'] is False and audit['semantic_authority_loaded_during_bank_or_selection'] is False and audit['selection_uses_runtime_output'] is False
          files={'candidate_bank':'V8_3_211_PRESEAL_CANDIDATE_BANK_V1.json','selection':'V8_3_211_SEALED_SELECTION_V1.json','fixture':'V8_3_211_SEALED_FIXTURE_V1.json','independent_gold':'V8_3_211_INDEPENDENT_GOLD_V1.json','membership':'V8_3_211_SEALED_MEMBERSHIP_V1.json','preseal_audit':'V8_3_211_PRESEAL_DIVERSITY_AUDIT_V1.json'}
          for k,fn in files.items():
              obj=json.loads((src/fn).read_text());got=hashlib.sha256(canon(obj)).hexdigest();assert got==auth['hashes'][k],(k,got,auth['hashes'][k]);shutil.copy2(src/fn,dst/fn)
          shutil.copy2(src/'V8_3_211_SEALED_AUTHORITY_V1.json',dst/'V8_3_211_SEALED_AUTHORITY_V1.json')
          PY
      - name: Record and commit direct R3 carrier
        run: |
          python - <<'PY'
          import json,pathlib,os
          p=pathlib.Path('validation/v83211-r3-preseal');a=json.loads((p/'V8_3_211_PRESEAL_DIVERSITY_AUDIT_V1.json').read_text())
          (p/'V8_3_211_R3_PRESEAL_RUN_RECEIPT.json').write_text(json.dumps({'candidate':'V8.3.211','phase':'preseal-r3-direct-carrier','run_id':int(os.environ['GITHUB_RUN_ID']),'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'source_validated_head':'ec0646c126ffd60358013663c148f4ffd7080ca2','conclusion':'success','candidate_count':a['candidate_count'],'selected_count':a['selected_count'],'internal_max_similarity':a['internal_max_similarity'],'external_max_similarity':a['external_max_similarity'],'semantic_runtime_executed':False,'semantic_authority_loaded':False,'v210_sealed_rerun':False,'step_111_authorized':False,'production_authorized':False},indent=2)+'\n')
          PY
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- validation/v83211-r3-preseal
          git commit -m 'Freeze V8.3.211 R3 direct preseal carrier'
          git push
      - name: Package R3 preseal checkpoint
        run: |
          python - <<'PY'
          import pathlib,zipfile,hashlib,shutil
          src=pathlib.Path('validation/v83211-r3-preseal');st=pathlib.Path('V8_3_211_R3_PRESEAL_CHECKPOINT');st.mkdir(exist_ok=True)
          for p in src.iterdir():
              if p.is_file():shutil.copy2(p,st/p.name)
          def sha(p):return hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          (st/'SHA256_MANIFEST.txt').write_text(''.join(f'{sha(p)}  {p.name}\n' for p in sorted(st.iterdir()) if p.is_file()))
          z=pathlib.Path('PSC_V8_3_211_R3_PRESEAL_CHECKPOINT.zip')
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED) as q:
              for p in sorted(st.iterdir()):q.write(p,p.name)
          pathlib.Path('PSC_V8_3_211_R3_PRESEAL_CHECKPOINT_SHA256.txt').write_text(f'{sha(z)}  {z.name}\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: PSC_V8_3_211_R3_PRESEAL_CHECKPOINT
          path: |
            PSC_V8_3_211_R3_PRESEAL_CHECKPOINT.zip
            PSC_V8_3_211_R3_PRESEAL_CHECKPOINT_SHA256.txt
