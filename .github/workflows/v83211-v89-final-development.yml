name: V8.3.211 R2 Transport via Development Runner
on:
  push:
    branches: [v83211-v1-validation]
permissions:
  contents: write
jobs:
  transport:
    if: github.event.head_commit.message == 'Run V8.3.211 R2 transport via development runner'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Fetch exact frozen R2 authority carrier
        run: |
          git fetch --depth=1 origin f2907d7107089dbf5d01ce5d193a0d8fb6b278dc
          mkdir -p validation/v83211-r2-transport
          git show f2907d7107089dbf5d01ce5d193a0d8fb6b278dc:validation/v83211-v1-sealed/V8_3_211_PRESEAL_BUNDLE_V1.json.gz.b64 > validation/v83211-r2-transport/V8_3_211_PRESEAL_BUNDLE_V1.json.gz.b64
          git show f2907d7107089dbf5d01ce5d193a0d8fb6b278dc:validation/v83211-v1-sealed/V8_3_211_SEALED_AUTHORITY_V1.json > validation/v83211-r2-transport/V8_3_211_SEALED_AUTHORITY_V1.json
          git show f2907d7107089dbf5d01ce5d193a0d8fb6b278dc:validation/v83211-v1-sealed/V8_3_211_PRESEAL_DIVERSITY_AUDIT_V1.json > validation/v83211-r2-transport/V8_3_211_PRESEAL_DIVERSITY_AUDIT_V1.json
      - name: Decode bundle and verify all frozen hashes without semantic runtime
        run: |
          python - <<'PY'
          import json,hashlib,pathlib,base64,gzip
          root=pathlib.Path('validation/v83211-r2-transport')
          def canon(o):return json.dumps(o,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()
          auth=json.loads((root/'V8_3_211_SEALED_AUTHORITY_V1.json').read_text())
          raw=gzip.decompress(base64.b64decode((root/'V8_3_211_PRESEAL_BUNDLE_V1.json.gz.b64').read_text().strip()))
          b=json.loads(raw)
          mapping={'candidate_bank':'candidate_bank','selection':'selection','fixture':'fixture','independent_gold':'independent_gold','membership':'membership','preseal_audit':'preseal_audit'}
          for k,bk in mapping.items():
              got=hashlib.sha256(canon(b[bk])).hexdigest()
              assert got==auth['hashes'][k],(k,got,auth['hashes'][k])
          assert auth['validated_development_head_sha']=='ec0646c126ffd60358013663c148f4ffd7080ca2'
          assert auth['semantic_authority']=='QCSemanticCoreV89'
          assert len(b['candidate_bank']['cases'])==180
          assert len(b['fixture']['cases'])==60
          assert len(b['selection']['batch_a'])==30 and len(b['selection']['batch_b'])==30
          assert set(b['selection']['batch_a']).isdisjoint(b['selection']['batch_b'])
          assert b['preseal_audit']['pass'] is True
          assert b['preseal_audit']['external_cases_at_or_above_0_75']==0
          assert b['preseal_audit']['runtime_executed_during_bank_or_selection'] is False
          assert b['preseal_audit']['semantic_authority_loaded_during_bank_or_selection'] is False
          # materialize exact frozen constituents for later sealed runner; no semantic code is loaded here.
          names={'candidate_bank':'V8_3_211_PRESEAL_CANDIDATE_BANK_V1.json','selection':'V8_3_211_SEALED_SELECTION_V1.json','fixture':'V8_3_211_SEALED_FIXTURE_V1.json','independent_gold':'V8_3_211_INDEPENDENT_GOLD_V1.json','membership':'V8_3_211_SEALED_MEMBERSHIP_V1.json','preseal_audit':'V8_3_211_PRESEAL_DIVERSITY_AUDIT_V1.json'}
          for k,fn in names.items():(root/fn).write_text(json.dumps(b[k],ensure_ascii=False,indent=2)+'\n')
          meta={'candidate':'V8.3.211','phase':'transport-only-r2','conclusion':'success','semantic_runtime_executed':False,'semantic_authority_loaded':False,'fixture_materialized':True,'hashes_verified':True,'semantic_authority':'QCSemanticCoreV89','validated_development_head_sha':'ec0646c126ffd60358013663c148f4ffd7080ca2','sealed_carrier_commit':'f2907d7107089dbf5d01ce5d193a0d8fb6b278dc','v210_sealed_rerun':False,'step_111_authorized':False,'production_authorized':False}
          (root/'V8_3_211_TRANSPORT_METADATA_V1.json').write_text(json.dumps(meta,indent=2)+'\n')
          PY
      - name: Package transport checkpoint
        run: |
          python - <<'PY'
          import pathlib,zipfile,hashlib,shutil
          root=pathlib.Path('validation/v83211-r2-transport');st=pathlib.Path('V8_3_211_R2_TRANSPORT_CHECKPOINT');st.mkdir(exist_ok=True)
          for p in root.iterdir():
              if p.is_file():shutil.copy2(p,st/p.name)
          def sha(p):return hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          (st/'SHA256_MANIFEST.txt').write_text(''.join(f'{sha(p)}  {p.name}\n' for p in sorted(st.iterdir()) if p.is_file()))
          z=pathlib.Path('PSC_V8_3_211_R2_TRANSPORT_CHECKPOINT.zip')
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED) as q:
              for p in sorted(st.iterdir()):q.write(p,p.name)
          pathlib.Path('PSC_V8_3_211_R2_TRANSPORT_CHECKPOINT_SHA256.txt').write_text(f'{sha(z)}  {z.name}\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: PSC_V8_3_211_R2_TRANSPORT_CHECKPOINT
          path: |
            PSC_V8_3_211_R2_TRANSPORT_CHECKPOINT.zip
            PSC_V8_3_211_R2_TRANSPORT_CHECKPOINT_SHA256.txt
      - name: Record transport receipt
        run: |
          python - <<'PY'
          import json,pathlib,os
          p=pathlib.Path('validation/V8_3_211_R2_TRANSPORT_DEV_RUNNER_RECEIPT.json')
          p.write_text(json.dumps({'candidate':'V8.3.211','phase':'transport-only-r2-via-development-runner','run_id':int(os.environ['GITHUB_RUN_ID']),'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'head_sha':os.environ['GITHUB_SHA'],'conclusion':'success','semantic_runtime_executed':False,'semantic_authority_loaded':False,'fixture_materialized':True,'hashes_verified':True,'v210_sealed_rerun':False,'step_111_authorized':False,'production_authorized':False},indent=2)+'\n')
          PY
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- validation/V8_3_211_R2_TRANSPORT_DEV_RUNNER_RECEIPT.json
          git commit -m 'Record V8.3.211 R2 transport development-runner receipt'
          git push
