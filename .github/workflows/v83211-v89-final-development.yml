name: V8.3.211 R3 Preseal Orchestrated
on:
  push:
    branches: [v83211-v1-validation]
permissions:
  contents: write
jobs:
  preseal:
    if: github.event.head_commit.message == 'Run V8.3.211 R3 preseal orchestrated'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Run deterministic R3 preseal orchestrator
        run: python validation/v83211-r3-preseal-orchestrator.py
      - name: Commit direct R3 carrier
        run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- validation/v83211-r3-preseal
          git commit -m 'Freeze V8.3.211 R3 direct preseal carrier'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: PSC_V8_3_211_R3_PRESEAL_CHECKPOINT
          path: |
            PSC_V8_3_211_R3_PRESEAL_CHECKPOINT.zip
            PSC_V8_3_211_R3_PRESEAL_CHECKPOINT_SHA256.txt
