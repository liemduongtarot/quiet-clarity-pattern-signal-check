name: V8.3.220 Transport + Static Preflight
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  verify:
    if: github.event.head_commit.message == 'Run V8.3.220 transport and static preflight'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83220-v1-sealed-validation
          fetch-depth: 0
      - name: Transport-only verification
        id: transport
        continue-on-error: true
        run: python validation/v83220-v1-sealed/v83220-transport-only.py
      - name: Static sealed preflight
        id: preflight
        if: always()
        continue-on-error: true
        run: python validation/v83220-v1-sealed/v83220-static-sealed-preflight.py
      - name: Build checkpoint if clean
        if: steps.transport.outcome == 'success' && steps.preflight.outcome == 'success'
        run: |
          python - <<'PY'
          import pathlib,zipfile,hashlib
          r=pathlib.Path('.');o=r/'validation/v83220-v1-sealed';files=['V8_3_220_SEALED_AUTHORITY_V1.json','V8_3_220_TRANSPORT_VERIFICATION_V1.json','V8_3_220_STATIC_SEALED_PREFLIGHT_V1.json','V8_3_220_FROZEN_TRANSPORT_BUNDLE_V1_SHA256.txt']
          z=r/'PSC_V8_3_220_V1_TRANSPORT_PREFLIGHT_CHECKPOINT.zip'
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED) as q:
            for n in files:q.write(o/n,n)
          (r/'PSC_V8_3_220_V1_TRANSPORT_PREFLIGHT_CHECKPOINT_SHA256.txt').write_text(hashlib.sha256(z.read_bytes()).hexdigest()+'  '+z.name+'\n')
          PY
      - name: Freeze verification evidence
        if: always()
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for f in V8_3_220_TRANSPORT_VERIFICATION_V1.json V8_3_220_STATIC_SEALED_PREFLIGHT_V1.json V8_3_220_FROZEN_TRANSPORT_BUNDLE_V1.zip V8_3_220_FROZEN_TRANSPORT_BUNDLE_V1_SHA256.txt; do test ! -f "validation/v83220-v1-sealed/$f" || git add -- "validation/v83220-v1-sealed/$f"; done
          git diff --cached --quiet || git commit -m 'Freeze V8.3.220 transport and static preflight evidence'
          git push origin HEAD:v83220-v1-sealed-validation
      - uses: actions/upload-artifact@v4
        if: steps.transport.outcome == 'success' && steps.preflight.outcome == 'success'
        with:
          name: PSC_V8_3_220_V1_TRANSPORT_PREFLIGHT_CHECKPOINT
          if-no-files-found: error
          path: |
            PSC_V8_3_220_V1_TRANSPORT_CHECKPOINT.zip
            PSC_V8_3_220_V1_TRANSPORT_CHECKPOINT_SHA256.txt
            PSC_V8_3_220_V1_TRANSPORT_PREFLIGHT_CHECKPOINT.zip
            PSC_V8_3_220_V1_TRANSPORT_PREFLIGHT_CHECKPOINT_SHA256.txt
      - name: Enforce
        if: always()
        run: test '${{ steps.transport.outcome }}' = 'success' && test '${{ steps.preflight.outcome }}' = 'success'
