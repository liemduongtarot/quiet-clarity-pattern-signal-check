name: V8.3.221 Bounded Runner Schema Recovery
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  recovery:
    if: github.event.head_commit.message == 'Run V8.3.221 bounded runner schema recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83221-v1-validation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run bounded recovery and preservation regression
        id: recovery
        continue-on-error: true
        run: python validation/v83221-bounded-runner-schema-recovery.py
      - name: Freeze recovery evidence
        if: always()
        run: |
          set -euo pipefail
          test -f validation/V8_3_221_BOUNDED_RUNNER_SCHEMA_RECOVERY_RECEIPT.json
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- validation/V8_3_221_BOUNDED_RUNNER_SCHEMA_RECOVERY_RECEIPT.json
          for f in validation/V8_3_220_V98_REGRESSION_RECEIPT.json validation/V8_3_220_V219_A_IMMUTABLE_REGRESSION.json validation/V8_3_220_V98_REGRESSION_RESULTS.json validation/V8_3_220_V219_A_REGRESSION_RESULTS.json; do
            test ! -f "$f" || git add -- "$f"
          done
          git diff --cached --quiet || git commit -m 'Record V8.3.221 bounded runner schema recovery evidence'
          git push origin HEAD:v83221-v1-validation
      - name: Build checkpoint
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,zipfile,hashlib
          r=pathlib.Path('.')
          files=[r/'validation/V8_3_221_BOUNDED_RUNNER_SCHEMA_RECOVERY_RECEIPT.json']
          for n in ['V8_3_220_V98_REGRESSION_RECEIPT.json','V8_3_220_V219_A_IMMUTABLE_REGRESSION.json','V8_3_220_V98_REGRESSION_RESULTS.json','V8_3_220_V219_A_REGRESSION_RESULTS.json']:
            p=r/'validation'/n
            if p.exists(): files.append(p)
          z=r/'PSC_V8_3_221_BOUNDED_RECOVERY_CHECKPOINT.zip'
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED) as q:
            for p in files:q.write(p,p.name)
          h=hashlib.sha256(z.read_bytes()).hexdigest()
          (r/'PSC_V8_3_221_BOUNDED_RECOVERY_CHECKPOINT_SHA256.txt').write_text(h+'  '+z.name+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PSC_V8_3_221_BOUNDED_RECOVERY_CHECKPOINT
          if-no-files-found: error
          path: |
            PSC_V8_3_221_BOUNDED_RECOVERY_CHECKPOINT.zip
            PSC_V8_3_221_BOUNDED_RECOVERY_CHECKPOINT_SHA256.txt
      - name: Enforce recovery outcome
        if: always()
        run: test '${{ steps.recovery.outcome }}' = 'success'
