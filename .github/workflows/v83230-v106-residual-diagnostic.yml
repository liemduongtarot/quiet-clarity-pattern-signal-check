name: V8.3.230 V106 residual diagnostic
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v83230-v106-residual-diagnostic.yml
permissions:
  contents: write
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83230-v1-validation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run residual diagnostic
        id: run
        shell: bash
        run: |
          # exact residual diagnostic after V106 28/30
          set +e
          python validation/v83230-v106-v229-residual-diagnostic.py > /tmp/v230-residual.log 2>&1
          rc=$?
          cat /tmp/v230-residual.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Freeze residual evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          test ! -f validation/V8_3_230_V106_RESIDUAL_FAILURES.json || git add validation/V8_3_230_V106_RESIDUAL_FAILURES.json
          test ! -f validation/V8_3_230_V229_A_V106_DIAGNOSTIC_RESULTS.json || git add validation/V8_3_230_V229_A_V106_DIAGNOSTIC_RESULTS.json
          git diff --cached --quiet || git commit -m 'Record V8.3.230 V106 residual diagnostic evidence'
          git push origin HEAD:v83230-v1-validation
      - name: Enforce diagnostic
        shell: bash
        run: test '${{ steps.run.outputs.rc }}' = '0'
