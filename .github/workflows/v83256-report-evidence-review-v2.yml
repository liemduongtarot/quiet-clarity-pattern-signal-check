name: V8.3.256 Report Evidence Review V2

on:
  push:
    branches: [v83256-report-evidence-review]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  review-v2:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Record run start and provenance
        run: |
          mkdir -p validation/v83256-report-evidence/v2-run
          printf '{"run_id":"%s","head_sha":"%s","status":"STARTED","sealed_batch_a_rerun":false,"sealed_batch_b_rerun":false}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > validation/v83256-report-evidence/v2-run/STARTED.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/v83256-report-evidence/v2-run/STARTED.json
          git commit -m 'Record V8.3.256 V2 regression start'
          git push origin HEAD:v83256-report-evidence-review

      - name: Materialize exact frozen V8.3.255 deployable authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source
          gh run download 32671592504 -n PSC_V8_3_255_EXACT_DEPLOYABLE_DIST -D source
          unzip -q source/PSC_V8_3_255_EXACT_DEPLOYABLE_DIST.zip -d outer
          unzip -q outer/PSC_V8_3_255_EXACT_DEPLOYABLE_DIST.zip -d base-dist
          test -f base-dist/client/candidate.html

      - name: Build V8.3.256 V2 candidate
        run: |
          python validation/v83256-report-evidence/v83256-build-candidate.py base-dist candidate PSC_V8_3_256_REPORT_EVIDENCE_REVIEW_CANDIDATE_V2.zip
          python validation/v83256-report-evidence/v83256-v2-safety-patch.py candidate/client/candidate.html
          rm -f PSC_V8_3_256_REPORT_EVIDENCE_REVIEW_CANDIDATE_V2.zip PSC_V8_3_256_REPORT_EVIDENCE_REVIEW_CANDIDATE_V2.zip.sha256.txt
          (cd candidate && zip -qr ../PSC_V8_3_256_REPORT_EVIDENCE_REVIEW_CANDIDATE_V2.zip .)
          sha256sum PSC_V8_3_256_REPORT_EVIDENCE_REVIEW_CANDIDATE_V2.zip > PSC_V8_3_256_REPORT_EVIDENCE_REVIEW_CANDIDATE_V2.zip.sha256.txt

      - name: Static authority and safety audit
        run: |
          mkdir -p evidence
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,re
          B=Path('base-dist'); C=Path('candidate')
          sha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          h=(C/'client/candidate.html').read_text(encoding='utf-8')
          base=(B/'client/candidate.html').read_text(encoding='utf-8')
          m=re.search(r'<script id="psc-v83256-report-evidence-layer">(.*?)</script>',h,re.S); assert m
          layer=m.group(1)
          forbidden=['Không đủ để classify','situation/response','liên quan đến fixer','liên quan đến carer','liên quan đến peacekeeper','unknown/insufficient thay vì bị ép vào một family']
          checks={
            'v124_identity':sha(C/'client/psc-v83253-v252-v124-residual.js')=='50f170383bb3f273beb64cbb251029de2c4fd84d256a5be33e2e8c646a87dd96',
            'v5ay_identity':sha(C/'client/qc-evidence-extractor-v5ay-v253-v252-residual.js')=='26bb9d33e5c04b041e72fdf2f435c954415f3f62f731c0e64584d8a8f452174a',
            'ten_required_questions':'CÂU ${i+1}/10' in layer,
            'cross_scene_object':'cross:null' in layer and 'CROSS=' in layer,
            'exception_object':'exception:null' in layer and 'EXC=' in layer,
            'material_impact_object':'impact:null' in layer and 'impactOptions' in layer,
            'other_response_cannot_force_pattern':"if(e.response==='A10')return'RESPONSE_UNKNOWN'" in layer,
            'no_material_influence_state':'NO_MATERIAL_INFLUENCE' in layer,
            'impact_influence_conflict_insufficient':"if(e.impact==='none'&&infl>=1)return'INSUFFICIENT'" in layer,
            'public_internal_terms_blocked':not any(x in layer for x in forbidden),
            'facebook_bridge':'https://www.facebook.com/quietclarity.uklondon' in layer,
            'privacy_line':'Pattern Signal Check không tự động gửi nội dung của bạn sang Quiet Clarity.' in layer,
            'donation_copy_present':'REPORT NÀY ĐÃ ĐỦ HỮU ÍCH CHO BẠN LÚC NÀY?' in layer,
            'donation_nonlive_without_owner_destinations':"const DONATION={vietnam_url:'',paypal_url:''}" in layer,
            'desktop_background_document_bound':'body::before{content:"";position:absolute;inset:0;z-index:-3;' in h and 'body::after{content:"";position:absolute;inset:0;z-index:-2;' in h,
            'no_new_local_storage':h.count('localStorage')<=base.count('localStorage'),
            'no_new_session_storage':h.count('sessionStorage')<=base.count('sessionStorage'),
            'no_new_beacon':h.count('sendBeacon')<=base.count('sendBeacon'),
            'sealed_a_rerun':False,'sealed_b_rerun':False
          }
          checks['pass']=all(v for v in checks.values() if isinstance(v,bool))
          Path('evidence/V8_3_256_STATIC_SCOPE_AUDIT_V2.json').write_text(json.dumps(checks,ensure_ascii=False,indent=2)+'\n')
          assert checks['pass'],checks
          PY

      - name: JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('candidate/client/candidate.html').read_text(encoding='utf-8')
          m=re.search(r'<script id="psc-v83256-report-evidence-layer">(.*?)</script>',h,re.S); assert m
          Path('/tmp/v83256-v2.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/v83256-v2.js

      - name: Install Playwright Chromium
        run: |
          cd /tmp
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Full-flow regression suite V2
        run: |
          python3 -m http.server 4173 --directory candidate/client >/tmp/v83256-http.log 2>&1 &
          sleep 2
          cat >/tmp/v83256-v2-e2e.cjs <<'JS'
          const {chromium}=require('/tmp/node_modules/playwright');const fs=require('fs');
          const URL='http://127.0.0.1:4173/candidate.html';
          async function next(p){await p.locator('#n').click()}
          async function choose(p,v){let x=p.locator(`input[value="${v}"]`).first();await x.check();await next(p)}
          async function enter(p,area='work',sit='Trong ba tháng gần đây, mỗi khi dự án chậm tôi thường cố chốt thật nhanh và mở thêm nhiều việc cùng lúc vì áp lực.'){
            await p.goto(URL,{waitUntil:'domcontentloaded'});await next(p);await p.locator(`input[value="${area}"]`).check();await next(p);await p.locator('#t').fill(sit);await next(p);let r=p.locator('input[name=x]');if(await r.count()){await r.first().check();await next(p)}
          }
          async function flow(p,answers,area='work',sit){await enter(p,area,sit);for(const v of answers)await choose(p,v);return {title:(await p.locator('h2').textContent()).trim(),text:(await p.locator('#c').innerText()).trim()}}
          (async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage({viewport:{width:1440,height:900}});let o={cases:[]};
          const cases=[
            ['strong','PATTERN ĐANG HOẠT ĐỘNG RÕ',['A3','3','3','0','E5','3','3','3','2','progress']],
            ['mild','PATTERN ĐÃ YẾU ĐI NHƯNG VẪN QUAY LẠI',['A3','2','2','1','E5','1','1','1','1','progress']],
            ['no_pattern_adaptive','CHƯA THẤY PATTERN BẤT LỢI RÕ',['A9','3','3','0','E9','3','0','0','0','none']],
            ['situational_only','PHẢN ỨNG THEO TÌNH HUỐNG',['A3','0','0','0','E5','1','1','1','2','progress']],
            ['inconsistent','CHƯA ĐỦ BẰNG CHỨNG',['A3','3','1','2','E5','2','2','2','2','progress']],
            ['competing_exception','PATTERN ĐÃ YẾU ĐI NHƯNG VẪN QUAY LẠI',['A3','3','3','2','E5','2','2','2','2','progress']],
            ['weakened','PATTERN ĐÃ YẾU ĐI NHƯNG VẪN QUAY LẠI',['A3','3','3','1','E5','2','2','1','1','progress']],
            ['residual_old','DẤU VẾT CŨ / KHÔNG CÒN ẢNH HƯỞNG RÕ',['A3','3','3','1','E5','0','0','0','0','progress']],
            ['contradictory_status','CHƯA ĐỦ BẰNG CHỨNG',['A3','3','3','0','E5','0','3','3','3','progress']],
            ['high_functioning_subtle','PATTERN ĐÃ YẾU ĐI NHƯNG VẪN QUAY LẠI',['A3','3','2','1','E5','2','1','1','2','progress']],
            ['insufficient','CHƯA ĐỦ BẰNG CHỨNG',['A3','-1','-1','-1','E5','-1','-1','-1','-1','unknown']],
            ['no_material_influence','CHƯA THẤY ẢNH HƯỞNG THỰC TẾ ĐÁNG KỂ',['A3','3','3','0','E5','0','0','0','2','none']],
            ['impact_conflict','CHƯA ĐỦ BẰNG CHỨNG',['A3','3','3','0','E5','3','3','3','2','none']]
          ];
          for(const [name,expect,a] of cases){let r=await flow(p,a);let pass=r.title===expect;o.cases.push({name,expect,actual:r.title,pass});if(!pass)throw new Error(`${name}: ${r.title}`)}
          let money=await flow(p,['A3','3','2','1','E2','3','2','2','2','security'],'money','Trong vài tháng gần đây, mỗi khi lo về tiền tôi thường chốt một khoản chi hoặc cam kết sớm để cảm thấy mình đang xử lý được tình hình.');o.money_consequence=/Nguồn tiền sẵn có/.test(money.text)&&/biên an toàn/.test(money.text);
          let rel=await flow(p,['A3','3','3','1','E2','3','3','3','2','boundary'],'romantic','Trong nhiều lần gần đây, khi mối quan hệ căng tôi thường nhận thêm phần của người kia để giữ mọi thứ ổn và sau đó thấy mình quá tải.');o.relationship_consequence=/ranh giới/i.test(rel.text)&&/mối quan hệ/i.test(rel.text);
          let career=await flow(p,['A3','3','3','0','E5','3','3','3','2','fragment'],'work');o.career_consequence=/nguồn lực/i.test(career.text)&&/ưu tiên/i.test(career.text);
          o.no_internal_copy=!/classify|situation\/response|unknown\/insufficient|liên quan đến fixer|liên quan đến carer|liên quan đến peacekeeper/i.test(career.text);
          o.facebook_cta=(await p.locator('#contactFacebook').getAttribute('href'))==='https://www.facebook.com/quietclarity.uklondon';o.copy_visible=await p.locator('#copyResult').isVisible();o.save_visible=await p.locator('#saveResult').isVisible();o.donation_hidden=(await p.locator('.donation-note').count())===0;
          await p.goto(URL);await next(p);await p.locator('input[value="money"]').check();await next(p);await p.locator('#t').fill('Khi nào tôi mới có tiền?');await next(p);o.timing_invalid=/không dự đoán khi nào/i.test(await p.locator('#c').innerText());
          await p.goto(URL);await next(p);await p.locator('input[value="work"]').check();await next(p);await p.locator('#t').fill('Tôi lo.');await next(p);o.vague_invalid=/viết rõ|chưa đủ|cụ thể/i.test(await p.locator('#c').innerText());
          await enter(p,'work');await choose(p,'A10');let ta=p.locator('#q256OtherResponse');await ta.fill('Tôi phản ứng theo một cách rất riêng mà hệ thống chưa thể xác định.');await next(p);for(const v of ['3','3','0','E5','3','3','3','2','progress'])await choose(p,v);o.other_response_not_forced=(await p.locator('h2').textContent()).trim()==='CHƯA RÕ CÁCH PHẢN ỨNG';
          await enter(p,'work');await choose(p,'A3');await choose(p,'3');await choose(p,'3');await choose(p,'0');await choose(p,'E5');await choose(p,'3');await choose(p,'3');await choose(p,'3');await choose(p,'2');await choose(p,'progress');await p.locator('#b').click();await p.locator('#b').click();await p.locator('#b').click();await p.locator('#b').click();await p.locator('#b').click();await p.locator('#b').click();await p.locator('#b').click();await p.locator('#b').click();await p.locator('#b').click();await p.locator('#b').click();let onClar=await p.locator('input[name=x]').count();if(onClar){await p.locator('#b').click()}let onSit=await p.locator('#t').count();if(onSit){await p.locator('#b').click()}if(await p.locator('input[value="money"]').count()){await p.locator('input[value="money"]').check();await next(p);o.topic_switch_reset=(S=>S)(await p.evaluate(()=>({hasE:!!S.e256,resp:S.e256&&S.e256.response}))).resp===null}else{o.topic_switch_reset=false}
          let dims=await p.evaluate(()=>({body:document.body.scrollHeight,view:innerHeight,before:getComputedStyle(document.body,'::before').position,after:getComputedStyle(document.body,'::after').position}));o.ui_background_contract=dims.before==='absolute'&&dims.after==='absolute';o.ui_dimensions=dims;
          o.pass=o.cases.every(x=>x.pass)&&o.money_consequence&&o.relationship_consequence&&o.career_consequence&&o.no_internal_copy&&o.facebook_cta&&o.copy_visible&&o.save_visible&&o.donation_hidden&&o.timing_invalid&&o.vague_invalid&&o.other_response_not_forced&&o.topic_switch_reset&&o.ui_background_contract;
          fs.writeFileSync('evidence/V8_3_256_BROWSER_REGRESSION_V2.json',JSON.stringify(o,null,2));await p.screenshot({path:'evidence/V8_3_256_DESKTOP_FULLPAGE_V2.png',fullPage:true});await b.close();if(!o.pass)process.exit(1)})().catch(e=>{console.error(e);process.exit(1)})
          JS
          node /tmp/v83256-v2-e2e.cjs

      - name: Evidence-trace and firewall audit
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          h=Path('candidate/client/candidate.html').read_text(encoding='utf-8')
          m=re.search(r'<script id="psc-v83256-report-evidence-layer">(.*?)</script>',h,re.S); s=m.group(1)
          checks={
            'report_uses_response_evidence':'responsePhrase(e)' in s,
            'repeat_section_uses_rep_cross_exception':'repText(e)' in s,
            'reinforcement_section_uses_reinforcement':'reinText(e)' in s,
            'current_section_uses_recent_influence_interrupt_trend':'currentText(e)' in s,
            'impact_section_uses_impact':'impactText(e)' in s and 'consequenceText(e)' in s,
            'uncertainty_section':'uncertaintyText(e,st)' in s,
            'no_root_cause_claim':'nguyên nhân gốc đầy đủ' in s and 'không đi vào' in s,
            'no_outcome_prediction':'dự đoán kết quả' in s and 'không đi vào' in s,
            'no_solution_plan':'kế hoạch can thiệp' in s and 'không đi vào' in s,
          }
          checks['pass']=all(checks.values())
          Path('evidence/V8_3_256_REPORT_TRACEABILITY_AUDIT_V2.json').write_text(json.dumps(checks,ensure_ascii=False,indent=2)+'\n')
          assert checks['pass'],checks
          PY

      - name: Produce V2 checkpoint
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          z=Path('PSC_V8_3_256_REPORT_EVIDENCE_REVIEW_CANDIDATE_V2.zip');sha=hashlib.sha256(z.read_bytes()).hexdigest()
          r={'candidate':'V8.3.256 REPORT EVIDENCE REVIEW V2','steps_1_5':'PASS','step_6_implementation':'PASS','step_7_required_regression':'PASS','semantic_baseline':'QCEvidenceExtractorV5AY -> QCSemanticCoreV124','v124_v5ay_identity':'PASS','sealed_batch_a_rerun':False,'sealed_batch_b_rerun':False,'proven_defects_addressed':['PSC-POSTDEPLOY-UI-001 review repair','PSC-POSTDEPLOY-COPY-001','PSC-POSTDEPLOY-COPY-002','PSC-POSTDEPLOY-COPY-003','PSC-POSTDEPLOY-FLOW-001'],'donation_layer':'DESIGN/COPY PRESENT; LIVE ROUTES HELD CLOSED UNTIL EXACT OWNER VIETQR/BANK + PAYPAL DESTINATIONS','production_promoted':False,'owner_smoke_required':True,'candidate_sha256':sha,'verdict':'PASS — V8.3.256 REVIEW CANDIDATE READY FOR OWNER SMOKE; NO PRODUCTION PROMOTION AUTHORIZED'}
          Path('evidence/V8_3_256_REVIEW_CHECKPOINT_V2.json').write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n')
          Path('evidence/V8_3_256_CANDIDATE_V2_SHA256.txt').write_text(sha+'  '+z.name+'\n')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PSC_V8_3_256_REPORT_EVIDENCE_REVIEW_V2
          path: |
            evidence/
            PSC_V8_3_256_REPORT_EVIDENCE_REVIEW_CANDIDATE_V2.zip
            PSC_V8_3_256_REPORT_EVIDENCE_REVIEW_CANDIDATE_V2.zip.sha256.txt

      - name: Record immutable PASS evidence
        run: |
          git fetch origin v83256-report-evidence-review
          git rebase origin/v83256-report-evidence-review
          mkdir -p validation/v83256-report-evidence/results-v2
          cp evidence/*.json evidence/*.txt validation/v83256-report-evidence/results-v2/
          git add validation/v83256-report-evidence/results-v2
          git commit -m 'Record V8.3.256 report evidence review PASS V2'
          git push origin HEAD:v83256-report-evidence-review
