name: V8.3.197 Sealed Validation
on:
  push:
    branches: [v83197-v1-sealed-validation]
permissions:
  contents: write
jobs:
  sealed_validate:
    if: github.event.head_commit.message == 'Run V8.3.197 sealed validation one-shot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Verify frozen authority and materialize exact V8.3.197 runtime
        run: |
          python - <<'PY'
          import json,hashlib,pathlib,base64,gzip,zipfile
          root=pathlib.Path('validation/v83197-v1-sealed');fixture=json.loads((root/'V8_3_197_SEALED_FIXTURE_V1.json').read_text());sel=json.loads((root/'V8_3_197_SEALED_SELECTION_V1.json').read_text());gold=json.loads((root/'V8_3_197_INDEPENDENT_GOLD_V1.json').read_text());auth=json.loads((root/'V8_3_197_SEALED_AUTHORITY_V1.json').read_text())
          membership={'authority':'V8.3.197 V1 SEALED MEMBERSHIP','members':[{'case_id':c['case_id'],'batch':'A' if c['case_id'] in sel['batch_a'] else 'B'} for c in fixture['cases']]}
          def canon(o):return json.dumps(o,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()
          for k,o in {'fixture':fixture,'selection':sel,'membership':membership,'independent_gold':gold}.items():assert hashlib.sha256(canon(o)).hexdigest()==auth['hashes'][k],k
          names=['V8_3_172_V171_V1_FAILURE_REGRESSION','V8_3_172_V171_V1_PREVIOUS_PASS_REGRESSION','V8_3_171_V170_V1_FAILURE_REGRESSION','V8_3_171_V170_V1_PREVIOUS_PASS_REGRESSION','V8_3_169_V168_V1_FAILURE_REGRESSION','V8_3_169_V168_V1_PREVIOUS_PASS_REGRESSION','V8_3_168_V167_V1_FAILURE_REGRESSION','V8_3_168_V167_V1_PREVIOUS_PASS_REGRESSION']
          for n in names:
            p=pathlib.Path('validation/'+n+'.json.gz.b64');pathlib.Path('validation/'+n+'.json').write_bytes(gzip.decompress(base64.b64decode(p.read_text().strip())))
          with zipfile.ZipFile('PSC_V8_3_139_FINAL_LOCAL_READINESS_EXTERNAL_BUILD_PENDING_CHECKPOINT (1).zip') as z:z.extractall('.')
          assert auth['v196_batch_a_rerun'] is False and auth['v196_batch_b_accessed'] is False
          PY
          python validation/v83197-v1-sealed/build-v197-sealed-runner.py
      - name: SEALED Batch A first run exactly once
        run: node validation/v83197-v1-sealed/run-v197-sealed.cjs A
      - name: SEALED Batch B exactly once only after A PASS
        if: success()
        run: node validation/v83197-v1-sealed/run-v197-sealed.cjs B
      - name: Package immutable sealed checkpoint
        if: always()
        run: |
          python - <<'PY'
          import pathlib,json,zipfile,hashlib,shutil,os
          st=pathlib.Path('V8_3_197_SEALED_CHECKPOINT');st.mkdir(exist_ok=True)
          for n in ['V8_3_197_BATCH_A_FIRST_RUN_RESULTS.json','V8_3_197_BATCH_B_FIRST_RUN_RESULTS.json']:
            p=pathlib.Path(n)
            if p.exists():shutil.copy2(p,st/n)
          root=pathlib.Path('validation/v83197-v1-sealed')
          for n in ['V8_3_197_SEALED_AUTHORITY_V1.json','V8_3_197_SEALED_FIXTURE_V1.json','V8_3_197_INDEPENDENT_GOLD_V1.json','V8_3_197_SEALED_SELECTION_V1.json','V8_3_197_SEALED_MEMBERSHIP_V1.json']:
            p=root/n
            if p.exists():shutil.copy2(p,st/n)
          A=pathlib.Path('V8_3_197_BATCH_A_FIRST_RUN_RESULTS.json');B=pathlib.Path('V8_3_197_BATCH_B_FIRST_RUN_RESULTS.json');a=json.loads(A.read_text()) if A.exists() else None;b=json.loads(B.read_text()) if B.exists() else None
          status={'candidate':'V8.3.197','run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'head_sha':os.environ['GITHUB_SHA'],'batch_a_executed':a is not None,'batch_a_passed':a['passed'] if a else None,'batch_a_failed':a['failed'] if a else None,'batch_b_executed':b is not None,'batch_b_passed':b['passed'] if b else None,'batch_b_failed':b['failed'] if b else None,'sealed_trigger_repeated':False,'v196_batch_a_rerun':False,'v196_batch_b_accessed':False,'step_111_authorized':False,'production_authorized':False};(st/'V8_3_197_SEALED_STATUS.json').write_text(json.dumps(status,indent=2))
          def sha(p):return hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          (st/'SHA256_MANIFEST.txt').write_text(''.join(f'{sha(p)}  {p.name}\n' for p in sorted(st.iterdir()) if p.is_file()));z=pathlib.Path('PSC_V8_3_197_V1_SEALED_VALIDATION_CHECKPOINT.zip')
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED) as q:
            for p in sorted(st.iterdir()):q.write(p,p.name)
          pathlib.Path('PSC_V8_3_197_V1_SEALED_VALIDATION_CHECKPOINT_SHA256.txt').write_text(f'{sha(z)}  {z.name}\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PSC_V8_3_197_V1_SEALED_VALIDATION_CHECKPOINT
          path: |
            PSC_V8_3_197_V1_SEALED_VALIDATION_CHECKPOINT.zip
            PSC_V8_3_197_V1_SEALED_VALIDATION_CHECKPOINT_SHA256.txt
      - name: Record sealed run receipt
        if: always()
        run: |
          python - <<'PY'
          import json,os,pathlib
          A=pathlib.Path('V8_3_197_BATCH_A_FIRST_RUN_RESULTS.json');B=pathlib.Path('V8_3_197_BATCH_B_FIRST_RUN_RESULTS.json');a=json.loads(A.read_text()) if A.exists() else None;b=json.loads(B.read_text()) if B.exists() else None
          success=bool(a and a['failed']==0 and b and b['failed']==0)
          p=pathlib.Path('validation/v83197-v1-sealed/V8_3_197_SEALED_RUN_RECEIPT.json');p.write_text(json.dumps({'candidate':'V8.3.197','phase':'sealed-validation','target_head_sha':os.environ['GITHUB_SHA'],'run_id':int(os.environ['GITHUB_RUN_ID']),'status':'completed','conclusion':'success' if success else 'failure','run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'sealed_trigger_repeated':False,'v196_sealed_rerun':False},indent=2))
          PY
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/v83197-v1-sealed/V8_3_197_SEALED_RUN_RECEIPT.json
          git commit -m 'Record V8.3.197 sealed run receipt'
          git push
