name: V8.3.155 V3 Sealed Transport Fixed Observer
on:
  workflow_run:
    workflows: ['V8.3.155 V3 Sealed Validation Transport Fixed']
    types: [completed]
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Record sealed run evidence
        run: |
          mkdir -p validation
          cat > validation/V8_3_155_V3_SEALED_TRANSPORT_FIXED_RUN_EVIDENCE.json <<EOF
          {
            "authority": "V8.3.155 V3 SEALED TRANSPORT FIXED RUN EVIDENCE",
            "run_id": ${{ github.event.workflow_run.id }},
            "run_attempt": ${{ github.event.workflow_run.run_attempt }},
            "conclusion": "${{ github.event.workflow_run.conclusion }}",
            "head_sha": "${{ github.event.workflow_run.head_sha }}",
            "head_branch": "${{ github.event.workflow_run.head_branch }}",
            "transport_preflight_run_id": 32094357890,
            "step_111_authorized": false,
            "production_authorized": false
          }
          EOF
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add validation/V8_3_155_V3_SEALED_TRANSPORT_FIXED_RUN_EVIDENCE.json
          git commit -m 'Record V8.3.155 V3 sealed transport-fixed run evidence' || exit 0
          git push origin main
