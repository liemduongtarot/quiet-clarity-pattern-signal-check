name: V8.3.179 V2 Sealed Validation
on:
  push:
    branches: [v83179-v1-sealed-validation]
permissions:
  contents: read
jobs:
  sealed_validate:
    if: github.event.head_commit.message == 'Run V8.3.179 V2 sealed validation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Verify frozen V2 authority and materialize exact V8.3.179 runtime
        run: |
          python - <<'PY'
          import json,hashlib,pathlib,zipfile
          root=pathlib.Path('validation/v83179-v1-sealed')
          auth=json.loads((root/'V8_3_179_SEALED_AUTHORITY_V2.json').read_text());pack=json.loads((root/'V8_3_179_SEALED_PACK_V1.json').read_text());gold=json.loads((root/'V8_3_179_INDEPENDENT_GOLD_V2.json').read_text())
          assert auth['development_authority_commit']=='83690d403a585f7c88d39ecc7cfdddb6ae2b1e74' and auth['semantic_runtime_executed_before_transport'] is False
          def canon(o):return json.dumps(o,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()
          assert hashlib.sha256(canon(pack['fixture'])).hexdigest()==auth['hashes']['fixture'];assert hashlib.sha256(canon(pack['selection'])).hexdigest()==auth['hashes']['selection'];assert hashlib.sha256(canon(pack['membership'])).hexdigest()==auth['hashes']['membership'];assert hashlib.sha256(canon(gold)).hexdigest()==auth['hashes']['independent_gold_v2']
          gm={cid:g['expected'] for g in gold['groups'] for cid in g['case_ids']};assert len(gm)==60
          for c in pack['fixture']['cases']:assert gm[c['case_id']]==c['expected']
          pathlib.Path('V8_3_179_SEALED_EXECUTION_FIXTURE_V2.json').write_text(json.dumps(pack['fixture'],ensure_ascii=False,indent=2))
          with zipfile.ZipFile('PSC_V8_3_139_FINAL_LOCAL_READINESS_EXTERNAL_BUILD_PENDING_CHECKPOINT (1).zip') as z:z.extractall('.')
          PY
          for f in psc-v83142-sealed-failure-convergence.js psc-v83143-semantic-convergence.js psc-v83144-sealed-failure-convergence.js psc-v83145-route-layer.js psc-v83145-family-state-layer.js psc-v83146-route-boundary-repair.js psc-v83146-family-sequence-repair.js psc-v83147-sealed-failure-repair.js psc-v83148-sealed-failure-repair.js psc-v83149-sealed-failure-repair.js psc-v83150-sealed-failure-repair.js psc-v83151-sealed-failure-repair.js psc-v83152-sealed-failure-repair.js psc-v83153-sealed-failure-repair.js psc-v83154-sealed-failure-repair.js psc-v83155-sealed-failure-repair.js psc-v83156-v155-v3-bounded-repair.js psc-v83157-v156-sealed-a-bounded-repair.js psc-v83158-v157-sealed-a-bounded-repair.js psc-v83159-v158-sealed-a-bounded-repair.js psc-v83160-v159-v2-sealed-a-bounded-repair.js psc-v83161-v160-v1-sealed-a-bounded-repair.js psc-v83162-v161-v1-sealed-a-bounded-repair.js psc-v83163-v162-v1-sealed-a-bounded-repair.js psc-v83164-v163-v1-sealed-a-bounded-repair.js psc-v83165-v164-v1-sealed-a-bounded-repair.js psc-v83166-v165-v1-sealed-a-bounded-repair.js psc-v83167-v166-v1-sealed-a-bounded-repair.js psc-v83168-v167-v1-sealed-a-bounded-repair.js psc-v83169-v168-v1-sealed-a-bounded-repair.js psc-v83170-v169-v1-sealed-a-bounded-repair.js psc-v83171-v170-v1-sealed-a-bounded-repair.js psc-v83172-v171-v1-sealed-a-bounded-repair.js psc-v83173-v172-v1-sealed-a-bounded-repair.js psc-v83174-v173-v1-sealed-a-bounded-repair.js psc-v83175-v174-v1-sealed-a-bounded-repair.js psc-v83176-v175-bank-contract-carry-forward.js psc-v83177-v176-sealed-a-bounded-repair.js psc-v83178-v177-sealed-a-bounded-repair.js psc-v83179-v178-sealed-a-bounded-repair.js; do cp validation/$f PSC_V8_3_138_DEV/public/; done
