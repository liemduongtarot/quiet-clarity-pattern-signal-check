name: V8.3.213 V93 Regression V1
on:
  push:
    branches: [v83213-v1-validation]
permissions:
  contents: write
jobs:
  regression:
    if: github.event.head_commit.message == 'Run V8.3.213 V93 regression V1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Run bounded + immutable regression
        run: python validation/v83213-v93-regression-orchestrator.py
      - name: Record regression receipt
        if: always()
        run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ -f validation/V8_3_213_V93_REGRESSION_V1_RECEIPT.json ]; then git add validation/V8_3_213_V93_REGRESSION_V1_RECEIPT.json; fi
          git diff --cached --quiet || git commit -m 'Record V8.3.213 V93 regression V1'
          git push
