name: Observe V8.3.203 Final Development
on:
  push:
    branches: [v83203-v1-validation]
permissions:
  contents: write
  actions: read
jobs:
  observe:
    if: github.event.head_commit.message == 'Observe V8.3.203 final development'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve final development run and record observer receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,urllib.request,pathlib
          repo=os.environ['GITHUB_REPOSITORY'];url=f'https://api.github.com/repos/{repo}/actions/workflows/v83203-final-development.yml/runs?branch=v83203-v1-validation&event=push&per_page=20'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          data=json.load(urllib.request.urlopen(req));runs=[r for r in data.get('workflow_runs',[]) if r.get('display_title')=='Run V8.3.203 final development'];assert runs,'final development run not found';r=sorted(runs,key=lambda x:x['id'],reverse=True)[0];assert r['status']=='completed',f"final development still {r['status']}"
          pathlib.Path('validation/V8_3_203_FINAL_DEVELOPMENT_OBSERVER_RECEIPT.json').write_text(json.dumps({'candidate':'V8.3.203','phase':'final-development-observer','run_id':r['id'],'run_attempt':r['run_attempt'],'head_sha':r['head_sha'],'status':r['status'],'conclusion':r['conclusion'],'v202_sealed_rerun':False,'step_111_authorized':False,'production_authorized':False},indent=2))
          PY
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/V8_3_203_FINAL_DEVELOPMENT_OBSERVER_RECEIPT.json
          git commit -m 'Record V8.3.203 final development observer receipt'
          git push
