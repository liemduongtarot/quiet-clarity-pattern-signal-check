name: V8.3.212 V92 Final Development Proven
on:
  push:
    branches: [v83212-v1-validation]
permissions:
  contents: write
jobs:
  final:
    if: github.event.head_commit.message == 'Run V8.3.212 V92 final development proven'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Run integrated final-development orchestrator
        run: python validation/v83212-v92-final-development-orchestrator.py
      - uses: actions/upload-artifact@v4
        with:
          name: PSC_V8_3_212_V92_DEVELOPMENT_VALIDATION_CHECKPOINT
          path: |
            PSC_V8_3_212_V92_DEVELOPMENT_VALIDATION_CHECKPOINT.zip
            PSC_V8_3_212_V92_DEVELOPMENT_VALIDATION_CHECKPOINT_SHA256.txt
      - name: Record final-development receipt
        run: |
          test -f validation/V8_3_212_V92_FINAL_DEVELOPMENT_RUN_RECEIPT.json
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- validation/V8_3_212_V92_FINAL_DEVELOPMENT_RUN_RECEIPT.json
          git commit -m 'Record V8.3.212 V92 final development receipt'
          git push
