name: V8.3.212 Preseal Diagnostic Proven
on:
  push:
    branches: [v83212-v1-validation]
permissions:
  contents: write
jobs:
  preseal:
    if: github.event.head_commit.message == 'Run V8.3.212 preseal diagnostic proven'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Run deterministic preseal diagnostic orchestrator
        id: preseal
        continue-on-error: true
        run: python validation/v83212-preseal-v1-orchestrator.py
      - name: Freeze preseal carrier if constructed
        if: always()
        run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- validation/V8_3_212_PRESEAL_DIAGNOSTIC_RECEIPT.json
          if [ -d validation/v83212-v1-sealed ]; then git add -- validation/v83212-v1-sealed; fi
          git commit -m 'Record V8.3.212 preseal diagnostic and carrier'
          git push
      - name: Enforce preseal success
        if: always()
        run: test '${{ steps.preseal.outcome }}' = 'success'
