name: V8.3.210 Regression V3
on:
  push:
    branches: [v83210-v1-validation]
permissions:
  contents: write
jobs:
  regression:
    if: github.event.head_commit.message == 'Run V8.3.210 regression V3'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Materialize immutable regression authority
        run: |
          python - <<'PY'
          import pathlib,base64,gzip,zipfile
          names=['V8_3_172_V171_V1_FAILURE_REGRESSION','V8_3_172_V171_V1_PREVIOUS_PASS_REGRESSION','V8_3_171_V170_V1_FAILURE_REGRESSION','V8_3_171_V170_V1_PREVIOUS_PASS_REGRESSION','V8_3_169_V168_V1_FAILURE_REGRESSION','V8_3_169_V168_V1_PREVIOUS_PASS_REGRESSION','V8_3_168_V167_V1_FAILURE_REGRESSION','V8_3_168_V167_V1_PREVIOUS_PASS_REGRESSION']
          for n in names:
            p=pathlib.Path('validation/'+n+'.json.gz.b64');pathlib.Path('validation/'+n+'.json').write_bytes(gzip.decompress(base64.b64decode(p.read_text().strip())))
          with zipfile.ZipFile('PSC_V8_3_139_FINAL_LOCAL_READINESS_EXTERNAL_BUILD_PENDING_CHECKPOINT (1).zip') as z:z.extractall('.')
          src=pathlib.Path('validation/run-v83196-full-regression-sweep-v2.cjs').read_text()
          chain="'psc-v83196-v195-v1-hypothetical-preservation-repair.js','psc-v83197-v196-sealed-a-bounded-repair.js','psc-v83198-v197-sealed-a-bounded-repair.js','psc-v83199-v198-sealed-a-bounded-repair.js','psc-v83200-v199-sealed-a-bounded-repair.js','psc-v83201-v200-sealed-a-bounded-repair.js','psc-v83201-v200-v1-preservation-precedence-repair.js','psc-v83202-v201-sealed-a-bounded-repair.js','psc-v83203-v202-sealed-a-bounded-repair.js','psc-v83204-v203-sealed-a-bounded-repair.js','psc-v83205-v204-sealed-a-bounded-repair.js','psc-v83206-v205-compositional-generalization.js','psc-v83206-v205-v1-preservation-repair.js','psc-v83207-v206-mechanism-cue-repair.js','psc-v83207-v206-v1-preservation-repair.js','psc-v83208-v207-mechanism-cue-repair.js','psc-v83208-v207-v1-preservation-repair.js','psc-v83209-v208-evidence-slot-composition.js','psc-v83209-v208-v1-preservation-repair.js','qc-evidence-extractor-v1-review-candidate.js','qc-evidence-extractor-v1r-review-candidate.js','qc-evidence-extractor-v1r2-review-candidate.js','psc-v83209-semantic-rule-table-v3-review-candidate.js','psc-v83209-v208-semantic-rule-table-promotion.js','qc-evidence-extractor-v1r3-v210-concept-coverage.js','psc-v83210-v209-semantic-rule-table-v4.js','qc-evidence-extractor-v1r4-v210-relational-preservation.js','psc-v83210-v209-v1-relational-preservation.js','qc-evidence-extractor-v2-v210-relational-semantics.js','psc-v83210-v210-semantic-rule-table-v5.js','qc-evidence-extractor-v2r-v210-multilingual-aliases.js','psc-v83210-v210-semantic-rule-table-v6.js'"
          src=src.replace("'psc-v83196-v195-v1-hypothetical-preservation-repair.js'];",chain+"];")
          src=src.replace('QCSemanticCoreV65R','QCSemanticCoreV84').replace('V8.3.196 V65R full immutable regression sweep V2','V8.3.210 V84 regression V3').replace('V8_3_196_V2_FULL_REGRESSION_SWEEP_RESULTS.json','V8_3_210_REGRESSION_V3_RESULTS.json')
          pathlib.Path('validation/run-v83210-regression-v3.cjs').write_text(src)
          PY
      - name: Run full immutable regression plus frozen V209 carriers
        run: node validation/run-v83210-regression-v3.cjs
      - name: Package regression checkpoint
        if: always()
        run: |
          python - <<'PY'
          import pathlib,zipfile,hashlib,json,shutil,os
          st=pathlib.Path('V8_3_210_REGRESSION_V3_CHECKPOINT');st.mkdir(exist_ok=True)
          files=[pathlib.Path('V8_3_210_REGRESSION_V3_RESULTS.json'),pathlib.Path('validation/V8_3_210_V209_V1_FAILURE_REGRESSION.json'),pathlib.Path('validation/V8_3_210_V209_V1_PREVIOUS_PASS_REGRESSION.json'),pathlib.Path('validation/qc-evidence-extractor-v2-v210-relational-semantics.js'),pathlib.Path('validation/qc-evidence-extractor-v2r-v210-multilingual-aliases.js'),pathlib.Path('validation/psc-v83210-v210-semantic-rule-table-v6.js')]
          for p in files:
            if p.exists():shutil.copy2(p,st/p.name)
          r=pathlib.Path('V8_3_210_REGRESSION_V3_RESULTS.json');rr=json.loads(r.read_text()) if r.exists() else None
          status={'candidate':'V8.3.210','phase':'development-regression-v3','semantic_authority':'QCSemanticCoreV84','run_id':int(os.environ['GITHUB_RUN_ID']),'result':'PASS' if rr and rr.get('failed')==0 else 'FAIL','v209_sealed_rerun':False,'step_111_authorized':False,'production_authorized':False};(st/'V8_3_210_REGRESSION_V3_STATUS.json').write_text(json.dumps(status,indent=2))
          def sha(p):return hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          (st/'SHA256_MANIFEST.txt').write_text(''.join(f'{sha(p)}  {p.name}\n' for p in sorted(st.iterdir()) if p.is_file()));z=pathlib.Path('PSC_V8_3_210_REGRESSION_V3_CHECKPOINT.zip')
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED) as q:
            for p in sorted(st.iterdir()):q.write(p,p.name)
          pathlib.Path('PSC_V8_3_210_REGRESSION_V3_CHECKPOINT_SHA256.txt').write_text(f'{sha(z)}  {z.name}\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PSC_V8_3_210_REGRESSION_V3_CHECKPOINT
          path: |
            PSC_V8_3_210_REGRESSION_V3_CHECKPOINT.zip
            PSC_V8_3_210_REGRESSION_V3_CHECKPOINT_SHA256.txt
      - name: Record regression V3 receipt
        if: always()
        run: |
          python - <<'PY'
          import pathlib,json,os
          p=pathlib.Path('V8_3_210_REGRESSION_V3_RESULTS.json');r=json.loads(p.read_text()) if p.exists() else None
          pathlib.Path('validation/V8_3_210_REGRESSION_V3_RUN_RECEIPT.json').write_text(json.dumps({'candidate':'V8.3.210','phase':'development-regression-v3','run_id':int(os.environ['GITHUB_RUN_ID']),'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'head_sha':os.environ['GITHUB_SHA'],'status':'completed','conclusion':'success' if r and r.get('failed')==0 else 'failure','total':r.get('total') if r else None,'passed':r.get('passed') if r else None,'failed':r.get('failed') if r else None,'semantic_authority':'QCSemanticCoreV84','v209_sealed_rerun':False,'step_111_authorized':False,'production_authorized':False},indent=2))
          PY
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- validation/V8_3_210_REGRESSION_V3_RUN_RECEIPT.json
          git commit -m 'Record V8.3.210 regression V3 receipt'
          git push
