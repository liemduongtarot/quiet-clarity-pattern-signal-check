name: V8.3.222 Frozen Failure Checkpoint
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checkpoint:
    if: github.event.head_commit.message == 'Build V8.3.222 frozen failure checkpoint'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83222-v1-sealed-validation
          fetch-depth: 0
      - name: Build checkpoint
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,zipfile,hashlib
          r=pathlib.Path('.');o=r/'validation/v83222-v1-sealed'
          names=['V8_3_222_BATCH_A_ATTEMPT_MARKER.json','V8_3_222_SEALED_FIRST_RUN_MARKER.json','V8_3_222_BATCH_A_STATUS_V1.json','V8_3_222_BATCH_A_RESULT_V1.json','V8_3_222_BATCH_A_FAILURE_AUTOPSY_V1.json','V8_3_222_SEALED_FREEZE_V1.json','V8_3_222_SEALED_AUTHORITY_V1.json','V8_3_222_PRESEAL_RUN_RECEIPT.json','V8_3_222_TRANSPORT_VERIFICATION_V1.json','V8_3_222_STATIC_SEALED_PREFLIGHT_V1.json']
          files=[o/n for n in names]
          for p in files:assert p.exists(),p
          z=r/'PSC_V8_3_222_FROZEN_FAILURE_CHECKPOINT.zip'
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED) as q:
            for p in files:q.write(p,p.name)
          h=hashlib.sha256(z.read_bytes()).hexdigest();(r/'PSC_V8_3_222_FROZEN_FAILURE_CHECKPOINT_SHA256.txt').write_text(h+'  '+z.name+'\n');print(h)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: PSC_V8_3_222_FROZEN_FAILURE_CHECKPOINT
          if-no-files-found: error
          path: |
            PSC_V8_3_222_FROZEN_FAILURE_CHECKPOINT.zip
            PSC_V8_3_222_FROZEN_FAILURE_CHECKPOINT_SHA256.txt
