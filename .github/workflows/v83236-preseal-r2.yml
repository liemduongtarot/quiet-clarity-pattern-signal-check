name: V8.3.236 PRESEAL R2
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v83236-preseal-r2.yml
permissions:
  contents: write
jobs:
  preseal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83236-v1-sealed-validation
          fetch-depth: 0
      - name: Run construction-only PRESEAL
        id: run
        shell: bash
        run: |
          set +e
          python validation/v83236-v1-sealed/v83236-preseal-freeze.py > /tmp/v236-preseal-r2.log 2>&1
          rc=$?
          cat /tmp/v236-preseal-r2.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          RC="$rc" python - <<'PY'
          import json,os,pathlib
          text=pathlib.Path('/tmp/v236-preseal-r2.log').read_text(errors='replace');rc=os.environ['RC']
          pathlib.Path('validation/v83236-v1-sealed/V8_3_236_PRESEAL_DIAGNOSTIC.json').write_text(json.dumps({'candidate':'V8.3.236','phase':'preseal-construction-diagnostic-r2','outcome':'success' if rc=='0' else 'failure','exit_code':rc,'log_tail':text[-18000:],'semantic_runtime_executed':False,'semantic_authority_loaded':False,'batch_a_executed':False,'batch_b_executed':False},indent=2)+'\n')
          PY
          exit 0
      - name: Freeze PRESEAL evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/v83236-v1-sealed/V8_3_236_PRESEAL_DIAGNOSTIC.json
          for f in validation/v83236-v1-sealed/V8_3_236_PRESEAL_CANDIDATE_BANK_V1.json validation/v83236-v1-sealed/V8_3_236_SEALED_SELECTION_V1.json validation/v83236-v1-sealed/V8_3_236_SEALED_FIXTURE_V1.json validation/v83236-v1-sealed/V8_3_236_INDEPENDENT_GOLD_V1.json validation/v83236-v1-sealed/V8_3_236_SEALED_MEMBERSHIP_V1.json validation/v83236-v1-sealed/V8_3_236_PRESEAL_DIVERSITY_AUDIT_V1.json validation/v83236-v1-sealed/V8_3_236_SEALED_AUTHORITY_V1.json validation/v83236-v1-sealed/V8_3_236_PRESEAL_RUN_RECEIPT.json; do test ! -f "$f" || git add "$f"; done
          git diff --cached --quiet || git commit -m 'Freeze V8.3.236 PRESEAL authority R2'
          git push origin HEAD:v83236-v1-sealed-validation
      - name: Enforce PRESEAL outcome
        shell: bash
        run: test '${{ steps.run.outputs.rc }}' = '0'
