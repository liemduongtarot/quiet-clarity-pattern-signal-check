name: V8.3.239 DEVELOPMENT checkpoint
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v83239-development-checkpoint.yml
permissions:
  contents: read
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 00ad4e2e12d58a22f26f171523c67231c662d325
          fetch-depth: 0
      - name: Build checkpoint
        run: |
          set -euo pipefail
          mkdir V8_3_239_DEVELOPMENT_CHECKPOINT
          cp validation/V8_3_239_DEVELOPMENT_AUTHORITY_V1.json V8_3_239_DEVELOPMENT_CHECKPOINT/
          cp validation/V8_3_239_V114_REGRESSION_RECEIPT.json V8_3_239_DEVELOPMENT_CHECKPOINT/
          cp validation/qc-evidence-extractor-v5ao-v239-v238-residuals.js V8_3_239_DEVELOPMENT_CHECKPOINT/
          cp validation/psc-v83239-v238-v114-v238-residuals.js V8_3_239_DEVELOPMENT_CHECKPOINT/
          printf '%s\n' '00ad4e2e12d58a22f26f171523c67231c662d325' > V8_3_239_DEVELOPMENT_CHECKPOINT/DEVELOPMENT_SHA.txt
          (cd V8_3_239_DEVELOPMENT_CHECKPOINT && sha256sum * > SHA256_MANIFEST.txt)
          zip -r PSC_V8_3_239_DEVELOPMENT_CHECKPOINT.zip V8_3_239_DEVELOPMENT_CHECKPOINT
          sha256sum PSC_V8_3_239_DEVELOPMENT_CHECKPOINT.zip > PSC_V8_3_239_DEVELOPMENT_CHECKPOINT_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PSC_V8_3_239_DEVELOPMENT_CHECKPOINT
          path: |
            PSC_V8_3_239_DEVELOPMENT_CHECKPOINT.zip
            PSC_V8_3_239_DEVELOPMENT_CHECKPOINT_SHA256.txt
          if-no-files-found: error
