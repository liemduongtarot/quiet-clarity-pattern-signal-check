name: V8.3.195 Sealed Transport
on:
  push:
    branches: [v83195-v1-sealed-validation]
permissions:
  contents: write
jobs:
  transport:
    if: github.event.head_commit.message == 'Run V8.3.195 transport preflight'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize and verify frozen bank without semantic runtime
        run: |
          python - <<'PY'
          import pathlib,base64,gzip,json,hashlib
          root=pathlib.Path('validation/v83195-v1-sealed')
          bundle=json.loads(gzip.decompress(base64.b64decode((root/'V8_3_195_BANK_BUNDLE_V1.json.gz.b64').read_text().strip())))
          fixture=bundle['fixture'];sel=bundle['selection'];gold=bundle['independent_gold'];auth=json.loads((root/'V8_3_195_SEALED_AUTHORITY_V1.json').read_text())
          membership={'authority':'V8.3.195 V1 SEALED MEMBERSHIP','members':[{'case_id':c['case_id'],'batch':'A' if c['case_id'] in sel['batch_a'] else 'B'} for c in fixture['cases']]}
          def canon(o):return json.dumps(o,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()
          for k,o in {'fixture':fixture,'selection':sel,'membership':membership,'independent_gold':gold}.items():assert hashlib.sha256(canon(o)).hexdigest()==auth['hashes'][k],k
          assert len(fixture['cases'])==60 and len(sel['batch_a'])==30 and len(sel['batch_b'])==30
          assert set(sel['batch_a']).isdisjoint(sel['batch_b']) and set(sel['batch_a'])|set(sel['batch_b'])=={c['case_id'] for c in fixture['cases']}
          gm={cid:g['expected'] for g in gold['groups'] for cid in g['case_ids']};assert len(gm)==60
          for c in fixture['cases']:assert gm[c['case_id']]==c['expected']
          assert auth['semantic_runtime_executed_before_transport'] is False and auth['v194_batch_a_rerun'] is False and auth['v194_batch_b_accessed'] is False
          (root/'V8_3_195_SEALED_FIXTURE_V1.json').write_text(json.dumps(fixture,ensure_ascii=False,separators=(',',':')))
          (root/'V8_3_195_SEALED_SELECTION_V1.json').write_text(json.dumps(sel,ensure_ascii=False,separators=(',',':')))
          (root/'V8_3_195_INDEPENDENT_GOLD_V1.json').write_text(json.dumps(gold,ensure_ascii=False,separators=(',',':')))
          print('V8.3.195 transport PASS; semantic runtime 0')
          PY
      - name: Record materialized bank and transport metadata
        run: |
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path('validation/v83195-v1-sealed')
          (root/'V8_3_195_TRANSPORT_METADATA.json').write_text(json.dumps({'target_head_sha':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'status':'completed','conclusion':'success','run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'semantic_runtime_executed':False},indent=2))
          PY
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/v83195-v1-sealed/V8_3_195_SEALED_FIXTURE_V1.json validation/v83195-v1-sealed/V8_3_195_SEALED_SELECTION_V1.json validation/v83195-v1-sealed/V8_3_195_INDEPENDENT_GOLD_V1.json validation/v83195-v1-sealed/V8_3_195_TRANSPORT_METADATA.json
          git commit -m 'Record V8.3.195 transport materialization and metadata'
          git push
