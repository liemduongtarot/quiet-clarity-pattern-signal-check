name: V8.3.145 Validation
on:
  push:
    branches: [v83145-validation-run]
jobs:
  validate:
    if: github.event.head_commit.message == 'Run V8.3.145 validation'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Materialize V8.3.145 authority
        run: |
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('PSC_V8_3_139_FINAL_LOCAL_READINESS_EXTERNAL_BUILD_PENDING_CHECKPOINT (1).zip') as z:z.extractall('.')
          PY
          cp validation/psc-v83142-sealed-failure-convergence.js PSC_V8_3_138_DEV/public/
          cp validation/psc-v83143-semantic-convergence.js PSC_V8_3_138_DEV/public/
          cp validation/psc-v83144-sealed-failure-convergence.js PSC_V8_3_138_DEV/public/
          cp validation/psc-v83145-route-layer.js PSC_V8_3_138_DEV/public/
          cp validation/psc-v83145-family-state-layer.js PSC_V8_3_138_DEV/public/
          cp validation/psc-v83145-browser-authority-lock.js PSC_V8_3_138_DEV/public/
          python - <<'PY'
          from pathlib import Path
          p=Path('PSC_V8_3_138_DEV/public/candidate.html');s=p.read_text()
          old='<script src="psc-v83139-semantic-convergence.js"></script><script src="psc-v83137-ui-gate-authority.js"></script>'
          new='<script src="psc-v83139-semantic-convergence.js"></script><script src="psc-v83142-sealed-failure-convergence.js"></script><script src="psc-v83143-semantic-convergence.js"></script><script src="psc-v83144-sealed-failure-convergence.js"></script><script src="psc-v83145-route-layer.js"></script><script src="psc-v83145-family-state-layer.js"></script><script src="psc-v83145-browser-authority-lock.js"></script><script src="psc-v83137-ui-gate-authority.js"></script>'
          if old not in s:raise SystemExit('script anchor missing')
          s=s.replace(old,new,1)
          oldb='if(globalThis.QCSemanticCoreV9)globalThis.QCSemanticCoreV4=globalThis.QCSemanticCoreV9;else if(globalThis.QCSemanticCoreV8)globalThis.QCSemanticCoreV4=globalThis.QCSemanticCoreV8;'
          newb='if(globalThis.QCSemanticCoreV14)globalThis.QCSemanticCoreV4=globalThis.QCSemanticCoreV14;else if(globalThis.QCSemanticCoreV13)globalThis.QCSemanticCoreV4=globalThis.QCSemanticCoreV13;else if(globalThis.QCSemanticCoreV12)globalThis.QCSemanticCoreV4=globalThis.QCSemanticCoreV12;else if(globalThis.QCSemanticCoreV11)globalThis.QCSemanticCoreV4=globalThis.QCSemanticCoreV11;else if(globalThis.QCSemanticCoreV10)globalThis.QCSemanticCoreV4=globalThis.QCSemanticCoreV10;else if(globalThis.QCSemanticCoreV9)globalThis.QCSemanticCoreV4=globalThis.QCSemanticCoreV9;else if(globalThis.QCSemanticCoreV8)globalThis.QCSemanticCoreV4=globalThis.QCSemanticCoreV8;'
          if oldb not in s:raise SystemExit('bootstrap anchor missing')
          p.write_text(s.replace(oldb,newb,1))
          PY
      - name: Immutable semantic regression
        working-directory: PSC_V8_3_138_DEV
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),assert=require('assert/strict');const s={};vm.createContext(s);
          for(const f of ['psc-v3.js','psc-v4.js','psc-v83121-r1-reconstructed.js','psc-v83122-operator-aware.js','psc-v83123-family-preservation.js','psc-v83124-operator-context.js','psc-v83125-semantic-routing.js','psc-v83126-public-route-canonicalization.js','psc-v83127-review-intent-authority.js','psc-v83129-canonical-shadow.js','psc-v83130-representation-coverage.js','psc-v83131-proposition-consolidation.js','psc-v83132-relation-graph.js','psc-v83133-canonical-role-binding.js','psc-v83135-scoped-operator.js','psc-v83138-semantic-convergence.js','psc-v83139-semantic-convergence.js','psc-v83142-sealed-failure-convergence.js','psc-v83143-semantic-convergence.js','psc-v83144-sealed-failure-convergence.js','psc-v83145-route-layer.js','psc-v83145-family-state-layer.js'])vm.runInContext(fs.readFileSync('public/'+f,'utf8'),s);
          const sets=[JSON.parse(fs.readFileSync('../validation/V8_3_144_BATCH_A_FAILURE_FIXTURE_V145.json')).failures,JSON.parse(fs.readFileSync('../validation/V8_3_143_BATCH_A_FAILURE_FORENSIC_IMMUTABLE.json')).failures];let n=0;
          for(const set of sets)for(const c of set){const r=s.QCSemanticCoreV14.analyze(c.surface),e=c.expected;assert.equal(r.input_route.id,e.route,c.case_id+' route');assert.deepEqual([...r.families].sort(),[...(e.families||[])].sort(),c.case_id+' families');assert.equal(!!r.sequence,!!e.sequence,c.case_id+' sequence');n++}console.log('immutable PASS',n);
          NODE
          node --check public/psc-v83145-route-layer.js
          node --check public/psc-v83145-family-state-layer.js
          node --check public/psc-v83145-browser-authority-lock.js
      - name: Install and build
        working-directory: PSC_V8_3_138_DEV
        run: |
          chmod +x scripts/*.sh
          npm run install:ci
          npm run build
          npm run validate:artifact
          test "$(find dist -type f -name '*.map' | wc -l)" -eq 0
          test -f dist/client/psc-v83145-route-layer.js
          test -f dist/client/psc-v83145-family-state-layer.js
          test -f dist/client/psc-v83145-browser-authority-lock.js
          grep -q 'QCSemanticCoreV14)globalThis.QCSemanticCoreV4=globalThis.QCSemanticCoreV14' dist/client/candidate.html
      - name: Record hashes
        working-directory: PSC_V8_3_138_DEV
        run: |
          sha256sum public/psc-v83145-route-layer.js public/psc-v83145-family-state-layer.js public/psc-v83145-browser-authority-lock.js public/psc-v83144-sealed-failure-convergence.js public/candidate.html package.json package-lock.json > V8_3_145_AUTHORITY_SHA256.txt
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > V8_3_145_DIST_SHA256.txt
      - name: Browser tooling
        run: |
          mkdir -p .e2e; printf '{"private":true}\n' > .e2e/package.json
          npm install --prefix .e2e --no-package-lock playwright@1.55.0
          .e2e/node_modules/.bin/playwright install --with-deps chromium
      - name: Start local build and tunnel
        run: |
          cd PSC_V8_3_138_DEV/dist/client;python3 -m http.server 4173 --bind 127.0.0.1 > ../../../V8_3_145_HTTP.log 2>&1 & echo $! > ../../../V8_3_145_HTTP.pid;cd ../../..
          for i in $(seq 1 30);do curl -fsS http://127.0.0.1:4173/candidate.html >/dev/null&&break;sleep 1;done
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared;chmod +x cloudflared
          ./cloudflared tunnel --url http://127.0.0.1:4173 --no-autoupdate > V8_3_145_CLOUDFLARED.log 2>&1 & echo $! > V8_3_145_CLOUDFLARED.pid
          for i in $(seq 1 60);do URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' V8_3_145_CLOUDFLARED.log|tail -1||true);[ -n "$URL" ]&&break;sleep 1;done
          [ -n "$URL" ]||exit 1;echo "PSC_E2E_URL=$URL" >> "$GITHUB_ENV";echo "$URL" > V8_3_145_TEMP_URL.txt
          for i in $(seq 1 90);do curl -fsS --max-time 5 "$URL/candidate.html" >/dev/null 2>&1&&exit 0;sleep 1;done;exit 1
      - name: Browser E2E
        run: |
          node - <<'NODE'
          const fs=require('fs'),{createRequire}=require('module'),req=createRequire(process.cwd()+'/x.js'),{chromium}=req('./.e2e/node_modules/playwright');
          (async()=>{const cases=JSON.parse(fs.readFileSync('validation/V8_3_144_BATCH_A_FAILURE_FIXTURE_V145.json')).failures;const b=await chromium.launch({headless:true});let err=0;try{const p=await b.newPage();p.on('console',m=>{if(m.type()==='error')err++});p.on('pageerror',()=>err++);await p.goto(process.env.PSC_E2E_URL+'/candidate.html',{waitUntil:'networkidle'});const pf=await p.evaluate(()=>({v14:QCSemanticCoreV14?.version,v4:QCSemanticCoreV4?.version,same:QCSemanticCoreV4===QCSemanticCoreV14,browser:PSC_V83145_BROWSER?.version}));if(!pf.same||pf.browser!=='V8.3.145-BROWSER-AUTHORITY-LOCK')throw Error(JSON.stringify(pf));let pass=0,res=[];for(const c of cases){const a=await p.evaluate(x=>{const r=QCSemanticCoreV4.analyze(x);return{route:r.input_route.id,families:[...r.families].sort(),sequence:!!r.sequence}},c.surface),e={route:c.expected.route,families:[...c.expected.families].sort(),sequence:!!c.expected.sequence},ok=a.route===e.route&&JSON.stringify(a.families)===JSON.stringify(e.families)&&a.sequence===e.sequence;pass+=ok;res.push({case_id:c.case_id,ok,a,e})}const out={candidate:'V8.3.145',total:cases.length,passed:pass,failed:cases.length-pass,console_errors:err,preflight:pf,results:res};fs.writeFileSync('V8_3_145_BROWSER_E2E_RESULTS.json',JSON.stringify(out,null,2));if(out.failed||err)process.exitCode=1}finally{await b.close()}})();
          NODE
      - name: Teardown
        if: always()
        run: |
          [ -f V8_3_145_CLOUDFLARED.pid ]&&kill "$(cat V8_3_145_CLOUDFLARED.pid)"||true
          [ -f V8_3_145_HTTP.pid ]&&kill "$(cat V8_3_145_HTTP.pid)"||true
      - name: Package checkpoint
        if: always()
        run: |
          python - <<'PY'
          import pathlib,shutil,zipfile,hashlib
          st=pathlib.Path('V8_3_145_CHECKPOINT');st.mkdir(exist_ok=True);r=pathlib.Path('PSC_V8_3_138_DEV')
          for p in [r/'public/psc-v83145-route-layer.js',r/'public/psc-v83145-family-state-layer.js',r/'public/psc-v83145-browser-authority-lock.js',r/'V8_3_145_AUTHORITY_SHA256.txt',r/'V8_3_145_DIST_SHA256.txt',pathlib.Path('V8_3_145_BROWSER_E2E_RESULTS.json'),pathlib.Path('V8_3_145_CLOUDFLARED.log')]:
           if p.exists():shutil.copy2(p,st/p.name)
          def sha(p):return hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          (st/'SHA256_MANIFEST.txt').write_text('\n'.join(f'{sha(p)}  {p.name}' for p in sorted(st.iterdir()) if p.is_file())+'\n')
          z=pathlib.Path('PSC_V8_3_145_DEVELOPMENT_VALIDATION_CHECKPOINT.zip')
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED) as f:
           for p in sorted(st.iterdir()):f.write(p,p.name)
          pathlib.Path('PSC_V8_3_145_DEVELOPMENT_VALIDATION_CHECKPOINT_SHA256.txt').write_text(f'{sha(z)}  {z.name}\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PSC_V8_3_145_DEVELOPMENT_VALIDATION_CHECKPOINT
          path: |
            PSC_V8_3_145_DEVELOPMENT_VALIDATION_CHECKPOINT.zip
            PSC_V8_3_145_DEVELOPMENT_VALIDATION_CHECKPOINT_SHA256.txt
