name: V8.3.231 V107 residual diagnostic
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v83231-v107-residual-diagnostic.yml
permissions:
  contents: write
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83231-v1-validation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run exact one-residual diagnostic
        id: run
        shell: bash
        run: |
          # first actual V8.3.231 one-residual diagnostic
          set +e
          python validation/v83231-v107-v230-residual-diagnostic.py > /tmp/v231-residual.log 2>&1
          rc=$?
          cat /tmp/v231-residual.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Freeze residual evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          test ! -f validation/V8_3_231_V107_RESIDUAL_FAILURE.json || git add validation/V8_3_231_V107_RESIDUAL_FAILURE.json
          test ! -f validation/V8_3_231_V230_A_V107_DIAGNOSTIC_RESULTS.json || git add validation/V8_3_231_V230_A_V107_DIAGNOSTIC_RESULTS.json
          git diff --cached --quiet || git commit -m 'Record V8.3.231 V107 residual diagnostic evidence'
          git push origin HEAD:v83231-v1-validation
      - name: Enforce diagnostic
        shell: bash
        run: test '${{ steps.run.outputs.rc }}' = '0'
