name: V8.3.218 Bounded Runner-Materialization Recovery
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  recovery:
    if: github.event.head_commit.message == 'Run V8.3.218 bounded recovery'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83218-v1-validation
          fetch-depth: 0
      - name: Verify bounded materialization repair
        run: python validation/v83218-bounded-recovery.py
      - name: Build recovery checkpoint
        run: |
          python - <<'PY'
          import pathlib,zipfile,hashlib
          r=pathlib.Path('.');p=r/'validation/V8_3_218_BOUNDED_RECOVERY_RECEIPT.json';z=r/'PSC_V8_3_218_BOUNDED_RECOVERY_CHECKPOINT.zip'
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED) as q:q.write(p,p.name)
          h=hashlib.sha256(z.read_bytes()).hexdigest();(r/'PSC_V8_3_218_BOUNDED_RECOVERY_CHECKPOINT_SHA256.txt').write_text(h+'  '+z.name+'\n')
          PY
      - name: Freeze recovery receipt
        run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- validation/V8_3_218_BOUNDED_RECOVERY_RECEIPT.json
          git diff --cached --quiet || git commit -m 'Record V8.3.218 bounded recovery PASS'
          git push origin HEAD:v83218-v1-validation
      - uses: actions/upload-artifact@v4
        with:
          name: PSC_V8_3_218_BOUNDED_RECOVERY_CHECKPOINT
          path: |
            PSC_V8_3_218_BOUNDED_RECOVERY_CHECKPOINT.zip
            PSC_V8_3_218_BOUNDED_RECOVERY_CHECKPOINT_SHA256.txt
