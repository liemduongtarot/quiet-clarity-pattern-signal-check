name: V8.3.243 DEVELOPMENT checkpoint
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v83243-development-checkpoint.yml
permissions:
  contents: read
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 885608fce9e70a8818d1ebda23c786a81005a2fe
          fetch-depth: 0
      - name: Build checkpoint
        run: |
          set -euo pipefail
          mkdir V8_3_243_DEVELOPMENT_CHECKPOINT
          cp validation/V8_3_243_DEVELOPMENT_AUTHORITY_V1.json V8_3_243_DEVELOPMENT_CHECKPOINT/
          cp validation/V8_3_243_V117_REGRESSION_RECEIPT.json V8_3_243_DEVELOPMENT_CHECKPOINT/
          cp validation/qc-evidence-extractor-v5ar-v243-v242-residuals.js V8_3_243_DEVELOPMENT_CHECKPOINT/
          cp validation/psc-v83243-v242-v117-residuals.js V8_3_243_DEVELOPMENT_CHECKPOINT/
          printf '%s\n' '885608fce9e70a8818d1ebda23c786a81005a2fe' > V8_3_243_DEVELOPMENT_CHECKPOINT/DEVELOPMENT_SHA.txt
          (cd V8_3_243_DEVELOPMENT_CHECKPOINT && sha256sum * > SHA256_MANIFEST.txt)
          zip -r PSC_V8_3_243_DEVELOPMENT_CHECKPOINT.zip V8_3_243_DEVELOPMENT_CHECKPOINT
          sha256sum PSC_V8_3_243_DEVELOPMENT_CHECKPOINT.zip > PSC_V8_3_243_DEVELOPMENT_CHECKPOINT_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PSC_V8_3_243_DEVELOPMENT_CHECKPOINT
          path: |
            PSC_V8_3_243_DEVELOPMENT_CHECKPOINT.zip
            PSC_V8_3_243_DEVELOPMENT_CHECKPOINT_SHA256.txt
          if-no-files-found: error
