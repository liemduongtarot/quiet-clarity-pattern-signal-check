name: V8.3.223 Protected Batch A One-Shot
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  batch-a:
    if: github.event.head_commit.message == 'Run V8.3.223 Batch A exactly once'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83223-v1-sealed-validation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Persist immutable Batch A reservation before semantic execution
        run: |
          set -euo pipefail
          test ! -e validation/v83223-v1-sealed/V8_3_223_BATCH_A_ATTEMPT_MARKER.json
          test ! -e validation/v83223-v1-sealed/V8_3_223_SEALED_FIRST_RUN_MARKER.json
          test ! -e validation/v83223-v1-sealed/V8_3_223_BATCH_A_RESULT_V1.json
          python - <<'PY'
          import json,os,pathlib
          o=pathlib.Path('validation/v83223-v1-sealed');pf=json.loads((o/'V8_3_223_STATIC_SEALED_PREFLIGHT_V1.json').read_text());tr=json.loads((o/'V8_3_223_TRANSPORT_VERIFICATION_V1.json').read_text())
          assert pf['pass'] is True and pf['first_run_marker_absent'] is True and pf['prior_batch_a_execution_absent'] is True and tr['pass'] is True
          common={'candidate':'V8.3.223','run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT'),'validated_development_head_sha':'857e98039a6d603fdcae2ec90f471ffd0bbabbb8','semantic_authority':'QCEvidenceExtractorV5AA -> QCSemanticCoreV100','reserved_before_semantic_execution':True,'semantic_runtime_executed':False,'v219_sealed_rerun':False,'v220_sealed_rerun':False,'v221_sealed_rerun':False,'v222_sealed_rerun':False,'step_111_authorized':False,'production_authorized':False}
          a=dict(common);a.update({'phase':'sealed-batch-a-attempt-reservation','batch':'A'});f=dict(common);f.update({'phase':'sealed-first-run-reservation','reserved_batch':'A'})
          (o/'V8_3_223_BATCH_A_ATTEMPT_MARKER.json').write_text(json.dumps(a,indent=2)+'\n');(o/'V8_3_223_SEALED_FIRST_RUN_MARKER.json').write_text(json.dumps(f,indent=2)+'\n')
          PY
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/v83223-v1-sealed/V8_3_223_BATCH_A_ATTEMPT_MARKER.json validation/v83223-v1-sealed/V8_3_223_SEALED_FIRST_RUN_MARKER.json
          git commit -m 'Reserve V8.3.223 sealed Batch A first run'
          git push origin HEAD:v83223-v1-sealed-validation
      - name: Execute V8.3.223 Batch A exactly once
        id: batcha
        continue-on-error: true
        run: python validation/v83223-v1-sealed/v83223-batch-a-once.py
      - name: Freeze Batch A evidence
        if: always()
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          test -f validation/v83223-v1-sealed/V8_3_223_BATCH_A_STATUS_V1.json
          git add validation/v83223-v1-sealed/V8_3_223_BATCH_A_STATUS_V1.json validation/v83223-v1-sealed/V8_3_223_BATCH_A_ATTEMPT_MARKER.json validation/v83223-v1-sealed/V8_3_223_SEALED_FIRST_RUN_MARKER.json
          test ! -f validation/v83223-v1-sealed/V8_3_223_BATCH_A_RESULT_V1.json || git add validation/v83223-v1-sealed/V8_3_223_BATCH_A_RESULT_V1.json
          git diff --cached --quiet || git commit -m 'Freeze V8.3.223 Batch A first-run evidence'
          git push origin HEAD:v83223-v1-sealed-validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PSC_V8_3_223_V1_BATCH_A_CHECKPOINT
          if-no-files-found: error
          path: |
            PSC_V8_3_223_V1_BATCH_A_CHECKPOINT.zip
            PSC_V8_3_223_V1_BATCH_A_CHECKPOINT_SHA256.txt
      - name: Enforce Batch A outcome
        if: always()
        run: test '${{ steps.batcha.outcome }}' = 'success'
