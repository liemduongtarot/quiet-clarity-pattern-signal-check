name: V8.3.189 Transport Evidence Probe
on:
  push:
    branches: [v83189-v1-sealed-validation]
permissions:
  actions: read
  contents: write
jobs:
  probe:
    if: github.event.head_commit.message == 'Probe V8.3.189 transport evidence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record metadata
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 4ab2a165fff5a6d4a85dd6f0cfafa488be97dee7
        run: |
          python - <<'PY'
          import json,os,urllib.request,pathlib
          repo=os.environ['GITHUB_REPOSITORY'];target=os.environ['TARGET_SHA'];token=os.environ['GH_TOKEN']
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/runs?branch=v83189-v1-sealed-validation&per_page=50',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json'})
          runs=json.load(urllib.request.urlopen(req))['workflow_runs'];cand=[r for r in runs if r.get('head_sha')==target and r.get('name')=='V8.3.189 Transport Preflight'];assert cand
          r=sorted(cand,key=lambda x:x['id'],reverse=True)[0]
          pathlib.Path('validation/v83189-v1-sealed/V8_3_189_TRANSPORT_METADATA.json').write_text(json.dumps({'target_head_sha':target,'run_id':r['id'],'status':r['status'],'conclusion':r.get('conclusion'),'run_attempt':r.get('run_attempt',1),'semantic_runtime_executed':False},indent=2))
          PY
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/v83189-v1-sealed/V8_3_189_TRANSPORT_METADATA.json
          git commit -m 'Record V8.3.189 transport metadata'
          git push