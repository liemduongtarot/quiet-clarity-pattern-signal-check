name: V8.3.221 Transport and Static Preflight
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  preflight:
    if: github.event.head_commit.message == 'Run V8.3.221 transport and static preflight'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83221-v1-sealed-validation
          fetch-depth: 0
      - name: Transport only
        run: python validation/v83221-v1-sealed/v83221-transport-only.py
      - name: Static sealed preflight
        run: python validation/v83221-v1-sealed/v83221-static-sealed-preflight.py
      - name: Freeze evidence
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- validation/v83221-v1-sealed/V8_3_221_TRANSPORT_VERIFICATION_V1.json validation/v83221-v1-sealed/V8_3_221_STATIC_SEALED_PREFLIGHT_V1.json validation/v83221-v1-sealed/V8_3_221_FROZEN_TRANSPORT_BUNDLE_V1.zip validation/v83221-v1-sealed/V8_3_221_FROZEN_TRANSPORT_BUNDLE_V1_SHA256.txt
          git diff --cached --quiet || git commit -m 'Freeze V8.3.221 transport and static preflight evidence'
          git push origin HEAD:v83221-v1-sealed-validation
      - uses: actions/upload-artifact@v4
        with:
          name: PSC_V8_3_221_TRANSPORT_PREFLIGHT_CHECKPOINT
          if-no-files-found: error
          path: |
            PSC_V8_3_221_V1_TRANSPORT_CHECKPOINT.zip
            PSC_V8_3_221_V1_TRANSPORT_CHECKPOINT_SHA256.txt
