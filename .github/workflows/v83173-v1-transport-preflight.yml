name: V8.3.173 V1 Transport Preflight
on:
  push:
    branches: [v83173-v1-sealed-validation]
jobs:
  verify:
    if: github.event.head_commit.message == 'Run V8.3.173 V1 transport preflight'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable sealed transport only
        run: |
          python - <<'PY'
          import pathlib,json,hashlib,base64,gzip,zipfile
          pack=json.loads(pathlib.Path('validation/v83173-v1-sealed/V8_3_173_SEALED_TRANSPORT_PACK_V1.json').read_text())
          assert pack['development_authority_commit']=='7c434c5acb297f7895cdbd3a442305231ab7806e'
          assert pack['fixture_sha256_without_sha_field']=='6f121566246747f782482f601b410e0eb3e9701a3450f246c19a00f538b3163c'
          assert pack['selection_sha256']=='aa0399e3899fadd11189a1a5c75e04780a298a8170eddd01c142dacfa97b0afb'
          assert pack['gold_sha256']=='e8c58265c7bc081d128795ebbfa0baffa45db9397c8ae714275861386350c0a3'
          assert pack['membership_sha256']=='18c7650eb724c492bd836c99419a39f05a05cf26ae597491868e4486dfe92934'
          assert pack['runtime_executed_before_transport'] is False and pack['v172_batch_a_rerun'] is False and pack['v172_batch_b_accessed'] is False
          raw=gzip.decompress(base64.b64decode(pack['fixture_gzip_b64']));fix=json.loads(raw)
          def csha(o):
            x=dict(o);x.pop('sha256_without_sha_field',None);return hashlib.sha256(json.dumps(x,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          assert csha(fix)==pack['fixture_sha256_without_sha_field']
          assert fix['selection_sha256']==pack['selection_sha256'] and fix['gold_sha256']==pack['gold_sha256'] and fix['membership_sha256']==pack['membership_sha256']
          ind=fix['independence_constraints'];assert ind['v172_sealed_membership_reused'] is False and ind['v172_sealed_gold_reused'] is False and ind['v172_batch_a_or_b_reused'] is False and ind['runtime_used_for_case_selection'] is False
          ids=[c['case_id'] for c in fix['cases']];A=fix['batch_a'];B=fix['batch_b'];assert len(ids)==60 and len(set(ids))==60 and len(A)==30 and len(B)==30 and set(A).isdisjoint(B) and set(A+B)==set(ids)
          pathlib.Path('V8_3_173_SEALED_EXECUTION_FIXTURE_V1.json').write_bytes(raw)
          ev={'authority':'V8.3.173 V1 TRANSPORT PREFLIGHT','result':'PASS','run_id':'${{ github.run_id }}','head_sha':'${{ github.sha }}','case_count':60,'batch_a_count':30,'batch_b_count':30,'semantic_runtime_executed':False,'v172_batch_a_rerun':False,'v172_batch_b_accessed':False,'step_111_authorized':False,'production_authorized':False};pathlib.Path('V8_3_173_TRANSPORT_PREFLIGHT_RESULT.json').write_text(json.dumps(ev,indent=2))
          with zipfile.ZipFile('PSC_V8_3_173_V1_TRANSPORT_PREFLIGHT_CHECKPOINT.zip','w',zipfile.ZIP_DEFLATED) as z:z.write('V8_3_173_TRANSPORT_PREFLIGHT_RESULT.json');z.write('V8_3_173_SEALED_EXECUTION_FIXTURE_V1.json')
          h=hashlib.sha256(pathlib.Path('PSC_V8_3_173_V1_TRANSPORT_PREFLIGHT_CHECKPOINT.zip').read_bytes()).hexdigest();pathlib.Path('PSC_V8_3_173_V1_TRANSPORT_PREFLIGHT_CHECKPOINT_SHA256.txt').write_text(h+'  PSC_V8_3_173_V1_TRANSPORT_PREFLIGHT_CHECKPOINT.zip\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: PSC_V8_3_173_V1_TRANSPORT_PREFLIGHT_CHECKPOINT
          path: |
            PSC_V8_3_173_V1_TRANSPORT_PREFLIGHT_CHECKPOINT.zip
            PSC_V8_3_173_V1_TRANSPORT_PREFLIGHT_CHECKPOINT_SHA256.txt
