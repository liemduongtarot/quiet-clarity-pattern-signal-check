name: V8.3.156 V1 Sealed Validation
on:
  push:
    branches: [v83156-v1-sealed-validation]
jobs:
  sealed_validate:
    if: github.event.head_commit.message == 'Run V8.3.156 sealed validation'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Verify sealed material and materialize exact authority
        run: |
          python - <<'PY'
          import base64,gzip,pathlib,hashlib,json,zipfile
          root=pathlib.Path('validation/v83156-v1-sealed')
          def mat(parts,out,sha):
            s=''.join((root/p).read_text().strip() for p in parts); assert len(s)%4==0
            raw=gzip.decompress(base64.b64decode(s,validate=True)); assert hashlib.sha256(raw).hexdigest()==sha
            pathlib.Path(out).write_bytes(raw); return json.loads(raw)
          f=mat([f'V8_3_156_SEALED_EXECUTION_FIXTURE_V1.json.gz.b64.part{i:02d}' for i in range(1,5)],'V8_3_156_SEALED_EXECUTION_FIXTURE_V1.json','37ea0c5c6f9563e312b69d44cdc4e8603ecb7b31e6c7d52b297bc0818deb4348')
          m=mat(['V8_3_156_SEALED_MEMBERSHIP_V1.json.gz.b64.part01'],'V8_3_156_SEALED_MEMBERSHIP_V1.json','712a728a363f1e77538ef961f751d318ae646616a0ae0bad57d70bbe8562b925')
          assert f['candidate_sha256']=='77a2110513255d680e1f16da06e23f79b0a2c16ecd71c5be70e4133e5130b790'
          assert f['selection_sha256']=='cdbda6b259bdab1969c2f299a285b4687bb346047a446b527961afb8279781af'
          assert f['gold_sha256']=='f94546d4363d1feafb9ec61aa0b43bd9fac6631a621e0bed07e6a9047abe9f2b'
          assert f['membership_sha256']=='712a728a363f1e77538ef961f751d318ae646616a0ae0bad57d70bbe8562b925'
          assert f['sealed_before_execution'] is True and f['runtime_execution_before_fixture']==0
          assert len(f['cases'])==60 and len(f['batch_a'])==30 and len(f['batch_b'])==30
          assert not(set(f['batch_a'])&set(f['batch_b']))
          with zipfile.ZipFile('PSC_V8_3_139_FINAL_LOCAL_READINESS_EXTERNAL_BUILD_PENDING_CHECKPOINT (1).zip') as z:z.extractall('.')
          PY
          for f in psc-v83142-sealed-failure-convergence.js psc-v83143-semantic-convergence.js psc-v83144-sealed-failure-convergence.js psc-v83145-route-layer.js psc-v83145-family-state-layer.js psc-v83146-route-boundary-repair.js psc-v83146-family-sequence-repair.js psc-v83147-sealed-failure-repair.js psc-v83148-sealed-failure-repair.js psc-v83149-sealed-failure-repair.js psc-v83150-sealed-failure-repair.js psc-v83151-sealed-failure-repair.js psc-v83152-sealed-failure-repair.js psc-v83153-sealed-failure-repair.js psc-v83154-sealed-failure-repair.js psc-v83155-sealed-failure-repair.js psc-v83156-v155-v3-bounded-repair.js; do cp validation/$f PSC_V8_3_138_DEV/public/; done
          sha256sum PSC_V8_3_138_DEV/public/psc-v83156-v155-v3-bounded-repair.js PSC_V8_3_138_DEV/public/psc-v83155-sealed-failure-repair.js > V8_3_156_RUNTIME_AUTHORITY_SHA256.txt
      - name: SEALED Batch A first run exactly once; Batch B only after A PASS
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const f=JSON.parse(fs.readFileSync('V8_3_156_SEALED_EXECUTION_FIXTURE_V1.json','utf8'));const by=Object.fromEntries(f.cases.map(c=>[c.case_id,c]));const s={};vm.createContext(s);
          const files=['psc-v3.js','psc-v4.js','psc-v83121-r1-reconstructed.js','psc-v83122-operator-aware.js','psc-v83123-family-preservation.js','psc-v83124-operator-context.js','psc-v83125-semantic-routing.js','psc-v83126-public-route-canonicalization.js','psc-v83127-review-intent-authority.js','psc-v83129-canonical-shadow.js','psc-v83130-representation-coverage.js','psc-v83131-proposition-consolidation.js','psc-v83132-relation-graph.js','psc-v83133-canonical-role-binding.js','psc-v83135-scoped-operator.js','psc-v83138-semantic-convergence.js','psc-v83139-semantic-convergence.js','psc-v83142-sealed-failure-convergence.js','psc-v83143-semantic-convergence.js','psc-v83144-sealed-failure-convergence.js','psc-v83145-route-layer.js','psc-v83145-family-state-layer.js','psc-v83146-route-boundary-repair.js','psc-v83146-family-sequence-repair.js','psc-v83147-sealed-failure-repair.js','psc-v83148-sealed-failure-repair.js','psc-v83149-sealed-failure-repair.js','psc-v83150-sealed-failure-repair.js','psc-v83151-sealed-failure-repair.js','psc-v83152-sealed-failure-repair.js','psc-v83153-sealed-failure-repair.js','psc-v83154-sealed-failure-repair.js','psc-v83155-sealed-failure-repair.js','psc-v83156-v155-v3-bounded-repair.js'];
          for(const x of files)vm.runInContext(fs.readFileSync('PSC_V8_3_138_DEV/public/'+x,'utf8'),s);if(!s.QCSemanticCoreV25)throw Error('QCSemanticCoreV25 missing');
          function run(ids,label,file){let passed=0;const results=[];for(const id of ids){const c=by[id],r=s.QCSemanticCoreV25.analyze(c.surface,c.domain),actual={route:r.input_route.id,families:[...r.families].sort(),sequence:!!r.sequence},expected={route:c.expected.route,families:[...c.expected.families].sort(),sequence:!!c.expected.sequence},pass=JSON.stringify(actual)===JSON.stringify(expected);if(pass)passed++;results.push({case_id:id,pass,expected,actual});}fs.writeFileSync(file,JSON.stringify({authority:label,run_id:process.env.GITHUB_RUN_ID,run_attempt:process.env.GITHUB_RUN_ATTEMPT,total:ids.length,passed,failed:ids.length-passed,results},null,2));console.log(label+': '+passed+'/'+ids.length);return passed===ids.length;}
          if(!run(f.batch_a,'V8.3.156 SEALED BATCH A FIRST RUN','V8_3_156_BATCH_A_FIRST_RUN_RESULTS.json'))process.exit(1);
          if(!run(f.batch_b,'V8.3.156 SEALED BATCH B FIRST RUN','V8_3_156_BATCH_B_FIRST_RUN_RESULTS.json'))process.exit(2);
          NODE
      - name: Package immutable sealed checkpoint
        if: always()
        run: |
          python - <<'PY'
          import pathlib,zipfile,hashlib,json,shutil
          st=pathlib.Path('V8_3_156_SEALED_CHECKPOINT');st.mkdir(exist_ok=True)
          for n in ['V8_3_156_RUNTIME_AUTHORITY_SHA256.txt','V8_3_156_SEALED_EXECUTION_FIXTURE_V1.json','V8_3_156_SEALED_MEMBERSHIP_V1.json','V8_3_156_BATCH_A_FIRST_RUN_RESULTS.json','V8_3_156_BATCH_B_FIRST_RUN_RESULTS.json']:
            p=pathlib.Path(n)
            if p.exists():shutil.copy2(p,st/p.name)
          a=st/'V8_3_156_BATCH_A_FIRST_RUN_RESULTS.json';b=st/'V8_3_156_BATCH_B_FIRST_RUN_RESULTS.json'
          status={'authority':'V8.3.156 SEALED STATUS V1','batch_a_executed':a.exists(),'batch_b_executed':b.exists(),'step_111_executed':False,'production_authorized':False,'prior_v155_failed_batch_reused':False}
          if a.exists():x=json.loads(a.read_text());status.update(batch_a_passed=x['passed'],batch_a_failed=x['failed'])
          if b.exists():x=json.loads(b.read_text());status.update(batch_b_passed=x['passed'],batch_b_failed=x['failed'])
          (st/'V8_3_156_SEALED_STATUS_V1.json').write_text(json.dumps(status,indent=2))
          def sha(p):return hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          (st/'SHA256_MANIFEST.txt').write_text(''.join(f'{sha(p)}  {p.name}\n' for p in sorted(st.iterdir()) if p.is_file()))
          z=pathlib.Path('PSC_V8_3_156_SEALED_VALIDATION_CHECKPOINT_V1.zip')
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED) as q:
            for p in sorted(st.iterdir()):q.write(p,p.name)
          pathlib.Path('PSC_V8_3_156_SEALED_VALIDATION_CHECKPOINT_V1_SHA256.txt').write_text(f'{sha(z)}  {z.name}\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PSC_V8_3_156_SEALED_VALIDATION_CHECKPOINT_V1
          path: |
            PSC_V8_3_156_SEALED_VALIDATION_CHECKPOINT_V1.zip
            PSC_V8_3_156_SEALED_VALIDATION_CHECKPOINT_V1_SHA256.txt
