name: V8.3.171 V1 Transport Preflight
on:
  push:
    branches: [v83171-v1-sealed-validation]
jobs:
  verify:
    if: github.event.head_commit.message == 'Run V8.3.171 V1 transport preflight'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable sealed transport only
        run: |
          python - <<'PY'
          import pathlib,json,hashlib,base64,gzip,zipfile
          p=pathlib.Path('validation/v83171-v1-sealed/V8_3_171_SEALED_TRANSPORT_PACK_V1.json')
          pack=json.loads(p.read_text())
          assert pack['development_authority_commit']=='1f5af9c02387f281b5d6de1266b24ca2b19ea3c1'
          assert pack['fixture_sha256_without_sha_field']=='db282a11dda40b6178156427e90d0070fcd5a575ef7aa99998434e0fb09dda18'
          assert pack['selection_sha256']=='08ab028df228b08fe9f1989dd6756a0596ee48720ca9ec646c5ac9e7e3da91c0'
          assert pack['gold_sha256']=='bda63e245747bf2173971b87252e5c418841f311292af645c82052fe119485c0'
          assert pack['membership_sha256']=='244c9be7dcef27286d59491b8c07451a8e33f730e03da1b02e53a56dbfa3cab0'
          assert pack['runtime_executed_before_transport'] is False
          raw=gzip.decompress(base64.b64decode(pack['fixture_gzip_b64']))
          fixture=json.loads(raw)
          def csha(o):
              x=dict(o);x.pop('sha256_without_sha_field',None)
              return hashlib.sha256(json.dumps(x,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          assert csha(fixture)==pack['fixture_sha256_without_sha_field']
          assert fixture['development_authority_commit']==pack['development_authority_commit']
          assert fixture['selection_sha256']==pack['selection_sha256']
          assert fixture['gold_sha256']==pack['gold_sha256']
          assert fixture['membership_sha256']==pack['membership_sha256']
          assert fixture['sealed_before_execution'] is True and fixture['runtime_execution_before_fixture']==0
          assert fixture['prior_frozen_v170_batch_a_rerun'] is False and fixture['prior_frozen_v170_batch_b_accessed'] is False
          ids=[c['case_id'] for c in fixture['cases']]
          A=fixture['batch_a'];B=fixture['batch_b']
          assert len(ids)==60 and len(set(ids))==60
          assert len(A)==30 and len(B)==30 and set(A).isdisjoint(B) and set(A+B)==set(ids)
          pathlib.Path('V8_3_171_SEALED_EXECUTION_FIXTURE_V1.json').write_bytes(raw)
          evidence={'authority':'V8.3.171 V1 TRANSPORT PREFLIGHT','result':'PASS','run_id':'${{ github.run_id }}','run_attempt':'${{ github.run_attempt }}','head_sha':'${{ github.sha }}','development_authority_commit':pack['development_authority_commit'],'fixture_sha256':csha(fixture),'selection_sha256':pack['selection_sha256'],'gold_sha256':pack['gold_sha256'],'membership_sha256':pack['membership_sha256'],'case_count':60,'batch_a_count':30,'batch_b_count':30,'semantic_runtime_executed':False,'step_111_authorized':False,'production_authorized':False}
          pathlib.Path('V8_3_171_TRANSPORT_PREFLIGHT_RESULT.json').write_text(json.dumps(evidence,indent=2))
          with zipfile.ZipFile('PSC_V8_3_171_V1_TRANSPORT_PREFLIGHT_CHECKPOINT.zip','w',zipfile.ZIP_DEFLATED) as z:
              z.write('V8_3_171_TRANSPORT_PREFLIGHT_RESULT.json')
              z.write('V8_3_171_SEALED_EXECUTION_FIXTURE_V1.json')
          h=hashlib.sha256(pathlib.Path('PSC_V8_3_171_V1_TRANSPORT_PREFLIGHT_CHECKPOINT.zip').read_bytes()).hexdigest()
          pathlib.Path('PSC_V8_3_171_V1_TRANSPORT_PREFLIGHT_CHECKPOINT_SHA256.txt').write_text(h+'  PSC_V8_3_171_V1_TRANSPORT_PREFLIGHT_CHECKPOINT.zip\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: PSC_V8_3_171_V1_TRANSPORT_PREFLIGHT_CHECKPOINT
          path: |
            PSC_V8_3_171_V1_TRANSPORT_PREFLIGHT_CHECKPOINT.zip
            PSC_V8_3_171_V1_TRANSPORT_PREFLIGHT_CHECKPOINT_SHA256.txt
