name: V8.3.179 V2 Transport Probe
on:
  push:
    branches: [v83179-v1-sealed-validation]
permissions:
  actions: read
  contents: write
jobs:
  probe:
    if: github.event.head_commit.message == 'Probe V8.3.179 V2 transport evidence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record exact transport run receipt
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 5e68c4124ba366811a0d1a2ff57164e36c135c9e
        run: |
          python - <<'PY'
          import json,os,urllib.request,pathlib
          repo=os.environ['GITHUB_REPOSITORY'];target=os.environ['TARGET_SHA'];token=os.environ['GH_TOKEN']
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/runs?branch=v83179-v1-sealed-validation&per_page=50',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json'})
          runs=json.load(urllib.request.urlopen(req))['workflow_runs']
          cand=[r for r in runs if r.get('head_sha')==target and r.get('name')=='V8.3.179 V2 Transport Preflight']
          assert cand,'target transport run not found';r=sorted(cand,key=lambda x:x['id'],reverse=True)[0]
          out={'candidate':'V8.3.179','phase':'transport-preflight-v2','target_head_sha':target,'run_id':r['id'],'status':r['status'],'conclusion':r.get('conclusion'),'run_attempt':r.get('run_attempt',1),'semantic_runtime_executed':False,'v178_sealed_rerun':False}
          pathlib.Path('validation/v83179-v1-sealed/V8_3_179_V2_TRANSPORT_RUN_RECEIPT.json').write_text(json.dumps(out,indent=2))
          PY
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/v83179-v1-sealed/V8_3_179_V2_TRANSPORT_RUN_RECEIPT.json
          git commit -m 'Record V8.3.179 V2 transport run receipt'
          git push