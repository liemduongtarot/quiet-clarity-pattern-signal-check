name: V8.3.256 Report Evidence Review V5

on:
  push:
    branches: [v83256-report-evidence-review-v5]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  review-v5:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Record V5 run marker
        run: |
          mkdir -p validation/v83256-report-evidence/v5-run
          printf '{"run_id":"%s","head_sha":"%s","status":"STARTED","sealed_batch_a_rerun":false,"sealed_batch_b_rerun":false}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > validation/v83256-report-evidence/v5-run/STARTED.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/v83256-report-evidence/v5-run/STARTED.json
          git commit -m 'Record V8.3.256 V5 regression start'
          git push origin HEAD:v83256-report-evidence-review-v5

      - name: Materialize exact frozen V8.3.255 deployable authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source base-dist
          gh run download 32671592504 -n PSC_V8_3_255_EXACT_DEPLOYABLE_DIST -D source
          unzip -q source/PSC_V8_3_255_EXACT_DEPLOYABLE_DIST.zip -d base-dist
          test -f base-dist/client/candidate.html

      - name: Build bounded V8.3.256 V5 candidate
        run: |
          python validation/v83256-report-evidence/v83256-build-candidate.py base-dist candidate PSC_V8_3_256_REPORT_EVIDENCE_REVIEW_CANDIDATE_V5.zip
          python validation/v83256-report-evidence/v83256-v3-safety-patch.py candidate/client/candidate.html
          rm -f PSC_V8_3_256_REPORT_EVIDENCE_REVIEW_CANDIDATE_V5.zip PSC_V8_3_256_REPORT_EVIDENCE_REVIEW_CANDIDATE_V5.zip.sha256.txt
          (cd candidate && zip -qr ../PSC_V8_3_256_REPORT_EVIDENCE_REVIEW_CANDIDATE_V5.zip .)
          sha256sum PSC_V8_3_256_REPORT_EVIDENCE_REVIEW_CANDIDATE_V5.zip > PSC_V8_3_256_REPORT_EVIDENCE_REVIEW_CANDIDATE_V5.zip.sha256.txt

      - name: Static authority and scope audit
        run: |
          mkdir -p evidence
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,re
          B=Path('base-dist');C=Path('candidate');sha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          h=(C/'client/candidate.html').read_text(encoding='utf-8');base=(B/'client/candidate.html').read_text(encoding='utf-8')
          m=re.search(r'<script id="psc-v83256-report-evidence-layer">(.*?)</script>',h,re.S);assert m;layer=m.group(1)
          forbidden=['Không đủ để classify','situation/response','liên quan đến fixer','liên quan đến carer','liên quan đến peacekeeper','unknown/insufficient thay vì bị ép vào một family']
          c={'v124_identity':sha(C/'client/psc-v83253-v252-v124-residual.js')=='50f170383bb3f273beb64cbb251029de2c4fd84d256a5be33e2e8c646a87dd96','v5ay_identity':sha(C/'client/qc-evidence-extractor-v5ay-v253-v252-residual.js')=='26bb9d33e5c04b041e72fdf2f435c954415f3f62f731c0e64584d8a8f452174a','ten_required_questions':'CÂU ${i+1}/10' in layer,'cross_scene_object':'cross:null' in layer and 'CROSS=' in layer,'exception_object':'exception:null' in layer and 'EXC=' in layer,'material_impact_object':'impact:null' in layer and 'impactOptions' in layer,'other_response_cannot_force_pattern':"if(e.response==='A10')return'RESPONSE_UNKNOWN'" in layer,'cross_exception_conflict_gate':"if(cross<=1&&exc>=2)return'INSUFFICIENT'" in layer,'active_requires_low_interruptibility':"intr>=2&&trend>=2" in layer,'no_material_state':'NO_MATERIAL_INFLUENCE' in layer,'public_internal_terms_blocked':not any(x in layer for x in forbidden),'facebook_bridge':'https://www.facebook.com/quietclarity.uklondon' in layer,'privacy_line':'Pattern Signal Check không tự động gửi nội dung của bạn sang Quiet Clarity.' in layer,'donation_copy_present':'REPORT NÀY ĐÃ ĐỦ HỮU ÍCH CHO BẠN LÚC NÀY?' in layer,'donation_config_recorded':Path('validation/v83256-report-evidence/V8_3_256_DONATION_DESTINATION_CONFIG_V1.json').exists(),'ui_background_document_bound':'body::before{content:"";position:absolute;inset:0;z-index:-3;' in h and 'body::after{content:"";position:absolute;inset:0;z-index:-2;' in h,'no_new_local_storage':h.count('localStorage')<=base.count('localStorage'),'no_new_session_storage':h.count('sessionStorage')<=base.count('sessionStorage'),'no_new_beacon':h.count('sendBeacon')<=base.count('sendBeacon'),'sealed_a_rerun':False,'sealed_b_rerun':False}
          c['pass']=all(v for v in c.values() if isinstance(v,bool));Path('evidence/V8_3_256_STATIC_SCOPE_AUDIT_V5.json').write_text(json.dumps(c,ensure_ascii=False,indent=2)+'\n');assert c['pass'],c
          PY

      - name: JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('candidate/client/candidate.html').read_text(encoding='utf-8');m=re.search(r'<script id="psc-v83256-report-evidence-layer">(.*?)</script>',h,re.S);assert m;Path('/tmp/v83256-v5.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/v83256-v5.js

      - name: Install Playwright Chromium
        run: |
          cd /tmp
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Full-flow required regression
        run: |
          python3 -m http.server 4173 --directory candidate/client >/tmp/v83256-http.log 2>&1 &
          sleep 2
          node validation/v83256-report-evidence/v83256-v3-browser-regression.cjs

      - name: Report evidence traceability and free-paid firewall
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          h=Path('candidate/client/candidate.html').read_text(encoding='utf-8');s=re.search(r'<script id="psc-v83256-report-evidence-layer">(.*?)</script>',h,re.S).group(1)
          c={'response_from_evidence':'responsePhrase(e)' in s,'repeat_from_rep_cross_exception':'repText(e)' in s,'reinforcement_from_evidence':'reinText(e)' in s,'current_from_recent_influence_interrupt_trend':'currentText(e)' in s,'impact_from_selected_impact':'impactText(e)' in s and 'consequenceText(e)' in s,'uncertainty_explicit':'uncertaintyText(e,st)' in s,'root_cause_out_of_scope':'nguyên nhân gốc đầy đủ' in s and 'không đi vào' in s,'trigger_architecture_out_of_scope':'trigger architecture' in s and 'không đi vào' in s,'intervention_out_of_scope':'kế hoạch can thiệp' in s and 'không đi vào' in s,'outcome_prediction_out_of_scope':'dự đoán kết quả' in s and 'không đi vào' in s}
          c['pass']=all(c.values());Path('evidence/V8_3_256_REPORT_TRACEABILITY_AUDIT_V5.json').write_text(json.dumps(c,ensure_ascii=False,indent=2)+'\n');assert c['pass'],c
          PY

      - name: Produce review checkpoint V5
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          z=Path('PSC_V8_3_256_REPORT_EVIDENCE_REVIEW_CANDIDATE_V5.zip');sha=hashlib.sha256(z.read_bytes()).hexdigest()
          r={'candidate':'V8.3.256 REPORT EVIDENCE REVIEW V5','steps_1_5':'PASS','step_6_implementation':'PASS','step_7_required_regression':'PASS','semantic_baseline':'QCEvidenceExtractorV5AY -> QCSemanticCoreV124','v124_v5ay_identity':'PASS','sealed_batch_a_rerun':False,'sealed_batch_b_rerun':False,'v3_failure_cause':'TRANSPORT ONLY — incorrect nested unzip assumption','donation_destination_config':'OWNER-PROVIDED / RECORDED; LIVE DONATION UI ENABLEMENT HELD FOR NEXT BOUNDED CONFIG PASS','production_promoted':False,'owner_smoke_required':True,'candidate_sha256':sha,'verdict':'PASS — V8.3.256 REVIEW CANDIDATE V5 READY FOR OWNER SMOKE; NO PRODUCTION PROMOTION AUTHORIZED'}
          Path('evidence/V8_3_256_REVIEW_CHECKPOINT_V5.json').write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n');Path('evidence/V8_3_256_CANDIDATE_V5_SHA256.txt').write_text(sha+'  '+z.name+'\n')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PSC_V8_3_256_REPORT_EVIDENCE_REVIEW_V5
          path: |
            evidence/
            PSC_V8_3_256_REPORT_EVIDENCE_REVIEW_CANDIDATE_V5.zip
            PSC_V8_3_256_REPORT_EVIDENCE_REVIEW_CANDIDATE_V5.zip.sha256.txt

      - name: Record immutable PASS evidence
        if: success()
        run: |
          git fetch origin v83256-report-evidence-review-v5
          git rebase origin/v83256-report-evidence-review-v5
          mkdir -p validation/v83256-report-evidence/results-v5
          cp evidence/*.json evidence/*.txt validation/v83256-report-evidence/results-v5/
          git add validation/v83256-report-evidence/results-v5
          git commit -m 'Record V8.3.256 report evidence review PASS V5'
          git push origin HEAD:v83256-report-evidence-review-v5
