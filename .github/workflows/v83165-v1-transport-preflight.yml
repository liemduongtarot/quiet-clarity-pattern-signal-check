name: V8.3.165 V1 Transport Preflight
on:
  push:
    branches: [v83165-v1-sealed-validation]
jobs:
  transport_preflight:
    if: github.event.head_commit.message == 'Run V8.3.165 V1 transport preflight'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and verify immutable V8.3.165 sealed material without runtime
        run: |
          python - <<'PY'
          import pathlib,json,hashlib,base64,gzip
          root=pathlib.Path('validation/v83165-v1-sealed')
          def csha(o):
              x=dict(o); x.pop('sha256_without_sha_field',None)
              return hashlib.sha256(json.dumps(x,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          def mat(parts):
              txt=''.join((root/p).read_text().strip() for p in parts)
              return json.loads(gzip.decompress(base64.b64decode(txt)))
          sel=mat(['V8_3_165_PRESEAL_OWNER_SELECTION_V1.json.gz.b64'])
          gold=mat([f'V8_3_165_INDEPENDENT_GOLD_V1.json.gz.b64.part{i:02d}' for i in range(1,6)])
          mem=mat(['V8_3_165_SEALED_MEMBERSHIP_V1.json.gz.b64'])
          fix=mat([f'V8_3_165_SEALED_EXECUTION_FIXTURE_V1.json.gz.b64.part{i:02d}' for i in range(1,6)])
          assert csha(sel)=='102bb455c95b2e42334c965b3a7d09d1773fccd3d50093fcb2537f1223b3fe5c'
          assert csha(gold)=='e495d5c2546629ffc7fb0f623c0a0b373e21d68085bf65b049c0e11eeea27eac'
          assert csha(mem)=='393960bd88bcef9796cc62c75234c28718b1120ec8c6533a4ec64f58dcda7d96'
          assert csha(fix)=='b47ca6e4535ad2974dead6bd9e4b78f7ed5ef0689db898c97102aa26843b3fbf'
          assert fix['development_authority_commit']=='bc21989f6fe4e2f5cd561c4df1fc5d716e322a67'
          assert len(fix['batch_a'])==30 and len(fix['batch_b'])==30
          assert set(fix['batch_a']).isdisjoint(set(fix['batch_b']))
          assert len(set(fix['batch_a']+fix['batch_b']))==60
          print('TRANSPORT PREFLIGHT PASS runtime=0 A=0 B=0')
          PY
          test -f validation/psc-v83165-v164-v1-sealed-a-bounded-repair.js
      - name: Record transport status artifact
        run: |
          cat > V8_3_165_TRANSPORT_PREFLIGHT_STATUS.json <<EOF
          {"authority":"V8.3.165 V1 TRANSPORT PREFLIGHT","run_id":"${{ github.run_id }}","run_attempt":"${{ github.run_attempt }}","head_sha":"${{ github.sha }}","result":"PASS","runtime_executed":false,"batch_a_executed":false,"batch_b_executed":false,"step_111_authorized":false,"production_authorized":false}
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: PSC_V8_3_165_TRANSPORT_PREFLIGHT
          path: V8_3_165_TRANSPORT_PREFLIGHT_STATUS.json
