name: PSC Workflow Trigger Diagnostic
on:
  push:
    branches: [main]
permissions:
  contents: write
  actions: read
jobs:
  diagnose:
    if: github.event.head_commit.message == 'Diagnose V8.3.216 regression trigger only'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83216-v1-validation
          fetch-depth: 1
      - name: Inspect prior workflow metadata only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess,pathlib
          trigger='bf4aa56c0e6347a661803df67a28e8eb7d094865'
          cmd=['gh','run','list','--repo','liemduongtarot/quiet-clarity-pattern-signal-check','--workflow','v83216-v96-regression.yml','--limit','20','--json','databaseId,headSha,status,conclusion,event,createdAt,updatedAt,displayTitle,workflowName']
          raw=subprocess.check_output(cmd,text=True)
          runs=json.loads(raw)
          matches=[r for r in runs if r.get('headSha')==trigger]
          out={'authority':'V8.3.216 REGRESSION TRIGGER DIAGNOSTIC ONLY','trigger_sha':trigger,'semantic_runtime_executed_by_diagnostic':False,'matches':matches,'match_count':len(matches)}
          pathlib.Path('validation/V8_3_216_REGRESSION_TRIGGER_DIAGNOSTIC.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
      - name: Commit diagnostic metadata only
        run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- validation/V8_3_216_REGRESSION_TRIGGER_DIAGNOSTIC.json
          git diff --cached --quiet || git commit -m 'Record V8.3.216 regression trigger diagnostic'
          git push origin HEAD:v83216-v1-validation
