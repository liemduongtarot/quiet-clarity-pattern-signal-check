name: V8.3.227 DEVELOPMENT checkpoint
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v83227-development-checkpoint.yml
permissions:
  contents: read
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a610a249639cb2a0e5fae5a8f69fed05cc3fe509
          fetch-depth: 0
      - name: Build checkpoint
        shell: bash
        run: |
          # V8.3.227 exact DEVELOPMENT authority checkpoint
          set -euo pipefail
          mkdir V8_3_227_DEVELOPMENT_CHECKPOINT
          cp validation/V8_3_227_DEVELOPMENT_AUTHORITY_V1.json V8_3_227_DEVELOPMENT_CHECKPOINT/
          cp validation/V8_3_227_V104_REGRESSION_RECEIPT.json V8_3_227_DEVELOPMENT_CHECKPOINT/
          cp validation/qc-evidence-extractor-v5ae-v227-residual-witness.js V8_3_227_DEVELOPMENT_CHECKPOINT/
          cp validation/psc-v83227-v226-v104-residual-witness.js V8_3_227_DEVELOPMENT_CHECKPOINT/
          printf '%s\n' 'a610a249639cb2a0e5fae5a8f69fed05cc3fe509' > V8_3_227_DEVELOPMENT_CHECKPOINT/DEVELOPMENT_SHA.txt
          (cd V8_3_227_DEVELOPMENT_CHECKPOINT && sha256sum * > SHA256_MANIFEST.txt)
          zip -r PSC_V8_3_227_DEVELOPMENT_CHECKPOINT.zip V8_3_227_DEVELOPMENT_CHECKPOINT
          sha256sum PSC_V8_3_227_DEVELOPMENT_CHECKPOINT.zip > PSC_V8_3_227_DEVELOPMENT_CHECKPOINT_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PSC_V8_3_227_DEVELOPMENT_CHECKPOINT
          path: |
            PSC_V8_3_227_DEVELOPMENT_CHECKPOINT.zip
            PSC_V8_3_227_DEVELOPMENT_CHECKPOINT_SHA256.txt
          if-no-files-found: error
