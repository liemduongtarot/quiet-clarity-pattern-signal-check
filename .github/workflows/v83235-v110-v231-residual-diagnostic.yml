name: V8.3.235 V110 V231 residual diagnostic
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v83235-v110-v231-residual-diagnostic.yml
permissions:
  contents: write
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83235-v1-validation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run exact residual diagnostic
        id: run
        shell: bash
        run: |
          # actual diagnostic trigger
          set +e
          python validation/v83235-v110-v231-residual-diagnostic.py > /tmp/v235-v231.log 2>&1
          rc=$?
          cat /tmp/v235-v231.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Freeze evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          test ! -f validation/V8_3_235_V110_V231_REGRESSION_FAILURE.json || git add validation/V8_3_235_V110_V231_REGRESSION_FAILURE.json
          test ! -f validation/V8_3_235_V231_A_V110_DIAGNOSTIC_RESULTS.json || git add validation/V8_3_235_V231_A_V110_DIAGNOSTIC_RESULTS.json
          git diff --cached --quiet || git commit -m 'Record V8.3.235 V110 V231 residual diagnostic evidence'
          git push origin HEAD:v83235-v1-validation
      - name: Enforce diagnostic
        shell: bash
        run: test '${{ steps.run.outputs.rc }}' = '0'
