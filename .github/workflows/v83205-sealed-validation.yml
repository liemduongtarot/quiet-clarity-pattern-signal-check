name: V8.3.205 Sealed Validation
on:
  push:
    branches: [v83205-v1-sealed-validation]
jobs:
  sealed_validate:
    if: github.event.head_commit.message == 'Run V8.3.205 sealed validation one-shot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Verify frozen authority and governance
        run: |
          python - <<'PY'
          import json,hashlib,pathlib,base64,gzip,zipfile
          root=pathlib.Path('validation/v83205-v1-sealed')
          fixture=json.loads((root/'V8_3_205_SEALED_FIXTURE_V1.json').read_text())
          sel=json.loads((root/'V8_3_205_SEALED_SELECTION_V1.json').read_text())
          gold=json.loads((root/'V8_3_205_INDEPENDENT_GOLD_V1.json').read_text())
          auth=json.loads((root/'V8_3_205_SEALED_AUTHORITY_V1.json').read_text())
          membership=json.loads((root/'V8_3_205_SEALED_MEMBERSHIP_V1.json').read_text())
          transport=json.loads((root/'V8_3_205_TRANSPORT_METADATA_V1.json').read_text())
          def canon(o):return json.dumps(o,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()
          for k,o in {'fixture':fixture,'selection':sel,'membership':membership,'independent_gold':gold}.items():assert hashlib.sha256(canon(o)).hexdigest()==auth['hashes'][k],k
          assert auth['validated_development_head_sha']=='31660ed0d9ca8de3b63843d4f9d9d94684ce7ad3'
          assert auth['semantic_authority']=='QCSemanticCoreV74'
          assert auth['v204_batch_a_rerun'] is False and auth['v204_batch_b_accessed'] is False
          assert transport['conclusion']=='success' and transport['semantic_runtime_executed'] is False and transport['semantic_authority_loaded'] is False
          assert len(fixture['cases'])==60 and len(sel['batch_a'])==30 and len(sel['batch_b'])==30 and set(sel['batch_a']).isdisjoint(sel['batch_b'])
          assert not (root/'V8_3_205_BATCH_A_FIRST_RUN_RESULTS.json').exists()
          assert not (root/'V8_3_205_BATCH_B_FIRST_RUN_RESULTS.json').exists()
          names=['V8_3_172_V171_V1_FAILURE_REGRESSION','V8_3_172_V171_V1_PREVIOUS_PASS_REGRESSION','V8_3_171_V170_V1_FAILURE_REGRESSION','V8_3_171_V170_V1_PREVIOUS_PASS_REGRESSION','V8_3_169_V168_V1_FAILURE_REGRESSION','V8_3_169_V168_V1_PREVIOUS_PASS_REGRESSION','V8_3_168_V167_V1_FAILURE_REGRESSION','V8_3_168_V167_V1_PREVIOUS_PASS_REGRESSION']
          for n in names:
            p=pathlib.Path('validation/'+n+'.json.gz.b64');pathlib.Path('validation/'+n+'.json').write_bytes(gzip.decompress(base64.b64decode(p.read_text().strip())))
          with zipfile.ZipFile('PSC_V8_3_139_FINAL_LOCAL_READINESS_EXTERNAL_BUILD_PENDING_CHECKPOINT (1).zip') as z:z.extractall('.')
          PY
      - name: Materialize exact V74 sealed runner
        run: |
          python - <<'PY'
          import pathlib
          template=pathlib.Path('validation/run-v83196-full-regression-sweep-v2.cjs').read_text()
          chain="'psc-v83196-v195-v1-hypothetical-preservation-repair.js','psc-v83197-v196-sealed-a-bounded-repair.js','psc-v83198-v197-sealed-a-bounded-repair.js','psc-v83199-v198-sealed-a-bounded-repair.js','psc-v83200-v199-sealed-a-bounded-repair.js','psc-v83201-v200-sealed-a-bounded-repair.js','psc-v83201-v200-v1-preservation-precedence-repair.js','psc-v83202-v201-sealed-a-bounded-repair.js','psc-v83203-v202-sealed-a-bounded-repair.js','psc-v83204-v203-sealed-a-bounded-repair.js','psc-v83205-v204-sealed-a-bounded-repair.js'"
          src=template.replace("'psc-v83196-v195-v1-hypothetical-preservation-repair.js'];",chain+"];")
          marker="const files=fs.readdirSync('validation')";prefix=src.split(marker)[0]
          runner=prefix+"\nif(!s.QCSemanticCoreV74)throw Error('V74 missing');\nconst batch=(process.argv[2]||'A').toUpperCase();const root='validation/v83205-v1-sealed';const F=JSON.parse(fs.readFileSync(root+'/V8_3_205_SEALED_FIXTURE_V1.json','utf8'));const S=JSON.parse(fs.readFileSync(root+'/V8_3_205_SEALED_SELECTION_V1.json','utf8'));const ids=new Set(batch==='A'?S.batch_a:S.batch_b);const cases=F.cases.filter(c=>ids.has(c.case_id));let passed=0;const results=[];for(const c of cases){const r=s.QCSemanticCoreV74.analyze(c.surface,c.domain),a={route:r.input_route.id,families:[...(r.families||[])].sort(),sequence:!!r.sequence},e={route:c.expected.route,families:[...(c.expected.families||[])].sort(),sequence:!!c.expected.sequence},ok=JSON.stringify(a)===JSON.stringify(e);if(ok)passed++;results.push({case_id:c.case_id,category:c.category,pass:ok,expected:e,actual:a,surface:c.surface,domain:c.domain});}const out={authority:'V8.3.205 V1 SEALED BATCH '+batch+' FIRST RUN',run_id:process.env.GITHUB_RUN_ID,run_attempt:process.env.GITHUB_RUN_ATTEMPT,total:cases.length,passed,failed:cases.length-passed,results};fs.writeFileSync('V8_3_205_BATCH_'+batch+'_FIRST_RUN_RESULTS.json',JSON.stringify(out,null,2));console.log('Batch',batch,passed+'/'+cases.length);if(passed!==cases.length)process.exit(1);\n"
          pathlib.Path('validation/v83205-v1-sealed/run-v205-sealed.cjs').write_text(runner)
          PY
      - name: SEALED Batch A first run exactly once
        id: batcha
        continue-on-error: true
        run: node validation/v83205-v1-sealed/run-v205-sealed.cjs A
      - name: SEALED Batch B exactly once only after A PASS
        if: steps.batcha.outcome == 'success'
        id: batchb
        continue-on-error: true
        run: node validation/v83205-v1-sealed/run-v205-sealed.cjs B
      - name: Package immutable sealed checkpoint
        if: always()
        run: |
          python - <<'PY'
          import pathlib,json,zipfile,hashlib,shutil,os
          st=pathlib.Path('V8_3_205_SEALED_CHECKPOINT');st.mkdir(exist_ok=True)
          for n in ['V8_3_205_BATCH_A_FIRST_RUN_RESULTS.json','V8_3_205_BATCH_B_FIRST_RUN_RESULTS.json']:
            p=pathlib.Path(n)
            if p.exists():shutil.copy2(p,st/n)
          root=pathlib.Path('validation/v83205-v1-sealed')
          for n in ['V8_3_205_SEALED_AUTHORITY_V1.json','V8_3_205_SEALED_FIXTURE_V1.json','V8_3_205_INDEPENDENT_GOLD_V1.json','V8_3_205_SEALED_SELECTION_V1.json','V8_3_205_SEALED_MEMBERSHIP_V1.json','V8_3_205_PRESEAL_DIVERSITY_AUDIT_V1.json','V8_3_205_TRANSPORT_METADATA_V1.json']:
            p=root/n
            if p.exists():shutil.copy2(p,st/n)
          A=pathlib.Path('V8_3_205_BATCH_A_FIRST_RUN_RESULTS.json');B=pathlib.Path('V8_3_205_BATCH_B_FIRST_RUN_RESULTS.json');a=json.loads(A.read_text()) if A.exists() else None;b=json.loads(B.read_text()) if B.exists() else None
          status={'candidate':'V8.3.205','run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'head_sha':os.environ['GITHUB_SHA'],'batch_a_executed':a is not None,'batch_a_passed':a['passed'] if a else None,'batch_a_failed':a['failed'] if a else None,'batch_b_executed':b is not None,'batch_b_passed':b['passed'] if b else None,'batch_b_failed':b['failed'] if b else None,'sealed_trigger_repeated':False,'v204_sealed_rerun':False,'step_111_authorized':False,'production_authorized':False};(st/'V8_3_205_SEALED_STATUS.json').write_text(json.dumps(status,indent=2))
          def sha(p):return hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          (st/'SHA256_MANIFEST.txt').write_text(''.join(f'{sha(p)}  {p.name}\n' for p in sorted(st.iterdir()) if p.is_file()));z=pathlib.Path('PSC_V8_3_205_V1_SEALED_VALIDATION_CHECKPOINT.zip')
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED) as q:
            for p in sorted(st.iterdir()):q.write(p,p.name)
          pathlib.Path('PSC_V8_3_205_V1_SEALED_VALIDATION_CHECKPOINT_SHA256.txt').write_text(f'{sha(z)}  {z.name}\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PSC_V8_3_205_V1_SEALED_VALIDATION_CHECKPOINT
          path: |
            PSC_V8_3_205_V1_SEALED_VALIDATION_CHECKPOINT.zip
            PSC_V8_3_205_V1_SEALED_VALIDATION_CHECKPOINT_SHA256.txt
      - name: Record sealed run receipt
        if: always()
        run: |
          python - <<'PY'
          import json,os,pathlib
          A=pathlib.Path('V8_3_205_BATCH_A_FIRST_RUN_RESULTS.json');B=pathlib.Path('V8_3_205_BATCH_B_FIRST_RUN_RESULTS.json');a=json.loads(A.read_text()) if A.exists() else None;b=json.loads(B.read_text()) if B.exists() else None
          success=bool(a and a['failed']==0 and b and b['failed']==0)
          p=pathlib.Path('validation/v83205-v1-sealed/V8_3_205_SEALED_RUN_RECEIPT.json');p.write_text(json.dumps({'candidate':'V8.3.205','phase':'sealed-validation','target_head_sha':os.environ['GITHUB_SHA'],'run_id':int(os.environ['GITHUB_RUN_ID']),'status':'completed','conclusion':'success' if success else 'failure','run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'sealed_trigger_repeated':False,'v204_sealed_rerun':False,'step_111_authorized':False,'production_authorized':False},indent=2))
          PY
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- validation/v83205-v1-sealed/V8_3_205_SEALED_RUN_RECEIPT.json
          git commit -m 'Record V8.3.205 sealed run receipt'
          git push
      - name: Fail workflow unless both batches passed
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib,sys
          A=pathlib.Path('V8_3_205_BATCH_A_FIRST_RUN_RESULTS.json');B=pathlib.Path('V8_3_205_BATCH_B_FIRST_RUN_RESULTS.json');a=json.loads(A.read_text()) if A.exists() else None;b=json.loads(B.read_text()) if B.exists() else None
          if not (a and a['failed']==0 and b and b['failed']==0):sys.exit(1)
          PY
