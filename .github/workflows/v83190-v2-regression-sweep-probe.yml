name: V8.3.190 V2 Regression Sweep Probe
on:
  push:
    branches: [v83190-v1-validation]
permissions:
  actions: read
  contents: write
jobs:
  probe:
    if: github.event.head_commit.message == 'Probe V8.3.190 V2 regression sweep evidence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read exact V2 run
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 838c40fabc563e84a9c912045cbb4f275941b593
        run: |
          python - <<'PY'
          import json,os,urllib.request,pathlib
          repo=os.environ['GITHUB_REPOSITORY'];token=os.environ['GH_TOKEN'];target=os.environ['TARGET_SHA']
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/workflows/v83190-v2-regression-sweep.yml/runs?event=push&per_page=20',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json'})
          data=json.load(urllib.request.urlopen(req));m=[r for r in data.get('workflow_runs',[]) if r.get('head_sha')==target];assert m
          r=m[0];pathlib.Path('validation/V8_3_190_V2_REGRESSION_SWEEP_RECEIPT.json').write_text(json.dumps({'target_head_sha':target,'run_id':r['id'],'status':r['status'],'conclusion':r.get('conclusion')},indent=2))
          PY
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/V8_3_190_V2_REGRESSION_SWEEP_RECEIPT.json
          git commit -m 'Record V8.3.190 V2 regression sweep receipt'
          git push
