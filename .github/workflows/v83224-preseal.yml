name: V8.3.224 PRESEAL
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  preseal:
    if: github.event.head_commit.message == 'Run V8.3.224 PRESEAL'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: v83224-v1-sealed-validation, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run construction-only preseal
        run: python validation/v83224-v1-sealed/v83224-preseal-freeze.py
      - name: Freeze evidence
        run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/v83224-v1-sealed/V8_3_224_*.json
          git diff --cached --quiet || git commit -m 'Record V8.3.224 frozen preseal authority'
          git push origin HEAD:v83224-v1-sealed-validation
      - name: Build checkpoint
        run: |
          python - <<'PY'
          import pathlib,zipfile,hashlib
          root=pathlib.Path('validation/v83224-v1-sealed');files=sorted(root.glob('V8_3_224_*.json'));z=pathlib.Path('PSC_V8_3_224_PRESEAL_CHECKPOINT.zip')
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED) as q:
            for p in files:q.write(p,p.name)
          pathlib.Path('PSC_V8_3_224_PRESEAL_CHECKPOINT_SHA256.txt').write_text(hashlib.sha256(z.read_bytes()).hexdigest()+'  '+z.name+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: PSC_V8_3_224_PRESEAL_CHECKPOINT
          path: |
            PSC_V8_3_224_PRESEAL_CHECKPOINT.zip
            PSC_V8_3_224_PRESEAL_CHECKPOINT_SHA256.txt
