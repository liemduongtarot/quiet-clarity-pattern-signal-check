name: V8.3.172 Run Evidence Probe
on:
  push:
    branches: [v83172-v1-validation]
permissions:
  contents: write
  actions: read
jobs:
  probe:
    if: github.event.head_commit.message == 'Probe V8.3.172 run evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Capture V8.3.172 development run evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_SHA: 5da3511fd7cb7e8cf49f7be9ca0c23b55abc4b1d
        run: |
          python - <<'PY'
          import json, os, time, urllib.request, pathlib
          token=os.environ['GH_TOKEN']; repo=os.environ['REPO']; target=os.environ['TARGET_SHA']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          base=f'https://api.github.com/repos/{repo}'
          selected=None
          for _ in range(30):
              data=get(base+'/actions/workflows/v83172-v1-deep-validation.yml/runs?branch=v83172-v1-validation&event=push&per_page=50')
              matches=[r for r in data.get('workflow_runs',[]) if r.get('head_sha')==target and (r.get('head_commit') or {}).get('message')=='Run V8.3.172 V1 deep validation']
              if not matches: raise SystemExit('Target V8.3.172 run not found')
              selected=sorted(matches,key=lambda r:r['id'],reverse=True)[0]
              if selected.get('status')=='completed':break
              time.sleep(10)
          rid=selected['id']
          jobs=get(base+f'/actions/runs/{rid}/jobs?per_page=100')
          arts=get(base+f'/actions/runs/{rid}/artifacts?per_page=100')
          receipt={
            'candidate':'V8.3.172','target_head_sha':target,'run_id':rid,
            'status':selected.get('status'),'conclusion':selected.get('conclusion'),
            'event':selected.get('event'),'run_attempt':selected.get('run_attempt'),
            'created_at':selected.get('created_at'),'updated_at':selected.get('updated_at'),
            'html_url':selected.get('html_url'),
            'jobs':[{'id':j.get('id'),'name':j.get('name'),'status':j.get('status'),'conclusion':j.get('conclusion'),'steps':[{'name':s.get('name'),'status':s.get('status'),'conclusion':s.get('conclusion'),'number':s.get('number')} for s in j.get('steps',[])]} for j in jobs.get('jobs',[])],
            'artifacts':[{'id':a.get('id'),'name':a.get('name'),'size_in_bytes':a.get('size_in_bytes'),'expired':a.get('expired')} for a in arts.get('artifacts',[])],
            'v171_batch_a_rerun':False,'v171_batch_b_accessed':False,'sealed_validation_executed':False,'step_111_authorized':False,'production_authorized':False
          }
          p=pathlib.Path('validation/V8_3_172_LATEST_DEVELOPMENT_RUN_RECEIPT.json');p.write_text(json.dumps(receipt,indent=2))
          PY
      - name: Publish receipt
        run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/V8_3_172_LATEST_DEVELOPMENT_RUN_RECEIPT.json
          git commit -m 'Record V8.3.172 development run receipt'
          git push origin HEAD:v83172-v1-validation
