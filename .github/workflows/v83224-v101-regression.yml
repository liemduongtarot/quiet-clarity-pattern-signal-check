name: V8.3.224 V101 Bounded Regression
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  regression:
    if: github.event.head_commit.message == 'Run V8.3.224 V101 bounded regression'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83224-v1-validation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Run bounded regression
        id: reg
        continue-on-error: true
        run: python validation/v83224-v101-regression-orchestrator.py
      - name: Freeze evidence
        if: always()
        run: |
          set -euo pipefail
          test -f validation/V8_3_224_V101_REGRESSION_RECEIPT.json
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/V8_3_224_V101_REGRESSION_RECEIPT.json validation/V8_3_224_V223_A_FROZEN_CARRIER.json
          for f in V8_3_224_V223_A_REGRESSION_RESULTS.json; do test ! -f "$f" || { cp "$f" validation/; git add "validation/$f"; }; done
          git diff --cached --quiet || git commit -m 'Record V8.3.224 V101 regression evidence'
          git push origin HEAD:v83224-v1-validation
      - name: Build checkpoint
        if: always()
        run: |
          python - <<'PY'
          import pathlib,zipfile,hashlib
          files=[p for p in [pathlib.Path('validation/V8_3_224_V101_REGRESSION_RECEIPT.json'),pathlib.Path('validation/V8_3_224_V223_A_FROZEN_CARRIER.json'),pathlib.Path('V8_3_224_V223_A_REGRESSION_RESULTS.json')] if p.exists()]
          z=pathlib.Path('PSC_V8_3_224_V101_REGRESSION_CHECKPOINT.zip')
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED) as q:
            for p in files:q.write(p,p.name)
          pathlib.Path('PSC_V8_3_224_V101_REGRESSION_CHECKPOINT_SHA256.txt').write_text(hashlib.sha256(z.read_bytes()).hexdigest()+'  '+z.name+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PSC_V8_3_224_V101_REGRESSION_CHECKPOINT
          if-no-files-found: error
          path: |
            PSC_V8_3_224_V101_REGRESSION_CHECKPOINT.zip
            PSC_V8_3_224_V101_REGRESSION_CHECKPOINT_SHA256.txt
      - name: Enforce
        if: always()
        run: test '${{ steps.reg.outcome }}' = 'success'
