name: V8.3.155 V3 Transport Preflight Observer
on:
  workflow_run:
    workflows: ['V8.3.155 V3 Transport Preflight']
    types: [completed]
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Record preflight evidence
        run: |
          mkdir -p validation
          cat > validation/V8_3_155_V3_TRANSPORT_PREFLIGHT_RUN_EVIDENCE.json <<EOF
          {
            "authority": "V8.3.155 V3 TRANSPORT PREFLIGHT RUN EVIDENCE",
            "run_id": ${{ github.event.workflow_run.id }},
            "run_attempt": ${{ github.event.workflow_run.run_attempt }},
            "conclusion": "${{ github.event.workflow_run.conclusion }}",
            "head_sha": "${{ github.event.workflow_run.head_sha }}",
            "head_branch": "${{ github.event.workflow_run.head_branch }}",
            "runtime_executed": false,
            "batch_a_executed": false,
            "batch_b_executed": false,
            "step_111_authorized": false,
            "production_authorized": false
          }
          EOF
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add validation/V8_3_155_V3_TRANSPORT_PREFLIGHT_RUN_EVIDENCE.json
          git commit -m 'Record V8.3.155 V3 transport preflight evidence' || exit 0
          git push origin main
