3173-v172-v1-sealed-a-bounded-repair.js','psc-v83174-v173-v1-sealed-a-bounded-repair.js','psc-v83175-v174-v1-sealed-a-bounded-repair.js','psc-v83176-v175-bank-contract-carry-forward.js','psc-v83177-v176-sealed-a-bounded-repair.js','psc-v83178-v177-sealed-a-bounded-repair.js','psc-v83179-v178-sealed-a-bounded-repair.js','psc-v83180-v179-sealed-a-bounded-repair.js','psc-v83181-v180-sealed-a-bounded-repair.js'];for(const f of files)vm.runInContext(fs.readFileSync('public/'+f,'utf8'),s);if(!s.QCSemanticCoreV50)throw Error('V50 missing');
          const dir='../validation',paths=fs.readdirSync(dir).filter(x=>/REGRESSION\.json$/.test(x));let total=0;
          for(const name of paths){const o=JSON.parse(fs.readFileSync(path.join(dir,name),'utf8'));if(!Array.isArray(o.cases))continue;for(const c of o.cases){const r=s.QCSemanticCoreV50.analyze(c.surface,c.domain),a={route:r.input_route.id,families:[...r.families].sort(),sequence:!!r.sequence},e={route:c.expected.route,families:[...(c.expected.families||[])].sort(),sequence:!!c.expected.sequence};if(JSON.stringify(a)!==JSON.stringify(e))throw Error(name+' '+c.case_id+' '+JSON.stringify({a,e}));total++;}}
