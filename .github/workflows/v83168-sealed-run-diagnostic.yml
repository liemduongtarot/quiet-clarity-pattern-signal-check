name: V8.3.168 Sealed Run Diagnostic
on:
  push:
    branches: [main]
permissions:
  contents: write
  actions: read
jobs:
  diagnose:
    if: github.event.head_commit.message == 'Run V8.3.168 sealed run diagnostic'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query sealed trigger run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,urllib.request,os,pathlib
          sha='20cc4673216e16af8af00fe9e820954f87d66a54'
          req=urllib.request.Request(f'https://api.github.com/repos/${{ github.repository }}/actions/runs?head_sha={sha}&per_page=20',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req) as r:data=json.load(r)
          runs=[{'id':x['id'],'name':x['name'],'status':x['status'],'conclusion':x['conclusion'],'head_branch':x['head_branch'],'head_sha':x['head_sha'],'run_attempt':x['run_attempt']} for x in data['workflow_runs']]
          out={'authority':'V8.3.168 SEALED RUN DIAGNOSTIC','target_head_sha':sha,'total_count':len(runs),'runs':runs,'diagnostic_runtime_executed':False,'step_111_authorized':False,'production_authorized':False}
          pathlib.Path('validation/V8_3_168_SEALED_RUN_DIAGNOSTIC.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - name: Persist diagnostic
        run: |
          git config user.name liemduongtarot
          git config user.email liemduongtarot@gmail.com
          git add validation/V8_3_168_SEALED_RUN_DIAGNOSTIC.json
          git commit -m 'Record V8.3.168 sealed run diagnostic' || true
          git push
