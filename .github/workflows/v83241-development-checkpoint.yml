name: V8.3.241 DEVELOPMENT checkpoint
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v83241-development-checkpoint.yml
permissions:
  contents: read
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c9da21d4507ff8727d58af13cd931dcc2a442faa
          fetch-depth: 0
      - name: Build checkpoint
        run: |
          set -euo pipefail
          mkdir V8_3_241_DEVELOPMENT_CHECKPOINT
          cp validation/V8_3_241_DEVELOPMENT_AUTHORITY_V1.json V8_3_241_DEVELOPMENT_CHECKPOINT/
          cp validation/V8_3_241_V115_REGRESSION_RECEIPT.json V8_3_241_DEVELOPMENT_CHECKPOINT/
          cp validation/qc-evidence-extractor-v5ap-v241-v240-residuals.js V8_3_241_DEVELOPMENT_CHECKPOINT/
          cp validation/psc-v83241-v240-v115-residuals.js V8_3_241_DEVELOPMENT_CHECKPOINT/
          printf '%s\n' 'c9da21d4507ff8727d58af13cd931dcc2a442faa' > V8_3_241_DEVELOPMENT_CHECKPOINT/DEVELOPMENT_SHA.txt
          (cd V8_3_241_DEVELOPMENT_CHECKPOINT && sha256sum * > SHA256_MANIFEST.txt)
          zip -r PSC_V8_3_241_DEVELOPMENT_CHECKPOINT.zip V8_3_241_DEVELOPMENT_CHECKPOINT
          sha256sum PSC_V8_3_241_DEVELOPMENT_CHECKPOINT.zip > PSC_V8_3_241_DEVELOPMENT_CHECKPOINT_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PSC_V8_3_241_DEVELOPMENT_CHECKPOINT
          path: |
            PSC_V8_3_241_DEVELOPMENT_CHECKPOINT.zip
            PSC_V8_3_241_DEVELOPMENT_CHECKPOINT_SHA256.txt
          if-no-files-found: error
