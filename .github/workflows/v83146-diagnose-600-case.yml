name: V8.3.146 Diagnose 600 Case
on:
  push:
    branches: [v83146-validation]
jobs:
  diagnose:
    if: github.event.head_commit.message == 'Diagnose V8.3.146 600 ignore case 257 source'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract parent test authority only
        run: |
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('PSC_V8_3_139_FINAL_LOCAL_READINESS_EXTERNAL_BUILD_PENDING_CHECKPOINT (1).zip') as z:z.extractall('.')
          PY
      - name: Print exact 600-case source lines 1-170
        working-directory: PSC_V8_3_138_DEV
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('tests/v83139-600-real-case-regression.test.cjs').read_text().splitlines()
          for i,line in enumerate(s[:170],1): print(f'{i:04d}: {line}')
          PY
