name: V8.3.176 V1 Sealed Validation
on:
  push:
    branches: [v83176-v1-sealed-validation]
jobs:
  sealed_validate:
    if: github.event.head_commit.message == 'Run V8.3.176 V1 sealed validation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Verify frozen bank and materialize exact V8.3.176 authority
        run: |
          python - <<'PY'
          import pathlib,json,hashlib,base64,gzip,zipfile
          pack=json.loads(pathlib.Path('validation/v83176-v1-sealed/V8_3_176_SEALED_TRANSPORT_PACK_V1.json').read_text());rules=json.loads(pathlib.Path('validation/V8_3_176_SEALED_BANK_CONTRACT_RULES.json').read_text())
          assert pack['development_authority_commit']=='8c995bd8eacf522e7b722ba477cff3228bc3cc2f'
          assert pack['fixture_sha256']=='4b2cf06ee7807e544c46f785b867ea7e1334cd5141f80462bccf7c1d6a57bf11'
          assert pack['selection_sha256']=='57fd1b9808d270449f79a4864c917a75df0ef3db766d2454996f36cc84b38d42'
          assert pack['gold_sha256']=='8f7c7a0fd09bf2edfcaa7907f12f4c59653bbc3956090c9f5151fcf085e721ae'
          assert pack['membership_sha256']=='90745781a8ae66aefd15ce79675fbea479a2bbf6b85896ef0895ad11df550b8e'
          assert pack['semantic_runtime_executed_before_transport'] is False and pack['v175_sealed_rerun'] is False
          objs={n:json.loads(gzip.decompress(base64.b64decode(b64))) for n,b64 in pack['compressed_files'].items()}
          def canon(o):return json.dumps(o,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()
          mapping={'fixture_sha256':'V8_3_176_SEALED_EXECUTION_FIXTURE_V1.json','selection_sha256':'V8_3_176_OWNER_SELECTION_V1.json','gold_sha256':'V8_3_176_INDEPENDENT_GOLD_V1.json','membership_sha256':'V8_3_176_SEALED_MEMBERSHIP_V1.json'}
          for k,n in mapping.items():assert hashlib.sha256(canon(objs[n])).hexdigest()==pack[k]
          f=objs['V8_3_176_SEALED_EXECUTION_FIXTURE_V1.json'];allowed=set(rules['allowed_route_values']);forbidden=set(rules['forbidden_conceptual_route_values'])
          assert len(f['cases'])==60 and len(f['batch_a'])==30 and len(f['batch_b'])==30 and set(f['batch_a']).isdisjoint(f['batch_b'])
          for c in f['cases']:
            assert c['expected']['route'] in allowed and c['expected']['route'] not in forbidden
            assert all(x in {'freeze','slow','ignore'} for x in c['expected'].get('families',[]))
          pathlib.Path('V8_3_176_SEALED_EXECUTION_FIXTURE_V1.json').write_text(json.dumps(f,ensure_ascii=False,indent=2))
          pathlib.Path('V8_3_176_SEALED_MEMBERSHIP_V1.json').write_text(json.dumps(objs['V8_3_176_SEALED_MEMBERSHIP_V1.json'],ensure_ascii=False,indent=2))
          with zipfile.ZipFile('PSC_V8_3_139_FINAL_LOCAL_READINESS_EXTERNAL_BUILD_PENDING_CHECKPOINT (1).zip') as z:z.extractall('.')
          PY
          for f in psc-v83142-sealed-failure-convergence.js psc-v83143-semantic-convergence.js psc-v83144-sealed-failure-convergence.js psc-v83145-route-layer.js psc-v83145-family-state-layer.js psc-v83146-route-boundary-repair.js psc-v83146-family-sequence-repair.js psc-v83147-sealed-failure-repair.js psc-v83148-sealed-failure-repair.js psc-v83149-sealed-failure-repair.js psc-v83150-sealed-failure-repair.js psc-v83151-sealed-failure-repair.js psc-v83152-sealed-failure-repair.js psc-v83153-sealed-failure-repair.js psc-v83154-sealed-failure-repair.js psc-v83155-sealed-failure-repair.js psc-v83156-v155-v3-bounded-repair.js psc-v83157-v156-sealed-a-bounded-repair.js psc-v83158-v157-sealed-a-bounded-repair.js psc-v83159-v158-sealed-a-bounded-repair.js psc-v83160-v159-v2-sealed-a-bounded-repair.js psc-v83161-v160-v1-sealed-a-bounded-repair.js psc-v83162-v161-v1-sealed-a-bounded-repair.js psc-v83163-v162-v1-sealed-a-bounded-repair.js psc-v83164-v163-v1-sealed-a-bounded-repair.js psc-v83165-v164-v1-sealed-a-bounded-repair.js psc-v83166-v165-v1-sealed-a-bounded-repair.js psc-v83167-v166-v1-sealed-a-bounded-repair.js psc-v83168-v167-v1-sealed-a-bounded-repair.js psc-v83169-v168-v1-sealed-a-bounded-repair.js psc-v83170-v169-v1-sealed-a-bounded-repair.js psc-v83171-v170-v1-sealed-a-bounded-repair.js psc-v83172-v171-v1-sealed-a-bounded-repair.js psc-v83173-v172-v1-sealed-a-bounded-repair.js psc-v83174-v173-v1-sealed-a-bounded-repair.js psc-v83175-v174-v1-sealed-a-bounded-repair.js psc-v83176-v175-bank-contract-carry-forward.js; do cp validation/$f PSC_V8_3_138_DEV/public/; done
      - name: SEALED Batch A first run exactly once
        working-directory: PSC_V8_3_138_DEV
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),s={};vm.createContext(s);const files=["psc-v3.js","psc-v4.js","psc-v83121-r1-reconstructed.js","psc-v83122-operator-aware.js","psc-v83123-family-preservation.js","psc-v83124-operator-context.js","psc-v83125-semantic-routing.js","psc-v83126-public-route-canonicalization.js","psc-v83127-review-intent-authority.js","psc-v83129-canonical-shadow.js","psc-v83130-representation-coverage.js","psc-v83131-proposition-consolidation.js","psc-v83132-relation-graph.js","psc-v83133-canonical-role-binding.js","psc-v83135-scoped-operator.js","psc-v83138-semantic-convergence.js","psc-v83139-semantic-convergence.js","psc-v83142-sealed-failure-convergence.js","psc-v83143-semantic-convergence.js","psc-v83144-sealed-failure-convergence.js","psc-v83145-route-layer.js","psc-v83145-family-state-layer.js","psc-v83146-route-boundary-repair.js","psc-v83146-family-sequence-repair.js","psc-v83147-sealed-failure-repair.js","psc-v83148-sealed-failure-repair.js","psc-v83149-sealed-failure-repair.js","psc-v83150-sealed-failure-repair.js","psc-v83151-sealed-failure-repair.js","psc-v83152-sealed-failure-repair.js","psc-v83153-sealed-failure-repair.js","psc-v83154-sealed-failure-repair.js","psc-v83155-sealed-failure-repair.js","psc-v83156-v155-v3-bounded-repair.js","psc-v83157-v156-sealed-a-bounded-repair.js","psc-v83158-v157-sealed-a-bounded-repair.js","psc-v83159-v158-sealed-a-bounded-repair.js","psc-v83160-v159-v2-sealed-a-bounded-repair.js","psc-v83161-v160-v1-sealed-a-bounded-repair.js","psc-v83162-v161-v1-sealed-a-bounded-repair.js","psc-v83163-v162-v1-sealed-a-bounded-repair.js","psc-v83164-v163-v1-sealed-a-bounded-repair.js","psc-v83165-v164-v1-sealed-a-bounded-repair.js","psc-v83166-v165-v1-sealed-a-bounded-repair.js","psc-v83167-v166-v1-sealed-a-bounded-repair.js","psc-v83168-v167-v1-sealed-a-bounded-repair.js","psc-v83169-v168-v1-sealed-a-bounded-repair.js","psc-v83170-v169-v1-sealed-a-bounded-repair.js","psc-v83171-v170-v1-sealed-a-bounded-repair.js","psc-v83172-v171-v1-sealed-a-bounded-repair.js","psc-v83173-v172-v1-sealed-a-bounded-repair.js","psc-v83174-v173-v1-sealed-a-bounded-repair.js","psc-v83175-v174-v1-sealed-a-bounded-repair.js","psc-v83176-v175-bank-contract-carry-forward.js"];for(const f of files)vm.runInContext(fs.readFileSync('public/'+f,'utf8'),s);if(!s.QCSemanticCoreV45)throw Error('V45 missing');const F=JSON.parse(fs.readFileSync('../V8_3_176_SEALED_EXECUTION_FIXTURE_V1.json')),ids=new Set(F.batch_a),cases=F.cases.filter(c=>ids.has(c.case_id));let passed=0;const results=[];for(const c of cases){const r=s.QCSemanticCoreV45.analyze(c.surface,c.domain),a={route:r.input_route.id,families:[...r.families].sort(),sequence:!!r.sequence},e={route:c.expected.route,families:[...(c.expected.families||[])].sort(),sequence:!!c.expected.sequence},ok=JSON.stringify(a)===JSON.stringify(e);if(ok)passed++;results.push({case_id:c.case_id,pass:ok,expected:e,actual:a,surface:c.surface,domain:c.domain,language:c.language});}fs.writeFileSync('../V8_3_176_BATCH_A_FIRST_RUN_RESULTS.json',JSON.stringify({authority:'V8.3.176 V1 SEALED BATCH A FIRST RUN',run_id:process.env.GITHUB_RUN_ID,run_attempt:process.env.GITHUB_RUN_ATTEMPT,total:cases.length,passed,failed:cases.length-passed,results},null,2));console.log('Batch A',passed+'/'+cases.length);if(passed!==cases.length)process.exit(1);
