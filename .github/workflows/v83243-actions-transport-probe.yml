name: V8.3.245 construction-only PRESEAL instrumented
# trigger-v245-preseal-instrumented-1
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v83243-actions-transport-probe.yml
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83245-v1-sealed-validation
          fetch-depth: 0
      - name: Persist PRESEAL start marker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation/v83245-v1-sealed
          printf '{"candidate":"V8.3.245","phase":"preseal-start","run_id":"%s","semantic_runtime_executed":false,"semantic_authority_loaded":false,"batch_a_executed":false,"batch_b_executed":false}\n' "$GITHUB_RUN_ID" > validation/v83245-v1-sealed/V8_3_245_PRESEAL_START.json
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/v83245-v1-sealed/V8_3_245_PRESEAL_START.json
          git commit -m 'Record V8.3.245 PRESEAL start'
          git push origin HEAD:v83245-v1-sealed-validation
      - name: Run exact construction-only PRESEAL
        id: run
        shell: bash
        run: |
          set +e
          python validation/v83245-v1-sealed/v83245-preseal-freeze.py > /tmp/v245-preseal.log 2>&1
          rc=$?
          set -e
          cat /tmp/v245-preseal.log
          RC="$rc" python - <<'PY'
          import json,os,pathlib
          text=pathlib.Path('/tmp/v245-preseal.log').read_text(errors='replace')
          o=pathlib.Path('validation/v83245-v1-sealed')
          (o/'V8_3_245_PRESEAL_DIAGNOSTIC.json').write_text(json.dumps({'candidate':'V8.3.245','phase':'preseal-diagnostic','run_id':os.environ['GITHUB_RUN_ID'],'rc':int(os.environ['RC']),'log_tail':text[-24000:],'semantic_runtime_executed':False,'semantic_authority_loaded':False,'batch_a_executed':False,'batch_b_executed':False,'expected_gold_changed':False},indent=2)+'\n')
          PY
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - name: Freeze PRESEAL evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/v83245-v1-sealed/V8_3_245_PRESEAL_DIAGNOSTIC.json
          for f in validation/v83245-v1-sealed/V8_3_245_PRESEAL_RUN_RECEIPT.json validation/v83245-v1-sealed/V8_3_245_PRESEAL_CANDIDATE_BANK_V1.json validation/v83245-v1-sealed/V8_3_245_SEALED_SELECTION_V1.json validation/v83245-v1-sealed/V8_3_245_SEALED_FIXTURE_V1.json validation/v83245-v1-sealed/V8_3_245_INDEPENDENT_GOLD_V1.json validation/v83245-v1-sealed/V8_3_245_SEALED_MEMBERSHIP_V1.json validation/v83245-v1-sealed/V8_3_245_PRESEAL_DIVERSITY_AUDIT_V1.json validation/v83245-v1-sealed/V8_3_245_SEALED_AUTHORITY_V1.json; do test ! -f "$f" || git add "$f"; done
          git diff --cached --quiet || git commit -m 'Freeze V8.3.245 PRESEAL evidence'
          git push origin HEAD:v83245-v1-sealed-validation
      - name: Enforce PRESEAL outcome
        run: test '${{ steps.run.outputs.rc }}' = '0'
