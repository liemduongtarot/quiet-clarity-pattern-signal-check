name: V8.3.250 Batch B preflight
# trigger-v250-b-preflight-1
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v83243-actions-transport-probe.yml
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83250-v1-sealed-validation
          fetch-depth: 0
      - name: Run Batch B preflight
        shell: bash
        run: |
          set -euo pipefail
          python validation/v83250-v1-sealed/v83250-batch-b-preflight.py
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/v83250-v1-sealed/V8_3_250_BATCH_B_PREFLIGHT_V1.json
          git commit -m 'Freeze V8.3.250 Batch B preflight'
          git push origin HEAD:v83250-v1-sealed-validation
