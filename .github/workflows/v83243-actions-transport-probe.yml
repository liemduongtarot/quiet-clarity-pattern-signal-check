name: V8.3.255 construction-only PRESEAL R2
# trigger-v255-preseal-r2-density
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v83243-actions-transport-probe.yml
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83255-v1-sealed-validation
          fetch-depth: 0
      - name: Persist PRESEAL R2 start
        run: |
          set -euo pipefail
          printf '{"candidate":"V8.3.255","phase":"preseal-r2-start","run_id":"%s","semantic_runtime_executed":false,"batch_a_executed":false,"batch_b_executed":false}\n' "$GITHUB_RUN_ID" > validation/v83255-v1-sealed/V8_3_255_PRESEAL_R2_START.json
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/v83255-v1-sealed/V8_3_255_PRESEAL_R2_START.json
          git commit -m 'Record V8.3.255 PRESEAL R2 start'
          git push origin HEAD:v83255-v1-sealed-validation
      - name: Run construction-only PRESEAL R2
        id: run
        shell: bash
        run: |
          set +e
          python validation/v83255-v1-sealed/v83255-preseal-r2.py > /tmp/v255-preseal-r2.log 2>&1
          rc=$?
          set -e
          cat /tmp/v255-preseal-r2.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - name: Freeze PRESEAL R2 evidence
        if: always()
        run: |
          set -euo pipefail
          RC='${{ steps.run.outputs.rc }}' python - <<'PY'
          import json,os,pathlib
          o=pathlib.Path('validation/v83255-v1-sealed');log=pathlib.Path('/tmp/v255-preseal-r2.log').read_text(errors='replace') if pathlib.Path('/tmp/v255-preseal-r2.log').exists() else ''
          (o/'V8_3_255_PRESEAL_R2_DIAGNOSTIC.json').write_text(json.dumps({'candidate':'V8.3.255','phase':'preseal-r2-diagnostic','run_id':os.environ['GITHUB_RUN_ID'],'rc':int(os.environ.get('RC') or 1),'log_tail':log[-30000:],'semantic_runtime_executed':False,'batch_a_executed':False,'batch_b_executed':False,'expected_gold_changed':False},indent=2)+'\n')
          PY
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/v83255-v1-sealed
          git diff --cached --quiet || git commit -m 'Freeze V8.3.255 PRESEAL R2 evidence'
          git push origin HEAD:v83255-v1-sealed-validation
      - name: Enforce PRESEAL R2
        run: test '${{ steps.run.outputs.rc }}' = '0'
