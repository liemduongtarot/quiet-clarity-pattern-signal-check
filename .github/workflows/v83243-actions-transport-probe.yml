name: V8.3.243 Actions Transport Probe
# trigger-probe-3-preseal-metrics
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v83243-actions-transport-probe.yml
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83243-v1-sealed-validation
          fetch-depth: 0
      - name: Run construction-only PRESEAL metric diagnostic
        id: run
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src=Path('validation/v83243-v1-sealed/v83243-preseal-freeze.py').read_text()
          needle="assert internal[0]<.75 and external[0]<.75 and high==0 and exact==0 and fpdup==0"
          inject="print('PRESEAL_METRICS', {'internal':internal,'external':external,'high':high,'exact':exact,'fpdup':fpdup}, flush=True)\n"+needle
          if needle not in src:
              raise SystemExit('assertion needle missing')
          Path('/tmp/v83243-preseal-metric-diagnostic.py').write_text(src.replace(needle,inject,1))
          PY
          set +e
          python /tmp/v83243-preseal-metric-diagnostic.py > /tmp/v243-preseal-metrics.log 2>&1
          rc=$?
          set -e
          cat /tmp/v243-preseal-metrics.log
          mkdir -p validation/v83243-v1-sealed
          cp /tmp/v243-preseal-metrics.log validation/v83243-v1-sealed/V8_3_243_PRESEAL_METRIC_DIAGNOSTIC.log
          printf '{"candidate":"V8.3.243","probe":"preseal-metric-diagnostic","run_id":"%s","rc":%s,"semantic_runtime_executed":false,"gold_changed":false}\n' "$GITHUB_RUN_ID" "$rc" > validation/v83243-v1-sealed/V8_3_243_PRESEAL_METRIC_DIAGNOSTIC.json
      - name: Freeze metric diagnostic evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/v83243-v1-sealed/V8_3_243_PRESEAL_METRIC_DIAGNOSTIC.log validation/v83243-v1-sealed/V8_3_243_PRESEAL_METRIC_DIAGNOSTIC.json
          git diff --cached --quiet || git commit -m 'Record V8.3.243 PRESEAL metric diagnostic'
          git push origin HEAD:v83243-v1-sealed-validation
