name: V8.3.250 PRESEAL metric diagnostic
# trigger-v250-preseal-metrics-1
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v83243-actions-transport-probe.yml
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83250-v1-sealed-validation
          fetch-depth: 0
      - name: Persist metric diagnostic start
        shell: bash
        run: |
          set -euo pipefail
          printf '{"candidate":"V8.3.250","phase":"preseal-metric-diagnostic-start","run_id":"%s","semantic_runtime_executed":false,"batch_a_executed":false,"batch_b_executed":false}\n' "$GITHUB_RUN_ID" > validation/v83250-v1-sealed/V8_3_250_PRESEAL_METRIC_START.json
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/v83250-v1-sealed/V8_3_250_PRESEAL_METRIC_START.json
          git commit -m 'Record V8.3.250 PRESEAL metric diagnostic start'
          git push origin HEAD:v83250-v1-sealed-validation
      - name: Print construction metrics without semantic runtime
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin v83249-v1-sealed-validation:refs/remotes/origin/v83249-v1-sealed-validation
          git fetch origin v83248-v1-sealed-validation:refs/remotes/origin/v83248-v1-sealed-validation
          python - <<'PY' > /tmp/v250-metrics.log 2>&1 || true
          from pathlib import Path
          code=Path('validation/v83250-v1-sealed/v83250-preseal-freeze.py').read_text()
          needle="exec(compile(src,'v83250-preseal-adapted.py','exec'))"
          repl="src=src.replace(\"assert internal[0]<.75 and external[0]<.75 and high==0 and exact==0 and fpdup==0\",\"print('PRESEAL_METRICS',{'internal':internal,'external':external,'high':high,'exact':exact,'fpdup':fpdup}); raise SystemExit(0)\",1); exec(compile(src,'v83250-preseal-adapted.py','exec'))"
          if needle not in code: raise SystemExit('final exec anchor missing')
          code=code.replace(needle,repl,1)
          exec(compile(code,'v250-metric-wrapper.py','exec'))
          PY
          cat /tmp/v250-metrics.log
          cp /tmp/v250-metrics.log validation/v83250-v1-sealed/V8_3_250_PRESEAL_METRIC_DIAGNOSTIC.log
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/v83250-v1-sealed/V8_3_250_PRESEAL_METRIC_DIAGNOSTIC.log
          git commit -m 'Record V8.3.250 PRESEAL metric diagnostic'
          git push origin HEAD:v83250-v1-sealed-validation
