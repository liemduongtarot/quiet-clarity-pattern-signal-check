name: V8.3.248 PRESEAL metric diagnostic
# trigger-v248-preseal-metrics-1
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v83243-actions-transport-probe.yml
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83248-v1-sealed-validation
          fetch-depth: 0
      - name: Persist metric start
        shell: bash
        run: |
          set -euo pipefail
          printf '{"candidate":"V8.3.248","phase":"preseal-metric-start","run_id":"%s","semantic_runtime_executed":false,"batch_a_executed":false,"batch_b_executed":false}\n' "$GITHUB_RUN_ID" > validation/v83248-v1-sealed/V8_3_248_PRESEAL_METRIC_START.json
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/v83248-v1-sealed/V8_3_248_PRESEAL_METRIC_START.json
          git commit -m 'Record V8.3.248 PRESEAL metric start'
          git push origin HEAD:v83248-v1-sealed-validation
      - name: Run metric diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin v83247-v1-sealed-validation:refs/remotes/origin/v83247-v1-sealed-validation
          git fetch origin v83246-v1-sealed-validation:refs/remotes/origin/v83246-v1-sealed-validation
          python - <<'PY' > /tmp/v248-metrics.log 2>&1 || true
          from pathlib import Path
          wrapper=Path('validation/v83248-v1-sealed/v83248-preseal-freeze.py').read_text()
          needle="exec(compile(code,'v83248-preseal-wrapper.py','exec'))"
          inner="code=code.replace(\"exec(compile(src,'v83247-preseal-adapted.py','exec'))\",\"src=src.replace('assert internal[0]<.75 and external[0]<.75 and high==0 and exact==0 and fpdup==0',\\\"print('PRESEAL_METRICS',{'internal':internal,'external':external,'high':high,'exact':exact,'fpdup':fpdup}); raise SystemExit(0)\\\",1); exec(compile(src,'v83247-preseal-adapted.py','exec'))\",1); exec(compile(code,'v83248-preseal-wrapper.py','exec'))"
          if needle not in wrapper: raise SystemExit('outer exec anchor missing')
          wrapper=wrapper.replace(needle,inner,1)
          exec(compile(wrapper,'v248-metric-outer.py','exec'))
          PY
          cat /tmp/v248-metrics.log
          cp /tmp/v248-metrics.log validation/v83248-v1-sealed/V8_3_248_PRESEAL_METRIC_DIAGNOSTIC.log
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/v83248-v1-sealed/V8_3_248_PRESEAL_METRIC_DIAGNOSTIC.log
          git commit -m 'Record V8.3.248 PRESEAL metric diagnostic'
          git push origin HEAD:v83248-v1-sealed-validation
