name: V8.3.255 PRESEAL metric diagnostic
# trigger-v255-preseal-metrics-1
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v83243-actions-transport-probe.yml
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83255-v1-sealed-validation
          fetch-depth: 0
      - name: Calculate PRESEAL metrics without semantics
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/v255-metrics.log 2>&1
          from pathlib import Path
          code=Path('validation/v83255-v1-sealed/v83255-preseal-freeze.py').read_text()
          needle="assert internal[0]<.75 and external[0]<.75 and not high and not exact and not fpdup"
          repl="print('V255_PRESEAL_METRICS',{'internal':internal,'external':external,'high_count':len(high),'high_top':sorted(high,key=lambda x:x['similarity'],reverse=True)[:10],'exact':exact,'fpdup':fpdup}); raise SystemExit(0)"
          assert needle in code
          exec(compile(code.replace(needle,repl,1),'v255-preseal-metric.py','exec'))
          PY
          cat /tmp/v255-metrics.log
          cp /tmp/v255-metrics.log validation/v83255-v1-sealed/V8_3_255_PRESEAL_METRIC_DIAGNOSTIC.log
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/v83255-v1-sealed/V8_3_255_PRESEAL_METRIC_DIAGNOSTIC.log
          git commit -m 'Record V8.3.255 PRESEAL metric diagnostic'
          git push origin HEAD:v83255-v1-sealed-validation
