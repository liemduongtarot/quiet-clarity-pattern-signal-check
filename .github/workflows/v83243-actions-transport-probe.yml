name: V8.3.243 Actions Transport Probe
# trigger-probe-4-preseal-highpairs
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v83243-actions-transport-probe.yml
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83243-v1-sealed-validation
          fetch-depth: 0
      - name: Run construction-only PRESEAL high-pair diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src=Path('validation/v83243-v1-sealed/v83243-preseal-freeze.py').read_text()
          src=src.replace("if q>=.75:high+=1", "if q>=.75:\n   high+=1\n   print('HIGHPAIR',round(q,9),x['case_id'],y.get('case_id'),flush=True)", 1)
          needle="assert internal[0]<.75 and external[0]<.75 and high==0 and exact==0 and fpdup==0"
          src=src.replace(needle,"print('PRESEAL_METRICS', {'internal':internal,'external':external,'high':high,'exact':exact,'fpdup':fpdup}, flush=True)\n"+needle,1)
          Path('/tmp/v83243-preseal-highpair-diagnostic.py').write_text(src)
          PY
          set +e
          python /tmp/v83243-preseal-highpair-diagnostic.py > /tmp/v243-preseal-highpairs.log 2>&1
          rc=$?
          set -e
          cat /tmp/v243-preseal-highpairs.log
          mkdir -p validation/v83243-v1-sealed
          cp /tmp/v243-preseal-highpairs.log validation/v83243-v1-sealed/V8_3_243_PRESEAL_HIGHPAIR_DIAGNOSTIC.log
          printf '{"candidate":"V8.3.243","probe":"preseal-highpair-diagnostic","run_id":"%s","rc":%s,"semantic_runtime_executed":false,"gold_changed":false}\n' "$GITHUB_RUN_ID" "$rc" > validation/v83243-v1-sealed/V8_3_243_PRESEAL_HIGHPAIR_DIAGNOSTIC.json
      - name: Freeze high-pair diagnostic evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/v83243-v1-sealed/V8_3_243_PRESEAL_HIGHPAIR_DIAGNOSTIC.log validation/v83243-v1-sealed/V8_3_243_PRESEAL_HIGHPAIR_DIAGNOSTIC.json
          git diff --cached --quiet || git commit -m 'Record V8.3.243 PRESEAL high-pair diagnostic'
          git push origin HEAD:v83243-v1-sealed-validation
