name: V8.3.254 provenance runner materialization
# trigger-v254-runner-materialization-1
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v83243-actions-transport-probe.yml
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83254-v1-sealed-validation
          fetch-depth: 0
      - name: Persist materialization start
        shell: bash
        run: |
          set -euo pipefail
          printf '{"candidate":"V8.3.254","phase":"provenance-runner-materialization-start","run_id":"%s","semantic_runtime_executed":false,"batch_a_executed":false,"batch_b_executed":false}\n' "$GITHUB_RUN_ID" > validation/v83254-v1-sealed/V8_3_254_RUNNER_MATERIALIZATION_START.json
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/v83254-v1-sealed/V8_3_254_RUNNER_MATERIALIZATION_START.json
          git commit -m 'Record V8.3.254 provenance runner materialization start'
          git push origin HEAD:v83254-v1-sealed-validation
      - name: Materialize provenance-enabled A runner and audit manifests
        id: run
        shell: bash
        run: |
          set +e
          git fetch origin v83253-v1-sealed-validation:refs/remotes/origin/v83253-v1-sealed-validation
          python validation/v83254-v1-sealed/v83254-runner-build.py > /tmp/v254-runner.log 2>&1
          rc=$?
          if [ "$rc" = 0 ]; then python - <<'PY' >> /tmp/v254-runner.log 2>&1
          import json,hashlib,pathlib,re,subprocess,shutil
          V=pathlib.Path('validation');O=V/'v83254-v1-sealed';DEV='238cdba6ee2d4d17bcde19de2d895a7087983345';SEM='QCEvidenceExtractorV5AY -> QCSemanticCoreV124'
          def hb(b):return hashlib.sha256(b).hexdigest()
          def fsha(p):return hb(pathlib.Path(p).read_bytes())
          def show(path):return subprocess.check_output(['git','show',f'{DEV}:{path}'])
          runner=V/'v83254-batch-a-self-contained.py';text=runner.read_text()
          names=[]
          for pat in [r"['\"](qc-evidence-extractor-[^'\"]+\.js)['\"]",r"['\"](psc-v83[^'\"]+\.js)['\"]"]:
              names += re.findall(pat,text)
          names=list(dict.fromkeys(names));sources=[]
          for n in names:
              p='validation/'+n
              if pathlib.Path(p).exists():
                  cur=pathlib.Path(p).read_bytes();dev=show(p);sources.append({'path':p,'sha256':hb(cur),'byte_identical_to_frozen_development':hb(cur)==hb(dev)})
          assert sources and all(x['byte_identical_to_frozen_development'] for x in sources)
          ident={'candidate':'V8.3.254','phase':'semantic-source-identity','validated_development_head_sha':DEV,'semantic_authority':SEM,'loaded_semantic_source_count':len(sources),'sources':sources,'all_byte_identical_to_frozen_development':True,'semantic_change':False,'pass':True}
          (O/'V8_3_254_SEMANTIC_SOURCE_IDENTITY_REPORT_V1.json').write_text(json.dumps(ident,indent=2)+'\n')
          contract=V/'V8_3_254_EVIDENCE_PROVENANCE_CONTRACT_V1.json';shutil.copy2(contract,O/'V8_3_254_EVIDENCE_PROVENANCE_CONTRACT_COPY_V1.json')
          for n in ['V8_3_254_HARNESS_POSITIVE_TEST_V1.json','V8_3_254_HARNESS_NEGATIVE_MISSING_FIELD_TEST_V1.json','V8_3_254_HARNESS_MUTATION_DETECTION_TEST_V1.json']:
              shutil.copy2(V/n,O/n)
          auth=json.loads((O/'V8_3_254_SEALED_AUTHORITY_V1.json').read_text());mat=json.loads((O/'V8_3_254_RUNNER_MATERIALIZATION_V1.json').read_text())
          manifest={'candidate':'V8.3.254','phase':'runtime-config-schema-manifest','validated_development_head_sha':DEV,'semantic_authority':SEM,'node_major':24,'runner_sha256':mat['runner_sha256'],'evidence_contract_raw_sha256':fsha(contract),'evidence_module_raw_sha256':fsha(V/'v83254-evidence-provenance.py'),'sealed_object_hashes':auth['hashes'],'semantic_source_identity_report_sha256':fsha(O/'V8_3_254_SEMANTIC_SOURCE_IDENTITY_REPORT_V1.json'),'semantic_change':False,'expected_gold_changed':False,'pass':True}
          (O/'V8_3_254_RUNTIME_CONFIG_SCHEMA_MANIFEST_V1.json').write_text(json.dumps(manifest,indent=2)+'\n')
          limits={'candidate':'V8.3.254','phase':'known-limitations','items':['Case executed_at_utc is captured immediately before the semantic analyze call for that case.','canonical_state_trace_ref points to the immutable batch result record for the same case; it is an evidence reference, not a hidden chain-of-thought trace.','Evidence instrumentation records and hashes runtime observations but does not alter semantic route/family/sequence decisions.','Production remains unauthorized until a fresh explicit Step 111 owner review passes.'],'production_authorized':False}
          (O/'V8_3_254_KNOWN_LIMITATIONS_V1.json').write_text(json.dumps(limits,indent=2)+'\n')
          print(json.dumps({'source_identity_count':len(sources),'runner_sha256':mat['runner_sha256'],'pass':True}))
          PY
          rc=$?; fi
          set -e
          cat /tmp/v254-runner.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - name: Freeze materialization evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RC='${{ steps.run.outputs.rc }}' python - <<'PY'
          import json,os,pathlib
          o=pathlib.Path('validation/v83254-v1-sealed');log=pathlib.Path('/tmp/v254-runner.log').read_text(errors='replace') if pathlib.Path('/tmp/v254-runner.log').exists() else ''
          (o/'V8_3_254_RUNNER_MATERIALIZATION_DIAGNOSTIC.json').write_text(json.dumps({'candidate':'V8.3.254','phase':'provenance-runner-materialization-diagnostic','run_id':os.environ['GITHUB_RUN_ID'],'rc':int(os.environ.get('RC') or 1),'log_tail':log[-30000:],'semantic_runtime_executed':False,'batch_a_executed':False,'batch_b_executed':False},indent=2)+'\n')
          PY
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/v83254-v1-sealed/V8_3_254_RUNNER_MATERIALIZATION_START.json validation/v83254-v1-sealed/V8_3_254_RUNNER_MATERIALIZATION_DIAGNOSTIC.json
          for f in validation/v83254-batch-a-self-contained.py validation/v83254-v1-sealed/V8_3_254_RUNNER_MATERIALIZATION_V1.json validation/v83254-v1-sealed/V8_3_254_EVIDENCE_PROVENANCE_CONTRACT_COPY_V1.json validation/v83254-v1-sealed/V8_3_254_SEMANTIC_SOURCE_IDENTITY_REPORT_V1.json validation/v83254-v1-sealed/V8_3_254_RUNTIME_CONFIG_SCHEMA_MANIFEST_V1.json validation/v83254-v1-sealed/V8_3_254_KNOWN_LIMITATIONS_V1.json validation/v83254-v1-sealed/V8_3_254_HARNESS_POSITIVE_TEST_V1.json validation/v83254-v1-sealed/V8_3_254_HARNESS_NEGATIVE_MISSING_FIELD_TEST_V1.json validation/v83254-v1-sealed/V8_3_254_HARNESS_MUTATION_DETECTION_TEST_V1.json; do test ! -f "$f" || git add "$f"; done
          git diff --cached --quiet || git commit -m 'Freeze V8.3.254 provenance runner and audit manifests'
          git push origin HEAD:v83254-v1-sealed-validation
      - name: Enforce materialization
        run: test '${{ steps.run.outputs.rc }}' = '0'
