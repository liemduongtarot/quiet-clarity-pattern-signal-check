name: V8.3.245 Actions transport probe
# trigger-v245-actions-transport-probe
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v83243-actions-transport-probe.yml
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83245-v1-validation
          fetch-depth: 0
      - name: Write V245 transport-only marker
        shell: bash
        run: |
          set -euo pipefail
          printf '{"candidate":"V8.3.245","phase":"actions-transport-probe","run_id":"%s","semantic_runtime_executed":false,"sealed_validation_executed":false,"expected_gold_changed":false}\n' "$GITHUB_RUN_ID" > validation/V8_3_245_ACTIONS_TRANSPORT_PROBE.json
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/V8_3_245_ACTIONS_TRANSPORT_PROBE.json
          git commit -m 'Record V8.3.245 Actions transport probe'
          git push origin HEAD:v83245-v1-validation
