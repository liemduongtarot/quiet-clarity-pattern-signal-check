          git fetch origin v83251-v1-sealed-validation:refs/remotes/origin/v83251-v1-sealed-validation
          python - <<'PY'
          from pathlib import Path
          import subprocess,hashlib,json
          src=subprocess.check_output(['git','show','origin/v83251-v1-sealed-validation:validation/v83251-batch-a-self-contained.py'],text=True)
          repls=[
