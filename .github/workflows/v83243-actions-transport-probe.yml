name: V8.3.254 DEVELOPMENT evidence regression
# trigger-v254-development-evidence-1
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v83243-actions-transport-probe.yml
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83254-v1-validation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Persist V254 DEVELOPMENT evidence start
        shell: bash
        run: |
          set -euo pipefail
          printf '{"candidate":"V8.3.254","phase":"development-evidence-regression-start","run_id":"%s","semantic_runtime_executed":false,"sealed_validation_executed":false,"v253_sealed_rerun":false}\n' "$GITHUB_RUN_ID" > validation/V8_3_254_DEVELOPMENT_EVIDENCE_START.json
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/V8_3_254_DEVELOPMENT_EVIDENCE_START.json
          git commit -m 'Record V8.3.254 DEVELOPMENT evidence regression start'
          git push origin HEAD:v83254-v1-validation
      - name: Run evidence and semantic regression
        id: run
        shell: bash
        run: |
          set +e
          python validation/v83254-development-evidence-regression.py > /tmp/v254-dev.log 2>&1
          rc=$?
          set -e
          cat /tmp/v254-dev.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - name: Freeze V254 DEVELOPMENT evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RC='${{ steps.run.outputs.rc }}' python - <<'PY'
          import json,os,pathlib
          V=pathlib.Path('validation');log=pathlib.Path('/tmp/v254-dev.log').read_text(errors='replace') if pathlib.Path('/tmp/v254-dev.log').exists() else ''
          (V/'V8_3_254_DEVELOPMENT_EVIDENCE_DIAGNOSTIC.json').write_text(json.dumps({'candidate':'V8.3.254','phase':'development-evidence-regression-diagnostic','run_id':os.environ['GITHUB_RUN_ID'],'rc':int(os.environ.get('RC') or 1),'log_tail':log[-50000:],'sealed_validation_executed':False,'v253_sealed_rerun':False,'step_111_authorized':False},indent=2)+'\n')
          PY
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/V8_3_254_DEVELOPMENT_EVIDENCE_START.json validation/V8_3_254_DEVELOPMENT_EVIDENCE_DIAGNOSTIC.json
          for f in validation/V8_3_254_HARNESS_POSITIVE_TEST_V1.json validation/V8_3_254_HARNESS_NEGATIVE_MISSING_FIELD_TEST_V1.json validation/V8_3_254_HARNESS_MUTATION_DETECTION_TEST_V1.json validation/V8_3_254_DEVELOPMENT_EVIDENCE_REGRESSION_RECEIPT_V1.json; do test ! -f "$f" || git add "$f"; done
          git diff --cached --quiet || git commit -m 'Freeze V8.3.254 DEVELOPMENT evidence regression'
          git push origin HEAD:v83254-v1-validation
      - name: Enforce DEVELOPMENT evidence gate
        run: test '${{ steps.run.outputs.rc }}' = '0'
