name: V8.3.249 V248 residual DEVELOPMENT diagnostic
# trigger-v249-v248-residual-diagnostic-4-runtime-materialized
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v83243-actions-transport-probe.yml
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83249-v1-validation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Persist residual diagnostic start
        shell: bash
        run: |
          set -euo pipefail
          printf '{"candidate":"V8.3.249","phase":"v248-residual-diagnostic-runtime","run_id":"%s","sealed_validation_executed":false,"expected_gold_changed":false}\n' "$GITHUB_RUN_ID" > validation/V8_3_249_V248_RESIDUAL_DIAGNOSTIC_START.json
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/V8_3_249_V248_RESIDUAL_DIAGNOSTIC_START.json
          git commit -m 'Record V8.3.249 residual diagnostic runtime start'
          git push origin HEAD:v83249-v1-validation
      - name: Run and capture V248 residual diagnostic
        shell: bash
        run: |
          set +e
          python validation/v83249-v120-v248-residual-diagnostic.py > /tmp/v249-v248.log 2>&1
          rc=$?
          set -e
          cat /tmp/v249-v248.log
          RC="$rc" python - <<'PY'
          import json,os,pathlib
          text=pathlib.Path('/tmp/v249-v248.log').read_text(errors='replace')
          pathlib.Path('validation/V8_3_249_V248_RESIDUAL_DIAGNOSTIC_CAPTURE.json').write_text(json.dumps({'candidate':'V8.3.249','run_id':os.environ['GITHUB_RUN_ID'],'rc':int(os.environ['RC']),'log':text[-30000:],'sealed_validation_executed':False,'expected_gold_changed':False},indent=2)+'\n')
          PY
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/V8_3_249_V248_RESIDUAL_DIAGNOSTIC_CAPTURE.json
          test ! -f validation/V8_3_249_V248_RESIDUAL_DIAGNOSTIC_RESULTS.json || git add validation/V8_3_249_V248_RESIDUAL_DIAGNOSTIC_RESULTS.json
          git diff --cached --quiet || git commit -m 'Capture V8.3.249 V248 residual diagnostic'
          git push origin HEAD:v83249-v1-validation
          exit 0
