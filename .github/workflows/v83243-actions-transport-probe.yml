name: V8.3.255 live production verification R2
# trigger-v255-live-verification-r2
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v83243-actions-transport-probe.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83255-v1-deployment
          fetch-depth: 0
      - name: Verify canonical production against frozen semantic sources
        id: verify
        shell: bash
        run: |
          set +e
          python - <<'PY' > /tmp/v255-live-r2.log 2>&1
          import urllib.request,hashlib,json,pathlib,time,os
          BASE='https://quiet-clarity-pattern-signal-check.vercel.app'
          V=pathlib.Path('validation')
          def fsha(p):return hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          def get(path):
            req=urllib.request.Request(BASE+path,headers={'User-Agent':'PSC-V8.3.255-live-verifier'})
            with urllib.request.urlopen(req,timeout=30) as r:return r.status,r.read()
          source_v124=V/'psc-v83253-v252-v124-residual.js'
          source_v5ay=V/'qc-evidence-extractor-v5ay-v253-v252-residual.js'
          assert source_v124.exists() and source_v5ay.exists()
          expected_v124=fsha(source_v124);expected_v5ay=fsha(source_v5ay)
          root=None;st=None
          for _ in range(20):
            try:
              st,root=get('/')
              if st==200:break
            except Exception:time.sleep(3)
          assert st==200 and root is not None
          assert b'Pattern Signal Check' in root
          assert b'QCSemanticCoreV124' in root
          assert b'qc-evidence-extractor-v5ay-v253-v252-residual.js' in root
          assert b'psc-v83253-v252-v124-residual.js' in root
          st2,v124=get('/psc-v83253-v252-v124-residual.js');assert st2==200
          st3,v5ay=get('/qc-evidence-extractor-v5ay-v253-v252-residual.js');assert st3==200
          live_v124=hashlib.sha256(v124).hexdigest();live_v5ay=hashlib.sha256(v5ay).hexdigest()
          assert live_v124==expected_v124,(live_v124,expected_v124)
          assert live_v5ay==expected_v5ay,(live_v5ay,expected_v5ay)
          lock=json.loads((V/'v83255-v1-sealed/V8_3_255_PRODUCTION_LOCK_V1.json').read_text())
          diag=json.loads((V/'V8_3_255_PRODUCTION_DEPLOYMENT_DIAGNOSTIC.json').read_text())
          assert lock['production_locked'] is True
          assert lock['semantic_authority']=='QCEvidenceExtractorV5AY -> QCSemanticCoreV124'
          assert diag['production_deployed'] is True
          out={
            'candidate':'V8.3.255','phase':'live-production-verification-r2',
            'run_id':os.environ['GITHUB_RUN_ID'],
            'canonical_url':BASE,
            'deployment_url':diag['deployment_url'],
            'root_http_status':st,
            'root_contains_pattern_signal_check':True,
            'root_contains_v124_alias':True,
            'root_contains_v5ay_source':True,
            'root_contains_v124_source':True,
            'v124_source_sha256':expected_v124,
            'v124_live_sha256':live_v124,
            'v124_byte_identical':True,
            'v5ay_source_sha256':expected_v5ay,
            'v5ay_live_sha256':live_v5ay,
            'v5ay_byte_identical':True,
            'semantic_authority':'QCEvidenceExtractorV5AY -> QCSemanticCoreV124',
            'prior_verifier_failure_cause':'incorrect hardcoded V124 SHA256 in verification runner; deployment content was not changed',
            'redeploy_executed':False,
            'semantic_change':False,'expected_gold_changed':False,
            'batch_a_rerun':False,'batch_b_rerun':False,
            'production_deployed':True,'pass':True
          }
          (V/'V8_3_255_LIVE_PRODUCTION_VERIFICATION_R2_V1.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out))
          PY
          rc=$?
          set -e
          cat /tmp/v255-live-r2.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - name: Freeze R2 live verification evidence
        if: always()
        shell: bash
        env:
          RC: ${{ steps.verify.outputs.rc }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,os
          log=pathlib.Path('/tmp/v255-live-r2.log').read_text(errors='replace') if pathlib.Path('/tmp/v255-live-r2.log').exists() else ''
          d={'candidate':'V8.3.255','phase':'live-production-verification-r2-diagnostic','run_id':os.environ['GITHUB_RUN_ID'],'rc':int(os.environ.get('RC') or 1),'log_tail':log[-30000:],'redeploy_executed':False,'semantic_change':False,'expected_gold_changed':False,'batch_a_rerun':False,'batch_b_rerun':False}
          pathlib.Path('validation/V8_3_255_LIVE_PRODUCTION_VERIFICATION_R2_DIAGNOSTIC.json').write_text(json.dumps(d,indent=2)+'\n')
          PY
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/V8_3_255_LIVE_PRODUCTION_VERIFICATION_R2_DIAGNOSTIC.json
          test ! -f validation/V8_3_255_LIVE_PRODUCTION_VERIFICATION_R2_V1.json || git add validation/V8_3_255_LIVE_PRODUCTION_VERIFICATION_R2_V1.json
          git commit -m 'Freeze V8.3.255 live production verification R2'
          git push origin HEAD:v83255-v1-deployment
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PSC_V8_3_255_LIVE_PRODUCTION_VERIFICATION_R2
          path: |
            validation/V8_3_255_LIVE_PRODUCTION_VERIFICATION_R2_V1.json
            validation/V8_3_255_LIVE_PRODUCTION_VERIFICATION_R2_DIAGNOSTIC.json
          if-no-files-found: warn
      - name: Enforce R2 verification
        run: test '${{ steps.verify.outputs.rc }}' = '0'
