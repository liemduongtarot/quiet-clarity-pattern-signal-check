name: V8.3.249 V248 residual fail extraction
# trigger-v249-v248-fail-only-1
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v83243-actions-transport-probe.yml
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83249-v1-validation
          fetch-depth: 0
      - name: Extract only remaining V248 regression failure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('validation/V8_3_249_V248_RESIDUAL_DIAGNOSTIC_RESULTS.json')
          r=json.loads(p.read_text());fails=[x for x in r['results'] if not x['pass']]
          assert r['total']==30 and r['passed']==29 and r['failed']==1 and len(fails)==1
          pathlib.Path('validation/V8_3_249_V248_RESIDUAL_FAIL_ONLY.json').write_text(json.dumps({'candidate':'V8.3.249','total':30,'passed':29,'failed':1,'failure':fails[0],'sealed_validation_executed':False,'expected_gold_changed':False},ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/V8_3_249_V248_RESIDUAL_FAIL_ONLY.json
          git commit -m 'Extract V8.3.249 remaining V248 residual failure'
          git push origin HEAD:v83249-v1-validation
