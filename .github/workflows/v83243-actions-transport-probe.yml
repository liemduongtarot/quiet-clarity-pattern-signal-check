name: V8.3.246 V119 DEVELOPMENT regression instrumented
# trigger-v246-v119-development-1
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v83243-actions-transport-probe.yml
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83246-v1-validation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Persist DEVELOPMENT regression start marker
        shell: bash
        run: |
          set -euo pipefail
          printf '{"candidate":"V8.3.246","phase":"v119-development-regression-start","run_id":"%s","semantic_runtime_executed":false,"sealed_validation_executed":false,"expected_gold_changed":false}\n' "$GITHUB_RUN_ID" > validation/V8_3_246_V119_REGRESSION_START.json
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/V8_3_246_V119_REGRESSION_START.json
          git commit -m 'Record V8.3.246 V119 DEVELOPMENT regression start'
          git push origin HEAD:v83246-v1-validation
      - name: Run V119 full DEVELOPMENT regression
        id: run
        shell: bash
        run: |
          set +e
          python validation/v83246-v119-regression-orchestrator.py > /tmp/v246.log 2>&1
          rc=$?
          set -e
          cat /tmp/v246.log
          RC="$rc" python - <<'PY'
          import json,os,pathlib
          text=pathlib.Path('/tmp/v246.log').read_text(errors='replace')
          pathlib.Path('validation/V8_3_246_V119_REGRESSION_DIAGNOSTIC.json').write_text(json.dumps({'candidate':'V8.3.246','phase':'v119-development-regression-diagnostic','run_id':os.environ['GITHUB_RUN_ID'],'outcome':'success' if os.environ['RC']=='0' else 'failure','exit_code':os.environ['RC'],'log_tail':text[-66000:],'sealed_validation_executed':False,'v245_sealed_rerun':False,'expected_gold_changed':False,'step_111_authorized':False,'production_authorized':False},indent=2)+'\n')
          PY
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - name: Freeze V246 DEVELOPMENT regression evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/V8_3_246_V119_REGRESSION_START.json validation/V8_3_246_V119_REGRESSION_DIAGNOSTIC.json
          test ! -f validation/V8_3_246_V119_REGRESSION_RECEIPT.json || git add validation/V8_3_246_V119_REGRESSION_RECEIPT.json
          for f in validation/V8_3_246_V*_A_FROZEN_CARRIER.json; do test ! -f "$f" || git add "$f"; done
          git diff --cached --quiet || git commit -m 'Record V8.3.246 V119 DEVELOPMENT regression evidence'
          git push origin HEAD:v83246-v1-validation
      - name: Enforce DEVELOPMENT regression outcome
        run: test '${{ steps.run.outputs.rc }}' = '0'
