            ('validation/v83251-v1-sealed-runtime','validation/v83252-v1-sealed-runtime'),('run-v83251-batch-a.cjs','run-v83252-batch-a.cjs'),
            ("'candidate':'V8.3.251'","'candidate':'V8.3.252'"),("authority:'V8.3.251 V1 SEALED BATCH A FIRST RUN'","authority:'V8.3.252 V1 SEALED BATCH A FIRST RUN'"),
            ("console.log('V251 A'","console.log('V252 A'"),('v251_batch_a_rerun','v252_batch_a_rerun'),('v250_sealed_rerun','v251_sealed_rerun')]
          for a,b in repls: src=src.replace(a,b)
          src=src.replace("assert pf['exact_v5aw_path']=='validation/qc-evidence-extractor-v5aw-v251-v250-b-residuals.js' and pf['exact_v122_path']=='validation/psc-v83251-v250-v122-b-residuals.js'","assert pf['exact_v5ax_path']=='validation/qc-evidence-extractor-v5ax-v252-v251-residuals.js' and pf['exact_v123_path']=='validation/psc-v83252-v251-v123-residuals.js'",1)
