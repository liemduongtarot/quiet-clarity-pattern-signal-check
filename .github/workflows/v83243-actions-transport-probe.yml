name: V8.3.250 frozen Batch B semantic autopsy
# trigger-v250-b-autopsy-1
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v83243-actions-transport-probe.yml
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83250-v1-sealed-validation
          fetch-depth: 0
      - name: Build immutable Batch B autopsy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,collections
          o=pathlib.Path('validation/v83250-v1-sealed')
          r=json.loads((o/'V8_3_250_BATCH_B_RESULT_V1.json').read_text());s=json.loads((o/'V8_3_250_BATCH_B_STATUS_V1.json').read_text())
          assert r['total']==30 and r['passed']==27 and r['failed']==3
          assert s['semantic_runtime_executed'] is True and s['semantic_failure'] is True
          fails=[x for x in r['results'] if not x['pass']];assert len(fails)==3
          cats=collections.Counter();groups=collections.Counter();details=[]
          for x in fails:
            e=x['expected'];a=x['actual'];cats[x['category']]+=1
            k=(x['category'],e['route'],a['route'],tuple(e['families']),tuple(a['families']),bool(e['sequence']),bool(a['sequence']))
            groups[k]+=1
            details.append({'case_id':x['case_id'],'category':x['category'],'language':x['language'],'domain':x['domain'],'expected':e,'actual':a,'surface':x['surface']})
          grouped=[{'category':k[0],'expected_route':k[1],'actual_route':k[2],'expected_families':list(k[3]),'actual_families':list(k[4]),'expected_sequence':k[5],'actual_sequence':k[6],'count':v} for k,v in groups.items()]
          out={'candidate':'V8.3.250','phase':'frozen-batch-b-semantic-autopsy','run_id':r['run_id'],'validated_development_head_sha':'514cbcb34fbe336033c8f8858a53415371137973','semantic_authority':'QCEvidenceExtractorV5AV -> QCSemanticCoreV121','batch_a_passed':30,'batch_b_total':30,'batch_b_passed':27,'batch_b_failed':3,'v250_batch_b_rerun':False,'semantic_runtime_executed':True,'semantic_failure':True,'failure_counts_by_category':dict(cats),'mechanism_groups':grouped,'failures':details,'expected_gold_changed':False,'step_111_authorized':False,'production_authorized':False,'conclusion':'frozen-semantic-failure'}
          (o/'V8_3_250_BATCH_B_FROZEN_AUTOPSY_V1.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'cats':dict(cats),'groups':grouped,'ids':[x['case_id'] for x in details]},ensure_ascii=False))
          PY
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/v83250-v1-sealed/V8_3_250_BATCH_B_FROZEN_AUTOPSY_V1.json
          git commit -m 'Freeze V8.3.250 Batch B semantic autopsy'
          git push origin HEAD:v83250-v1-sealed-validation
