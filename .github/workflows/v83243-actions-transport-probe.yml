name: V8.3.244 transport/static preflight via proven transport
# trigger-v244-preflight-1
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v83243-actions-transport-probe.yml
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83244-v1-sealed-validation
          fetch-depth: 0
      - name: Run V8.3.244 transport/static preflight
        id: run
        shell: bash
        run: |
          set +e
          python validation/v83244-v1-sealed/v83244-transport-preflight.py > /tmp/v244-preflight.log 2>&1
          rc=$?
          set -e
          cat /tmp/v244-preflight.log
          cp /tmp/v244-preflight.log validation/v83244-v1-sealed/V8_3_244_TRANSPORT_PREFLIGHT_DIAGNOSTIC.log
          printf '{"candidate":"V8.3.244","phase":"transport-static-preflight","run_id":"%s","rc":%s,"semantic_runtime_executed":false,"batch_a_executed":false,"batch_b_executed":false}\n' "$GITHUB_RUN_ID" "$rc" > validation/v83244-v1-sealed/V8_3_244_TRANSPORT_PREFLIGHT_DIAGNOSTIC.json
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - name: Freeze preflight evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/v83244-v1-sealed/V8_3_244_TRANSPORT_PREFLIGHT_DIAGNOSTIC.log validation/v83244-v1-sealed/V8_3_244_TRANSPORT_PREFLIGHT_DIAGNOSTIC.json
          test ! -f validation/v83244-v1-sealed/V8_3_244_TRANSPORT_VERIFICATION_V1.json || git add validation/v83244-v1-sealed/V8_3_244_TRANSPORT_VERIFICATION_V1.json
          test ! -f validation/v83244-v1-sealed/V8_3_244_STATIC_SEALED_PREFLIGHT_V1.json || git add validation/v83244-v1-sealed/V8_3_244_STATIC_SEALED_PREFLIGHT_V1.json
          git diff --cached --quiet || git commit -m 'Freeze V8.3.244 transport/static preflight evidence'
          git push origin HEAD:v83244-v1-sealed-validation
      - name: Enforce preflight outcome
        run: test '${{ steps.run.outputs.rc }}' = '0'
