name: V8.3.246 PRESEAL diversity diagnostic
# trigger-v246-preseal-metrics-1
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v83243-actions-transport-probe.yml
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83246-v1-sealed-validation
          fetch-depth: 0
      - name: Run temporary construction metric diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin v83245-v1-sealed-validation:refs/remotes/origin/v83245-v1-sealed-validation
          python - <<'PY'
          from pathlib import Path
          p=Path('validation/v83246-v1-sealed/v83246-preseal-freeze.py')
          w=p.read_text()
          old="compile(src,'v83246-preseal-adapted.py','exec')\nexec(compile(src,'v83246-preseal-adapted.py','exec'))"
          new="src=src.replace(\"assert internal[0]<.75 and external[0]<.75 and high==0 and exact==0 and fpdup==0\",\"print('PRESEAL_METRICS', {'internal':internal,'external':external,'high':high,'exact':exact,'fpdup':fpdup}, flush=True)\\nassert internal[0]<.75 and external[0]<.75 and high==0 and exact==0 and fpdup==0\",1)\ncompile(src,'v83246-preseal-adapted.py','exec')\nexec(compile(src,'v83246-preseal-adapted.py','exec'))"
          if old not in w: raise SystemExit('wrapper anchor missing')
          Path('/tmp/v246-preseal-diagnostic-wrapper.py').write_text(w.replace(old,new,1))
          PY
          set +e
          python /tmp/v246-preseal-diagnostic-wrapper.py > /tmp/v246-preseal-metrics.log 2>&1
          rc=$?
          set -e
          cat /tmp/v246-preseal-metrics.log
          cp /tmp/v246-preseal-metrics.log validation/v83246-v1-sealed/V8_3_246_PRESEAL_METRIC_DIAGNOSTIC.log
          printf '{"candidate":"V8.3.246","phase":"preseal-metric-diagnostic","run_id":"%s","rc":%s,"semantic_runtime_executed":false,"semantic_authority_loaded":false,"batch_a_executed":false,"batch_b_executed":false,"expected_gold_changed":false}\n' "$GITHUB_RUN_ID" "$rc" > validation/v83246-v1-sealed/V8_3_246_PRESEAL_METRIC_DIAGNOSTIC.json
      - name: Freeze diagnostic evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/v83246-v1-sealed/V8_3_246_PRESEAL_METRIC_DIAGNOSTIC.log validation/v83246-v1-sealed/V8_3_246_PRESEAL_METRIC_DIAGNOSTIC.json
          git commit -m 'Record V8.3.246 PRESEAL diversity diagnostic'
          git push origin HEAD:v83246-v1-sealed-validation
