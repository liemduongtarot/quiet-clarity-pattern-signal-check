name: V8.3.244 PRESEAL via proven Actions transport
# trigger-v244-preseal-1
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v83243-actions-transport-probe.yml
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83244-v1-sealed-validation
          fetch-depth: 0
      - name: Run V8.3.244 construction-only PRESEAL
        id: run
        shell: bash
        run: |
          set +e
          python validation/v83244-v1-sealed/v83244-preseal-freeze.py > /tmp/v244-preseal.log 2>&1
          rc=$?
          set -e
          cat /tmp/v244-preseal.log
          cp /tmp/v244-preseal.log validation/v83244-v1-sealed/V8_3_244_PRESEAL_DIAGNOSTIC.log
          printf '{"candidate":"V8.3.244","phase":"preseal-via-proven-transport","run_id":"%s","rc":%s,"semantic_runtime_executed":false,"gold_expected_changed":false}\n' "$GITHUB_RUN_ID" "$rc" > validation/v83244-v1-sealed/V8_3_244_PRESEAL_DIAGNOSTIC.json
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - name: Freeze V8.3.244 PRESEAL evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/v83244-v1-sealed/V8_3_244_PRESEAL_DIAGNOSTIC.log validation/v83244-v1-sealed/V8_3_244_PRESEAL_DIAGNOSTIC.json
          for f in validation/v83244-v1-sealed/V8_3_244_PRESEAL_RUN_RECEIPT.json validation/v83244-v1-sealed/V8_3_244_PRESEAL_CANDIDATE_BANK_V1.json validation/v83244-v1-sealed/V8_3_244_SEALED_SELECTION_V1.json validation/v83244-v1-sealed/V8_3_244_SEALED_FIXTURE_V1.json validation/v83244-v1-sealed/V8_3_244_INDEPENDENT_GOLD_V1.json validation/v83244-v1-sealed/V8_3_244_SEALED_MEMBERSHIP_V1.json validation/v83244-v1-sealed/V8_3_244_PRESEAL_DIVERSITY_AUDIT_V1.json validation/v83244-v1-sealed/V8_3_244_SEALED_AUTHORITY_V1.json; do test ! -f "$f" || git add "$f"; done
          git diff --cached --quiet || git commit -m 'Freeze V8.3.244 PRESEAL authority'
          git push origin HEAD:v83244-v1-sealed-validation
      - name: Enforce PRESEAL outcome
        run: test '${{ steps.run.outputs.rc }}' = '0'
