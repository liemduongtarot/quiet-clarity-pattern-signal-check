name: V8.3.246 construction-only PRESEAL R2
# trigger-v246-preseal-r2
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v83243-actions-transport-probe.yml
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83246-v1-sealed-validation
          fetch-depth: 0
      - name: Run V8.3.246 fresh construction PRESEAL
        id: run
        shell: bash
        run: |
          set +e
          python validation/v83246-v1-sealed/v83246-preseal-freeze.py > /tmp/v246-preseal-r2.log 2>&1
          rc=$?
          set -e
          cat /tmp/v246-preseal-r2.log
          RC="$rc" python - <<'PY'
          import json,os,pathlib
          text=pathlib.Path('/tmp/v246-preseal-r2.log').read_text(errors='replace')
          o=pathlib.Path('validation/v83246-v1-sealed')
          (o/'V8_3_246_PRESEAL_R2_DIAGNOSTIC.json').write_text(json.dumps({'candidate':'V8.3.246','phase':'preseal-r2-fresh-bank','run_id':os.environ['GITHUB_RUN_ID'],'rc':int(os.environ['RC']),'log_tail':text[-24000:],'semantic_runtime_executed':False,'semantic_authority_loaded':False,'batch_a_executed':False,'batch_b_executed':False,'expected_gold_changed':False},indent=2)+'\n')
          PY
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - name: Freeze V246 PRESEAL R2 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/v83246-v1-sealed/V8_3_246_PRESEAL_R2_DIAGNOSTIC.json
          for f in validation/v83246-v1-sealed/V8_3_246_PRESEAL_RUN_RECEIPT.json validation/v83246-v1-sealed/V8_3_246_PRESEAL_CANDIDATE_BANK_V1.json validation/v83246-v1-sealed/V8_3_246_SEALED_SELECTION_V1.json validation/v83246-v1-sealed/V8_3_246_SEALED_FIXTURE_V1.json validation/v83246-v1-sealed/V8_3_246_INDEPENDENT_GOLD_V1.json validation/v83246-v1-sealed/V8_3_246_SEALED_MEMBERSHIP_V1.json validation/v83246-v1-sealed/V8_3_246_PRESEAL_DIVERSITY_AUDIT_V1.json validation/v83246-v1-sealed/V8_3_246_SEALED_AUTHORITY_V1.json; do test ! -f "$f" || git add "$f"; done
          git diff --cached --quiet || git commit -m 'Freeze V8.3.246 PRESEAL R2 fresh bank evidence'
          git push origin HEAD:v83246-v1-sealed-validation
      - name: Enforce PRESEAL R2
        run: test '${{ steps.run.outputs.rc }}' = '0'
