name: V8.3.255 deployment source discovery
# trigger-v255-deploy-discovery-1
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v83243-actions-transport-probe.yml
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83255-v1-deployment
          fetch-depth: 0
      - name: Discover exact locked deployment materials
        shell: bash
        env:
          HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
          HAS_VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID != '' }}
          HAS_VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID != '' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,hashlib,zipfile,json,os
          R=pathlib.Path('.')
          LOCK='f96cecd6bac63d5cfc868a42bfad80fc236bb7ef'
          PUB='886936b9e771c55474158e27c5129ccd06637cee690aabbdf15bb08ad68926ac'
          BASE='c2b57a436f744627b5600b97bdbc43dce70f748e66f2d0986c361f20683a7f5f'
          def sha(b): return hashlib.sha256(b).hexdigest()
          file_matches=[]; zip_matches=[]; candidates=[]
          for p in R.rglob('*'):
            if not p.is_file() or '.git' in p.parts: continue
            try:b=p.read_bytes()
            except:continue
            h=sha(b)
            if h in (PUB,BASE): file_matches.append({'path':str(p),'sha256':h,'size':len(b)})
            if p.suffix.lower()=='.zip':
              try:
                with zipfile.ZipFile(p) as z:
                  for n in z.namelist():
                    if n.endswith('/'): continue
                    try:d=z.read(n)
                    except:continue
                    hh=sha(d)
                    if hh in (PUB,BASE): zip_matches.append({'zip':str(p),'entry':n,'sha256':hh,'size':len(d)})
                    ln=n.lower()
                    if any(x in ln for x in ['candidate.html','public/','dist/client','semantic-convergence','extractor']): candidates.append({'zip':str(p),'entry':n,'sha256':hh,'size':len(d)})
              except zipfile.BadZipFile: pass
          lock=json.loads((R/'validation/v83255-v1-sealed/V8_3_255_PRODUCTION_LOCK_V1.json').read_text())
          assert lock['production_locked'] is True and lock['semantic_change'] is False and lock['expected_gold_changed'] is False
          out={'candidate':'V8.3.255','phase':'deployment-source-discovery','source_branch':'v83255-v1-deployment','source_lock_commit':LOCK,'public_runtime_sha256_expected':PUB,'base_archive_sha256_expected':BASE,'file_matches':file_matches,'zip_entry_matches':zip_matches,'candidate_entries':candidates[:500],'vercel_secret_presence':{'token':os.environ.get('HAS_VERCEL_TOKEN')=='true','org_id':os.environ.get('HAS_VERCEL_ORG_ID')=='true','project_id':os.environ.get('HAS_VERCEL_PROJECT_ID')=='true'},'semantic_change':False,'expected_gold_changed':False,'batch_a_rerun':False,'batch_b_rerun':False}
          pathlib.Path('validation/V8_3_255_DEPLOYMENT_SOURCE_DISCOVERY_V1.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps({'file_matches':file_matches,'zip_matches':zip_matches,'candidate_count':len(candidates),'secrets':out['vercel_secret_presence']}))
          PY
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/V8_3_255_DEPLOYMENT_SOURCE_DISCOVERY_V1.json
          git commit -m 'Record V8.3.255 deployment source discovery'
          git push origin HEAD:v83255-v1-deployment
