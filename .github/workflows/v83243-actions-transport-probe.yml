name: V8.3.244 final static preflight after metadata correction
# trigger-v244-final-preflight-r3
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v83243-actions-transport-probe.yml
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83244-v1-sealed-validation
          fetch-depth: 0
      - name: Run final V8.3.244 transport/static preflight
        id: run
        shell: bash
        run: |
          set +e
          python validation/v83244-v1-sealed/v83244-transport-preflight.py > /tmp/v244-final-preflight-r3.log 2>&1
          rc=$?
          set -e
          cat /tmp/v244-final-preflight-r3.log
          cp /tmp/v244-final-preflight-r3.log validation/v83244-v1-sealed/V8_3_244_FINAL_PREFLIGHT_R3.log
          printf '{"candidate":"V8.3.244","phase":"final-preflight-r3","run_id":"%s","rc":%s,"semantic_runtime_executed":false,"batch_a_executed":false,"batch_b_executed":false}\n' "$GITHUB_RUN_ID" "$rc" > validation/v83244-v1-sealed/V8_3_244_FINAL_PREFLIGHT_R3.json
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - name: Freeze final preflight R3 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/v83244-v1-sealed/V8_3_244_FINAL_PREFLIGHT_R3.log validation/v83244-v1-sealed/V8_3_244_FINAL_PREFLIGHT_R3.json
          test ! -f validation/v83244-v1-sealed/V8_3_244_TRANSPORT_VERIFICATION_V1.json || git add validation/v83244-v1-sealed/V8_3_244_TRANSPORT_VERIFICATION_V1.json
          test ! -f validation/v83244-v1-sealed/V8_3_244_STATIC_SEALED_PREFLIGHT_V1.json || git add validation/v83244-v1-sealed/V8_3_244_STATIC_SEALED_PREFLIGHT_V1.json
          git diff --cached --quiet || git commit -m 'Freeze V8.3.244 final preflight R3'
          git push origin HEAD:v83244-v1-sealed-validation
      - name: Enforce final preflight R3
        run: test '${{ steps.run.outputs.rc }}' = '0'
