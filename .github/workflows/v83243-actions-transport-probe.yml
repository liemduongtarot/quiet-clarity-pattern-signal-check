          if anchor not in src: raise SystemExit('V252 chain anchor missing')
          src=src.replace(anchor,new,1)
          src=src.replace("if(!s.QCEvidenceExtractorV5AW)throw Error('V5AW missing');if(!s.QCSemanticCoreV122)throw Error('V122 missing');","if(!s.QCEvidenceExtractorV5AX)throw Error('V5AX missing');if(!s.QCSemanticCoreV123)throw Error('V123 missing');",1)
