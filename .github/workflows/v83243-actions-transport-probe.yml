name: V8.3.254 hardened evidence preflight
# trigger-v254-evidence-preflight-1
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v83243-actions-transport-probe.yml
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83254-v1-sealed-validation
          fetch-depth: 0
      - name: Run hardened transport/evidence preflight
        id: run
        shell: bash
        run: |
          set +e
          python validation/v83254-v1-sealed/v83254-transport-evidence-preflight.py > /tmp/v254-preflight.log 2>&1
          rc=$?
          set -e
          cat /tmp/v254-preflight.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - name: Freeze preflight evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RC='${{ steps.run.outputs.rc }}' python - <<'PY'
          import json,os,pathlib
          o=pathlib.Path('validation/v83254-v1-sealed');log=pathlib.Path('/tmp/v254-preflight.log').read_text(errors='replace') if pathlib.Path('/tmp/v254-preflight.log').exists() else ''
          (o/'V8_3_254_TRANSPORT_PREFLIGHT_DIAGNOSTIC.json').write_text(json.dumps({'candidate':'V8.3.254','phase':'hardened-transport-evidence-preflight-diagnostic','run_id':os.environ['GITHUB_RUN_ID'],'rc':int(os.environ.get('RC') or 1),'log_tail':log[-30000:],'semantic_runtime_executed':False,'batch_a_executed':False,'batch_b_executed':False,'v253_sealed_rerun':False},indent=2)+'\n')
          PY
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/v83254-v1-sealed/V8_3_254_TRANSPORT_PREFLIGHT_DIAGNOSTIC.json
          for f in validation/v83254-v1-sealed/V8_3_254_TRANSPORT_VERIFICATION_V1.json validation/v83254-v1-sealed/V8_3_254_STATIC_SEALED_PREFLIGHT_V1.json validation/v83254-v1-sealed/V8_3_254_RUNTIME_CONFIG_SCHEMA_MANIFEST_V1.json; do test ! -f "$f" || git add "$f"; done
          git diff --cached --quiet || git commit -m 'Freeze V8.3.254 hardened evidence preflight'
          git push origin HEAD:v83254-v1-sealed-validation
      - name: Enforce preflight outcome
        run: test '${{ steps.run.outputs.rc }}' = '0'
