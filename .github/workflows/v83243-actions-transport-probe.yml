name: V8.3.255 sealed Batch B provenance one-shot
# trigger-v255-batch-b-one-shot-1
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v83243-actions-transport-probe.yml
permissions:
  contents: write
jobs:
  batch-b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83255-v1-sealed-validation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Persist immutable B reservation before semantics
        shell: bash
        run: |
          set -euo pipefail
          O=validation/v83255-v1-sealed
          for f in V8_3_255_BATCH_B_ATTEMPT_MARKER.json V8_3_255_BATCH_B_RESERVATION_V1.json V8_3_255_BATCH_B_RESULT_V1.json V8_3_255_BATCH_B_STATUS_V1.json V8_3_255_BATCH_B_CASE_PROVENANCE_V1.json V8_3_255_BATCH_B_EXECUTION_LEDGER_V1.json; do test ! -e "$O/$f"; done
          python - <<'PY'
          import json,os,pathlib,importlib.util,hashlib
          V=pathlib.Path('validation');O=V/'v83255-v1-sealed';DEV='8100c9d590a95b612829e92f4a9fc859b6eddb23';SEM='QCEvidenceExtractorV5AY -> QCSemanticCoreV124';RUNNER_SHA='af297926d68381599eb461dc432e660a6065cd3c9ea969d62c672920721534b2'
          pf=json.loads((O/'V8_3_255_BATCH_B_STATIC_PREFLIGHT_V1.json').read_text());m=json.loads((O/'V8_3_255_BATCH_B_RUNNER_MATERIALIZATION_V1.json').read_text());astat=json.loads((O/'V8_3_255_BATCH_A_STATUS_V1.json').read_text())
          assert pf['pass'] and pf['batch_a_30_of_30'] and pf['batch_a_ledger_verified'] and pf['batch_b_runner_hash_verified'] and pf['step_111_authorized'] is True
          assert astat['conclusion']=='success' and astat['batch_a_passed']==30 and m['pass'] and m['batch_b_runner_sha256']==RUNNER_SHA
          assert hashlib.sha256((V/'v83255-batch-b-materialized.py').read_bytes()).hexdigest()==RUNNER_SHA
          spec=importlib.util.spec_from_file_location('prov',V/'v83254-evidence-provenance.py');prov=importlib.util.module_from_spec(spec);spec.loader.exec_module(prov)
          reservation=prov.build_reservation('V8.3.255','B',os.environ['GITHUB_RUN_ID'],os.environ.get('GITHUB_RUN_ATTEMPT','1'),DEV,SEM,RUNNER_SHA)
          (O/'V8_3_255_BATCH_B_RESERVATION_V1.json').write_text(json.dumps(reservation,indent=2)+'\n')
          mark={'candidate':'V8.3.255','phase':'sealed-batch-b-attempt-reservation','batch':'B','run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT','1'),'validated_development_head_sha':DEV,'semantic_authority':SEM,'source_runner_sha256':RUNNER_SHA,'reservation_sha256':reservation['reservation_sha256'],'reserved_before_semantic_execution':True,'semantic_runtime_executed':False,'batch_a_rerun':False,'v254_sealed_rerun':False,'step_111_authorized':True,'production_authorized':False}
          (O/'V8_3_255_BATCH_B_ATTEMPT_MARKER.json').write_text(json.dumps(mark,indent=2)+'\n')
          PY
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$O/V8_3_255_BATCH_B_RESERVATION_V1.json" "$O/V8_3_255_BATCH_B_ATTEMPT_MARKER.json"
          git commit -m 'Reserve V8.3.255 sealed Batch B first run with provenance hash'
          git push origin HEAD:v83255-v1-sealed-validation
      - name: Execute V8.3.255 Batch B exactly once
        id: execute
        shell: bash
        run: |
          set +e
          python validation/v83255-batch-b-materialized.py
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Freeze Batch B provenance evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          O=validation/v83255-v1-sealed
          test -f "$O/V8_3_255_BATCH_B_STATUS_V1.json"
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$O/V8_3_255_BATCH_B_STATUS_V1.json"
          for f in V8_3_255_BATCH_B_RESULT_V1.json V8_3_255_BATCH_B_CASE_PROVENANCE_V1.json V8_3_255_BATCH_B_EXECUTION_LEDGER_V1.json; do test ! -f "$O/$f" || git add "$O/$f"; done
          git diff --cached --quiet || git commit -m 'Freeze V8.3.255 Batch B first-run provenance evidence'
          git push origin HEAD:v83255-v1-sealed-validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PSC_V8_3_255_V1_BATCH_B_PROVENANCE_CHECKPOINT
          path: |
            PSC_V8_3_255_V1_BATCH_B_CHECKPOINT.zip
            PSC_V8_3_255_V1_BATCH_B_CHECKPOINT_SHA256.txt
          if-no-files-found: error
      - name: Enforce Batch B outcome
        run: test '${{ steps.execute.outputs.rc }}' = '0'
