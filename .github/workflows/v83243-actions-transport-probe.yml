name: V8.3.247 PRESEAL metric diagnostic
# trigger-v247-preseal-metrics-1
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v83243-actions-transport-probe.yml
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83247-v1-sealed-validation
          fetch-depth: 0
      - name: Diagnose PRESEAL metrics without semantic runtime
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin v83246-v1-sealed-validation:refs/remotes/origin/v83246-v1-sealed-validation
          python - <<'PY' > /tmp/v247-metrics.log 2>&1 || true
          from pathlib import Path
          code=Path('validation/v83247-v1-sealed/v83247-preseal-freeze.py').read_text()
          needle="exec(compile(src,'v83247-preseal-adapted.py','exec'))"
          repl="src=src.replace(\"assert internal[0]<.75 and external[0]<.75 and high==0 and exact==0 and fpdup==0\",\"print('PRESEAL_METRICS',{'internal':internal,'external':external,'high':high,'exact':exact,'fpdup':fpdup}); raise SystemExit(0)\",1); exec(compile(src,'v83247-preseal-adapted.py','exec'))"
          if needle not in code: raise SystemExit('final exec anchor missing')
          code=code.replace(needle,repl,1)
          exec(compile(code,'v247-metric-wrapper.py','exec'))
          PY
          cat /tmp/v247-metrics.log
          cp /tmp/v247-metrics.log validation/v83247-v1-sealed/V8_3_247_PRESEAL_METRIC_DIAGNOSTIC.log
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/v83247-v1-sealed/V8_3_247_PRESEAL_METRIC_DIAGNOSTIC.log
          git commit -m 'Record V8.3.247 PRESEAL metric diagnostic'
          git push origin HEAD:v83247-v1-sealed-validation
