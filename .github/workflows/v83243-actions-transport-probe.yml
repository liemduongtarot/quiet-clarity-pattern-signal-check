name: V8.3.253 PRESEAL metric diagnostic
# trigger-v253-preseal-metric-1
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v83243-actions-transport-probe.yml
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83253-v1-sealed-validation
          fetch-depth: 0
      - name: Persist metric start
        shell: bash
        run: |
          set -euo pipefail
          printf '{"candidate":"V8.3.253","phase":"preseal-metric-start","run_id":"%s","semantic_runtime_executed":false,"batch_a_executed":false,"batch_b_executed":false}\n' "$GITHUB_RUN_ID" > validation/v83253-v1-sealed/V8_3_253_PRESEAL_METRIC_START.json
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/v83253-v1-sealed/V8_3_253_PRESEAL_METRIC_START.json
          git commit -m 'Record V8.3.253 PRESEAL metric start'
          git push origin HEAD:v83253-v1-sealed-validation
      - name: Print construction metrics without semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/v253-metrics.log 2>&1 || true
          from pathlib import Path
          code=Path('validation/v83253-v1-sealed/v83253-preseal-freeze.py').read_text()
          needle="assert internal[0]<.75 and external[0]<.75 and high==0 and exact==0 and fpdup==0"
          repl="print('PRESEAL_METRICS',{'internal':internal,'external':external,'high':high,'exact':exact,'fpdup':fpdup}); raise SystemExit(0)"
          if needle not in code: raise SystemExit('metric assertion anchor missing')
          code=code.replace(needle,repl,1)
          exec(compile(code,'v253-preseal-metric.py','exec'))
          PY
          cat /tmp/v253-metrics.log
          cp /tmp/v253-metrics.log validation/v83253-v1-sealed/V8_3_253_PRESEAL_METRIC_DIAGNOSTIC.log
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/v83253-v1-sealed/V8_3_253_PRESEAL_METRIC_DIAGNOSTIC.log
          git commit -m 'Record V8.3.253 PRESEAL metric diagnostic'
          git push origin HEAD:v83253-v1-sealed-validation
