name: V8.3.251 sealed runner materialization
# trigger-v251-runner-materialization-1
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v83243-actions-transport-probe.yml
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83251-v1-sealed-validation
          fetch-depth: 0
      - name: Materialize self-contained V251 runner
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin v83250-v1-sealed-validation:refs/remotes/origin/v83250-v1-sealed-validation
          python - <<'PY'
          from pathlib import Path
          import subprocess,hashlib,json
          src=subprocess.check_output(['git','show','origin/v83250-v1-sealed-validation:validation/v83250-batch-a-self-contained.py'],text=True)
          repls=[
            ("TARGET='514cbcb34fbe336033c8f8858a53415371137973'","TARGET='125a6f60c94eda4c455323a171006cac613eb903'"),
            ("SEM='QCEvidenceExtractorV5AV -> QCSemanticCoreV121'","SEM='QCEvidenceExtractorV5AW -> QCSemanticCoreV122'"),
            ("SEALED=REPO/'validation/v83250-v1-sealed'","SEALED=REPO/'validation/v83251-v1-sealed'"),
            ("WORK=pathlib.Path('/tmp/v83250-batch-a-authority')","WORK=pathlib.Path('/tmp/v83251-batch-a-authority')"),
            ("ROOT='validation/v83250-v1-sealed-runtime'","ROOT='validation/v83251-v1-sealed-runtime'"),
            ('V8_3_250_BATCH_A','V8_3_251_BATCH_A'),('V8_3_250_SEALED_FIRST_RUN_MARKER','V8_3_251_SEALED_FIRST_RUN_MARKER'),
            ('V8_3_250_SEALED_AUTHORITY_V1','V8_3_251_SEALED_AUTHORITY_V1'),('V8_3_250_PRESEAL_DIVERSITY_AUDIT_V1','V8_3_251_PRESEAL_DIVERSITY_AUDIT_V1'),
            ('V8_3_250_PRESEAL_CANDIDATE_BANK_V1','V8_3_251_PRESEAL_CANDIDATE_BANK_V1'),('V8_3_250_SEALED_SELECTION_V1','V8_3_251_SEALED_SELECTION_V1'),
            ('V8_3_250_SEALED_FIXTURE_V1','V8_3_251_SEALED_FIXTURE_V1'),('V8_3_250_INDEPENDENT_GOLD_V1','V8_3_251_INDEPENDENT_GOLD_V1'),
            ('V8_3_250_SEALED_MEMBERSHIP_V1','V8_3_251_SEALED_MEMBERSHIP_V1'),('V8_3_250_TRANSPORT_VERIFICATION_V1','V8_3_251_TRANSPORT_VERIFICATION_V1'),
            ('V8_3_250_STATIC_SEALED_PREFLIGHT_V1','V8_3_251_STATIC_SEALED_PREFLIGHT_V1'),('PSC_V8_3_250_V1_BATCH_A_CHECKPOINT','PSC_V8_3_251_V1_BATCH_A_CHECKPOINT'),
            ('validation/v83250-v1-sealed-runtime','validation/v83251-v1-sealed-runtime'),('run-v83250-batch-a.cjs','run-v83251-batch-a.cjs'),
            ("'candidate':'V8.3.250'","'candidate':'V8.3.251'"),("authority:'V8.3.250 V1 SEALED BATCH A FIRST RUN'","authority:'V8.3.251 V1 SEALED BATCH A FIRST RUN'"),
            ("console.log('V250 A'","console.log('V251 A'"),('v250_batch_a_rerun','v251_batch_a_rerun'),('v249_sealed_rerun','v250_sealed_rerun')]
          for a,b in repls: src=src.replace(a,b)
          src=src.replace("assert pf['exact_v5av_path']=='validation/qc-evidence-extractor-v5av-v250-v249-residuals.js' and pf['exact_v121_path']=='validation/psc-v83250-v249-v121-residuals.js'","assert pf['exact_v5aw_path']=='validation/qc-evidence-extractor-v5aw-v251-v250-b-residuals.js' and pf['exact_v122_path']=='validation/psc-v83251-v250-v122-b-residuals.js'",1)
          anchor="'qc-evidence-extractor-v5av-v250-v249-residuals.js','psc-v83250-v249-v121-residuals.js']"
          new="'qc-evidence-extractor-v5av-v250-v249-residuals.js','psc-v83250-v249-v121-residuals.js','qc-evidence-extractor-v5aw-v251-v250-b-residuals.js','psc-v83251-v250-v122-b-residuals.js']"
          if anchor not in src: raise SystemExit('V251 chain anchor missing')
          src=src.replace(anchor,new,1)
          src=src.replace("if(!s.QCEvidenceExtractorV5AV)throw Error('V5AV missing');if(!s.QCSemanticCoreV121)throw Error('V121 missing');","if(!s.QCEvidenceExtractorV5AW)throw Error('V5AW missing');if(!s.QCSemanticCoreV122)throw Error('V122 missing');",1)
          src=src.replace('s.QCSemanticCoreV121.analyze','s.QCSemanticCoreV122.analyze')
          src=src.replace("semantic_authority:'QCEvidenceExtractorV5AV -> QCSemanticCoreV121'","semantic_authority:'QCEvidenceExtractorV5AW -> QCSemanticCoreV122'")
          src=src.replace("validated_development_head_sha:'514cbcb34fbe336033c8f8858a53415371137973'","validated_development_head_sha:'125a6f60c94eda4c455323a171006cac613eb903'")
          forbidden=['V8_3_250_PRESEAL_CANDIDATE_BANK_V1.json','validation/v83250-v1-sealed-runtime','run-v83250-batch-a.cjs','V8_3_250_BATCH_A_RESULT_V1.json','QCSemanticCoreV121.analyze']
          if any(x in src for x in forbidden): raise SystemExit('stale V250 literal')
          required=['V8_3_251_PRESEAL_CANDIDATE_BANK_V1.json','validation/v83251-v1-sealed-runtime','run-v83251-batch-a.cjs','V8_3_251_BATCH_A_RESULT_V1.json',"A['validated_development_head_sha']==TARGET",'qc-evidence-extractor-v5aw-v251-v250-b-residuals.js','psc-v83251-v250-v122-b-residuals.js','QCSemanticCoreV122.analyze']
          if any(x not in src for x in required): raise SystemExit('missing V251 runner literal')
          compile(src,'validation/v83251-batch-a-self-contained.py','exec')
          p=Path('validation/v83251-batch-a-self-contained.py');p.write_text(src)
          receipt={'candidate':'V8.3.251','phase':'sealed-runner-materialization','validated_development_head_sha':'125a6f60c94eda4c455323a171006cac613eb903','parent_development_sha':'514cbcb34fbe336033c8f8858a53415371137973','semantic_authority':'QCEvidenceExtractorV5AW -> QCSemanticCoreV122','runner_sha256':hashlib.sha256(src.encode()).hexdigest(),'self_contained':True,'semantic_change':False,'expected_gold_changed':False,'pass':True,'sealed_semantics_executed':False,'step_111_authorized':False}
          Path('validation/v83251-v1-sealed/V8_3_251_RUNNER_MATERIALIZATION_V1.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/v83251-batch-a-self-contained.py validation/v83251-v1-sealed/V8_3_251_RUNNER_MATERIALIZATION_V1.json
          git commit -m 'Materialize V8.3.251 sealed runner'
          git push origin HEAD:v83251-v1-sealed-validation
