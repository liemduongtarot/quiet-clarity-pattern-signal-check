          o=pathlib.Path('validation/v83252-v1-sealed')
          r=json.loads((o/'V8_3_252_BATCH_A_RESULT_V1.json').read_text());s=json.loads((o/'V8_3_252_BATCH_A_STATUS_V1.json').read_text())
          assert r['total']==30 and r['passed']==29 and r['failed']==1
          assert s['semantic_runtime_executed'] is True and s['semantic_failure'] is True and s['batch_b_executed'] is False
          fails=[x for x in r['results'] if not x['pass']];assert len(fails)==1
          x=fails[0];e=x['expected'];a=x['actual']
          out={'candidate':'V8.3.252','phase':'frozen-batch-a-semantic-autopsy','run_id':r['run_id'],'validated_development_head_sha':'59d1d564a2208ae4ce5899262ad094357a20402a','semantic_authority':'QCEvidenceExtractorV5AX -> QCSemanticCoreV123','batch_a_total':30,'batch_a_passed':29,'batch_a_failed':1,'batch_b_executed':False,'v252_batch_a_rerun':False,'semantic_runtime_executed':True,'semantic_failure':True,'failure_counts_by_category':{x['category']:1},'failure':{'case_id':x['case_id'],'category':x['category'],'language':x['language'],'domain':x['domain'],'expected':e,'actual':a,'surface':x['surface']},'expected_gold_changed':False,'step_111_authorized':False,'production_authorized':False,'conclusion':'frozen-semantic-failure'}
