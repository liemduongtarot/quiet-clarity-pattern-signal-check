name: V8.3.249 hardened transport/static preflight
# trigger-v249-preflight-1
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v83243-actions-transport-probe.yml
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83249-v1-sealed-validation
          fetch-depth: 0
      - name: Run hardened preflight
        id: run
        shell: bash
        run: |
          set +e
          python validation/v83249-v1-sealed/v83249-transport-preflight.py > /tmp/v249-preflight.log 2>&1
          rc=$?
          set -e
          cat /tmp/v249-preflight.log
          RC="$rc" python - <<'PY'
          import json,os,pathlib
          text=pathlib.Path('/tmp/v249-preflight.log').read_text(errors='replace')
          o=pathlib.Path('validation/v83249-v1-sealed')
          (o/'V8_3_249_TRANSPORT_PREFLIGHT_DIAGNOSTIC.json').write_text(json.dumps({'candidate':'V8.3.249','phase':'hardened-transport-static-preflight','run_id':os.environ['GITHUB_RUN_ID'],'rc':int(os.environ['RC']),'log_tail':text[-30000:],'semantic_runtime_executed':False,'batch_a_executed':False,'batch_b_executed':False},indent=2)+'\n')
          PY
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - name: Freeze preflight evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/v83249-v1-sealed/V8_3_249_TRANSPORT_PREFLIGHT_DIAGNOSTIC.json
          test ! -f validation/v83249-v1-sealed/V8_3_249_TRANSPORT_VERIFICATION_V1.json || git add validation/v83249-v1-sealed/V8_3_249_TRANSPORT_VERIFICATION_V1.json
          test ! -f validation/v83249-v1-sealed/V8_3_249_STATIC_SEALED_PREFLIGHT_V1.json || git add validation/v83249-v1-sealed/V8_3_249_STATIC_SEALED_PREFLIGHT_V1.json
          git diff --cached --quiet || git commit -m 'Freeze V8.3.249 hardened preflight evidence'
          git push origin HEAD:v83249-v1-sealed-validation
      - name: Enforce preflight outcome
        run: test '${{ steps.run.outputs.rc }}' = '0'
