name: V8.3.243 Actions Transport Probe
# trigger-probe-2-preseal-diagnostic
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v83243-actions-transport-probe.yml
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83243-v1-sealed-validation
          fetch-depth: 0
      - name: Run construction-only PRESEAL diagnostic
        id: run
        shell: bash
        run: |
          set +e
          python validation/v83243-v1-sealed/v83243-preseal-freeze.py > /tmp/v243-preseal-diagnostic.log 2>&1
          rc=$?
          cat /tmp/v243-preseal-diagnostic.log
          mkdir -p validation/v83243-v1-sealed
          cp /tmp/v243-preseal-diagnostic.log validation/v83243-v1-sealed/V8_3_243_PRESEAL_R9_DIAGNOSTIC.log
          printf '{"candidate":"V8.3.243","probe":"actions-push-transport","run_id":"%s","preseal_diagnostic_rc":%s,"semantic_runtime_executed":false,"gold_changed":false}\n' "$GITHUB_RUN_ID" "$rc" > validation/v83243-v1-sealed/V8_3_243_ACTIONS_TRANSPORT_PROBE.json
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Freeze transport and PRESEAL diagnostic evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/v83243-v1-sealed/V8_3_243_ACTIONS_TRANSPORT_PROBE.json validation/v83243-v1-sealed/V8_3_243_PRESEAL_R9_DIAGNOSTIC.log
          for f in validation/v83243-v1-sealed/V8_3_243_PRESEAL_RUN_RECEIPT.json validation/v83243-v1-sealed/V8_3_243_PRESEAL_CANDIDATE_BANK_V1.json validation/v83243-v1-sealed/V8_3_243_SEALED_SELECTION_V1.json validation/v83243-v1-sealed/V8_3_243_SEALED_FIXTURE_V1.json validation/v83243-v1-sealed/V8_3_243_INDEPENDENT_GOLD_V1.json validation/v83243-v1-sealed/V8_3_243_SEALED_MEMBERSHIP_V1.json validation/v83243-v1-sealed/V8_3_243_PRESEAL_DIVERSITY_AUDIT_V1.json validation/v83243-v1-sealed/V8_3_243_SEALED_AUTHORITY_V1.json; do test ! -f "$f" || git add "$f"; done
          git diff --cached --quiet || git commit -m 'Record V8.3.243 PRESEAL diagnostic via proven Actions transport'
          git push origin HEAD:v83243-v1-sealed-validation
