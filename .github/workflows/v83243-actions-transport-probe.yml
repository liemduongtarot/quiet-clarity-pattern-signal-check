name: V8.3.253 Batch B runner materialization
# trigger-v253-b-runner-materialization-1
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v83243-actions-transport-probe.yml
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83253-v1-sealed-validation
          fetch-depth: 0
      - name: Materialize V253 Batch B runner
        id: run
        shell: bash
        run: |
          set +e
          python validation/v83253-batch-b-self-contained.py > /tmp/v253-b-mat.log 2>&1
          rc=$?
          set -e
          cat /tmp/v253-b-mat.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - name: Freeze B runner evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RC='${{ steps.run.outputs.rc }}' python - <<'PY'
          import json,os,pathlib
          o=pathlib.Path('validation/v83253-v1-sealed')
          log=pathlib.Path('/tmp/v253-b-mat.log').read_text(errors='replace') if pathlib.Path('/tmp/v253-b-mat.log').exists() else ''
          (o/'V8_3_253_BATCH_B_RUNNER_DIAGNOSTIC.json').write_text(json.dumps({'candidate':'V8.3.253','phase':'batch-b-runner-materialization-diagnostic','run_id':os.environ['GITHUB_RUN_ID'],'rc':int(os.environ.get('RC') or 1),'log_tail':log[-30000:],'batch_b_executed':False,'step_111_authorized':False},indent=2)+'\n')
          PY
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/v83253-v1-sealed/V8_3_253_BATCH_B_RUNNER_DIAGNOSTIC.json
          test ! -f validation/v83253-batch-b-materialized.py || git add validation/v83253-batch-b-materialized.py
          test ! -f validation/v83253-v1-sealed/V8_3_253_BATCH_B_RUNNER_MATERIALIZATION_V1.json || git add validation/v83253-v1-sealed/V8_3_253_BATCH_B_RUNNER_MATERIALIZATION_V1.json
          git diff --cached --quiet || git commit -m 'Freeze V8.3.253 Batch B runner materialization evidence'
          git push origin HEAD:v83253-v1-sealed-validation
      - name: Enforce B runner materialization
        run: test '${{ steps.run.outputs.rc }}' = '0'
