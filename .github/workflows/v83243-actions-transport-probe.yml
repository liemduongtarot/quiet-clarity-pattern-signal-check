name: V8.3.255 pre-Step-111 archive R2 repair
# trigger-v255-pre-step111-archive-r2-1
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v83243-actions-transport-probe.yml
permissions:
  contents: write
jobs:
  archive-r2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v83255-v1-sealed-validation
          fetch-depth: 0
      - name: Build clean unique-entry self-contained archive R2
        id: build
        shell: bash
        run: |
          set +e
          python - <<'PY' > /tmp/v255-archive-r2.log 2>&1
          import json,hashlib,pathlib,zipfile,datetime
          R=pathlib.Path('.');V=R/'validation';O=V/'v83255-v1-sealed';DEV='8100c9d590a95b612829e92f4a9fc859b6eddb23';SEM='QCEvidenceExtractorV5AY -> QCSemanticCoreV124'
          def fsha(p):return hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          post=json.loads((O/'V8_3_255_POST_B_INTEGRITY_AUDIT_V1.json').read_text());assert post['pass'] and post['batch_a']=='30/30' and post['batch_b']=='30/30'
          names=[
           'V8_3_255_PRESEAL_RUN_RECEIPT.json','V8_3_255_PRESEAL_DIVERSITY_AUDIT_V1.json','V8_3_255_CONTAMINATION_DUPLICATE_AUDIT_V1.json','V8_3_255_SEMANTIC_FINGERPRINTS_V1.json','V8_3_255_SEALED_AUTHORITY_V1.json','V8_3_255_PRESEAL_CANDIDATE_BANK_V1.json','V8_3_255_SEALED_SELECTION_V1.json','V8_3_255_SEALED_FIXTURE_V1.json','V8_3_255_INDEPENDENT_GOLD_V1.json','V8_3_255_SEALED_MEMBERSHIP_V1.json','V8_3_255_RUNNER_MATERIALIZATION_V1.json','V8_3_255_SEMANTIC_SOURCE_IDENTITY_REPORT_V1.json','V8_3_255_RUNTIME_CONFIG_SCHEMA_MANIFEST_V1.json','V8_3_255_STATIC_SEALED_PREFLIGHT_V1.json','V8_3_255_RUNNER_EVIDENCE_GATE_PREFLIGHT_V1.json','V8_3_255_KNOWN_LIMITATIONS_V1.json','V8_3_255_BATCH_A_RESERVATION_V1.json','V8_3_255_BATCH_A_ATTEMPT_MARKER.json','V8_3_255_SEALED_FIRST_RUN_MARKER.json','V8_3_255_BATCH_A_RESULT_V1.json','V8_3_255_BATCH_A_STATUS_V1.json','V8_3_255_BATCH_A_CASE_PROVENANCE_V1.json','V8_3_255_BATCH_A_EXECUTION_LEDGER_V1.json','V8_3_255_BATCH_B_RUNNER_MATERIALIZATION_V1.json','V8_3_255_BATCH_B_STATIC_PREFLIGHT_V1.json','V8_3_255_BATCH_B_RESERVATION_V1.json','V8_3_255_BATCH_B_ATTEMPT_MARKER.json','V8_3_255_BATCH_B_RESULT_V1.json','V8_3_255_BATCH_B_STATUS_V1.json','V8_3_255_BATCH_B_CASE_PROVENANCE_V1.json','V8_3_255_BATCH_B_EXECUTION_LEDGER_V1.json','V8_3_255_POST_B_INTEGRITY_AUDIT_V1.json','V8_3_255_POST_B_DIAGNOSTIC.json']
          support=['validation/v83255-runner-evidence-gate.py','validation/v83254-evidence-provenance.py','validation/V8_3_254_EVIDENCE_PROVENANCE_CONTRACT_V1.json','validation/v83255-batch-a-self-contained.py','validation/v83255-batch-b-materialized.py']
          paths=[O/n for n in names]+[R/n for n in support]
          assert len({str(p) for p in paths})==len(paths)
          missing=[str(p) for p in paths if not p.exists()];assert not missing,missing
          man={'candidate':'V8.3.255','phase':'pre-step-111-self-contained-archive-manifest-r2','repair_reason':'remove duplicate archive entry only','validated_development_head_sha':DEV,'semantic_authority':SEM,'created_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'),'files':[{'archive_path':str(p),'sha256':fsha(p),'size':p.stat().st_size} for p in paths],'unique_archive_paths':True,'batch_a_run_id':'32668811798','batch_b_run_id':'32669034665','batch_a_rerun':False,'batch_b_rerun':False,'semantic_change':False,'expected_gold_changed':False,'step_111_authorized':True,'production_authorized':False,'pass':True}
          mp=O/'V8_3_255_PRE_STEP_111_ARCHIVE_MANIFEST_R2.json';mp.write_text(json.dumps(man,indent=2)+'\n');paths.append(mp)
          zpath=R/'PSC_V8_3_255_PRE_STEP_111_SELF_CONTAINED_CHECKPOINT_R2.zip'
          with zipfile.ZipFile(zpath,'w',zipfile.ZIP_DEFLATED) as z:
              for p in paths:z.write(p,str(p))
          with zipfile.ZipFile(zpath) as z:
              zn=z.namelist();assert len(zn)==len(set(zn))==len(paths)
              for item in man['files']:assert hashlib.sha256(z.read(item['archive_path'])).hexdigest()==item['sha256']
              assert str(mp) in zn
          sha=fsha(zpath);(R/'PSC_V8_3_255_PRE_STEP_111_SELF_CONTAINED_CHECKPOINT_R2_SHA256.txt').write_text(sha+'  '+zpath.name+'\n')
          rec={'candidate':'V8.3.255','phase':'pre-step-111-archive-r2-validation','archive_sha256':sha,'archive_entry_count':len(paths),'unique_entries':True,'manifest_entries':len(man['files']),'semantic_change':False,'expected_gold_changed':False,'batch_a_rerun':False,'batch_b_rerun':False,'step_111_authorized':True,'pass':True};(O/'V8_3_255_PRE_STEP_111_ARCHIVE_R2_VALIDATION_V1.json').write_text(json.dumps(rec,indent=2)+'\n');print(json.dumps(rec))
          PY
          rc=$?
          set -e
          cat /tmp/v255-archive-r2.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - name: Freeze archive R2 evidence
        if: always()
        run: |
          set -euo pipefail
          RC='${{ steps.build.outputs.rc }}' python - <<'PY'
          import json,os,pathlib
          o=pathlib.Path('validation/v83255-v1-sealed');log=pathlib.Path('/tmp/v255-archive-r2.log').read_text(errors='replace') if pathlib.Path('/tmp/v255-archive-r2.log').exists() else ''
          (o/'V8_3_255_PRE_STEP_111_ARCHIVE_R2_DIAGNOSTIC.json').write_text(json.dumps({'candidate':'V8.3.255','phase':'pre-step-111-archive-r2-diagnostic','run_id':os.environ['GITHUB_RUN_ID'],'rc':int(os.environ.get('RC') or 1),'log_tail':log[-30000:],'semantic_change':False,'expected_gold_changed':False,'batch_a_rerun':False,'batch_b_rerun':False},indent=2)+'\n')
          PY
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/v83255-v1-sealed/V8_3_255_PRE_STEP_111_ARCHIVE_MANIFEST_R2.json validation/v83255-v1-sealed/V8_3_255_PRE_STEP_111_ARCHIVE_R2_VALIDATION_V1.json validation/v83255-v1-sealed/V8_3_255_PRE_STEP_111_ARCHIVE_R2_DIAGNOSTIC.json
          git commit -m 'Freeze V8.3.255 clean pre-Step-111 archive R2 evidence'
          git push origin HEAD:v83255-v1-sealed-validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PSC_V8_3_255_PRE_STEP_111_SELF_CONTAINED_CHECKPOINT_R2
          path: |
            PSC_V8_3_255_PRE_STEP_111_SELF_CONTAINED_CHECKPOINT_R2.zip
            PSC_V8_3_255_PRE_STEP_111_SELF_CONTAINED_CHECKPOINT_R2_SHA256.txt
          if-no-files-found: error
      - name: Enforce clean archive R2
        run: test '${{ steps.build.outputs.rc }}' = '0'
