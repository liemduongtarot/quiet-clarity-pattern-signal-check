name: V8.3.233 DEVELOPMENT checkpoint
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v83233-development-checkpoint.yml
permissions:
  contents: read
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8f85efc8b8383420c65a50724d2512693302dbcb
          fetch-depth: 0
      - name: Build checkpoint
        run: |
          # first actual V8.3.233 DEVELOPMENT checkpoint run
          set -euo pipefail
          mkdir V8_3_233_DEVELOPMENT_CHECKPOINT
          cp validation/V8_3_233_DEVELOPMENT_AUTHORITY_V1.json V8_3_233_DEVELOPMENT_CHECKPOINT/
          cp validation/V8_3_233_RUNNER_PLUMBING_RECOVERY_RECEIPT.json V8_3_233_DEVELOPMENT_CHECKPOINT/
          printf '%s\n' '8f85efc8b8383420c65a50724d2512693302dbcb' > V8_3_233_DEVELOPMENT_CHECKPOINT/DEVELOPMENT_SHA.txt
          (cd V8_3_233_DEVELOPMENT_CHECKPOINT && sha256sum * > SHA256_MANIFEST.txt)
          zip -r PSC_V8_3_233_DEVELOPMENT_CHECKPOINT.zip V8_3_233_DEVELOPMENT_CHECKPOINT
          sha256sum PSC_V8_3_233_DEVELOPMENT_CHECKPOINT.zip > PSC_V8_3_233_DEVELOPMENT_CHECKPOINT_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PSC_V8_3_233_DEVELOPMENT_CHECKPOINT
          path: |
            PSC_V8_3_233_DEVELOPMENT_CHECKPOINT.zip
            PSC_V8_3_233_DEVELOPMENT_CHECKPOINT_SHA256.txt
          if-no-files-found: error
