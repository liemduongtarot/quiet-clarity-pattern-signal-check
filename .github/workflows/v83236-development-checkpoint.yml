name: V8.3.236 DEVELOPMENT checkpoint
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v83236-development-checkpoint.yml
permissions:
  contents: read
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fac7c5e35c928c5b0dfe33b28b584af876ac0bf1
          fetch-depth: 0
      - name: Build checkpoint
        run: |
          set -euo pipefail
          mkdir V8_3_236_DEVELOPMENT_CHECKPOINT
          cp validation/V8_3_236_DEVELOPMENT_AUTHORITY_V1.json V8_3_236_DEVELOPMENT_CHECKPOINT/
          cp validation/V8_3_236_V111_REGRESSION_RECEIPT.json V8_3_236_DEVELOPMENT_CHECKPOINT/
          cp validation/qc-evidence-extractor-v5al-v236-contextual-mechanisms.js V8_3_236_DEVELOPMENT_CHECKPOINT/
          cp validation/psc-v83236-v235-v111-contextual-mechanisms.js V8_3_236_DEVELOPMENT_CHECKPOINT/
          printf '%s\n' 'fac7c5e35c928c5b0dfe33b28b584af876ac0bf1' > V8_3_236_DEVELOPMENT_CHECKPOINT/DEVELOPMENT_SHA.txt
          (cd V8_3_236_DEVELOPMENT_CHECKPOINT && sha256sum * > SHA256_MANIFEST.txt)
          zip -r PSC_V8_3_236_DEVELOPMENT_CHECKPOINT.zip V8_3_236_DEVELOPMENT_CHECKPOINT
          sha256sum PSC_V8_3_236_DEVELOPMENT_CHECKPOINT.zip > PSC_V8_3_236_DEVELOPMENT_CHECKPOINT_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PSC_V8_3_236_DEVELOPMENT_CHECKPOINT
          path: |
            PSC_V8_3_236_DEVELOPMENT_CHECKPOINT.zip
            PSC_V8_3_236_DEVELOPMENT_CHECKPOINT_SHA256.txt
          if-no-files-found: error
